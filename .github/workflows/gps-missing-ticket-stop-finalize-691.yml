name: Finalize GPS Missing Ticket STOP 691

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/gps-missing-ticket-stop-finalize-691.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-remove-self:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 691 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/technician-gps-session-cas' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/technician-gps-session-cas
          fetch-depth: 0
      - name: Apply missing-ticket STOP and duplicate-idempotence hardening
        run: python .github/scripts/apply-gps-missing-ticket-stop-691.py
      - name: Commit product/tests and remove one-off write workflow
        run: |
          set -euo pipefail
          git add functions/technicianLiveLocation.ts tests/launch/technician-live-location-cas.test.mjs
          git rm .github/scripts/apply-gps-missing-ticket-stop-691.py
          git rm .github/workflows/gps-missing-ticket-stop-finalize-691.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/apply-gps-missing-ticket-stop-691.py \
            .github/workflows/gps-missing-ticket-stop-finalize-691.yml \
            functions/technicianLiveLocation.ts \
            tests/launch/technician-live-location-cas.test.mjs | sort)"
          [[ "$changed" == "$expected" ]] || {
            echo '::error::Final STOP patch touched unexpected files.'
            printf 'Changed:\n%s\n' "$changed"
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(gps): reconcile missing-ticket STOP safely'
          git push origin HEAD:fix/technician-gps-session-cas
