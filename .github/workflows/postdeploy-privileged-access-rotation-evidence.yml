name: Privileged Access Rotation Evidence
run-name: Privileged Access Rotation Evidence source-deploy-${{ inputs.source_deploy_run_id }}

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Exact successful Firebase Production Deploy main SHA'
        required: true
        type: string
      source_deploy_run_id:
        description: 'Successful Firebase Production Deploy workflow run ID'
        required: true
        type: string
      confirmation:
        description: 'Enter VERIFY_PRIVILEGED_ACCESS_ROTATION'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: postdeploy-privileged-rotation-${{ inputs.source_deploy_run_id }}
  cancel-in-progress: false

jobs:
  verify-rotation:
    name: Verify privileged access rotation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: hard-launch-operations
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      SOURCE_AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
      SOURCE_DEPLOY_RUN_ID: ${{ inputs.source_deploy_run_id }}

    steps:
      - name: Checkout current main evidence commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify trusted parent production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-trusted-production-deploy-source.mjs

      - name: Enforce deployment-triggered rotation evidence inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_ACTOR" == "github-actions[bot]" ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$GITHUB_SHA" ]]
          [[ "$SOURCE_DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TRUSTED_PRODUCTION_DEPLOY_EVIDENCE" == "true" ]]
          [[ "$TRUSTED_PRODUCTION_DEPLOY_RUN_ID" == "$SOURCE_DEPLOY_RUN_ID" ]]
          [[ "$AUTHORIZED_FOUNDER_ACTORS" == *"github-actions[bot]"* ]]
          [[ "$CONFIRMATION" == "VERIFY_PRIVILEGED_ACCESS_ROTATION" ]]

      - name: Bind exact release and control-plane identity for the dual-SHA publisher
        # The publisher and finalizer require the release SHA, the control-plane SHA, the control-plane scope
        # verdict and the numeric run identity as separate, exact values. This deployment-triggered workflow
        # always evidences the deployed main SHA itself, so release == control plane == the trusted deployed
        # SHA (the "exact same-SHA pair" case of the manual workflow). Every value is validated here and
        # bound to the verified trusted-source record; nothing is defaulted or accepted unchecked.
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TRUSTED_PRODUCTION_DEPLOY_EVIDENCE" == "true" ]]
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const proof = JSON.parse(readFileSync('launch_package/trusted-production-deploy-source.json', 'utf8'));
          const failures = [];
          if (proof.status !== 'passed') failures.push('trusted deploy source proof is not passed');
          if (proof.commitSha !== process.env.TARGET_SHA) failures.push('trusted deploy source commit does not match the evidence commit');
          if (String(proof.sourceDeployRunId) !== process.env.SOURCE_DEPLOY_RUN_ID) failures.push('trusted deploy source run does not match');
          if (failures.length) { failures.forEach((failure) => console.error(`::error::${failure}`)); process.exit(1); }
          NODE
          {
            echo "PRODUCTION_RELEASE_SHA=$TARGET_SHA"
            echo "CONTROL_PLANE_COMMIT_SHA=$GITHUB_SHA"
            echo "CONTROL_PLANE_SCOPE_VERIFIED=true"
          } >> "$GITHUB_ENV"

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Prove rotated Admin credential is accepted by Firebase Auth
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: node scripts/verify-admin-credential-login.mjs

      - name: Verify provider-backed credential rotation
        run: node scripts/verify-privileged-access-rotation.mjs

      - name: Bind Admin login proof to the rotation record
        run: node scripts/bind-admin-credential-rotation-proof.mjs

      - name: Publish canonical privileged-rotation evidence
        run: node scripts/publish-direct-operational-proof.mjs

      - name: Upload deployment-triggered rotation proof
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postdeploy-privileged-access-rotation-${{ inputs.expected_commit_sha }}
          path: |
            launch_package/trusted-production-deploy-source.json
            launch_package/operational-proof.json
            launch_package/admin-credential-login-proof.json
          if-no-files-found: error
          retention-days: 365
