name: Sync Admin Map Lifecycle 699

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: sync-admin-map-lifecycle-699
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event.pull_request.number == 699 &&
      github.event.pull_request.head.ref == 'fix/admin-map-unresolved-ticket-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Merge exact current main and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          test "$main_sha" = 'a770dd5b545881c4bd9422450f4ebf16c3a004e5'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/sync-admin-map-lifecycle-699.yml
          git add -A
          git commit -m 'Sync Admin map lifecycle with canonical GPS authority'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
