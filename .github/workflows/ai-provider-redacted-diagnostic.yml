name: AI Provider Redacted Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Full lowercase current main SHA'
        required: true
        type: string
      confirmation:
        description: 'Enter DIAGNOSE_AI_PROVIDER_REDACTED'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hard-public-launch
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
    steps:
      - name: Enforce protected diagnostic inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Diagnostic may only run from main."; exit 1; }
          [[ "$GITHUB_SHA" == "$TARGET_SHA" ]] || { echo "::error::Expected main SHA does not match this run."; exit 1; }
          [[ "$CONFIRMATION" == "DIAGNOSE_AI_PROVIDER_REDACTED" ]] || { echo "::error::Confirmation phrase mismatch."; exit 1; }
          authorized=false
          IFS=',' read -ra allowed <<< "${AUTHORIZED_FOUNDER_ACTORS:-}"
          for actor in "${allowed[@]}"; do
            actor="$(printf '%s' "$actor" | xargs)"
            if [[ -n "$actor" && "$GITHUB_ACTOR" == "$actor" ]]; then authorized=true; fi
          done
          [[ "$authorized" == "true" ]] || { echo "::error::Actor is not authorized for hard-public-launch diagnostics."; exit 1; }

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Read redacted Sovereign AI provider failure categories
        run: |
          set -euo pipefail
          gcloud logging read \
            'timestamp >= "2026-09-15T00:00:00Z" AND SEARCH("Live providers unavailable")' \
            --project="$GCP_PROJECT_ID" \
            --limit=100 \
            --order=desc \
            --format=json > "$RUNNER_TEMP/ai-provider-log.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const allowed = new Set([
            'timeout',
            'rate-limited',
            'provider-auth-failed',
            'provider-server-error',
            'provider-http-error',
            'usage-metadata-invalid',
            'usage-envelope-exceeded',
            'empty-response',
            'budget-exhausted',
            'provider-failed',
          ]);
          const entries = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/ai-provider-log.json', 'utf8'));
          const categories = new Set();
          for (const entry of entries) {
            const raw = JSON.stringify(entry);
            for (const match of raw.matchAll(/\b(gemini|openai):([a-z-]+)\b/g)) {
              if (allowed.has(match[2])) categories.add(`${match[1]}:${match[2]}`);
            }
          }
          if (!categories.size) {
            console.log('::warning::No redacted Sovereign AI provider failure categories were found in the protected log window.');
            process.exit(0);
          }
          for (const category of [...categories].sort()) {
            console.log(`::notice::Redacted Sovereign AI provider failure category: ${category}`);
          }
          NODE

      - name: Probe Gemini with redacted status only
        run: |
          set -euo pipefail
          key="$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project="$GCP_PROJECT_ID" 2>/dev/null || true)"
          if [[ -z "$key" ]]; then
            echo "::error::Redacted Gemini diagnostic: provider credential is unavailable."
            exit 0
          fi
          echo "::add-mask::$key"
          body="$RUNNER_TEMP/gemini-redacted-probe.json"
          set +e
          http_status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
            --output "$body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=$key" \
            --data '{"contents":[{"parts":[{"text":"Reply with OK."}]}],"generationConfig":{"maxOutputTokens":8}}')"
          curl_status=$?
          set -e
          if [[ "$curl_status" -ne 0 || ! "$http_status" =~ ^[0-9]{3}$ ]]; then http_status=000; fi
          api_status="$(GEMINI_BODY="$body" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          try {
            const doc = JSON.parse(readFileSync(process.env.GEMINI_BODY, 'utf8'));
            const raw = String(doc?.error?.status || (Array.isArray(doc?.candidates) ? 'OK' : 'UNKNOWN')).trim().toUpperCase();
            console.log(/^[A-Z_]{2,40}$/.test(raw) ? raw : 'UNKNOWN');
          } catch {
            console.log('UNKNOWN');
          }
          NODE
          )"
          rm -f "$body"
          echo "::notice::Redacted Gemini probe HTTP status: $http_status"
          echo "::notice::Redacted Gemini probe API status: $api_status"
          echo "::notice::Redacted Gemini probe model: gemini-3.6-flash"

      - name: Probe OpenAI with redacted status only
        run: |
          set -euo pipefail
          key="$(gcloud secrets versions access latest --secret=OPENAI_API_KEY --project="$GCP_PROJECT_ID" 2>/dev/null || true)"
          if [[ -z "$key" ]]; then
            echo "::error::Redacted OpenAI diagnostic: provider credential is unavailable."
            exit 0
          fi
          echo "::add-mask::$key"
          body="$RUNNER_TEMP/openai-redacted-probe.json"
          set +e
          http_status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
            --output "$body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $key" \
            -X POST 'https://api.openai.com/v1/chat/completions' \
            --data '{"model":"gpt-4.1-mini","messages":[{"role":"user","content":"Reply with OK."}],"max_tokens":8}')"
          curl_status=$?
          set -e
          if [[ "$curl_status" -ne 0 || ! "$http_status" =~ ^[0-9]{3}$ ]]; then http_status=000; fi
          category="$(HTTP_STATUS="$http_status" node --input-type=module <<'NODE'
          const status = Number(process.env.HTTP_STATUS || 0);
          let category = 'other-http';
          if (status >= 200 && status < 300) category = 'ok';
          else if (status === 401 || status === 403) category = 'auth';
          else if (status === 429) category = 'rate-limited';
          else if (status === 400 || status === 404 || status === 422) category = 'invalid-request';
          else if (status >= 500) category = 'server-error';
          else if (status === 0) category = 'network-error';
          console.log(category);
          NODE
          )"
          rm -f "$body"
          echo "::notice::Redacted OpenAI probe HTTP status: $http_status"
          echo "::notice::Redacted OpenAI probe category: $category"
          echo "::notice::Redacted OpenAI probe model: gpt-4.1-mini"
