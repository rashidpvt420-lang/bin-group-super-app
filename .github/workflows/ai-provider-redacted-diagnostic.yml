name: AI Provider Redacted Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Full lowercase current main SHA'
        required: true
        type: string
      confirmation:
        description: 'Enter DIAGNOSE_AI_PROVIDER_REDACTED'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hard-public-launch
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
    steps:
      - name: Enforce protected diagnostic inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Diagnostic may only run from main."; exit 1; }
          [[ "$GITHUB_SHA" == "$TARGET_SHA" ]] || { echo "::error::Expected main SHA does not match this run."; exit 1; }
          [[ "$CONFIRMATION" == "DIAGNOSE_AI_PROVIDER_REDACTED" ]] || { echo "::error::Confirmation phrase mismatch."; exit 1; }
          authorized=false
          IFS=',' read -ra allowed <<< "${AUTHORIZED_FOUNDER_ACTORS:-}"
          for actor in "${allowed[@]}"; do
            actor="$(printf '%s' "$actor" | xargs)"
            if [[ -n "$actor" && "$GITHUB_ACTOR" == "$actor" ]]; then authorized=true; fi
          done
          [[ "$authorized" == "true" ]] || { echo "::error::Actor is not authorized for hard-public-launch diagnostics."; exit 1; }

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Read redacted Sovereign AI provider failure categories
        run: |
          set -euo pipefail
          gcloud logging read \
            'timestamp >= "2026-09-15T00:00:00Z" AND SEARCH("Live providers unavailable")' \
            --project="$GCP_PROJECT_ID" \
            --limit=100 \
            --order=desc \
            --format=json > "$RUNNER_TEMP/ai-provider-log.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const allowed = new Set([
            'timeout',
            'rate-limited',
            'provider-auth-failed',
            'provider-server-error',
            'provider-http-error',
            'usage-metadata-invalid',
            'usage-envelope-exceeded',
            'empty-response',
            'budget-exhausted',
            'provider-failed',
          ]);
          const entries = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/ai-provider-log.json', 'utf8'));
          const categories = new Set();
          for (const entry of entries) {
            const raw = JSON.stringify(entry);
            for (const match of raw.matchAll(/\b(gemini|openai):([a-z-]+)\b/g)) {
              if (allowed.has(match[2])) categories.add(`${match[1]}:${match[2]}`);
            }
          }
          if (!categories.size) {
            console.log('::warning::No redacted Sovereign AI provider failure categories were found in the protected log window.');
            process.exit(0);
          }
          for (const category of [...categories].sort()) {
            console.log(`::notice::Redacted Sovereign AI provider failure category: ${category}`);
          }
          NODE

      - name: Probe Gemini with redacted status only
        run: |
          set -euo pipefail
          gemini_key="$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project="$GCP_PROJECT_ID" 2>/dev/null || true)"
          if [[ -z "$gemini_key" ]]; then
            echo "::error::Redacted Gemini diagnostic: provider credential is unavailable."
            exit 0
          fi
          echo "::add-mask::$gemini_key"
          GEMINI_DIAGNOSTIC_KEY="$gemini_key" node --input-type=module <<'NODE'
          const apiKey = String(process.env.GEMINI_DIAGNOSTIC_KEY || '');
          const model = 'gemini-3.6-flash';
          const allowedStatuses = new Set([
            'OK',
            'INVALID_ARGUMENT',
            'PERMISSION_DENIED',
            'UNAUTHENTICATED',
            'NOT_FOUND',
            'RESOURCE_EXHAUSTED',
            'FAILED_PRECONDITION',
            'UNAVAILABLE',
            'DEADLINE_EXCEEDED',
            'UNKNOWN',
          ]);
          let httpStatus = 0;
          let apiStatus = 'UNKNOWN';
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 10_000);
          try {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-goog-api-key': apiKey,
                },
                signal: controller.signal,
                body: JSON.stringify({
                  contents: [{ parts: [{ text: 'Reply with OK.' }] }],
                  generationConfig: { maxOutputTokens: 8 },
                }),
              },
            );
            httpStatus = response.status;
            const payload = await response.json().catch(() => ({}));
            const raw = response.ok ? 'OK' : String(payload?.error?.status || 'UNKNOWN').trim().toUpperCase();
            apiStatus = allowedStatuses.has(raw) ? raw : 'UNKNOWN';
          } catch (error) {
            apiStatus = error?.name === 'AbortError' ? 'DEADLINE_EXCEEDED' : 'UNKNOWN';
          } finally {
            clearTimeout(timeout);
          }
          console.log(`::notice::Redacted Gemini probe HTTP status: ${httpStatus}`);
          console.log(`::notice::Redacted Gemini probe API status: ${apiStatus}`);
          console.log(`::notice::Redacted Gemini probe model: ${model}`);
          NODE

      - name: Probe OpenAI with redacted status only
        run: |
          set -euo pipefail
          openai_key="$(gcloud secrets versions access latest --secret=OPENAI_API_KEY --project="$GCP_PROJECT_ID" 2>/dev/null || true)"
          if [[ -z "$openai_key" ]]; then
            echo "::error::Redacted OpenAI diagnostic: provider credential is unavailable."
            exit 0
          fi
          echo "::add-mask::$openai_key"
          OPENAI_DIAGNOSTIC_KEY="$openai_key" node --input-type=module <<'NODE'
          const apiKey = String(process.env.OPENAI_DIAGNOSTIC_KEY || '');
          const model = 'gpt-4.1-mini';
          const classify = (status) => {
            if (status >= 200 && status < 300) return 'ok';
            if (status === 401 || status === 403) return 'auth';
            if (status === 429) return 'rate-limited';
            if (status === 400 || status === 404 || status === 422) return 'invalid-request';
            if (status >= 500) return 'server-error';
            if (status === 0) return 'network-error';
            return 'other-http';
          };
          let httpStatus = 0;
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 10_000);
          try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${apiKey}`,
              },
              signal: controller.signal,
              body: JSON.stringify({
                model,
                messages: [{ role: 'user', content: 'Reply with OK.' }],
                max_tokens: 8,
              }),
            });
            httpStatus = response.status;
            await response.body?.cancel().catch(() => {});
          } catch {
            httpStatus = 0;
          } finally {
            clearTimeout(timeout);
          }
          console.log(`::notice::Redacted OpenAI probe HTTP status: ${httpStatus}`);
          console.log(`::notice::Redacted OpenAI probe category: ${classify(httpStatus)}`);
          console.log(`::notice::Redacted OpenAI probe model: ${model}`);
          NODE
