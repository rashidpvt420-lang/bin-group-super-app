name: Production Founder E2E Preflight

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight-check:
    name: Verify Founder E2E Preflight Environment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Print set/missing/redacted status
        env:
          E2E_FOUNDER_EMAIL: ${{ vars.E2E_FOUNDER_EMAIL || secrets.E2E_FOUNDER_EMAIL }}
          E2E_FOUNDER_PASSWORD: ${{ secrets.E2E_FOUNDER_PASSWORD }}
          E2E_FOUNDER_TOTP_SECRET: ${{ secrets.E2E_FOUNDER_TOTP_SECRET }}
          E2E_FOUNDER_REAL_MFA_CODE: ${{ secrets.E2E_FOUNDER_REAL_MFA_CODE }}
        run: |
          echo "Checking presence of critical Founder values:"
          if [ -z "$E2E_FOUNDER_EMAIL" ]; then
            echo "  E2E_FOUNDER_EMAIL: MISSING"
          else
            echo "  E2E_FOUNDER_EMAIL: SET (redacted)"
          fi
          if [ -z "$E2E_FOUNDER_PASSWORD" ]; then
            echo "  E2E_FOUNDER_PASSWORD: MISSING"
          else
            echo "  E2E_FOUNDER_PASSWORD: SET (redacted)"
          fi
          if [ -n "$E2E_FOUNDER_TOTP_SECRET" ]; then
            echo "  Founder MFA evidence: SET (TOTP secret, redacted)"
          elif [ -n "$E2E_FOUNDER_REAL_MFA_CODE" ]; then
            echo "  Founder MFA evidence: SET (real MFA code, redacted)"
          else
            echo "  Founder MFA evidence: MISSING"
          fi

      - name: Run verification script
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          HARD_LAUNCH_APPROVAL_HMAC_KEY: ${{ secrets.HARD_LAUNCH_APPROVAL_HMAC_KEY }}
          AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
          AUTHORIZED_FOUNDER_EMAILS: ${{ secrets.AUTHORIZED_FOUNDER_EMAILS }}
          PRODUCTION_APPROVED_BY: ${{ secrets.PRODUCTION_APPROVED_BY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
          VITE_ENABLE_FIREBASE_APPCHECK: 'true'
          VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
          E2E_BASE_URL: https://bin-group-57c60.web.app
          E2E_ADMIN_BASE_URL: https://bin-group-admin-panel.web.app
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_OWNER_MAILBOX_EMAIL: ${{ vars.E2E_OWNER_MAILBOX_EMAIL || secrets.E2E_OWNER_MAILBOX_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
          E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
          E2E_TECHNICIAN_EMAIL: ${{ secrets.E2E_TECHNICIAN_EMAIL }}
          E2E_TECHNICIAN_PASSWORD: ${{ secrets.E2E_TECHNICIAN_PASSWORD }}
          E2E_BROKER_MAILBOX_EMAIL: ${{ vars.E2E_BROKER_MAILBOX_EMAIL || secrets.E2E_BROKER_MAILBOX_EMAIL }}
          E2E_BROKER_PASSWORD: ${{ secrets.E2E_BROKER_PASSWORD }}
          E2E_FOUNDER_EMAIL: ${{ vars.E2E_FOUNDER_EMAIL || secrets.E2E_FOUNDER_EMAIL }}
          E2E_FOUNDER_PASSWORD: ${{ secrets.E2E_FOUNDER_PASSWORD }}
          E2E_FOUNDER_TOTP_SECRET: ${{ secrets.E2E_FOUNDER_TOTP_SECRET }}
          E2E_FOUNDER_REAL_MFA_CODE: ${{ secrets.E2E_FOUNDER_REAL_MFA_CODE }}
          LAUNCH_MODE: 'public'
          RUN_PUBLIC_RELEASE_GATE: 'true'
        run: |
          node scripts/verify-production-workflow-env.mjs
