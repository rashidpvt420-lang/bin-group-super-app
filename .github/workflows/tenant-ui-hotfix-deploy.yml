name: Tenant UI Hotfix Deploy (Retired)

# Production deploys are intentionally centralized in
# firebase-production-deploy.yml so exact-SHA, founder authorization,
# incident, artifact, live-role, and postdeployment gates cannot be bypassed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Refuse parallel production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Use the protected production workflow
        run: |
          echo "::error::This deploy path is retired. Dispatch Firebase Production Deploy with its protected production environment and exact current main SHA."
          exit 1
