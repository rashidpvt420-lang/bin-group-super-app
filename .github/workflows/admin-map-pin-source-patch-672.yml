name: Apply Admin Map Pin Source Patch 672

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/admin-map-pin-source-patch-672.yml
      - .github/scripts/apply-admin-map-pin-source-binding-672.py

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 676 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/admin-map-pin-truth-672' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/admin-map-pin-truth-672
          fetch-depth: 0
      - name: Apply deterministic authoritative-source, viewport and disclosure patch
        run: python .github/scripts/apply-admin-map-pin-source-binding-672.py
      - name: Commit only the reviewed Admin map correction
        run: |
          set -euo pipefail
          git add apps/admin-panel/src/pages/map/LiveMapPage.tsx
          git diff --cached --quiet && { echo '::error::Map patch produced no change.'; exit 1; }
          git diff --cached --name-only | grep -Fx 'apps/admin-panel/src/pages/map/LiveMapPage.tsx'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(map): bind pin evidence and preserve admin viewport'
          git push origin HEAD:fix/admin-map-pin-truth-672
