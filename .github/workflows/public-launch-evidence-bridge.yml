name: Public Launch Evidence Bridge

on:
  workflow_run:
    workflows:
      - Live Role Smoke Tests
    types:
      - completed

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: public-launch-evidence-bridge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish-command-center-evidence:
    name: Publish exact-SHA Command Center evidence
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: bin-group-57c60

    steps:
      - name: Detect successful live-evidence artifact
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          artifact_name="live-launch-evidence-${SOURCE_SHA}"
          artifacts="$(gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"
          artifact_count="$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))] | length' <<<"$artifacts")"
          if [[ "$artifact_count" == "0" ]]; then
            echo "has_live_evidence=false" >> "$GITHUB_OUTPUT"
            echo "Successful source run contains no live-evidence artifact; bridge is an intentional no-op."
            exit 0
          fi
          [[ "$artifact_count" == "1" ]]
          artifact_digest="$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name == $name and (.expired | not)) | .digest // empty' <<<"$artifacts" | tr '[:upper:]' '[:lower:]')"
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "has_live_evidence=true" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Checkout exact evidence commit
        if: steps.detect.outputs.has_live_evidence == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Use Node.js 22
        if: steps.detect.outputs.has_live_evidence == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Authenticate Google Cloud
        if: steps.detect.outputs.has_live_evidence == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        if: steps.detect.outputs.has_live_evidence == 'true'
        run: bash scripts/npm-install-retry.sh

      - name: Download exact live-evidence artifact
        if: steps.detect.outputs.has_live_evidence == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.detect.outputs.artifact_name }}
          path: downloaded-live-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Restore cryptographic evidence bundle
        if: steps.detect.outputs.has_live_evidence == 'true'
        shell: bash
        run: |
          set -euo pipefail
          evidence_file="$(find downloaded-live-evidence -type f -name launch-evidence-batch.json -print -quit)"
          deployment_file="$(find downloaded-live-evidence -type f -name production-deployment.json -print -quit)"
          artifact_dir="$(find downloaded-live-evidence -type d -path '*/launch_package/artifacts' -print -quit)"
          if [[ -z "$artifact_dir" ]]; then
            artifact_dir="$(find downloaded-live-evidence -type d -name artifacts -print -quit)"
          fi
          [[ -n "$evidence_file" && -s "$evidence_file" ]]
          [[ -n "$deployment_file" && -s "$deployment_file" ]]
          [[ -n "$artifact_dir" ]]
          mkdir -p launch_package
          cp "$evidence_file" launch_package/launch-evidence-batch.json
          cp "$deployment_file" launch_package/production-deployment.json
          rm -rf launch_package/artifacts
          cp -R "$artifact_dir" launch_package/artifacts

      - name: Build trusted Command Center manifest
        if: steps.detect.outputs.has_live_evidence == 'true'
        env:
          SOURCE_EVIDENCE_MODE: live-role-smoke
          SOURCE_EVIDENCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVIDENCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_EVIDENCE_ARTIFACT_NAME: ${{ steps.detect.outputs.artifact_name }}
          SOURCE_EVIDENCE_ARTIFACT_DIGEST: ${{ steps.detect.outputs.artifact_digest }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_FOUNDER_EMAIL: ceo@bin-groups.com
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_MAILBOX_EMAIL: ${{ vars.E2E_OWNER_MAILBOX_EMAIL || secrets.E2E_OWNER_MAILBOX_EMAIL }}
          E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
          E2E_TECHNICIAN_EMAIL: ${{ secrets.E2E_TECHNICIAN_EMAIL }}
          E2E_BROKER_EMAIL: ${{ secrets.E2E_BROKER_EMAIL }}
          E2E_BROKER_MAILBOX_EMAIL: ${{ vars.E2E_BROKER_MAILBOX_EMAIL || secrets.E2E_BROKER_MAILBOX_EMAIL }}
        run: node scripts/build-command-center-evidence-manifest.mjs

      - name: Validate manifest without writing
        if: steps.detect.outputs.has_live_evidence == 'true'
        run: node scripts/record-firestore-evidence.js --manifest launch_package/command-center-evidence-manifest.json

      - name: Publish append-only evidence to Firestore
        if: steps.detect.outputs.has_live_evidence == 'true'
        run: node scripts/record-firestore-evidence.js --manifest launch_package/command-center-evidence-manifest.json --write

      - name: Verify Firestore publication
        if: steps.detect.outputs.has_live_evidence == 'true'
        env:
          SOURCE_EVIDENCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVIDENCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/verify-command-center-firestore-evidence.mjs

      - name: Upload bridge manifest
        if: steps.detect.outputs.has_live_evidence == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: command-center-evidence-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}
          path: launch_package/command-center-evidence-manifest.json
          if-no-files-found: error
          retention-days: 90
