name: Bootstrap Owner Contract OTP Pepper
run-name: Bootstrap Owner Contract OTP Pepper · ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: bootstrap-owner-contract-otp-pepper-production
  cancel-in-progress: false

jobs:
  authorize-owner-command:
    if: >-
      github.event.issue.number == 434 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/bin-launch bootstrap-owner-contract-otp-pepper' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.bind.outputs.authorized }}
      commit_sha: ${{ steps.bind.outputs.commit_sha }}
    steps:
      - id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          first_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$second_sha" == "$first_sha" ]] || exit 1
          echo "commit_sha=$second_sha" >> "$GITHUB_OUTPUT"
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  bootstrap-production-secret:
    needs: authorize-owner-command
    if: needs.authorize-owner-command.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      GCP_PROJECT_ID: bin-group-57c60
      EXPECTED_COMMIT_SHA: ${{ needs.authorize-owner-command.outputs.commit_sha }}
      DEPLOYMENT_ENVIRONMENT: production
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '434'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.authorize-owner-command.outputs.commit_sha }}
          persist-credentials: false
      - name: Verify exact checkout binding
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          [[ "$checked_out_sha" == "$EXPECTED_COMMIT_SHA" ]]
          current_main="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$EXPECTED_COMMIT_SHA" ]]
          echo "CHECKED_OUT_COMMIT_SHA=$checked_out_sha" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '>= 416.0.0'
          project_id: bin-group-57c60
      - name: Bootstrap and verify Owner contract OTP pepper
        run: node scripts/bootstrap-owner-contract-otp-pepper.mjs
      - name: Reverify exact main after protected mutation
        if: always()
        run: |
          set -euo pipefail
          evidence='launch_package/owner-contract-otp-pepper-bootstrap.json'
          if [[ ! -f "$evidence" ]]; then
            mkdir -p launch_package
            jq -n \
              --arg sha "$EXPECTED_COMMIT_SHA" \
              --arg run_id "$GITHUB_RUN_ID" \
              '{
                schemaVersion: 1,
                status: "failed",
                projectId: "bin-group-57c60",
                secretName: "OWNER_CONTRACT_OTP_PEPPER",
                action: "none",
                previousState: "unknown",
                failureCode: "BOOTSTRAP_STEP_DID_NOT_PRODUCE_EVIDENCE",
                exactCommitSha: $sha,
                workflowRunId: $run_id,
                protectedEnvironment: "production",
                secretTransport: "stdin",
                secretPersistedToRunnerDisk: false,
                secretValueLogged: false,
                hardLaunchClaim: false,
                failedAt: (now | todateiso8601)
              }' > "$evidence"
            chmod 600 "$evidence"
          fi

          current_main="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$EXPECTED_COMMIT_SHA" ]]; then
            tmp="$(mktemp)"
            jq \
              '.status = "failed"
               | .failureCode = "MAIN_ADVANCED_AFTER_SECRET_MUTATION"
               | .hardLaunchClaim = false
               | .verifiedAt = null
               | .failedAt = (now | todateiso8601)' \
              "$evidence" > "$tmp"
            install -m 600 "$tmp" "$evidence"
            rm -f "$tmp"
            exit 1
          fi

          jq -e --arg sha "$EXPECTED_COMMIT_SHA" '
            .status == "passed" and
            .exactCommitSha == $sha and
            .secretTransport == "stdin" and
            .secretPersistedToRunnerDisk == false and
            .secretValueLogged == false and
            .hardLaunchClaim == false
          ' "$evidence" >/dev/null
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-contract-otp-pepper-bootstrap-${{ needs.authorize-owner-command.outputs.commit_sha }}
          path: launch_package/owner-contract-otp-pepper-bootstrap.json
          if-no-files-found: error
          retention-days: 365
      - name: Publish sanitized result
        if: always()
        run: |
          set -euo pipefail
          test -f launch_package/owner-contract-otp-pepper-bootstrap.json
          status="$(jq -r '.status' launch_package/owner-contract-otp-pepper-bootstrap.json)"
          action="$(jq -r '.action' launch_package/owner-contract-otp-pepper-bootstrap.json)"
          failure_code="$(jq -r '.failureCode // empty' launch_package/owner-contract-otp-pepper-bootstrap.json)"
          body="## Owner contract OTP pepper bootstrap\n\n- Exact main SHA: \`$EXPECTED_COMMIT_SHA\`\n- Status: \`$status\`\n- Action: \`$action\`\n- Secret transport: \`stdin\`\n- Secret persisted to runner disk: \`false\`\n- Secret value logged: \`false\`\n- Hard-launch claim: \`false\`"
          if [[ -n "$failure_code" ]]; then body="$body\n- Failure code: \`$failure_code\`"; fi
          body="$body\n\nA fresh exact-SHA bank-pilot deployment is required after a successful bootstrap."
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
