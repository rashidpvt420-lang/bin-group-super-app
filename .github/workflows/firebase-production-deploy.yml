name: Firebase Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly DEPLOY_PRODUCTION_BIN_GROUP_57C60'
        required: true
        type: string
      hard_launch_confirmation:
        description: 'Type exactly AUTHORIZE_HARD_PUBLIC_LAUNCH_BIN_GROUP'
        required: true
        type: string
      expected_commit_sha:
        description: 'Full lowercase 40-character main commit SHA'
        required: true
        type: string
      founder_name:
        description: 'Founder/CEO legal name recorded in the signed authorization'
        required: true
        type: string
      founder_email:
        description: 'Founder/CEO email listed in AUTHORIZED_FOUNDER_EMAILS'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
  VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
  VITE_ENABLE_FIREBASE_APPCHECK: 'true'
  REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
  REACT_APP_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
  REACT_APP_ENABLE_FIREBASE_APPCHECK: 'true'
  REACT_APP_FOUNDER_ADMIN_EMAILS: ${{ secrets.REACT_APP_FOUNDER_ADMIN_EMAILS || 'ceo@bin-groups.com' }}
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
  CI: true
  PRODUCTION_CONFIRMATION_PHRASE: DEPLOY_PRODUCTION_BIN_GROUP_57C60
  HARD_LAUNCH_CONFIRMATION_PHRASE: AUTHORIZE_HARD_PUBLIC_LAUNCH_BIN_GROUP

jobs:
  validate-production-build:
    name: Validate production build
    runs-on: ubuntu-latest

    steps:
      - name: Enforce production dispatch gates
        env:
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          HARD_LAUNCH_CONFIRMATION_INPUT: ${{ inputs.hard_launch_confirmation }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          CURRENT_COMMIT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_CONFIRMATION" != "$PRODUCTION_CONFIRMATION_PHRASE" ]]; then
            echo "::error::Production confirmation phrase mismatch."
            exit 1
          fi
          if [[ "$HARD_LAUNCH_CONFIRMATION_INPUT" != "$HARD_LAUNCH_CONFIRMATION_PHRASE" ]]; then
            echo "::error::Hard-launch confirmation phrase mismatch."
            exit 1
          fi
          if [[ "$CURRENT_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deploy is only approved from refs/heads/main."
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_commit_sha must be a lowercase 40-character SHA."
            exit 1
          fi
          if [[ "$EXPECTED_COMMIT_SHA" != "$CURRENT_COMMIT_SHA" ]]; then
            echo "::error::expected_commit_sha does not equal the workflow commit SHA."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java runtime
        run: java -version

      - name: Repository hygiene guard
        run: node scripts/repo-hygiene-guard.mjs

      - name: Install dependencies with retry
        run: bash scripts/npm-install-retry.sh

      - name: Create production environment files
        run: |
          set -euo pipefail
          printf 'VITE_GOOGLE_MAPS_API_KEY=%s\n' "$VITE_GOOGLE_MAPS_API_KEY" > .env.production
          printf 'VITE_APP_CHECK_SITE_KEY=%s\n' "$VITE_APP_CHECK_SITE_KEY" >> .env.production
          printf 'VITE_ENABLE_FIREBASE_APPCHECK=true\n' >> .env.production
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$VITE_FIREBASE_API_KEY" >> .env.production
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$VITE_FIREBASE_APP_ID" >> .env.production
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$VITE_FIREBASE_MESSAGING_SENDER_ID" >> .env.production
          printf 'VITE_FIREBASE_VAPID_KEY=%s\n' "$VITE_FIREBASE_VAPID_KEY" >> .env.production
          cp .env.production .env.local

          mkdir -p apps/admin-panel
          printf 'GENERATE_SOURCEMAP=false\n' > apps/admin-panel/.env.production
          printf 'REACT_APP_ENABLE_FIREBASE_APPCHECK=true\n' >> apps/admin-panel/.env.production
          printf 'REACT_APP_APP_CHECK_SITE_KEY=%s\n' "$VITE_APP_CHECK_SITE_KEY" >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_API_KEY=%s\n' "$VITE_FIREBASE_API_KEY" >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_APP_ID=%s\n' "$VITE_FIREBASE_APP_ID" >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$VITE_FIREBASE_MESSAGING_SENDER_ID" >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_AUTH_DOMAIN=bin-group-57c60.firebaseapp.com\n' >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_PROJECT_ID=bin-group-57c60\n' >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_STORAGE_BUCKET=bin-group-57c60.firebasestorage.app\n' >> apps/admin-panel/.env.production
          cp apps/admin-panel/.env.production apps/admin-panel/.env.local

      - name: Production stability guard
        run: npm run test:stability

      - name: Launch honesty and hard-launch control regressions
        run: npm run test:launch-honesty

      - name: TypeScript check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Lint root app
        run: npm run lint

      - name: Build shared package
        run: npm run build --workspace=@bin/shared

      - name: Build unified public app
        run: npm run build

      - name: Build dedicated admin panel
        run: npm run build:admin
        env:
          CI: false
          REACT_APP_ENABLE_FIREBASE_APPCHECK: 'true'
          REACT_APP_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: bin-group-57c60.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: bin-group-57c60
          REACT_APP_FIREBASE_STORAGE_BUCKET: bin-group-57c60.firebasestorage.app

      - name: Verify admin Firebase project embedding
        run: npm run verify:admin-firebase -- --build apps/admin-panel/build

      - name: Build Firebase Functions
        run: npm run build --workspace=functions

      - name: Measure Functions discovery load
        run: npm run measure:functions-load

      - name: Run Firestore rules tests
        run: npm run test:rules

      - name: Verify mobile store source readiness
        run: npm run test:mobile-store-readiness

      - name: Verify Firebase hosting entrypoints
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f apps/admin-panel/build/index.html

  deploy-firebase-production-stack:
    name: Deploy Firebase production stack
    runs-on: ubuntu-latest
    needs: validate-production-build
    environment: production

    steps:
      - name: Enforce production dispatch gates
        env:
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          HARD_LAUNCH_CONFIRMATION_INPUT: ${{ inputs.hard_launch_confirmation }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          CURRENT_COMMIT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_CONFIRMATION" == "$PRODUCTION_CONFIRMATION_PHRASE" ]]
          [[ "$HARD_LAUNCH_CONFIRMATION_INPUT" == "$HARD_LAUNCH_CONFIRMATION_PHRASE" ]]
          [[ "$CURRENT_REF" == "refs/heads/main" ]]
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_COMMIT_SHA" == "$CURRENT_COMMIT_SHA" ]]

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deployment and authorization secrets preflight
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          APPROVAL_HMAC_KEY: ${{ secrets.HARD_LAUNCH_APPROVAL_HMAC_KEY }}
          FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
          FOUNDER_EMAILS: ${{ secrets.AUTHORIZED_FOUNDER_EMAILS }}
        run: |
          set -euo pipefail
          missing=0
          require_value() {
            if [[ -z "$2" ]]; then
              echo "::error::Missing required production secret: $1"
              missing=1
            fi
          }
          require_value GCP_WORKLOAD_IDENTITY_PROVIDER "$WIF_PROVIDER"
          require_value GCP_SERVICE_ACCOUNT "$GCP_SERVICE_ACCOUNT"
          require_value VITE_APP_CHECK_SITE_KEY "$APP_CHECK_SITE_KEY"
          require_value VITE_FIREBASE_API_KEY "$FIREBASE_API_KEY"
          require_value VITE_FIREBASE_APP_ID "$FIREBASE_APP_ID"
          require_value VITE_FIREBASE_MESSAGING_SENDER_ID "$FIREBASE_SENDER_ID"
          require_value VITE_FIREBASE_VAPID_KEY "$FIREBASE_VAPID_KEY"
          require_value HARD_LAUNCH_APPROVAL_HMAC_KEY "$APPROVAL_HMAC_KEY"
          require_value AUTHORIZED_FOUNDER_ACTORS "$FOUNDER_ACTORS"
          require_value AUTHORIZED_FOUNDER_EMAILS "$FOUNDER_EMAILS"
          [[ ${#APPROVAL_HMAC_KEY:-0} -ge 0 ]] || true
          if [[ "$missing" -ne 0 ]]; then exit 1; fi
          if [[ ${#APPROVAL_HMAC_KEY} -lt 32 ]]; then
            echo "::error::HARD_LAUNCH_APPROVAL_HMAC_KEY must be at least 32 characters."
            exit 1
          fi

      - name: Authenticate to Google Cloud by Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Repository hygiene guard
        run: node scripts/repo-hygiene-guard.mjs

      - name: Install dependencies with retry
        run: bash scripts/npm-install-retry.sh

      - name: Create signed founder authorization
        env:
          FOUNDER_NAME: ${{ inputs.founder_name }}
          FOUNDER_EMAIL: ${{ inputs.founder_email }}
          DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmation }}
          HARD_LAUNCH_CONFIRMATION: ${{ inputs.hard_launch_confirmation }}
          HARD_LAUNCH_APPROVAL_HMAC_KEY: ${{ secrets.HARD_LAUNCH_APPROVAL_HMAC_KEY }}
          AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
          AUTHORIZED_FOUNDER_EMAILS: ${{ secrets.AUTHORIZED_FOUNDER_EMAILS }}
        run: npm run hard-launch:authorize

      - name: Enforce signed predeploy authorization
        env:
          HARD_LAUNCH_APPROVAL_HMAC_KEY: ${{ secrets.HARD_LAUNCH_APPROVAL_HMAC_KEY }}
          AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
          AUTHORIZED_FOUNDER_EMAILS: ${{ secrets.AUTHORIZED_FOUNDER_EMAILS }}
        run: npm run hard-launch:predeploy

      - name: Create production environment files
        run: |
          set -euo pipefail
          printf 'VITE_GOOGLE_MAPS_API_KEY=%s\n' "$VITE_GOOGLE_MAPS_API_KEY" > .env.production
          printf 'VITE_APP_CHECK_SITE_KEY=%s\n' "$VITE_APP_CHECK_SITE_KEY" >> .env.production
          printf 'VITE_ENABLE_FIREBASE_APPCHECK=true\n' >> .env.production
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$VITE_FIREBASE_API_KEY" >> .env.production
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$VITE_FIREBASE_APP_ID" >> .env.production
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$VITE_FIREBASE_MESSAGING_SENDER_ID" >> .env.production
          printf 'VITE_FIREBASE_VAPID_KEY=%s\n' "$VITE_FIREBASE_VAPID_KEY" >> .env.production
          cp .env.production .env.local

          mkdir -p apps/admin-panel
          printf 'GENERATE_SOURCEMAP=false\n' > apps/admin-panel/.env.production
          printf 'REACT_APP_ENABLE_FIREBASE_APPCHECK=true\n' >> apps/admin-panel/.env.production
          printf 'REACT_APP_APP_CHECK_SITE_KEY=%s\n' "$VITE_APP_CHECK_SITE_KEY" >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_API_KEY=%s\n' "$VITE_FIREBASE_API_KEY" >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_APP_ID=%s\n' "$VITE_FIREBASE_APP_ID" >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$VITE_FIREBASE_MESSAGING_SENDER_ID" >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_AUTH_DOMAIN=bin-group-57c60.firebaseapp.com\n' >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_PROJECT_ID=bin-group-57c60\n' >> apps/admin-panel/.env.production
          printf 'REACT_APP_FIREBASE_STORAGE_BUCKET=bin-group-57c60.firebasestorage.app\n' >> apps/admin-panel/.env.production
          cp apps/admin-panel/.env.production apps/admin-panel/.env.local

      - name: Build shared package
        run: npm run build --workspace=@bin/shared

      - name: Build unified public app
        run: npm run build

      - name: Build dedicated admin panel
        run: npm run build:admin
        env:
          CI: false
          REACT_APP_ENABLE_FIREBASE_APPCHECK: 'true'
          REACT_APP_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: bin-group-57c60.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: bin-group-57c60
          REACT_APP_FIREBASE_STORAGE_BUCKET: bin-group-57c60.firebasestorage.app

      - name: Verify admin Firebase project embedding before deploy
        run: npm run verify:admin-firebase -- --build apps/admin-panel/build

      - name: Build Firebase Functions
        run: npm run build --workspace=functions

      - name: Deploy critical hosting, rules, indexes, and storage
        id: deploy_critical
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx firebase deploy --only hosting,firestore:rules,firestore:indexes,storage --project "$GCP_PROJECT_ID" --non-interactive --force; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$attempt" -eq 3 ]] || sleep 30
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Deploy Firebase Functions
        id: deploy_functions
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx firebase deploy --only functions --project "$GCP_PROJECT_ID" --non-interactive --force; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$attempt" -eq 3 ]] || sleep 30
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Write production deployment metadata
        run: |
          node scripts/write-production-deployment-metadata.mjs \
            --components hosting,firestoreRules,firestoreIndexes,storageRules,functions

      - name: Verify production deployment identity
        run: |
          set -euo pipefail
          npm run verify:production-deployment -- --write-evidence | tee launch_package/production-deployment-verify.log

      - name: Upload production deployment proof
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-${{ github.sha }}
          path: |
            launch_package/hard-launch-authorization.json
            launch_package/production-incidents.json
            launch_package/production-deployment.json
            launch_package/production-deployment-verify.log
          if-no-files-found: error
          retention-days: 90

  validate-live-launch-evidence:
    name: Validate current-commit live launch evidence
    runs-on: ubuntu-latest
    needs: deploy-firebase-production-stack
    environment: production
    env:
      E2E_BASE_URL: https://bin-group-57c60.web.app
      E2E_ADMIN_BASE_URL: https://bin-group-admin-panel.web.app
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
      E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
      E2E_TECHNICIAN_EMAIL: ${{ secrets.E2E_TECHNICIAN_EMAIL }}
      E2E_TECHNICIAN_PASSWORD: ${{ secrets.E2E_TECHNICIAN_PASSWORD }}
      E2E_BROKER_EMAIL: ${{ secrets.E2E_BROKER_EMAIL }}
      E2E_BROKER_PASSWORD: ${{ secrets.E2E_BROKER_PASSWORD }}
      VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
      E2E_STRICT_ROLES: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate Google Cloud for E2E fixtures
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies with retry
        run: bash scripts/npm-install-retry.sh

      - name: Download production deployment proof
        uses: actions/download-artifact@v4
        with:
          name: production-deployment-${{ github.sha }}
          path: _deployment-proof

      - name: Restore deployment proof
        run: |
          set -euo pipefail
          mkdir -p launch_package
          for name in hard-launch-authorization.json production-incidents.json production-deployment.json production-deployment-verify.log; do
            source_file="$(find _deployment-proof -type f -name "$name" -print -quit)"
            if [[ -z "$source_file" ]]; then
              echo "::error::Missing deployment proof file: $name"
              exit 1
            fi
            cp "$source_file" "launch_package/$name"
          done

      - name: Validate full live E2E secrets and App Check UUID
        run: npm run test:e2e:env

      - name: Seed or repair E2E role accounts
        run: npm run seed:e2e:auth

      - name: Seed current-commit five-role fixtures
        run: npm run seed:e2e:live-data

      - name: Run current-commit production deployment evidence
        run: node scripts/run-critical-evidence.mjs --suite productionDeployment

      - name: Run current-commit five-role business evidence
        run: npm run test:e2e:business

      - name: Run current-commit live launch audit
        run: npm run test:e2e:launch-audit:live

      - name: Evaluate controlled-pilot eligibility
        run: npm run launch:status

      - name: Upload current-commit live evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-launch-evidence-${{ github.sha }}
          path: |
            launch_package
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 90

  approve-hard-public-launch:
    name: Create signed hard-launch decision
    runs-on: ubuntu-latest
    needs: validate-live-launch-evidence
    environment: production
    env:
      E2E_BASE_URL: https://bin-group-57c60.web.app
      E2E_ADMIN_BASE_URL: https://bin-group-admin-panel.web.app
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
      E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
      E2E_TECHNICIAN_EMAIL: ${{ secrets.E2E_TECHNICIAN_EMAIL }}
      E2E_TECHNICIAN_PASSWORD: ${{ secrets.E2E_TECHNICIAN_PASSWORD }}
      E2E_BROKER_EMAIL: ${{ secrets.E2E_BROKER_EMAIL }}
      E2E_BROKER_PASSWORD: ${{ secrets.E2E_BROKER_PASSWORD }}
      VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
      HARD_LAUNCH_APPROVAL_HMAC_KEY: ${{ secrets.HARD_LAUNCH_APPROVAL_HMAC_KEY }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
      AUTHORIZED_FOUNDER_EMAILS: ${{ secrets.AUTHORIZED_FOUNDER_EMAILS }}
      E2E_STRICT_ROLES: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies with retry
        run: bash scripts/npm-install-retry.sh

      - name: Download current-commit live evidence
        uses: actions/download-artifact@v4
        with:
          name: live-launch-evidence-${{ github.sha }}
          path: _live-proof

      - name: Restore live evidence package
        run: |
          set -euo pipefail
          rm -rf launch_package
          mkdir -p launch_package
          root="$(find _live-proof -type d -name launch_package -print -quit)"
          if [[ -n "$root" ]]; then
            cp -R "$root"/. launch_package/
          else
            find _live-proof -type f | while read -r file; do
              relative="${file#_live-proof/}"
              mkdir -p "launch_package/$(dirname "$relative")"
              cp "$file" "launch_package/$relative"
            done
          fi
          test -f launch_package/launch-evidence-batch.json
          test -f launch_package/production-deployment.json
          test -f launch_package/hard-launch-authorization.json

      - name: Create signed hard-launch decision
        run: npm run hard-launch:decision

      - name: Verify final hard-launch status
        run: npm run hard-launch:status

      - name: Upload final hard-launch decision
        uses: actions/upload-artifact@v4
        with:
          name: hard-launch-decision-${{ github.sha }}
          path: |
            launch_package/hard-launch-authorization.json
            launch_package/production-incidents.json
            launch_package/production-deployment.json
            launch_package/launch-evidence-batch.json
            launch_package/launch-status.json
