name: Founder Predeploy Environment Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: founder-predeploy-env-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'fix/founder-predeploy-env-guard-30637308881'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce unchanged exact main
        env:
          EXPECTED_MAIN_SHA: 91e8ebe62fce90da65400253b2476efdcba7b3d0
        run: |
          set -euo pipefail
          git fetch origin main
          actual_main_sha="$(git rev-parse origin/main)"
          merge_base_sha="$(git merge-base HEAD origin/main)"
          test "$actual_main_sha" = "$EXPECTED_MAIN_SHA"
          test "$merge_base_sha" = "$EXPECTED_MAIN_SHA"

      - name: Apply Founder predeploy environment repair
        run: node scripts/apply-founder-predeploy-env-guard.mjs

      - name: Run focused regressions
        run: |
          node --test \
            tests/launch/production-client-value-preflight.test.mjs \
            tests/launch/owner-inspection-first-live-evidence.test.mjs

      - name: Verify exact persistent repair scope
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only | sort)
          mapfile -t expected < <(printf '%s\n' \
            '.github/workflows/firebase-production-deploy.yml' \
            'launch_package/generated/firebase-production-deploy-phase1.yml' \
            'scripts/apply-owner-inspection-first-evidence-workflow.mjs' \
            'scripts/verify-production-workflow-env.mjs' \
            'tests/launch/owner-inspection-first-live-evidence.test.mjs' \
            'tests/launch/production-client-value-preflight.test.mjs' | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          test "$(grep -c 'E2E_FOUNDER_EMAIL:' .github/workflows/firebase-production-deploy.yml)" -ge 2
          test "$(grep -c 'inputs.founder_email' .github/workflows/firebase-production-deploy.yml)" -ge 2
          test "$(grep -c 'E2E_FOUNDER_REAL_MFA_CODE:' .github/workflows/firebase-production-deploy.yml)" -eq 2
          grep -q "E2E_FOUNDER_EMAIL'" scripts/verify-production-workflow-env.mjs
          grep -q 'Set a valid E2E_FOUNDER_TOTP_SECRET or six-digit E2E_FOUNDER_REAL_MFA_CODE' scripts/verify-production-workflow-env.mjs
          mkdir -p founder-predeploy-repair
          cp --parents \
            .github/workflows/firebase-production-deploy.yml \
            launch_package/generated/firebase-production-deploy-phase1.yml \
            scripts/apply-owner-inspection-first-evidence-workflow.mjs \
            scripts/verify-production-workflow-env.mjs \
            tests/launch/owner-inspection-first-live-evidence.test.mjs \
            tests/launch/production-client-value-preflight.test.mjs \
            founder-predeploy-repair/
          git diff --check
          git diff --stat > founder-predeploy-repair/validated-diff-stat.txt
          printf '%s\n' \
            "base_main_sha=91e8ebe62fce90da65400253b2476efdcba7b3d0" \
            "repair_source_sha=$(git rev-parse HEAD)" \
            "public_release_gate=false" \
            "hard_launch_claim=false" \
            "payment_policy=phase1-manual" \
            "firebase_dispatched=false" \
            > founder-predeploy-repair/repair-manifest.txt

      - name: Upload validated Founder predeploy repair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: founder-predeploy-repair-${{ github.event.pull_request.head.sha }}
          path: founder-predeploy-repair
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Commit validated non-workflow repair files
        env:
          BRANCH_NAME: fix/founder-predeploy-env-guard-30637308881
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git fetch origin "$BRANCH_NAME"
          test "$(git rev-parse "origin/$BRANCH_NAME")" = "$source_sha"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            launch_package/generated/firebase-production-deploy-phase1.yml \
            scripts/apply-owner-inspection-first-evidence-workflow.mjs \
            scripts/verify-production-workflow-env.mjs \
            tests/launch/owner-inspection-first-live-evidence.test.mjs \
            tests/launch/production-client-value-preflight.test.mjs
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected < <(printf '%s\n' \
            'launch_package/generated/firebase-production-deploy-phase1.yml' \
            'scripts/apply-owner-inspection-first-evidence-workflow.mjs' \
            'scripts/verify-production-workflow-env.mjs' \
            'tests/launch/owner-inspection-first-live-evidence.test.mjs' \
            'tests/launch/production-client-value-preflight.test.mjs' | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${staged[@]}")
          git commit -m 'fix: fail closed on missing Founder production evidence'
          git push origin "HEAD:$BRANCH_NAME"
