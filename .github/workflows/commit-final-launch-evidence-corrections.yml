name: Commit Final Launch Evidence Corrections

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/commit-final-launch-evidence-corrections.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: commit-final-launch-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  commit-validated-patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/finalize-launch-evidence-sequence' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-launch-evidence-sequence
          fetch-depth: 0

      - name: Apply already-validated corrections
        run: |
          node scripts/apply-final-launch-evidence-corrections.mjs
          node scripts/fix-launch-evidence-test-contracts.mjs

      - name: Commit and push with exact-head lease
        id: commit
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            temporary_files=(
              .github/workflows/apply-final-launch-evidence-corrections.yml
              .github/workflows/commit-final-launch-evidence-corrections.yml
              .github/workflows/diagnose-final-launch-evidence-apply.yml
              scripts/apply-final-launch-evidence-corrections.mjs
              scripts/apply-final-launch-evidence-corrections.payload.mjs
              scripts/fix-launch-evidence-test-contracts.mjs
            )
            git rm --ignore-unmatch -- "${temporary_files[@]}"
            git add -A

            allowed_file() {
              case "$1" in
                .env.e2e.example|\
                .github/workflows/admin-production-evidence.yml|\
                .github/workflows/firebase-production-deploy.yml|\
                .github/workflows/live-role-smoke.yml|\
                functions/contractSignatureOtpMailbox.ts|\
                functions/secureBrokerPayoutOperations.ts|\
                scripts/lib/gmail-otp-reader.mjs|\
                scripts/lib/production-otp-mailbox-preflight.mjs|\
                scripts/run-broker-production-evidence.mjs|\
                scripts/run-owner-onboarding-production-evidence.mjs|\
                scripts/run-owner-onboarding-production-evidence-secure.mjs|\
                scripts/verify-e2e-env.mjs|\
                scripts/verify-production-otp-mailboxes.mjs|\
                src/broker/pages/BrokerCommissionsPage.tsx|\
                src/owner/components/ContractSignatureOtpControl.tsx|\
                tests/e2e/business-broker.spec.ts|\
                tests/e2e/business-owner.spec.ts|\
                tests/launch/broker-payout-otp-live-evidence.test.mjs|\
                tests/launch/e2e-mailbox-env-contract.test.mjs|\
                tests/launch/github-workflows-actionlint.test.mjs|\
                tests/launch/gmail-otp-reader-hardening.test.mjs|\
                tests/launch/otp-correlation-contract.test.mjs|\
                tests/launch/owner-onboarding-production-proof.test.mjs|\
                tests/launch/production-otp-mailbox-preflight.test.mjs|\
                tests/launch/workflow-mailbox-secret-scope.test.mjs|\
                .github/workflows/apply-final-launch-evidence-corrections.yml|\
                .github/workflows/commit-final-launch-evidence-corrections.yml|\
                .github/workflows/diagnose-final-launch-evidence-apply.yml|\
                scripts/apply-final-launch-evidence-corrections.mjs|\
                scripts/apply-final-launch-evidence-corrections.payload.mjs|\
                scripts/fix-launch-evidence-test-contracts.mjs)
                  return 0
                  ;;
                *)
                  return 1
                  ;;
              esac
            }

            permanent_count=0
            while IFS= read -r changed_file; do
              [[ -n "$changed_file" ]] || continue
              if ! allowed_file "$changed_file"; then
                echo "::error::Unexpected file in permanent OTP/mailbox commit: $changed_file"
                exit 1
              fi
              case "$changed_file" in
                "${temporary_files[0]}"|"${temporary_files[1]}"|"${temporary_files[2]}"|"${temporary_files[3]}"|"${temporary_files[4]}"|"${temporary_files[5]}") ;;
                *) permanent_count=$((permanent_count + 1)) ;;
              esac
            done < <(git diff --cached --name-only)

            if [[ "$permanent_count" -eq 0 ]]; then
              echo "::error::No permanent reviewed OTP/mailbox changes were staged."
              exit 1
            fi
            for temporary_file in "${temporary_files[@]}"; do
              [[ ! -e "$temporary_file" ]] || {
                echo "::error::Temporary patch machinery remains: $temporary_file"
                exit 1
              }
            done

            git diff --cached --check
            git status --short
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'fix(launch): harden OTP mailbox evidence'
            git push \
              --force-with-lease="refs/heads/agent/finalize-launch-evidence-sequence:${EXPECTED_HEAD_SHA}" \
              origin HEAD:refs/heads/agent/finalize-launch-evidence-sequence
          } > /tmp/final-launch-evidence-commit.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/final-launch-evidence-commit.status
          cat /tmp/final-launch-evidence-commit.log
          exit 0

      - name: Upload commit diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-launch-evidence-commit-${{ github.sha }}
          path: |
            /tmp/final-launch-evidence-commit.log
            /tmp/final-launch-evidence-commit.status
          if-no-files-found: error
          retention-days: 7

      - name: Enforce commit result
        shell: bash
        run: test "$(cat /tmp/final-launch-evidence-commit.status)" = "0"
