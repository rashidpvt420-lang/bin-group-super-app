name: Apply Live Evidence Admin App Check Fix 626

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-live-evidence-admin-appcheck-fix-626
  cancel-in-progress: true

jobs:
  patch-test-clean:
    if: github.event.pull_request.head.ref == 'fix/live-role-admin-appcheck-resolution-626' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-role-admin-appcheck-resolution-626
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Apply protected App Check verifier repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label} marker count: {count}')
              return source.replace(old, new, 1)

          resolver = Path('scripts/resolve-admin-app-check-site-key.mjs')
          source = resolver.read_text(encoding='utf-8')
          anchor = "const PLACEHOLDER_RE = /(?:REPLACE|undefined|null|VALIDATION_ONLY)/i;\n"
          contexts = """const PLACEHOLDER_RE = /(?:REPLACE|undefined|null|VALIDATION_ONLY)/i;
          const PROTECTED_WORKFLOW_JOBS = Object.freeze([
            Object.freeze({ workflow: 'Firebase Production Deploy', job: 'deploy-firebase-production-stack' }),
            Object.freeze({ workflow: 'Live Role Smoke Tests', job: 'live-evidence' }),
            Object.freeze({ workflow: 'Admin Production Evidence', job: 'admin-operational-evidence' }),
          ]);
          """
          source = replace_once(source, anchor, contexts, 'protected workflow whitelist')
          old = """  if (clean(env.GITHUB_WORKFLOW) !== 'Firebase Production Deploy') {
            failures.push('the exact Firebase Production Deploy workflow');
          }
          if (clean(env.GITHUB_JOB) !== 'deploy-firebase-production-stack') {
            failures.push('the deploy-firebase-production-stack job');
          }
          """
          new = """  const workflow = clean(env.GITHUB_WORKFLOW);
          const job = clean(env.GITHUB_JOB);
          if (!PROTECTED_WORKFLOW_JOBS.some((entry) => entry.workflow === workflow && entry.job === job)) {
            failures.push('an explicitly authorized protected production workflow/job');
          }
          """
          source = replace_once(source, old, new, 'protected context guard')
          resolver.write_text(source, encoding='utf-8')

          live = Path('.github/workflows/live-role-smoke.yml')
          source = live.read_text(encoding='utf-8')
          marker = """      - name: Install dependencies
                run: bash scripts/npm-install-retry.sh

              - name: Download exact production deployment artifact
          """.replace('              ', '')
          replacement = """      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Resolve Admin App Check Enterprise site key for hosted verification
        run: node scripts/resolve-admin-app-check-site-key.mjs

      - name: Download exact production deployment artifact
          """
          source = replace_once(source, marker, replacement, 'live evidence resolver step')
          live.write_text(source, encoding='utf-8')

          admin = Path('.github/workflows/admin-production-evidence.yml')
          source = admin.read_text(encoding='utf-8')
          env_marker = """  VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
            FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
            GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
          """.replace('          ', '')
          env_replacement = """  VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
  REACT_APP_ENABLE_FIREBASE_APPCHECK: 'true'
  REACT_APP_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  REACT_APP_ADMIN_FIREBASE_APP_ID: 1:123413252227:web:285cb53bc26626d699f3b6
  REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  REACT_APP_FIREBASE_AUTH_DOMAIN: bin-group-57c60.firebaseapp.com
  REACT_APP_FIREBASE_PROJECT_ID: bin-group-57c60
  REACT_APP_FIREBASE_STORAGE_BUCKET: bin-group-57c60.firebasestorage.app
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
  DEPLOYMENT_ENVIRONMENT: production
          """
          source = replace_once(source, env_marker, env_replacement, 'admin verifier expected client env')
          marker = """      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Download exact deployment evidence
          """
          replacement = """      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Resolve Admin App Check Enterprise site key for hosted verification
        run: node scripts/resolve-admin-app-check-site-key.mjs

      - name: Download exact deployment evidence
          """
          source = replace_once(source, marker, replacement, 'admin evidence resolver step')
          admin.write_text(source, encoding='utf-8')

          test_file = Path('tests/launch/admin-app-check-evidence-resolution.test.mjs')
          test_file.write_text("""import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';

          const read = (path) => readFileSync(path, 'utf8');
          const resolver = read('scripts/resolve-admin-app-check-site-key.mjs');
          const live = read('.github/workflows/live-role-smoke.yml');
          const admin = read('.github/workflows/admin-production-evidence.yml');

          function assertOrdered(source, labels) {
            let previous = -1;
            for (const label of labels) {
              const current = source.indexOf(label);
              assert.ok(current >= 0, `missing required marker: ${label}`);
              assert.ok(current > previous, `marker out of order: ${label}`);
              previous = current;
            }
          }

          test('Admin Enterprise site-key resolver is restricted to explicit protected workflow/job pairs', () => {
            assert.match(resolver, /Firebase Production Deploy', job: 'deploy-firebase-production-stack/);
            assert.match(resolver, /Live Role Smoke Tests', job: 'live-evidence/);
            assert.match(resolver, /Admin Production Evidence', job: 'admin-operational-evidence/);
            assert.match(resolver, /DEPLOYMENT_ENVIRONMENT=production/);
            assert.match(resolver, /refs\/heads\/main/);
            assert.match(resolver, /GCP_PROJECT_ID=/);
            assert.match(resolver, /GITHUB_ENV/);
            assert.match(resolver, /PROTECTED_WORKFLOW_JOBS\.some/);
          });

          test('Live Role resolves the Admin Enterprise key before hosted production reconciliation', () => {
            assertOrdered(live, [
              '- name: Authenticate Google Cloud',
              '- name: Install dependencies',
              '- name: Resolve Admin App Check Enterprise site key for hosted verification',
              '- name: Run every required live evidence suite',
            ]);
            assert.match(live, /run: node scripts\/resolve-admin-app-check-site-key\.mjs/);
            assert.match(live, /DEPLOYMENT_ENVIRONMENT: production/);
          });

          test('Admin Production Evidence resolves the same key and supplies all hosted verifier expectations', () => {
            assertOrdered(admin, [
              '- name: Authenticate Google Cloud',
              '- name: Install dependencies',
              '- name: Resolve Admin App Check Enterprise site key for hosted verification',
              '- name: Restore and verify deployment evidence',
            ]);
            for (const required of [
              'VITE_GOOGLE_MAPS_API_KEY:',
              'VITE_FIREBASE_API_KEY:',
              'VITE_FIREBASE_APP_ID:',
              'VITE_FIREBASE_MESSAGING_SENDER_ID:',
              'VITE_FIREBASE_VAPID_KEY:',
              'REACT_APP_FIREBASE_API_KEY:',
              'REACT_APP_ADMIN_FIREBASE_APP_ID:',
              'REACT_APP_FIREBASE_MESSAGING_SENDER_ID:',
              'DEPLOYMENT_ENVIRONMENT: production',
            ]) assert.match(admin, new RegExp(required));
          });
          """.replace(/^          /gm, ''), encoding='utf-8')
          PY

      - name: Validate targeted repair
        run: |
          node --check scripts/resolve-admin-app-check-site-key.mjs
          node --test tests/launch/admin-app-check-evidence-resolution.test.mjs
          npm run test:launch-honesty
          npm run typecheck

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/resolve-admin-app-check-site-key.mjs \
            .github/workflows/live-role-smoke.yml \
            .github/workflows/admin-production-evidence.yml \
            tests/launch/admin-app-check-evidence-resolution.test.mjs
          git rm .github/workflows/zz-apply-live-role-admin-appcheck-fix-626.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/admin-production-evidence.yml \
            .github/workflows/live-role-smoke.yml \
            .github/workflows/zz-apply-live-role-admin-appcheck-fix-626.yml \
            scripts/resolve-admin-app-check-site-key.mjs \
            tests/launch/admin-app-check-evidence-resolution.test.mjs | sort)"
          [[ "$changed" == "$expected" ]] || {
            echo '::error::Repair touched unexpected files.'
            printf 'Changed:\n%s\nExpected:\n%s\n' "$changed" "$expected"
            exit 1
          }
          git commit -m 'fix(launch): resolve admin App Check key in live evidence'
          git push origin HEAD:fix/live-role-admin-appcheck-resolution-626
