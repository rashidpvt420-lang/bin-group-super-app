name: Staff OS Staging Deploy

on:
  push:
    branches:
      - feature/staff-operating-system

permissions:
  contents: read
  id-token: write

concurrency:
  group: staff-os-staging-deploy
  cancel-in-progress: false

env:
  STAGING_PROJECT_ID: bin-group-staging
  PRODUCTION_PROJECT_ID: bin-group-57c60
  SOURCE_BRANCH: feature/staff-operating-system
  CI: true

jobs:
  validate:
    name: Revalidate exact staging source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Enforce staging-only boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$SOURCE_BRANCH"
          test "$STAGING_PROJECT_ID" = "bin-group-staging"
          test "$STAGING_PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$STAGING_PROJECT_ID" != "bin-group-57c60"
          echo "Staging-only deployment boundary accepted for $GITHUB_SHA"

      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Normalize generated Firestore rules
        run: node scripts/normalize-firestore-rules.mjs

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Repository hygiene guard
        run: node scripts/repo-hygiene-guard.mjs

      - name: Launch honesty and workflow-security tests
        run: npm run test:launch-honesty

      - name: Staff OS comprehensive suite
        run: node tests/staff/staff-os-comprehensive.test.mjs

      - name: Staff OS source-backed workflow contracts
        run: node tests/staff/staff-operating-system.test.mjs

      - name: TypeScript check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Lint root app
        run: npm run lint

      - name: Build Functions
        run: npm run build --workspace=functions

      - name: Firestore security rules tests
        run: npm run test:rules

  deploy:
    name: Deploy exact SHA to Firebase staging only
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 55
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.STAGING_GCP_SERVICE_ACCOUNT }}
      STAGING_V3_APP_CHECK_SITE_KEY_OVERRIDE: ${{ secrets.STAGING_V3_APP_CHECK_SITE_KEY || secrets.STAGING_APP_CHECK_SITE_KEY }}
      STAGING_ENTERPRISE_APP_CHECK_SITE_KEY_OVERRIDE: ${{ secrets.STAGING_ENTERPRISE_APP_CHECK_SITE_KEY || secrets.STAGING_APP_CHECK_ENTERPRISE_SITE_KEY }}
      STAGING_GOOGLE_MAPS_API_KEY: ${{ secrets.STAGING_GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Enforce staging-only boundaries and required deployment identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$SOURCE_BRANCH"
          test "$STAGING_PROJECT_ID" = "bin-group-staging"
          test "$STAGING_PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"
          test "$GCP_WORKLOAD_IDENTITY_PROVIDER" = "projects/355288045402/locations/global/workloadIdentityPools/github-actions-staging/providers/github-bin-group-staging"
          test "$GCP_SERVICE_ACCOUNT" = "github-staging-deploy@bin-group-staging.iam.gserviceaccount.com"

      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.STAGING_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Normalize generated Firestore rules
        run: node scripts/normalize-firestore-rules.mjs

      - name: Verify authenticated access is staging-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project 2>/dev/null)" = "$STAGING_PROJECT_ID"
          npx firebase-tools projects:list --json > "$RUNNER_TEMP/firebase-projects.json"
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/firebase-projects.json', 'utf8'));
          const rows = payload?.result || payload?.projects || [];
          const ids = Array.isArray(rows)
            ? rows.map((row) => row.projectId || row.project_id || row.id).filter(Boolean)
            : [];
          const staging = process.env.STAGING_PROJECT_ID;
          const production = process.env.PRODUCTION_PROJECT_ID;
          if (staging === production) throw new Error('Staging project unexpectedly equals production.');
          if (!ids.includes(staging)) throw new Error(`Authenticated identity cannot access staging project ${staging}.`);
          console.log(`Verified Firebase access to staging project ${staging}.`);
          NODE

      - name: Resolve staging Firebase Web App configuration
        shell: bash
        run: |
          set -euo pipefail
          npx firebase-tools apps:list WEB --project "$STAGING_PROJECT_ID" --json > "$RUNNER_TEMP/staging-web-apps.json"
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/staging-web-apps.json', 'utf8'));
          const raw = payload?.result || payload?.apps || payload;
          const rows = Array.isArray(raw) ? raw : (Array.isArray(raw?.apps) ? raw.apps : []);
          const web = rows.find((row) => String(row.platform || row.platformId || row.type || '').toUpperCase().includes('WEB')) || rows[0];
          const appId = web?.appId || web?.app_id || web?.app?.appId;
          if (!appId) throw new Error('No Firebase Web App exists in the staging project.');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/staging-web-app-id.txt', String(appId));
          console.log(`Resolved staging Web App ${appId}.`);
          NODE
          STAGING_WEB_APP_ID="$(cat "$RUNNER_TEMP/staging-web-app-id.txt")"
          npx firebase-tools apps:sdkconfig WEB "$STAGING_WEB_APP_ID" --project "$STAGING_PROJECT_ID" --json > "$RUNNER_TEMP/staging-sdkconfig.json"
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/staging-sdkconfig.json', 'utf8'));
          const candidates = [
            payload?.result?.sdkConfig,
            payload?.result?.config,
            payload?.result?.fileContents,
            payload?.sdkConfig,
            payload?.config,
            payload?.fileContents,
            payload?.result,
          ];
          let cfg = candidates.find((value) => value && typeof value === 'object' && !Array.isArray(value));
          const stringValue = candidates.find((value) => typeof value === 'string');
          if (!cfg && stringValue) {
            const grab = (name) => {
              const match = stringValue.match(new RegExp(`${name}\\s*:\\s*["']([^"']+)["']`));
              return match?.[1] || '';
            };
            cfg = {
              apiKey: grab('apiKey'),
              authDomain: grab('authDomain'),
              projectId: grab('projectId'),
              storageBucket: grab('storageBucket'),
              messagingSenderId: grab('messagingSenderId'),
              appId: grab('appId'),
            };
          }
          cfg ||= {};
          const required = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
          for (const key of required) {
            if (!cfg[key]) throw new Error(`Staging Firebase sdkconfig is missing ${key}.`);
          }
          if (cfg.projectId !== process.env.STAGING_PROJECT_ID) {
            throw new Error(`Resolved Firebase config belongs to ${cfg.projectId}, not staging.`);
          }
          const pairs = {
            VITE_FIREBASE_API_KEY: cfg.apiKey,
            VITE_FIREBASE_AUTH_DOMAIN: cfg.authDomain,
            VITE_FIREBASE_PROJECT_ID: cfg.projectId,
            VITE_FIREBASE_STORAGE_BUCKET: cfg.storageBucket,
            VITE_FIREBASE_MESSAGING_SENDER_ID: cfg.messagingSenderId,
            VITE_FIREBASE_APP_ID: cfg.appId,
            REACT_APP_FIREBASE_API_KEY: cfg.apiKey,
            REACT_APP_FIREBASE_AUTH_DOMAIN: cfg.authDomain,
            REACT_APP_FIREBASE_PROJECT_ID: cfg.projectId,
            REACT_APP_FIREBASE_STORAGE_BUCKET: cfg.storageBucket,
            REACT_APP_FIREBASE_MESSAGING_SENDER_ID: cfg.messagingSenderId,
            REACT_APP_ADMIN_FIREBASE_APP_ID: cfg.appId,
          };
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(pairs).map(([key, value]) => `${key}=${value}`).join('\n') + '\n');
          NODE

      - name: Resolve staging Hosting inventory
        shell: bash
        run: |
          set -euo pipefail
          npx firebase-tools hosting:sites:list --project "$STAGING_PROJECT_ID" --json > "$RUNNER_TEMP/staging-sites.json"
          test -s "$RUNNER_TEMP/staging-sites.json"

      - name: Resolve staging-only App Check keys
        env:
          STAGING_WEB_APP_ID_FILE: ${{ runner.temp }}/staging-web-app-id.txt
          STAGING_HOSTING_SITES_FILE: ${{ runner.temp }}/staging-sites.json
        run: node scripts/resolve-staging-appcheck-keys.mjs

      - name: Build shared package and staging frontends
        env:
          CI: false
          VITE_ENABLE_FIREBASE_APPCHECK: 'true'
          VITE_GOOGLE_MAPS_API_KEY: ${{ env.STAGING_GOOGLE_MAPS_API_KEY }}
          REACT_APP_ENABLE_FIREBASE_APPCHECK: 'true'
          REACT_APP_GOOGLE_MAPS_API_KEY: ${{ env.STAGING_GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_FIREBASE_PROJECT_ID" = "$STAGING_PROJECT_ID"
          test "$REACT_APP_FIREBASE_PROJECT_ID" = "$STAGING_PROJECT_ID"
          test -n "$VITE_APP_CHECK_SITE_KEY"
          test -n "$REACT_APP_APP_CHECK_SITE_KEY"
          npm run build --workspace=@bin/shared
          npm run build
          npm run build:admin
          test -f dist/index.html
          test -f apps/admin-panel/build/index.html

      - name: Write exact-SHA staging manifests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const evidence = {
            schemaVersion: 1,
            commitSha: process.env.GITHUB_SHA,
            branch: process.env.SOURCE_BRANCH,
            firebaseProjectId: process.env.STAGING_PROJECT_ID,
            productionProjectId: process.env.PRODUCTION_PROJECT_ID,
            deploymentEnvironment: 'staging',
            productionTouched: false,
            migrationExecuted: false,
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync(`dist/staff-os-staging-${process.env.GITHUB_SHA}.json`, JSON.stringify(evidence, null, 2) + '\n');
          fs.writeFileSync(`apps/admin-panel/build/staff-os-staging-${process.env.GITHUB_SHA}.json`, JSON.stringify(evidence, null, 2) + '\n');
          NODE

      - name: Deploy Functions to staging
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          npm run build --workspace=functions
          GOOGLE_CLOUD_PROJECT="$STAGING_PROJECT_ID" node functions/selectStagingRuntime.cjs
          npx firebase-tools deploy --only functions --project "$STAGING_PROJECT_ID" --force --non-interactive

      - name: Deploy Firestore rules, indexes, and Storage rules to staging
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage --project "$STAGING_PROJECT_ID" --non-interactive

      - name: Generate isolated staging Hosting configs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_HOSTING_SITE"
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const entries = Array.isArray(source.hosting) ? source.hosting : [source.hosting];
          const app = entries.find((entry) => entry && entry.target === 'app');
          const admin = entries.find((entry) => entry && entry.target === 'admin');
          if (!app || !admin) throw new Error('Canonical app/admin Hosting entries were not found.');
          const site = process.env.STAGING_HOSTING_SITE;
          if (!site || site === process.env.PRODUCTION_PROJECT_ID || site === 'bin-group-admin-panel') {
            throw new Error('Refusing production or empty Hosting destination.');
          }
          const appConfig = JSON.parse(JSON.stringify(app));
          const adminConfig = JSON.parse(JSON.stringify(admin));
          delete appConfig.target;
          delete adminConfig.target;
          appConfig.site = site;
          adminConfig.site = site;
          fs.writeFileSync('firebase.staff-staging-app.json', JSON.stringify({ hosting: appConfig }, null, 2) + '\n');
          fs.writeFileSync('firebase.staff-staging-admin.json', JSON.stringify({ hosting: adminConfig }, null, 2) + '\n');
          NODE

      - name: Deploy exact SHA to isolated staging preview channels
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          APP_CHANNEL="staff-app-${SHORT_SHA}"
          ADMIN_CHANNEL="staff-admin-${SHORT_SHA}"
          npx firebase-tools hosting:channel:deploy "$APP_CHANNEL" \
            --config firebase.staff-staging-app.json \
            --project "$STAGING_PROJECT_ID" \
            --expires 7d \
            --non-interactive \
            --json > "$RUNNER_TEMP/staff-app-preview.json"
          npx firebase-tools hosting:channel:deploy "$ADMIN_CHANNEL" \
            --config firebase.staff-staging-admin.json \
            --project "$STAGING_PROJECT_ID" \
            --expires 7d \
            --non-interactive \
            --json > "$RUNNER_TEMP/staff-admin-preview.json"
          echo "APP_CHANNEL=$APP_CHANNEL" >> "$GITHUB_ENV"
          echo "ADMIN_CHANNEL=$ADMIN_CHANNEL" >> "$GITHUB_ENV"

      - name: Verify deployed exact-SHA manifests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const parseUrl = (file) => {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            const result = payload?.result || payload;
            const candidates = [
              result?.url,
              result?.previewUrl,
              result?.hosting?.url,
              result?.details?.url,
            ].filter(Boolean);
            const deep = JSON.stringify(result).match(/https:\/\/[^"\\]+\.web\.app[^"\\]*/g) || [];
            return String(candidates[0] || deep[0] || '').replace(/\\u0026/g, '&');
          };
          const appUrl = parseUrl(process.env.RUNNER_TEMP + '/staff-app-preview.json');
          const adminUrl = parseUrl(process.env.RUNNER_TEMP + '/staff-admin-preview.json');
          if (!appUrl || !adminUrl) throw new Error('Could not resolve staging preview URLs from Firebase CLI evidence.');
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_APP_PREVIEW_URL=${appUrl}\nSTAGING_ADMIN_PREVIEW_URL=${adminUrl}\n`);
          fs.writeFileSync(process.env.RUNNER_TEMP + '/preview-urls.json', JSON.stringify({ appUrl, adminUrl }, null, 2));
          NODE
          MANIFEST="staff-os-staging-${GITHUB_SHA}.json"
          curl --fail --silent --show-error --location "$STAGING_APP_PREVIEW_URL/$MANIFEST" -o "$RUNNER_TEMP/app-manifest.json"
          curl --fail --silent --show-error --location "$STAGING_ADMIN_PREVIEW_URL/$MANIFEST" -o "$RUNNER_TEMP/admin-manifest.json"
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['app-manifest.json', 'admin-manifest.json']) {
            const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/' + file, 'utf8'));
            if (payload.commitSha !== process.env.GITHUB_SHA) throw new Error(`${file} SHA mismatch.`);
            if (payload.firebaseProjectId !== process.env.STAGING_PROJECT_ID) throw new Error(`${file} project mismatch.`);
            if (payload.productionTouched !== false || payload.migrationExecuted !== false) throw new Error(`${file} safety marker mismatch.`);
          }
          console.log('Verified exact-SHA staging manifests on both preview channels.');
          NODE

      - name: Record staging deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging_deployment_evidence
          cp "$RUNNER_TEMP/staff-app-preview.json" staging_deployment_evidence/staff-app-preview.json
          cp "$RUNNER_TEMP/staff-admin-preview.json" staging_deployment_evidence/staff-admin-preview.json
          cp "$RUNNER_TEMP/preview-urls.json" staging_deployment_evidence/preview-urls.json
          cp "$RUNNER_TEMP/app-manifest.json" staging_deployment_evidence/app-manifest.json
          cp "$RUNNER_TEMP/admin-manifest.json" staging_deployment_evidence/admin-manifest.json
          node <<'NODE'
          const fs = require('fs');
          const evidence = {
            schemaVersion: 1,
            commitSha: process.env.GITHUB_SHA,
            branch: process.env.SOURCE_BRANCH,
            firebaseProjectId: process.env.STAGING_PROJECT_ID,
            hostingSite: process.env.STAGING_HOSTING_SITE,
            appPreviewChannel: process.env.APP_CHANNEL,
            adminPreviewChannel: process.env.ADMIN_CHANNEL,
            appPreviewUrl: process.env.STAGING_APP_PREVIEW_URL,
            adminPreviewUrl: process.env.STAGING_ADMIN_PREVIEW_URL,
            functionsDeployed: true,
            firestoreRulesDeployed: true,
            firestoreIndexesDeployed: true,
            storageRulesDeployed: true,
            productionTouched: false,
            migrationExecuted: false,
            deploymentMode: 'isolated-staging-preview',
            deployedAt: new Date().toISOString(),
          };
          fs.writeFileSync('staging_deployment_evidence/staff-os-staging-deployment.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE

      - name: Upload staging deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staff-os-staging-${{ github.sha }}
          path: staging_deployment_evidence
          if-no-files-found: error
          retention-days: 30
