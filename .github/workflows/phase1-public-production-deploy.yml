name: Phase 1 Public Production Release

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Exact current main SHA authorized by the Owner request PR
        required: true
        type: string
      authorization_actor:
        description: Repository Owner who opened the authorization PR
        required: true
        type: string
      authorization_source_pr:
        description: Open draft Owner authorization PR number
        required: true
        type: string
      confirmation:
        description: Type exactly DEPLOY_PHASE1_PUBLIC_BIN_GROUP
        required: true
        type: string
      hard_launch_confirmation:
        description: Type exactly AUTHORIZE_PHASE1_PUBLIC_YES_GO
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

concurrency:
  group: phase1-public-production-release
  cancel-in-progress: false

env:
  CI: true
  GCP_PROJECT_ID: bin-group-57c60
  DEPLOYMENT_ENVIRONMENT: production
  LAUNCH_MODE: phase1-public
  E2E_BASE_URL: https://bin-group-57c60.web.app
  E2E_ADMIN_BASE_URL: https://bin-group-admin-panel.web.app
  VITE_ENABLE_FIREBASE_APPCHECK: 'true'
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
  VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
  REACT_APP_ENABLE_FIREBASE_APPCHECK: 'true'
  REACT_APP_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
  REACT_APP_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  REACT_APP_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  REACT_APP_FIREBASE_AUTH_DOMAIN: bin-group-57c60.firebaseapp.com
  REACT_APP_FIREBASE_PROJECT_ID: bin-group-57c60
  REACT_APP_FIREBASE_STORAGE_BUCKET: bin-group-57c60.firebasestorage.app

jobs:
  deploy-and-prove-phase1-public:
    name: Deploy exact SHA and prove Phase 1 public launch
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    steps:
      - name: Enforce exact Owner authorization request
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          AUTHORIZATION_ACTOR: ${{ inputs.authorization_actor }}
          SOURCE_PR: ${{ inputs.authorization_source_pr }}
          CONFIRMATION: ${{ inputs.confirmation }}
          HARD_CONFIRMATION: ${{ inputs.hard_launch_confirmation }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$CONFIRMATION" == "DEPLOY_PHASE1_PUBLIC_BIN_GROUP" ]] || fail "Phase 1 production confirmation mismatch."
          [[ "$HARD_CONFIRMATION" == "AUTHORIZE_PHASE1_PUBLIC_YES_GO" ]] || fail "Phase 1 hard-launch confirmation mismatch."
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || fail "Phase 1 production release must run on main."
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Expected SHA must be a full lowercase SHA."
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]] || fail "Workflow SHA does not match the authorized exact main SHA."
          [[ "$SOURCE_PR" =~ ^[1-9][0-9]*$ ]] || fail "Authorization source PR is invalid."
          [[ "$AUTHORIZATION_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || fail "Only the repository Owner can authorize Phase 1 public launch."

          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')"
          [[ "$main_sha" == "$EXPECTED_SHA" ]] || fail "Current main advanced beyond the authorized SHA."

          pr_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR")"
          jq -e \
            --arg actor "$AUTHORIZATION_ACTOR" \
            --arg sha "$EXPECTED_SHA" \
            --arg repository "$GITHUB_REPOSITORY" '
              .state == "open" and
              .draft == true and
              .title == "Authorize protected Phase 1 public release" and
              .user.login == $actor and
              .base.ref == "main" and
              .base.sha == $sha and
              .head.repo.full_name == $repository and
              (.head.ref | startswith("ops/dispatch-phase1-public-"))
            ' <<<"$pr_json" >/dev/null || fail "Authorization PR identity, state, title, branch or exact-SHA binding is invalid."

          files_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR/files?per_page=100")"
          jq -e 'length == 1 and .[0].filename == ".github/phase1-public-dispatch-request"' <<<"$files_json" >/dev/null \
            || fail "Authorization PR must change only the canonical Phase 1 request marker."

          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          marker_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/phase1-public-dispatch-request?ref=$head_sha")"
          marker="$(jq -r '.content' <<<"$marker_json" | tr -d '\n' | base64 --decode)"
          expected_marker=$(cat <<EOF
          request=dispatch-protected-phase1-public
          expected_main_sha=$EXPECTED_SHA
          payment_methods=CASH,CHEQUE
          bank_transfer_enabled=false
          stripe_enabled=false
          hard_launch_claim=conditional-on-live-proof
          EOF
          )
          [[ "$marker" == "$expected_marker" ]] || fail "Phase 1 authorization marker is malformed or does not match the exact main SHA."

      - name: Checkout exact authorized main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          fetch-depth: 0

      - name: Verify checkout and remote main remain exact
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" == "$EXPECTED_SHA" ]]

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Authenticate to Google Cloud by Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Production secrets and identity preflight
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          APPROVED_BY: ${{ secrets.PRODUCTION_APPROVED_BY }}
          AUTHORIZED_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
          AUTHORIZED_EMAILS: ${{ secrets.AUTHORIZED_FOUNDER_EMAILS }}
        run: |
          set -euo pipefail
          [[ -n "$WIF_PROVIDER" ]]
          [[ -n "$SERVICE_ACCOUNT" ]]
          [[ -n "$APPROVED_BY" ]]
          [[ -n "$AUTHORIZED_ACTORS" ]]
          [[ -n "$AUTHORIZED_EMAILS" ]]
          grep -Eq '(^|,)${{ inputs.authorization_actor }}(,|$)' <<<"$AUTHORIZED_ACTORS"
          grep -Eq '(^|,)ceo@bin-groups\.com(,|$)' <<<"$AUTHORIZED_EMAILS"

      - name: Resolve protected Owner mailbox identity
        env:
          E2E_OWNER_MAILBOX_EMAIL_CONFIGURED: ${{ vars.E2E_OWNER_MAILBOX_EMAIL || secrets.E2E_OWNER_MAILBOX_EMAIL }}
          E2E_OWNER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_ID }}
          E2E_OWNER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_SECRET }}
          E2E_OWNER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_OWNER_MAILBOX_REFRESH_TOKEN }}
          E2E_BROKER_MAILBOX_EMAIL_CONFIGURED: ${{ vars.E2E_BROKER_MAILBOX_EMAIL || secrets.E2E_BROKER_MAILBOX_EMAIL }}
          E2E_BROKER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_ID }}
          E2E_BROKER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_SECRET }}
          E2E_BROKER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_BROKER_MAILBOX_REFRESH_TOKEN }}
        run: node scripts/resolve-production-mailbox-identities.mjs

      - name: Install dependencies with retry
        run: bash scripts/npm-install-retry.sh

      - name: Create strict production environment files
        run: node scripts/write-production-env.mjs

      - name: Repository and launch honesty guards
        run: |
          set -euo pipefail
          node scripts/repo-hygiene-guard.mjs
          npm run test:stability
          npm run test:launch-honesty

      - name: Compile and build exact production artifacts
        env:
          CI: false
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run build --workspace=@bin/shared
          npm run build
          npm run build:admin
          npm run verify:admin-firebase -- --build apps/admin-panel/build
          npm run build:functions
          npm run measure:functions-load
          npm run test:rules
          npm run test:mobile-store-readiness

      - name: Compute exact validated artifact digest
        id: artifact_digest
        run: |
          set -euo pipefail
          digest="$(node scripts/compute-artifact-digest.mjs)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "VALIDATED_ARTIFACT_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Write production-environment approval binding
        env:
          APPROVED_BY: ${{ secrets.PRODUCTION_APPROVED_BY }}
          RELEASE_ID: phase1-public-${{ github.run_id }}-${{ github.run_attempt }}
          AUTHORIZATION_ACTOR: ${{ inputs.authorization_actor }}
          AUTHORIZATION_SOURCE_PR: ${{ inputs.authorization_source_pr }}
        run: |
          set -euo pipefail
          mkdir -p launch_package
          node <<'NODE'
          const fs = require('fs');
          const doc = {
            schemaVersion: 1,
            commitSha: process.env.GITHUB_SHA,
            artifactDigest: process.env.VALIDATED_ARTIFACT_DIGEST,
            releaseId: process.env.RELEASE_ID,
            approvedAt: new Date().toISOString(),
            approvedBy: process.env.APPROVED_BY,
            approvedVia: 'github-environment-protection',
            githubEnvironment: 'production',
            launchMode: 'phase1-public',
            authorizationActor: process.env.AUTHORIZATION_ACTOR,
            authorizationSourcePullRequest: Number(process.env.AUTHORIZATION_SOURCE_PR),
            approvedPaymentMethods: ['CASH', 'CHEQUE'],
            bankTransferEnabled: false,
            stripeEnabled: false,
          };
          fs.writeFileSync('launch_package/predeploy-approval.json', `${JSON.stringify(doc, null, 2)}\n`);
          NODE

      - name: Deploy and verify exact Firebase production stack
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_ARTIFACT_DIGEST: ${{ steps.artifact_digest.outputs.digest }}
        run: node scripts/deploy-firebase-production.mjs

      - name: Install Chromium for clean-browser proof
        run: npx playwright install --with-deps chromium

      - name: Prove real production App Check in a clean browser without debug token
        env:
          E2E_BASE_URL: https://bin-group-57c60.web.app
        run: |
          set -euo pipefail
          unset VITE_FIREBASE_APPCHECK_DEBUG_TOKEN FIREBASE_APPCHECK_DEBUG_TOKEN
          npx playwright test tests/e2e/production-clean-browser-appcheck.spec.ts --project=chromium-desktop

      - name: Run complete Phase 1 Owner to Admin MFA activation journey
        env:
          VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_OWNER_MAILBOX_EMAIL: ${{ vars.E2E_OWNER_MAILBOX_EMAIL || secrets.E2E_OWNER_MAILBOX_EMAIL }}
          E2E_OWNER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_ID }}
          E2E_OWNER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_SECRET }}
          E2E_OWNER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_OWNER_MAILBOX_REFRESH_TOKEN }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_FOUNDER_TOTP_SECRET: ${{ secrets.E2E_FOUNDER_TOTP_SECRET }}
        run: node scripts/run-phase1-public-owner-launch-evidence.mjs

      - name: Write exact-SHA YES-GO decision only after every live proof passed
        env:
          AUTHORIZATION_ACTOR: ${{ inputs.authorization_actor }}
          AUTHORIZATION_SOURCE_PR: ${{ inputs.authorization_source_pr }}
          VALIDATED_ARTIFACT_DIGEST: ${{ steps.artifact_digest.outputs.digest }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const deployment = read('launch_package/production-deployment.json');
          const appCheck = read('launch_package/artifacts/clean-browser-appcheck-evidence.json');
          const journey = read('launch_package/artifacts/phase1-public-owner-launch-evidence.json');
          const sha = process.env.GITHUB_SHA;
          const fail = (message) => { throw new Error(message); };
          if (deployment.status !== 'passed' || deployment.deployedCommitSha !== sha || deployment.httpChecksOk !== true || deployment.bundleVerified !== true) fail('Exact-SHA production deployment evidence is incomplete.');
          if (deployment.validatedArtifactDigest !== process.env.VALIDATED_ARTIFACT_DIGEST) fail('Deployment artifact digest mismatch.');
          if (appCheck.status !== 'passed' || appCheck.commitSha !== sha || appCheck.debugTokenPresent !== false || appCheck.appCheckTokenObtained !== true || appCheck.protectedCallableVerified !== true) fail('Clean-browser real App Check evidence is incomplete.');
          if (journey.status !== 'passed' || journey.commitSha !== sha || journey.hardLaunchDecision !== 'YES-GO' || journey.dashboardUnlocked !== true || journey.contractActive !== true || journey.propertyActive !== true || journey.bankTransferEnabled !== false || journey.stripeEnabled !== false) fail('Phase 1 live Owner activation evidence is incomplete.');
          const decision = {
            schemaVersion: 1,
            status: 'passed',
            decision: 'YES-GO',
            launchMode: 'phase1-public',
            projectId: 'bin-group-57c60',
            repository: process.env.GITHUB_REPOSITORY,
            commitSha: sha,
            artifactDigest: process.env.VALIDATED_ARTIFACT_DIGEST,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            authorizationActor: process.env.AUTHORIZATION_ACTOR,
            authorizationSourcePullRequest: Number(process.env.AUTHORIZATION_SOURCE_PR),
            approvedPaymentMethods: ['CASH', 'CHEQUE'],
            bankTransferEnabled: false,
            stripeEnabled: false,
            cleanBrowserAppCheckVerified: true,
            fullOwnerAdminMfaJourneyVerified: true,
            deployedExactShaVerified: true,
            noGoBlockersRemaining: [],
            decidedAt: new Date().toISOString(),
          };
          fs.writeFileSync('launch_package/phase1-public-launch-decision.json', `${JSON.stringify(decision, null, 2)}\n`);
          console.log('PHASE 1 PUBLIC LAUNCH DECISION: YES-GO');
          NODE

      - name: Upload Phase 1 public launch evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-public-yes-go-${{ github.sha }}
          path: |
            launch_package/predeploy-approval.json
            launch_package/production-deployment.json
            launch_package/production-deployment-verify.log
            launch_package/artifacts/clean-browser-appcheck-evidence.json
            launch_package/artifacts/phase1-public-owner-launch-evidence.json
            launch_package/phase1-public-launch-decision.json
            test-results/**
            playwright-report/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload failed Phase 1 diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-public-failure-${{ github.sha }}-${{ github.run_id }}
          path: |
            launch_package/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 30
