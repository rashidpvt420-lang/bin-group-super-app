name: Current Main Firestore Verification

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-current-main:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore and Storage rules suite
        id: rules
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run test:rules 2>&1 | tee current-main-rules-output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build expression-overflow diagnostic
        if: always()
        shell: bash
        run: |
          if grep -Fq "maximum of 1000 expressions" current-main-rules-output.log; then
            grep -n -B 8 -A 12 -F "maximum of 1000 expressions" current-main-rules-output.log > overflow-context.txt || true
          else
            echo "No Firestore 1000-expression overflow detected." > overflow-context.txt
          fi
          cat overflow-context.txt

      - name: Upload expression-overflow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-overflow-context-${{ github.run_id }}
          path: overflow-context.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce expression-budget and rules result
        shell: bash
        run: |
          if grep -F "maximum of 1000 expressions" current-main-rules-output.log; then
            echo "Firestore 1000-expression overflow detected."
            exit 1
          fi
          if [ "${{ steps.rules.outputs.exit_code }}" != "0" ]; then
            echo "Firestore/Storage rules suite failed."
            exit 1
          fi

      - name: Run stability suite
        run: npm run test:stability

      - name: Run launch-honesty suite
        run: npm run test:launch-honesty
