name: Scheduled Services Production (Retired)

# Scheduled-service code remains covered by normal CI. Production deployment
# is centralized in firebase-production-deploy.yml so no partial stack can
# bypass exact-SHA, founder, incident, artifact, role-proof, or postdeploy gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Refuse parallel production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Use the protected production workflow
        run: |
          echo "::error::This deploy path is retired. Dispatch Firebase Production Deploy with its protected production environment and exact current main SHA."
          exit 1
