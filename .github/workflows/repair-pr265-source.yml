name: Repair PR 265 source contracts

on:
  push:
    branches:
      - repair/current-main-ci-blockers-2bbb986

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/current-main-ci-blockers-2bbb986
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact fail-closed source repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          coherence_path = Path('tests/launch/firebase-production-workflow-coherence.test.mjs')
          source = coherence_path.read_text(encoding='utf-8')
          old = """test('same-run deployment artifact downloads without nesting launch_package twice', () => {
            assert.match(
              workflow,
              /name: Download production deployment metadata[\\s\\S]{0,300}name: production-deployment-\\$\\{\\{ github\\.sha \\}\\}[\\s\\S]{0,120}path: \\./,
            );
            assert.doesNotMatch(
              workflow,
              /name: Download production deployment metadata[\\s\\S]{0,300}path: launch_package/,
            );
          });"""
          new = """test('same-run deployment artifact downloads without nesting launch_package twice', () => {
            const stepStart = workflow.indexOf(
              '      - name: Download production deployment metadata',
            );
            assert.ok(stepStart >= 0, 'deployment metadata download step missing');
            const nextStep = workflow.indexOf('\\n      - name:', stepStart + 1);
            const stepBlock = workflow.slice(
              stepStart,
              nextStep >= 0 ? nextStep : workflow.length,
            );

            assert.match(
              stepBlock,
              /name:\\s*production-deployment-\\$\\{\\{\\s*github\\.sha\\s*\\}\\}/,
            );
            assert.match(stepBlock, /^\\s*path:\\s*\\.\\s*$/m);
            assert.doesNotMatch(stepBlock, /^\\s*path:\\s*launch_package\\s*$/m);
          });"""
          if source.count(old) != 1:
              raise SystemExit('STOP: expected exactly one stale deployment-download assertion block')
          coherence_path.write_text(source.replace(old, new), encoding='utf-8')

          verifier_path = Path('scripts/verify-scheduled-services-completeness.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          runtime_export = '      \'export * from "./tenantTicketOperations";\',\n'
          if runtime_export not in verifier:
              anchor = '      \'export * from "./ticketDispatchOperations";\',\n'
              if verifier.count(anchor) != 1:
                  raise SystemExit('STOP: runtime export anchor missing or duplicated')
              verifier = verifier.replace(anchor, anchor + runtime_export)
              verifier_path.write_text(verifier, encoding='utf-8')

          self_path = Path('.github/workflows/repair-pr265-source.yml')
          if not self_path.exists():
              raise SystemExit('STOP: transient repair workflow is missing')
          self_path.unlink()
          PY

          git diff --check
          git diff --exit-code -- .github/workflows/firebase-production-deploy.yml
          git diff --name-only

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Validate repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-scheduled-services-completeness.mjs
          npm run test:stability
          npm run test:launch-honesty
          npm run typecheck
          npm run build:functions
          npm run build

      - name: Commit repaired source to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/launch/firebase-production-workflow-coherence.test.mjs
          git add scripts/verify-scheduled-services-completeness.mjs
          git add .github/workflows/repair-pr265-source.yml
          git diff --cached --check
          git commit -m 'test(ci): make launch verifier assertions semantic'
          git push origin HEAD:repair/current-main-ci-blockers-2bbb986
