name: One-shot Android Release Dispatch

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.ref == 'ops/android-release-f6b7d4ae'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: f6b7d4ae4e1ea694bbf6e6e8fea7053a9465f5b4
    steps:
      - name: Dispatch exact-main signed Android AAB
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          gh_get() {
            local endpoint="$1"
            local output=""
            for attempt in 1 2 3 4 5; do
              if output="$(gh api "$endpoint")"; then
                printf '%s' "$output"
                return 0
              fi
              echo "GitHub API GET attempt $attempt failed; retrying safely." >&2
              sleep $((attempt * 3))
            done
            return 1
          }

          current="$(gh_get "repos/$REPOSITORY/commits/main" | jq -r '.sha')" \
            || fail "Unable to verify current main."
          [[ "$current" == "$TARGET_SHA" ]] \
            || fail "main moved from $TARGET_SHA to $current; refusing stale Android dispatch."

          find_exact_run() {
            local runs_json
            runs_json="$(gh_get "repos/$REPOSITORY/actions/workflows/android-store-release.yml/runs?branch=main&event=workflow_dispatch&per_page=100")" \
              || return 1
            jq -r --arg sha "$TARGET_SHA" '
              [.workflow_runs[]
                | select(.head_branch == "main")
                | select(.event == "workflow_dispatch")
                | select(.head_sha == $sha)
                | select(.status != "completed" or .conclusion == "success")]
              | sort_by(.created_at) | reverse | .[0].id // empty' <<<"$runs_json"
          }

          existing="$(find_exact_run || true)"
          if [[ "$existing" =~ ^[1-9][0-9]*$ ]]; then
            echo "Exact-SHA Android run already exists: $existing"
            exit 0
          fi

          payload="$(jq -nc --arg ref main --arg sha "$TARGET_SHA" \
            '{ref:$ref,inputs:{expected_commit_sha:$sha,confirmation:"BUILD_SIGNED_ANDROID_AAB_BIN_GROUP"}}')"

          for dispatch_attempt in 1 2 3; do
            accepted=false
            if printf '%s' "$payload" | gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/actions/workflows/android-store-release.yml/dispatches" --input -; then
              accepted=true
            else
              echo "Android dispatch POST attempt $dispatch_attempt was inconclusive; checking before retry." >&2
            fi

            for _ in $(seq 1 36); do
              run_id="$(find_exact_run || true)"
              if [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
                echo "Android Store Release exact-SHA run: $run_id"
                exit 0
              fi
              sleep 5
            done

            if [[ "$accepted" == "true" ]]; then
              fail "Android dispatch was accepted but no exact-SHA run appeared; refusing duplicate POST."
            fi
          done

          fail "Unable to dispatch or correlate exact-SHA Android Store Release safely."
