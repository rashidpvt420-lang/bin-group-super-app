name: Apply Technician GPS Queue Patch 673

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/technician-gps-queue-patch-673.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/technician-gps-durable-queue-673' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/technician-gps-durable-queue-673
          fetch-depth: 0
      - name: Apply narrowed deterministic tracking state-machine patch
        run: python .github/scripts/apply-technician-gps-queue-673.py
      - name: Commit only the patched tracking utility
        run: |
          set -euo pipefail
          git add src/utils/liveTracking.ts
          git diff --cached --quiet && { echo '::error::GPS patch produced no change.'; exit 1; }
          git diff --cached --name-only | grep -Fx 'src/utils/liveTracking.ts'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(gps): replay durable STOP state truthfully'
          git push origin HEAD:fix/technician-gps-durable-queue-673
