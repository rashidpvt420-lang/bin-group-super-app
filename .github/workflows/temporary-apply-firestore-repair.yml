name: Temporary Apply Firestore Repair

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: temporary-apply-firestore-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-current-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current clearance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/final-firestore-clearance-v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align scheduled fallback verifier
        run: node scripts/fix-scheduled-fallback-verifier.mjs

      - name: Commit verifier alignment
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- scripts/verify-scheduled-services-completeness.mjs; then
            echo "Expected scheduled verifier change was not produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/verify-scheduled-services-completeness.mjs
          git commit -m "Validate fail-closed fallback outcomes"
          git push origin HEAD:fix/final-firestore-clearance-v2

      - name: Verify scheduled-services completeness
        run: node scripts/verify-scheduled-services-completeness.mjs

      - name: Run stability suite
        run: npm run test:stability

      - name: Run launch-honesty suite
        run: npm run test:launch-honesty
