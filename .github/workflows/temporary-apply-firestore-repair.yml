name: Temporary Apply Firestore Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-apply-firestore-repair.yml

permissions:
  contents: write

concurrency:
  group: temporary-apply-firestore-repair
  cancel-in-progress: false

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/final-firestore-security-clearance

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic hardening
        run: node scripts/apply-final-firestore-security-hardening.mjs

      - name: Verify generated changes
        shell: bash
        run: |
          git diff --check
          git diff --stat
          if git diff --quiet -- firestore.rules test/security-rules.test.js; then
            echo "Expected Firestore rule/test changes were not produced."
            exit 1
          fi

      - name: Run rules suite and reject expression overflow
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-test-output.log
          if grep -F "maximum of 1000 expressions" rules-test-output.log; then
            echo "Firestore 1000-expression overflow remains."
            exit 1
          fi

      - name: Run launch-critical regression suites
        run: |
          npm run test:stability
          npm run test:launch-honesty

      - name: Commit and push verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- firestore.rules test/security-rules.test.js
          git diff --cached --check
          git commit -m "Enforce explicit user subcollections and stale-token suspension"
          git push origin HEAD:fix/final-firestore-security-clearance
