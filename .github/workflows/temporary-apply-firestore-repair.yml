name: Temporary Apply Firestore Repair

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: temporary-apply-firestore-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  capture-launch-honesty:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current clearance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/final-firestore-clearance-v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run and capture launch-honesty suite
        id: honesty
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run test:launch-honesty 2>&1 | tee launch-honesty-output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist launch-honesty diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p launch_package
          cp launch-honesty-output.log launch_package/launch-honesty-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- launch_package/launch-honesty-output.txt
          git commit -m "Record launch-honesty diagnostics" || true
          git push origin HEAD:fix/final-firestore-clearance-v2

      - name: Enforce launch-honesty result
        shell: bash
        run: |
          if [ "${{ steps.honesty.outputs.exit_code }}" != "0" ]; then
            echo "Launch-honesty suite failed."
            exit 1
          fi
