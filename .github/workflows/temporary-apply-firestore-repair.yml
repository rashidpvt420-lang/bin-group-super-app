name: Temporary Apply Firestore Repair

on:
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: write

concurrency:
  group: temporary-apply-firestore-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout clean repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/final-firestore-clearance-v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Apply complete Firestore clearance patch
        run: node scripts/apply-final-firestore-clearance-entry.mjs

      - name: Verify generated changes
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff -- firestore.rules test/security-rules.test.js
          if git diff --quiet -- firestore.rules test/security-rules.test.js; then
            echo "Expected final Firestore changes were not produced."
            exit 1
          fi

      - name: Commit generated security changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- firestore.rules test/security-rules.test.js
          git diff --cached --check
          git commit -m "Finalize Firestore security rules and actor-routed ticket updates"
          git push origin HEAD:fix/final-firestore-clearance-v2

      - name: Run rules suite and reject expression overflow
        id: rules
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-test-output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist complete rule-test diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p launch_package
          cp rules-test-output.log launch_package/firestore-rule-test-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- launch_package/firestore-rule-test-output.txt
          git commit -m "Record final Firestore rule-test diagnostics" || true
          git push origin HEAD:fix/final-firestore-clearance-v2

      - name: Enforce clean rules result
        shell: bash
        run: |
          if grep -F "maximum of 1000 expressions" rules-test-output.log; then
            echo "Firestore 1000-expression overflow remains."
            exit 1
          fi
          if [ "${{ steps.rules.outputs.exit_code }}" != "0" ]; then
            echo "Firestore/Storage rules suite failed."
            exit 1
          fi

      - name: Run launch-critical regression suites
        run: |
          npm run test:stability
          npm run test:launch-honesty
