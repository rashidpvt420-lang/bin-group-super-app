name: Temporary Apply Firestore Repair

on:
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: write

concurrency:
  group: temporary-apply-firestore-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout clean repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/final-firestore-clearance-v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Optimize technician evidence authorization
        run: node scripts/optimize-technician-ticket-update.mjs

      - name: Run rules suite and reject expression overflow
        id: rules
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-test-output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce clean rules result
        shell: bash
        run: |
          if grep -F "maximum of 1000 expressions" rules-test-output.log; then
            echo "Firestore 1000-expression overflow remains."
            exit 1
          fi
          if [ "${{ steps.rules.outputs.exit_code }}" != "0" ]; then
            echo "Firestore/Storage rules suite failed."
            exit 1
          fi
