name: Diagnose Property Geo Functions Build

on:
  push:
    branches:
      - fix/property-geo-dispatch-authority-main
    paths:
      - .github/workflows/diagnose-property-geo-functions.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/diagnose-property-geo-functions.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.actor == github.repository_owner &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/fix/property-geo-dispatch-authority-main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/property-geo-dispatch-authority-main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/property-geo-dispatch-authority-main

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies quietly
        shell: bash
        run: |
          set +e
          bash scripts/npm-install-retry.sh > dependency-install.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then tail -120 dependency-install.txt; fi
          exit "$status"

      - name: Capture Functions build
        id: build
        shell: bash
        run: |
          set +e
          npm run build:functions > property-geo-functions-build.txt 2>&1
          status=$?
          cat property-geo-functions-build.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Functions diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: property-geo-functions-build-${{ github.sha }}
          path: property-geo-functions-build.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce Functions build
        run: test "${{ steps.build.outputs.status }}" = "0"
