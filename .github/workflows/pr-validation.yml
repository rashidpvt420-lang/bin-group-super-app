name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: false
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

jobs:
  validate:
    name: Install, typecheck, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Repository hygiene guard
        run: node scripts/repo-hygiene-guard.mjs

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Verify Functions compiler configuration
        run: node --test test/functions-tsconfig.test.mjs

      - name: Production stability guard
        id: stability
        shell: bash
        run: |
          set +e
          npm run test:stability > stability-output.txt 2>&1
          status=$?
          cat stability-output.txt
          exit $status

      - name: Upload stability diagnostics
        if: failure() && steps.stability.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: stability-diagnostics
          path: stability-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Launch honesty and workflow-security tests
        id: launch_honesty
        shell: bash
        run: |
          set +e
          npm run test:launch-honesty > launch-honesty-output.txt 2>&1
          status=$?
          cat launch-honesty-output.txt
          exit $status

      - name: Upload launch-honesty diagnostics
        if: failure() && steps.launch_honesty.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: launch-honesty-diagnostics
          path: launch-honesty-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: TypeScript check
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc -p tsconfig.app.json --noEmit > typecheck-output.txt 2>&1
          status=$?
          cat typecheck-output.txt
          exit $status

      - name: Upload TypeScript diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Lint root app
        run: npm run lint

      - name: Build unified Vite app
        run: npm run build

      - name: Build dedicated admin panel
        id: build_admin
        shell: bash
        env:
          CI: false
        run: |
          set +e
          npm run build:admin > admin-build-output.txt 2>&1
          status=$?
          cat admin-build-output.txt
          exit $status

      - name: Upload Admin build diagnostics
        if: failure() && steps.build_admin.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: admin-build-diagnostics-${{ github.sha }}
          path: admin-build-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Build functions
        id: build_functions
        shell: bash
        run: |
          set +e
          npm run build --workspace=functions > functions-build-output.txt 2>&1
          status=$?
          cat functions-build-output.txt
          exit $status

      - name: Upload Functions build diagnostics
        if: failure() && steps.build_functions.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: functions-build-diagnostics-${{ github.sha }}
          path: functions-build-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run Firestore and Storage security rules tests
        run: npm run test:rules

      - name: Verify mobile store source readiness
        run: npm run test:mobile-store-readiness
