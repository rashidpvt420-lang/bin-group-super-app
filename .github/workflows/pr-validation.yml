name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: false
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

jobs:
  validate:
    name: Install, typecheck, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repository hygiene guard
        run: node scripts/repo-hygiene-guard.mjs

      - name: Admin canonicalization inventory
        run: node scripts/audit-admin-canonicalization.mjs

      - name: Route and duplicate implementation audit
        id: duplicate_audit
        run: npm run audit:duplicates

      - name: Canonical route architecture guard
        run: node scripts/verify-canonical-route-architecture.mjs

      - name: Upload route consolidation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-consolidation-audit
          path: artifacts/route-consolidation
          if-no-files-found: error
          retention-days: 14

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Production stability guard
        id: stability
        shell: bash
        run: |
          set +e
          npm run test:stability > stability-output.txt 2>&1
          status=$?
          cat stability-output.txt
          exit $status

      - name: Upload stability diagnostics
        if: failure() && steps.stability.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: stability-diagnostics
          path: stability-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: TypeScript check
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc -p tsconfig.app.json --noEmit > typecheck-output.txt 2>&1
          status=$?
          cat typecheck-output.txt
          exit $status

      - name: Upload TypeScript diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Lint root app
        run: npm run lint

      - name: Build unified Vite app
        run: npm run build

      - name: Build dedicated admin panel
        run: npm run build:admin
        env:
          CI: false

      - name: Build functions
        run: npm run build --workspace=functions

      - name: Verify mobile store source readiness
        run: npm run test:mobile-store-readiness
