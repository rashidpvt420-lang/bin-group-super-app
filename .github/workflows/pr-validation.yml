name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Validation operation
        required: true
        default: validate
        type: string
      expected_commit_sha:
        description: Exact current main SHA for certificate export
        required: false
        type: string
      request_pr:
        description: Draft owner request PR number
        required: false
        type: string
      confirmation:
        description: Protected operation confirmation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: false
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

jobs:
  validate:
    name: Install, typecheck, lint, and build
    if: github.event_name == 'pull_request' || github.event.inputs.operation != 'export-play-certificate'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Normalize Firestore rules before hygiene guard
        run: npm run normalize:rules

      - name: Repository hygiene guard
        run: node scripts/repo-hygiene-guard.mjs

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Verify Functions compiler configuration
        run: node --test test/functions-tsconfig.test.mjs

      - name: Production stability guard
        id: stability
        shell: bash
        run: |
          set +e
          npm run test:stability > stability-output.txt 2>&1
          status=$?
          cat stability-output.txt
          exit $status

      - name: Upload stability diagnostics
        if: failure() && steps.stability.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: stability-diagnostics
          path: stability-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Launch honesty and workflow-security tests
        id: launch_honesty
        shell: bash
        run: |
          set +e
          npm run test:launch-honesty > launch-honesty-output.txt 2>&1
          status=$?
          cat launch-honesty-output.txt
          exit $status

      - name: Upload launch-honesty diagnostics
        if: failure() && steps.launch_honesty.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: launch-honesty-diagnostics
          path: launch-honesty-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: TypeScript check
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc -p tsconfig.app.json --noEmit > typecheck-output.txt 2>&1
          status=$?
          cat typecheck-output.txt
          exit $status

      - name: Upload TypeScript diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Lint root app
        run: npm run lint

      - name: Build unified Vite app
        run: npm run build

      - name: Build dedicated admin panel
        id: build_admin
        shell: bash
        env:
          CI: false
        run: |
          set +e
          npm run build:admin > admin-build-output.txt 2>&1
          status=$?
          cat admin-build-output.txt
          exit $status

      - name: Upload Admin build diagnostics
        if: failure() && steps.build_admin.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: admin-build-diagnostics-${{ github.sha }}
          path: admin-build-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Build functions
        id: build_functions
        shell: bash
        run: |
          set +e
          npm run build --workspace=functions > functions-build-output.txt 2>&1
          status=$?
          cat functions-build-output.txt
          exit $status

      - name: Upload Functions build diagnostics
        if: failure() && steps.build_functions.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: functions-build-diagnostics-${{ github.sha }}
          path: functions-build-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run Firestore and Storage security rules tests
        run: npm run test:rules

      - name: Verify mobile store source readiness
        run: npm run test:mobile-store-readiness

  dispatch_play_certificate:
    name: Dispatch protected Play certificate export
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'ops/dispatch-play-cert-extraction-') &&
      github.event.pull_request.title == 'Dispatch protected Play certificate extraction'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUEST_PR: ${{ github.event.pull_request.number }}
      REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Validate owner request and dispatch exact-main child run
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(gh api --paginate "repos/$REPOSITORY/pulls/$REQUEST_PR/files" --jq '.[].filename')
          [[ "${#files[@]}" -eq 1 && "${files[0]}" == '.github/play-cert-extraction-request' ]] || {
            printf '::error::Certificate request must change only .github/play-cert-extraction-request. Found: %s\n' "${files[*]:-none}"
            exit 1
          }

          marker="$(gh api "repos/$REPOSITORY/contents/.github/play-cert-extraction-request?ref=$REQUEST_HEAD_SHA" --jq '.content' | tr -d '\n' | base64 --decode)"
          grep -q '^request=extract-public-play-upload-certificate$' <<< "$marker"
          grep -q '^private_material_artifact_allowed=false$' <<< "$marker"
          grep -q '^hard_launch_claim=false$' <<< "$marker"

          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]] || {
            echo '::error::Main moved while preparing certificate export.'
            exit 1
          }

          gh api --method POST "repos/$REPOSITORY/actions/workflows/pr-validation.yml/dispatches" \
            -f ref='main' \
            -f 'inputs[operation]=export-play-certificate' \
            -f "inputs[expected_commit_sha]=$second_sha" \
            -f "inputs[request_pr]=$REQUEST_PR" \
            -f 'inputs[confirmation]=EXPORT_PUBLIC_PLAY_CERTIFICATE_BIN_GROUP'

          echo "Dispatched protected certificate export for $second_sha from request PR #$REQUEST_PR."

  announce_play_certificate:
    name: Announce protected Play certificate run
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'export-play-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      release_sha: ${{ steps.authorize.outputs.release_sha }}
      request_pr: ${{ steps.authorize.outputs.request_pr }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TRACKING_ISSUE: '478'
      EXPECTED_COMMIT_SHA: ${{ github.event.inputs.expected_commit_sha }}
      REQUEST_PR: ${{ github.event.inputs.request_pr }}
      CONFIRMATION: ${{ github.event.inputs.confirmation }}
    steps:
      - name: Authorize exact-main certificate operation
        id: authorize
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$CONFIRMATION" == 'EXPORT_PUBLIC_PLAY_CERTIFICATE_BIN_GROUP' ]]
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_PR" =~ ^[0-9]+$ ]]

          current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$current_main" == "$EXPECTED_COMMIT_SHA" ]] || {
            echo "::error::Expected main $EXPECTED_COMMIT_SHA but current main is $current_main."
            exit 1
          }

          pr_state="$(gh api "repos/$REPOSITORY/pulls/$REQUEST_PR" --jq '.state')"
          pr_draft="$(gh api "repos/$REPOSITORY/pulls/$REQUEST_PR" --jq '.draft')"
          pr_owner="$(gh api "repos/$REPOSITORY/pulls/$REQUEST_PR" --jq '.user.login')"
          pr_title="$(gh api "repos/$REPOSITORY/pulls/$REQUEST_PR" --jq '.title')"
          pr_head="$(gh api "repos/$REPOSITORY/pulls/$REQUEST_PR" --jq '.head.ref')"
          [[ "$pr_state" == 'open' ]]
          [[ "$pr_draft" == 'true' ]]
          [[ "$pr_owner" == "$GITHUB_REPOSITORY_OWNER" ]]
          [[ "$pr_title" == 'Dispatch protected Play certificate extraction' ]]
          [[ "$pr_head" == ops/dispatch-play-cert-extraction-* ]]

          mapfile -t files < <(gh api --paginate "repos/$REPOSITORY/pulls/$REQUEST_PR/files" --jq '.[].filename')
          [[ "${#files[@]}" -eq 1 && "${files[0]}" == '.github/play-cert-extraction-request' ]]

          echo "release_sha=$EXPECTED_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "request_pr=$REQUEST_PR" >> "$GITHUB_OUTPUT"

      - name: Publish waiting-for-production status
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="## Protected Play Store certificate extraction

- Status: \`WAITING_FOR_PRODUCTION_ENVIRONMENT\`
- Exact SHA: \`$EXPECTED_COMMIT_SHA\`
- Request PR: #$REQUEST_PR — draft, do not merge
- Workflow run ID: \`$GITHUB_RUN_ID\`
- Workflow run: $run_url
- Protected job: \`Export public Android upload certificate\`
- Artifact: pending
- Package: \`ae.bingroups.superapp\`
- Private key included: \`false\`
- Keystore included: \`false\`
- Passwords included: \`false\`
- Hard-launch claim: \`false\`"
          gh api --method PATCH "repos/$REPOSITORY/issues/$TRACKING_ISSUE" \
            -f state='open' \
            -f body="$body" >/dev/null

  export_play_certificate:
    name: Export public Android upload certificate
    needs: announce_play_certificate
    if: needs.announce_play_certificate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.announce_play_certificate.outputs.release_sha }}
      REQUEST_PR: ${{ needs.announce_play_certificate.outputs.request_pr }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Verify main remained frozen before extraction
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Main moved from $RELEASE_SHA to $remote_main before extraction."
            exit 1
          }

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate protected Android signing inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          [[ "${#missing[@]}" -eq 0 ]] || {
            missing_csv="$(IFS=,; printf '%s' "${missing[*]}")"
            echo "::error::Missing protected Android signing inputs: $missing_csv"
            exit 1
          }

      - name: Decode keystore and write signing properties
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/bin-group-upload.jks
          chmod 600 android/app/bin-group-upload.jks
          [[ -s android/app/bin-group-upload.jks ]]

          umask 077
          printf '%s\n' \
            'storeFile=app/bin-group-upload.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > android/keystore.properties
          [[ -s android/keystore.properties ]]

      - name: Export and verify public upload certificate
        id: certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play-store-certificate

          keytool -exportcert -rfc \
            -keystore android/app/bin-group-upload.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file play-store-certificate/bin-group-upload-certificate.pem

          grep -q -- '-----BEGIN CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem
          grep -q -- '-----END CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem

          keytool -printcert \
            -file play-store-certificate/bin-group-upload-certificate.pem \
            > play-store-certificate/bin-group-upload-certificate-details.txt

          fingerprint="$(awk -F': ' '/SHA256:/{print $2; exit}' play-store-certificate/bin-group-upload-certificate-details.txt)"
          [[ "$fingerprint" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]
          certificate_file_sha256="$(sha256sum play-store-certificate/bin-group-upload-certificate.pem | awk '{print $1}')"
          [[ "$certificate_file_sha256" =~ ^[0-9a-f]{64}$ ]]

          jq -n \
            --arg commitSha "$RELEASE_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg requestPr "$REQUEST_PR" \
            --arg packageName 'ae.bingroups.superapp' \
            --arg certificateSha256Fingerprint "$fingerprint" \
            --arg certificateFileSha256 "$certificate_file_sha256" \
            '{
              schemaVersion: 6,
              commitSha: $commitSha,
              workflowRunId: $workflowRunId,
              requestPr: $requestPr,
              packageName: $packageName,
              certificateSha256Fingerprint: $certificateSha256Fingerprint,
              certificateFileSha256: $certificateFileSha256,
              publicCertificateOnly: true,
              privateKeyExcluded: true,
              keystoreExcluded: true,
              passwordsExcluded: true,
              hardLaunchClaim: false
            }' > play-store-certificate/play-store-certificate-evidence.json

          artifact_name="bin-group-play-store-certificate-$RELEASE_SHA-$GITHUB_RUN_ID"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Verify certificate artifact allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find play-store-certificate -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(
            bin-group-upload-certificate-details.txt
            bin-group-upload-certificate.pem
            play-store-certificate-evidence.json
          )
          [[ "${files[*]}" == "${expected[*]}" ]]
          ! find play-store-certificate -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' \) | grep -q .

      - name: Upload public Play certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.certificate.outputs.artifact_name }}
          path: play-store-certificate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Verify main remained frozen through extraction
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Certificate exported, but main moved to $remote_main."
            exit 1
          }

      - name: Remove private Android signing material
        if: always()
        shell: bash
        run: |
          set +e
          shred -u android/app/bin-group-upload.jks 2>/dev/null || rm -f android/app/bin-group-upload.jks
          shred -u android/keystore.properties 2>/dev/null || rm -f android/keystore.properties
