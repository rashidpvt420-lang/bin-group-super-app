name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: false
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

jobs:
  validate:
    name: Install, typecheck, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Normalize Firestore rules before hygiene guard
        run: npm run normalize:rules

      - name: Repository hygiene guard
        run: node scripts/repo-hygiene-guard.mjs

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Verify Functions compiler configuration
        run: node --test test/functions-tsconfig.test.mjs

      - name: Production stability guard
        id: stability
        shell: bash
        run: |
          set +e
          npm run test:stability > stability-output.txt 2>&1
          status=$?
          cat stability-output.txt
          exit $status

      - name: Upload stability diagnostics
        if: failure() && steps.stability.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: stability-diagnostics
          path: stability-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Launch honesty and workflow-security tests
        id: launch_honesty
        shell: bash
        run: |
          set +e
          npm run test:launch-honesty > launch-honesty-output.txt 2>&1
          status=$?
          cat launch-honesty-output.txt
          exit $status

      - name: Upload launch-honesty diagnostics
        if: failure() && steps.launch_honesty.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: launch-honesty-diagnostics
          path: launch-honesty-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: TypeScript check
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc -p tsconfig.app.json --noEmit > typecheck-output.txt 2>&1
          status=$?
          cat typecheck-output.txt
          exit $status

      - name: Upload TypeScript diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Lint root app
        run: npm run lint

      - name: Build unified Vite app
        run: npm run build

      - name: Build dedicated admin panel
        id: build_admin
        shell: bash
        env:
          CI: false
        run: |
          set +e
          npm run build:admin > admin-build-output.txt 2>&1
          status=$?
          cat admin-build-output.txt
          exit $status

      - name: Upload Admin build diagnostics
        if: failure() && steps.build_admin.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: admin-build-diagnostics-${{ github.sha }}
          path: admin-build-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Build functions
        id: build_functions
        shell: bash
        run: |
          set +e
          npm run build --workspace=functions > functions-build-output.txt 2>&1
          status=$?
          cat functions-build-output.txt
          exit $status

      - name: Upload Functions build diagnostics
        if: failure() && steps.build_functions.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: functions-build-diagnostics-${{ github.sha }}
          path: functions-build-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run Firestore and Storage security rules tests
        run: npm run test:rules

      - name: Verify mobile store source readiness
        run: npm run test:mobile-store-readiness

  export-play-upload-certificate:
    name: Export protected Play upload certificate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'ops/dispatch-play-cert-extraction-') &&
      github.event.pull_request.title == 'Dispatch protected Play certificate extraction'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Resolve stable exact current main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]] || {
            echo 'Main changed while authorizing certificate extraction.' >&2
            exit 1
          }
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Verify main remained frozen before extraction
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "Main moved from $RELEASE_SHA to $remote_main before certificate extraction." >&2
            exit 1
          }

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate protected Android signing inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || {
              echo "Missing required protected secret: $name" >&2
              exit 1
            }
          done

      - name: Decode keystore and write local signing properties
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/bin-group-upload.jks
          chmod 600 android/app/bin-group-upload.jks
          [[ -s android/app/bin-group-upload.jks ]]

          umask 077
          printf '%s\n' \
            'storeFile=app/bin-group-upload.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > android/keystore.properties
          [[ -s android/keystore.properties ]]

      - name: Export and verify public upload certificate
        id: certificate
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play-store-certificate

          keytool -exportcert -rfc \
            -keystore android/app/bin-group-upload.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file play-store-certificate/bin-group-upload-certificate.pem

          grep -q -- '-----BEGIN CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem
          grep -q -- '-----END CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem

          keytool -printcert \
            -file play-store-certificate/bin-group-upload-certificate.pem \
            > play-store-certificate/bin-group-upload-certificate-details.txt

          fingerprint="$(awk -F': ' '/SHA256:/{print $2; exit}' play-store-certificate/bin-group-upload-certificate-details.txt)"
          [[ "$fingerprint" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]

          certificate_file_sha256="$(sha256sum play-store-certificate/bin-group-upload-certificate.pem | awk '{print $1}')"
          [[ "$certificate_file_sha256" =~ ^[0-9a-f]{64}$ ]]

          jq -n \
            --arg commitSha "$RELEASE_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg packageName 'ae.bingroups.superapp' \
            --arg certificateSha256Fingerprint "$fingerprint" \
            --arg certificateFileSha256 "$certificate_file_sha256" \
            '{
              schemaVersion: 1,
              commitSha: $commitSha,
              workflowRunId: $workflowRunId,
              packageName: $packageName,
              certificateSha256Fingerprint: $certificateSha256Fingerprint,
              certificateFileSha256: $certificateFileSha256,
              publicCertificateOnly: true,
              privateKeyExcluded: true,
              keystoreExcluded: true,
              passwordsExcluded: true,
              hardLaunchClaim: false
            }' > play-store-certificate/play-store-certificate-evidence.json

          artifact_name="bin-group-play-store-certificate-$RELEASE_SHA-$GITHUB_RUN_ID"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Verify certificate artifact allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find play-store-certificate -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(
            bin-group-upload-certificate-details.txt
            bin-group-upload-certificate.pem
            play-store-certificate-evidence.json
          )
          [[ "${files[*]}" == "${expected[*]}" ]]
          ! find play-store-certificate -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' \) | grep -q .

      - name: Upload public Play certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.certificate.outputs.artifact_name }}
          path: play-store-certificate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Verify main remained frozen through extraction
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "Certificate exported, but main moved to $remote_main; refusing exact-SHA evidence." >&2
            exit 1
          }

      - name: Remove private Android signing material
        if: always()
        shell: bash
        run: |
          set +e
          shred -u android/app/bin-group-upload.jks 2>/dev/null || rm -f android/app/bin-group-upload.jks
          shred -u android/keystore.properties 2>/dev/null || rm -f android/keystore.properties

  review-privileged-accounts:
    name: Review protected privileged accounts without mutation
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'ops/dispatch-privileged-review-') &&
      github.event.pull_request.title == 'Dispatch protected privileged account review'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      GCP_PROJECT_ID: bin-group-57c60

    steps:
      - name: Resolve stable exact current main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]] || {
            echo 'Main changed while authorizing privileged-account review.' >&2
            exit 1
          }
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Verify main remained frozen before review
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "Main moved from $RELEASE_SHA to $remote_main before privileged review." >&2
            exit 1
          }

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Build read-only privileged-account inventory
        env:
          PRIVILEGED_REVIEW_COMMIT_SHA: ${{ steps.release.outputs.sha }}
          PRIVILEGED_REVIEW_REF: refs/heads/main
        run: node scripts/review-privileged-accounts-production.mjs

      - name: Validate exact-SHA no-mutation review evidence
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          report='launch_package/privileged-account-cleanup.json'
          [[ -s "$report" ]]
          jq -e --arg sha "$RELEASE_SHA" '
            .schemaVersion == 2 and
            .status == "dry-run" and
            .projectId == "bin-group-57c60" and
            .commitSha == $sha and
            .ref == "refs/heads/main" and
            .mutationPerformed == false and
            .deletedAccountCount == 0 and
            .deletedProfileDocumentCount == 0 and
            .sensitiveValuesExcluded == true and
            .auditLogsPreserved == true and
            .nonPrivilegedAccountsUntouched == true and
            .hardLaunchClaim == false and
            (.canonicalFounderReady | type) == "boolean" and
            (.executionEligible | type) == "boolean" and
            (.deletionTargetCount | type) == "number"
          ' "$report" >/dev/null

      - name: Verify main remained frozen through review
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "Privileged review completed, but main moved to $remote_main; refusing exact-SHA evidence." >&2
            exit 1
          }

      - name: Upload sanitized privileged review artifact
        uses: actions/upload-artifact@v4
        with:
          name: privileged-account-cleanup-review-${{ steps.release.outputs.sha }}-${{ github.run_id }}
          path: launch_package/privileged-account-cleanup.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Publish sanitized privileged review summary
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          report='launch_package/privileged-account-cleanup.json'
          ready="$(jq -r '.canonicalFounderReady' "$report")"
          email_verified="$(jq -r '.founderEmailVerified' "$report")"
          phone_mfa="$(jq -r '.founderPhoneMfaReady' "$report")"
          eligible="$(jq -r '.executionEligible' "$report")"
          privileged_count="$(jq -r '.privilegedAccountCountBefore' "$report")"
          target_count="$(jq -r '.deletionTargetCount' "$report")"
          blockers="$(jq -r '.executionBlockers | join("; ") | if length == 0 then "none" else . end' "$report")"
          artifact="privileged-account-cleanup-review-$RELEASE_SHA-$GITHUB_RUN_ID"
          body="## Privileged-account review

- Exact SHA: \`$RELEASE_SHA\`
- Review run ID: \`$GITHUB_RUN_ID\`
- Artifact: \`$artifact\`
- Canonical Founder ready: \`$ready\`
- Founder email verified: \`$email_verified\`
- Founder phone MFA ready: \`$phone_mfa\`
- Privileged accounts: \`$privileged_count\`
- Unexpected deletion targets: \`$target_count\`
- Cleanup execution eligible: \`$eligible\`
- Execution blockers: \`$blockers\`
- Mutation performed: \`false\`
- Hard-launch claim: \`false\`"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
