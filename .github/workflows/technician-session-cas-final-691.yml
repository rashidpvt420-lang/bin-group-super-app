name: Apply Technician Session CAS Final 691

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/technician-session-cas-final-691.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 691 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/technician-gps-session-cas' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/technician-gps-session-cas
          fetch-depth: 0
      - name: Apply update-session and duplicate-STOP CAS hardening
        run: python .github/scripts/apply-technician-session-cas-final-691.py
      - name: Commit bounded server CAS changes
        run: |
          set -euo pipefail
          git add functions/technicianLiveLocation.ts tests/launch/technician-live-location-cas.test.mjs
          git diff --cached --quiet && { echo '::error::Final session CAS patch produced no changes.'; exit 1; }
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(gps): reject competing sessions and preserve STOP idempotence'
          git push origin HEAD:fix/technician-gps-session-cas
