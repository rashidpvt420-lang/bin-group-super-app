name: V7 Enterprise Grid Production Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-enterprise-grid-production
  cancel-in-progress: false

jobs:
  retired-production-entrypoint:
    name: Retired production entrypoint
    runs-on: ubuntu-24.04
    steps:
      - name: Stop legacy production deployment path
        run: |
          echo "::error::This legacy production entrypoint is retired. Use the Firebase Production Deploy workflow, which enforces signed founder authorization and live evidence gates."
          exit 1
