name: Live Role Smoke Tests

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: "Full lowercase 40-character main SHA that is already deployed"
        required: true
        type: string
      production_deploy_run_id:
        description: "Successful Firebase Production Deploy run ID for this same SHA"
        required: true
        type: string
      live_evidence_run_id:
        description: "Successful Live Role Smoke Tests run ID that produced exact-SHA live evidence"
        required: false
        type: string
      confirmation:
        description: "Type AUTHORIZE PUBLIC HARD LAUNCH for the clearance job"
        required: false
        type: string
      incident_confirmation:
        description: "Type INCIDENT REVIEW COMPLETE for the clearance job"
        required: false
        type: string
      rollback_confirmation:
        description: "Type ROLLBACK PATH VERIFIED for the clearance job"
        required: false
        type: string
      open_p0:
        description: "Confirmed unresolved P0 incident count"
        required: false
        default: "0"
        type: string
      open_p1:
        description: "Confirmed unresolved P1 incident count"
        required: false
        default: "0"
        type: string
      incident_reference:
        description: "Incident review evidence reference"
        required: false
        type: string
      rollback_reference:
        description: "Rollback readiness evidence reference"
        required: false
        type: string
      monitoring_reference:
        description: "Monitoring and alerting readiness evidence reference"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: live-role-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  E2E_BASE_URL: https://bin-group-57c60.web.app
  E2E_ADMIN_BASE_URL: https://bin-group-admin-panel.web.app
  E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
  E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
  E2E_FOUNDER_EMAIL: ${{ secrets.E2E_FOUNDER_EMAIL }}
  E2E_FOUNDER_PASSWORD: ${{ secrets.E2E_FOUNDER_PASSWORD }}
  E2E_FOUNDER_TOTP_SECRET: ${{ secrets.E2E_FOUNDER_TOTP_SECRET }}
  E2E_FOUNDER_REAL_MFA_CODE: ${{ secrets.E2E_FOUNDER_REAL_MFA_CODE }}
  E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
  E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
  E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
  E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
  E2E_TECHNICIAN_EMAIL: ${{ secrets.E2E_TECHNICIAN_EMAIL }}
  E2E_TECHNICIAN_PASSWORD: ${{ secrets.E2E_TECHNICIAN_PASSWORD }}
  E2E_TECHNICIAN_B_EMAIL: ${{ secrets.E2E_TECHNICIAN_B_EMAIL }}
  E2E_TECHNICIAN_B_PASSWORD: ${{ secrets.E2E_TECHNICIAN_B_PASSWORD }}
  E2E_BROKER_EMAIL: ${{ secrets.E2E_BROKER_EMAIL }}
  E2E_BROKER_PASSWORD: ${{ secrets.E2E_BROKER_PASSWORD }}
  E2E_BROKER_PHONE: ${{ secrets.E2E_BROKER_PHONE }}
  E2E_BROKER_PAYOUT_OTP_CODE: ${{ secrets.E2E_BROKER_PAYOUT_OTP_CODE }}
  E2E_BROKER_PAYOUT_ACCOUNT_HOLDER: ${{ secrets.E2E_BROKER_PAYOUT_ACCOUNT_HOLDER }}
  E2E_BROKER_PAYOUT_IBAN: ${{ secrets.E2E_BROKER_PAYOUT_IBAN }}
  E2E_TENANT_CORRECTION_REQUEST_ID: ${{ secrets.E2E_TENANT_CORRECTION_REQUEST_ID }}
  E2E_STRICT_ROLES: "true"
  E2E_STRICT_LIVE: "true"
  E2E_STRICT_BUSINESS: "true"
  VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
  VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  GCP_PROJECT_ID: bin-group-57c60
  GCLOUD_PROJECT: bin-group-57c60
  GOOGLE_CLOUD_PROJECT: bin-group-57c60

jobs:
  live-evidence:
    name: Live multi-role business evidence
    if: github.ref == 'refs/heads/main' && inputs.live_evidence_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production

    steps:
      - name: Verify protected exact-SHA inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CURRENT_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_commit_sha must be a full lowercase 40-character SHA."
            exit 1
          fi
          if [[ "$TARGET_SHA" != "$CURRENT_SHA" ]]; then
            echo "::error::Expected SHA does not match the current main workflow SHA."
            exit 1
          fi
          if [[ ! "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::production_deploy_run_id must be numeric."
            exit 1
          fi

      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Download exact production deployment evidence
        uses: actions/download-artifact@v4
        with:
          name: production-deployment-${{ inputs.expected_commit_sha }}
          path: downloaded-production
          run-id: ${{ inputs.production_deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore exact production deployment evidence
        run: |
          set -euo pipefail
          source_file="$(find downloaded-production -type f -name production-deployment.json -print -quit)"
          if [[ -z "$source_file" ]]; then
            echo "::error::production-deployment.json was not found in the selected production deploy artifact."
            exit 1
          fi
          mkdir -p launch_package
          cp "$source_file" launch_package/production-deployment.json

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Verify E2E environment and App Check
        run: |
          node scripts/verify-e2e-env.mjs
          node scripts/ensure-appcheck.mjs

      - name: Verify canonical Founder TOTP readiness
        run: node scripts/verify-founder-totp-readiness.mjs

      - name: Verify exact production deployment evidence
        run: node scripts/verify-production-deployment.mjs

      - name: Seed protected E2E role identities
        run: node scripts/seed-e2e-auth.mjs

      - name: Run exact-SHA protected live business evidence
        run: node scripts/run-critical-evidence.mjs --suite all-required

      - name: Verify exact-SHA launch status
        run: node scripts/launch-status.mjs

      - name: Upload live launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-launch-evidence-${{ inputs.expected_commit_sha }}
          path: |
            launch_package/production-deployment.json
            launch_package/launch-evidence-batch.json
            launch_package/artifacts
            launch_package/e2e-admin-lifecycle-post-business-evidence.json
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 90

  hard-public-launch-clearance:
    name: Hard public launch clearance
    if: github.ref == 'refs/heads/main' && inputs.live_evidence_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Verify founder authorization and incident inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CURRENT_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
          LIVE_RUN_ID: ${{ inputs.live_evidence_run_id }}
          HARD_LAUNCH_CONFIRMATION: ${{ inputs.confirmation }}
          INCIDENT_CONFIRMATION: ${{ inputs.incident_confirmation }}
          ROLLBACK_CONFIRMATION: ${{ inputs.rollback_confirmation }}
          OPEN_P0: ${{ inputs.open_p0 }}
          OPEN_P1: ${{ inputs.open_p1 }}
          INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
          ROLLBACK_REFERENCE: ${{ inputs.rollback_reference }}
          MONITORING_REFERENCE: ${{ inputs.monitoring_reference }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_commit_sha must be a full lowercase 40-character SHA."
            exit 1
          fi
          if [[ "$TARGET_SHA" != "$CURRENT_SHA" ]]; then
            echo "::error::Expected SHA does not match the current main workflow SHA."
            exit 1
          fi
          if [[ ! "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]] || [[ ! "$LIVE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Both workflow run IDs must be numeric."
            exit 1
          fi
          if [[ "$HARD_LAUNCH_CONFIRMATION" != "AUTHORIZE PUBLIC HARD LAUNCH" ]]; then
            echo "::error::Missing exact founder hard-launch confirmation phrase."
            exit 1
          fi
          if [[ "$INCIDENT_CONFIRMATION" != "INCIDENT REVIEW COMPLETE" ]]; then
            echo "::error::Missing exact incident review confirmation phrase."
            exit 1
          fi
          if [[ "$ROLLBACK_CONFIRMATION" != "ROLLBACK PATH VERIFIED" ]]; then
            echo "::error::Missing exact rollback verification phrase."
            exit 1
          fi
          if [[ ! "$OPEN_P0" =~ ^[0-9]+$ ]] || [[ ! "$OPEN_P1" =~ ^[0-9]+$ ]]; then
            echo "::error::Open P0/P1 values must be non-negative integers."
            exit 1
          fi
          if [[ "$OPEN_P0" != "0" ]] || [[ "$OPEN_P1" != "0" ]]; then
            echo "::error::Hard launch is blocked while any P0/P1 incident remains open."
            exit 1
          fi
          for entry in "$INCIDENT_REFERENCE" "$ROLLBACK_REFERENCE" "$MONITORING_REFERENCE"; do
            if [[ -z "${entry//[[:space:]]/}" ]] || [[ "$entry" =~ ^[Pp]laceholder ]] || [[ "$entry" =~ ^[Tt][Oo][Dd][Oo]$ ]]; then
              echo "::error::Incident, rollback and monitoring references must be real evidence references."
              exit 1
            fi
          done

      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Download exact production deployment evidence
        uses: actions/download-artifact@v4
        with:
          name: production-deployment-${{ inputs.expected_commit_sha }}
          path: downloaded-production
          run-id: ${{ inputs.production_deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact live launch evidence
        uses: actions/download-artifact@v4
        with:
          name: live-launch-evidence-${{ inputs.expected_commit_sha }}
          path: downloaded-live-evidence
          run-id: ${{ inputs.live_evidence_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore and validate evidence bundle
        run: |
          set -euo pipefail
          deployment_file="$(find downloaded-production -type f -name production-deployment.json -print -quit)"
          evidence_file="$(find downloaded-live-evidence -type f -name launch-evidence-batch.json -print -quit)"
          artifact_dir="$(find downloaded-live-evidence -type d -path '*/launch_package/artifacts' -print -quit)"
          if [[ -z "$artifact_dir" ]]; then artifact_dir="$(find downloaded-live-evidence -type d -name artifacts -print -quit)"; fi
          if [[ -z "$deployment_file" ]] || [[ -z "$evidence_file" ]] || [[ -z "$artifact_dir" ]]; then
            echo "::error::Selected live evidence artifact is incomplete."
            exit 1
          fi
          mkdir -p launch_package
          cp "$deployment_file" launch_package/production-deployment.json
          cp "$evidence_file" launch_package/launch-evidence-batch.json
          rm -rf launch_package/artifacts
          cp -R "$artifact_dir" launch_package/artifacts

      - name: Revalidate same-commit pilot evidence
        run: node scripts/launch-status.mjs

      - name: Snapshot canonical operational readiness
        env:
          HARD_LAUNCH_EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
        run: node scripts/verify-operational-readiness.mjs

      - name: Write workflow-bound pilot incident report
        env:
          HARD_LAUNCH_EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          HARD_LAUNCH_CONFIRMATION: ${{ inputs.confirmation }}
          INCIDENT_CONFIRMATION: ${{ inputs.incident_confirmation }}
          ROLLBACK_CONFIRMATION: ${{ inputs.rollback_confirmation }}
          OPEN_P0: ${{ inputs.open_p0 }}
          OPEN_P1: ${{ inputs.open_p1 }}
          INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
          ROLLBACK_REFERENCE: ${{ inputs.rollback_reference }}
          MONITORING_REFERENCE: ${{ inputs.monitoring_reference }}
        run: node scripts/write-pilot-incident-report.mjs

      - name: Write founder-authorized hard launch approval
        env:
          HARD_LAUNCH_EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          HARD_LAUNCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/write-hard-launch-approval.mjs

      - name: Verify final hard launch status
        run: |
          node scripts/launch-status.mjs --hard
          npm run launch:hard-gate

      - name: Upload hard launch clearance evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hard-public-launch-clearance-${{ inputs.expected_commit_sha }}
          path: |
            launch_package/production-deployment.json
            launch_package/launch-evidence-batch.json
            launch_package/artifacts
            launch_package/live-evidence-provenance.json
            launch_package/operational-readiness.json
            launch_package/pilot-incident-report.json
            launch_package/hard-launch-approval.json
            launch_package/hard-launch-status.json
            launch_package/launch-status.json
          if-no-files-found: error
          retention-days: 365
