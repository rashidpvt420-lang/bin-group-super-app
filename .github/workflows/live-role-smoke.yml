name: Live Role Smoke Tests

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Full lowercase 40-character main SHA deployed to production'
        required: true
        type: string
      production_deploy_run_id:
        description: 'Successful Firebase Production Deploy workflow run ID for this SHA'
        required: true
        type: string
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: live-role-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  E2E_BASE_URL: https://bin-group-57c60.web.app
  E2E_ADMIN_BASE_URL: ${{ secrets.E2E_ADMIN_BASE_URL || 'https://bin-group-admin-panel.web.app' }}
  E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
  E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
  E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
  E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
  E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
  E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
  E2E_TECHNICIAN_EMAIL: ${{ secrets.E2E_TECHNICIAN_EMAIL }}
  E2E_TECHNICIAN_PASSWORD: ${{ secrets.E2E_TECHNICIAN_PASSWORD }}
  E2E_BROKER_EMAIL: ${{ secrets.E2E_BROKER_EMAIL }}
  E2E_BROKER_PASSWORD: ${{ secrets.E2E_BROKER_PASSWORD }}
  VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}

jobs:
  live-role-smoke:
    name: Verify production public and role flows
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Enforce manual same-commit gates
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REF" != "refs/heads/main" ]]; then
            echo "::error::Live launch evidence may only run from refs/heads/main."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_commit_sha must be a full lowercase SHA."
            exit 1
          fi
          if [[ "$TARGET_SHA" != "$CURRENT_SHA" ]]; then
            echo "::error::expected_commit_sha must equal the workflow main SHA."
            exit 1
          fi
          if [[ ! "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::production_deploy_run_id must be numeric."
            exit 1
          fi

      - name: Checkout exact launch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate Google Cloud for manual launch data seed
        if: github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Download exact production deployment evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: production-deployment-${{ inputs.expected_commit_sha }}
          path: downloaded-production
          run-id: ${{ inputs.production_deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore production deployment metadata
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          source_file="$(find downloaded-production -type f -name production-deployment.json -print -quit)"
          if [[ -z "$source_file" ]]; then
            echo "::error::production-deployment.json was not found in the selected deployment artifact."
            exit 1
          fi
          mkdir -p launch_package
          cp "$source_file" launch_package/production-deployment.json
          test -s launch_package/production-deployment.json

      - name: Validate public-smoke environment
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/ensure-appcheck.mjs

      - name: Validate full role-smoke secrets and App Check
        if: github.event_name == 'workflow_dispatch'
        env:
          E2E_STRICT_ROLES: 'true'
        run: |
          node scripts/verify-e2e-env.mjs
          node scripts/ensure-appcheck.mjs

      - name: Seed or repair E2E auth accounts and role claims
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/seed-e2e-auth.mjs

      - name: Seed five-role launch fixtures
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/seed-live-role-test-data.mjs

      - name: Install Playwright browser for scheduled smoke
        if: github.event_name != 'workflow_dispatch'
        run: npx playwright install --with-deps chromium

      - name: Run scheduled public smoke tests
        if: github.event_name != 'workflow_dispatch'
        run: npx playwright test --grep "production public smoke" --project=chromium-desktop

      - name: Run all current-commit launch evidence suites
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/run-critical-evidence.mjs --suite all-required

      - name: Verify controlled-pilot launch status
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/launch-status.mjs

      - name: Create launch proof manifest
        if: always()
        shell: bash
        run: |
          mkdir -p launch-proof
          {
            echo "BIN GROUP launch proof manifest"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "actor=${GITHUB_ACTOR}"
            echo "base_url=${E2E_BASE_URL}"
            echo "admin_base_url=${E2E_ADMIN_BASE_URL}"
          } > launch-proof/manifest.txt
          if [[ -d launch_package/artifacts ]]; then find launch_package/artifacts -type f -print0 | sort -z | xargs -0 -r sha256sum >> launch-proof/manifest.txt; fi
          sha256sum launch-proof/manifest.txt > launch-proof/manifest.sha256

      - name: Upload current-commit live launch evidence
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@v4
        with:
          name: live-launch-evidence-${{ inputs.expected_commit_sha }}
          path: |
            launch_package/production-deployment.json
            launch_package/launch-evidence-batch.json
            launch_package/launch-status.json
            launch_package/artifacts
            launch-proof
          if-no-files-found: error
          retention-days: 90

      - name: Upload scheduled smoke manifest
        if: github.event_name != 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-public-smoke-${{ github.sha }}
          path: launch-proof
          if-no-files-found: error
          retention-days: 14
