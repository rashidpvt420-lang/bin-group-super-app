name: Live Role Smoke Tests

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run live-evidence first; hard-clearance only after a completed 24-hour pilot'
        required: true
        default: live-evidence
        type: choice
        options:
          - live-evidence
          - hard-clearance
      expected_commit_sha:
        description: 'Full lowercase 40-character production release SHA'
        required: true
        type: string
      production_deploy_run_id:
        description: 'For live-evidence: successful Firebase Production Deploy run ID'
        required: false
        type: string
      live_evidence_run_id:
        description: 'For hard-clearance: successful live-evidence run ID bound to the frozen release and current control-plane SHA'
        required: false
        type: string
      clearance_payload_json:
        description: 'For hard-clearance: JSON containing confirmation, incident, rollback, and monitoring fields'
        required: false
        type: string
        default: '{"confirmation":"","incident_confirmation":"","rollback_confirmation":"","open_p0":"0","open_p1":"0","incident_reference":"","rollback_reference":"","monitoring_reference":""}'
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: live-role-smoke-${{ github.event_name }}-${{ github.ref }}-${{ inputs.mode || 'scheduled' }}
  cancel-in-progress: false

env:
  E2E_BASE_URL: https://bin-group-57c60.web.app
  E2E_ADMIN_BASE_URL: ${{ secrets.E2E_ADMIN_BASE_URL || 'https://bin-group-admin-panel.web.app' }}
  E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
  E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
  E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
  E2E_OWNER_MAILBOX_EMAIL: ${{ vars.E2E_OWNER_MAILBOX_EMAIL || secrets.E2E_OWNER_MAILBOX_EMAIL }}
  E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
  E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
  E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
  E2E_TECHNICIAN_EMAIL: ${{ secrets.E2E_TECHNICIAN_EMAIL }}
  E2E_TECHNICIAN_PASSWORD: ${{ secrets.E2E_TECHNICIAN_PASSWORD }}
  E2E_BROKER_EMAIL: ${{ secrets.E2E_BROKER_EMAIL }}
  E2E_BROKER_MAILBOX_EMAIL: ${{ vars.E2E_BROKER_MAILBOX_EMAIL || secrets.E2E_BROKER_MAILBOX_EMAIL }}
  E2E_BROKER_PASSWORD: ${{ secrets.E2E_BROKER_PASSWORD }}
  E2E_FOUNDER_EMAIL: ${{ secrets.E2E_FOUNDER_EMAIL }}
  E2E_FOUNDER_PASSWORD: ${{ secrets.E2E_FOUNDER_PASSWORD }}
  E2E_FOUNDER_TOTP_SECRET: ${{ secrets.E2E_FOUNDER_TOTP_SECRET }}
  E2E_FINANCE_APPROVER_EMAIL: ${{ secrets.E2E_FINANCE_APPROVER_EMAIL }}
  E2E_FINANCE_APPROVER_PASSWORD: ${{ secrets.E2E_FINANCE_APPROVER_PASSWORD }}
  E2E_FINANCE_APPROVER_TOTP_SECRET: ${{ secrets.E2E_FINANCE_APPROVER_TOTP_SECRET }}
  E2E_FOUNDER_REAL_MFA_CODE: ${{ secrets.E2E_FOUNDER_REAL_MFA_CODE }}
  VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
  VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
  FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY }}
  # Production hosting embeds FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY. Live-evidence
  # deploy-verify must expect that Enterprise key (same as firebase-production-deploy).
  VITE_APP_CHECK_PROVIDER: enterprise
  VITE_ENABLE_FIREBASE_APPCHECK: 'true'
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
  REACT_APP_ENABLE_FIREBASE_APPCHECK: 'true'
  REACT_APP_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY }}
  REACT_APP_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  REACT_APP_ADMIN_FIREBASE_APP_ID: 1:123413252227:web:285cb53bc26626d699f3b6
  REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  REACT_APP_FIREBASE_AUTH_DOMAIN: bin-group-57c60.firebaseapp.com
  REACT_APP_FIREBASE_PROJECT_ID: bin-group-57c60
  REACT_APP_FIREBASE_STORAGE_BUCKET: bin-group-57c60.firebasestorage.app
  AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
  AUTHORIZED_FOUNDER_EMAILS: ${{ secrets.AUTHORIZED_FOUNDER_EMAILS }}
  DEPLOYMENT_ENVIRONMENT: production
  PAYMENT_POLICY: phase1-manual
  E2E_STRICT_LIVE: 'true'

jobs:
  scheduled-public-smoke:
    name: Scheduled production public smoke
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh
      - name: Validate App Check debug configuration
        run: node scripts/ensure-appcheck.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public smoke tests
        run: npx playwright test --grep "production public smoke" --project=chromium-desktop
      - name: Upload scheduled smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduled-public-smoke-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  live-evidence:
    name: Generate frozen-release five-role production evidence
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live-evidence'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    defaults:
      run:
        working-directory: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout live-evidence control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control-plane
          fetch-depth: 0

      - name: Verify frozen-release/control-plane scope
        working-directory: .
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
          KNOWN_RULES_WRITER_COMMIT: 86b67c4a12a4ac61037dba8201f3d5ab96b09c5f
        run: |
          set -euo pipefail
          [[ "$CURRENT_REF" == "refs/heads/main" ]] || { echo "::error::Live launch evidence may only run from refs/heads/main."; exit 1; }
          [[ "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::production_deploy_run_id must be numeric."; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_commit_sha must be a full lowercase release SHA."; exit 1; }
          git -C control-plane cat-file -e "$TARGET_SHA^{commit}" || git -C control-plane fetch origin "$TARGET_SHA"
          git -C control-plane merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_SHA" || { echo "::error::Release SHA is not an ancestor of the live-evidence control plane."; exit 1; }
          changed="$(git -C control-plane diff --name-only "$TARGET_SHA" "$CURRENT_SHA")"
          rules_writer_path='scripts/write-production-firestore-rules.mjs'
          rules_writer_test_path='tests/launch/design-payment-rules-artifact.test.mjs'
          verify_exact_rules_writer_blob() {
            local path="$1"
            local known_blob current_blob target_blob
            known_blob="$(git -C control-plane rev-parse "$KNOWN_RULES_WRITER_COMMIT:$path")"
            current_blob="$(git -C control-plane rev-parse "$CURRENT_SHA:$path")"
            target_blob="$(git -C control-plane rev-parse "$TARGET_SHA:$path")"
            [[ "$current_blob" == "$known_blob" ]] || { echo "::error::The one-time PR #1770 exception requires the exact approved blob for $path."; exit 1; }
            [[ "$target_blob" != "$known_blob" ]] || { echo "::error::The PR #1770 exception path is not part of the release/control-plane delta: $path"; exit 1; }
            echo "Verified exact PR #1770 blob for $path ($known_blob)."
          }
          if [[ -z "$changed" ]]; then
            [[ "$TARGET_SHA" == "$CURRENT_SHA" ]] || { echo "::error::Empty control-plane delta is only valid for an exact same-SHA pair."; exit 1; }
            echo "Exact same-SHA release/control-plane pair verified."
          else
            allowed='^(\.github/workflows/firebase-production-deploy\.yml|\.github/workflows/current-main-expression-budget-repair\.yml|\.github/workflows/pr-validation\.yml|\.github/workflows/renewal-pdf-diagnostic-owner-bridge\.yml|\.github/workflows/renewal-pdf-runtime-diagnostic\.yml|\.github/workflows/repair-frozen-sovereign-ai-runtime\.yml|\.github/workflows/live-role-smoke\.yml|\.github/workflows/operational-application-evidence\.yml|\.github/workflows/operational-provider-evidence\.yml|\.github/workflows/privileged-access-rotation-evidence\.yml|\.github/workflows/technician-physical-evidence\.yml|scripts/finalize-operational-provider-evidence\.mjs|scripts/hard-clearance-production-revalidation\.mjs|scripts/launch-status\.mjs|scripts/lib/live-pilot-provenance\.mjs|scripts/publish-direct-operational-proof\.mjs|scripts/publish-operational-application-evidence\.mjs|scripts/publish-operational-provider-evidence\.mjs|scripts/resolve-admin-app-check-site-key\.mjs|scripts/run-critical-evidence\.mjs|scripts/run-frozen-release-evidence\.mjs|scripts/verify-ai-live-evidence\.mjs|scripts/verify-hard-launch-approval\.mjs|scripts/verify-production-deployment\.mjs|scripts/verify-operational-readiness\.mjs|tests/launch/ai-operational-contract\.test\.mjs|tests/launch/external-gate-production-provenance\.test\.mjs|tests/launch/final-operational-evidence-producers\.test\.mjs|tests/launch/hard-clearance-revalidation\.test\.mjs|tests/launch/operational-application-evidence-audit\.test\.mjs|scripts/resolve-live-pilot-window\.mjs)$'
            supplemental_allowed='^(scripts/hard-launch-status\.mjs|scripts/lib/hard-launch-control\.mjs|scripts/lib/operational-proof-schema\.mjs|scripts/prepare-operational-application-evidence\.mjs|scripts/print-hard-launch-blockers\.mjs|scripts/verify-operational-application-evidence\.mjs|scripts/verify-launch-clearance\.mjs|scripts/reconcile-hard-public-evidence\.mjs|tests/launch/hard-launch-blocker-plan\.test\.mjs|tests/launch/phase1-manual-public-launch-policy\.test\.mjs|\.github/workflows/public-launch-evidence-backfill\.yml|scripts/build-command-center-evidence-manifest\.mjs|tests/launch/public-launch-evidence-workflow-bridge\.test\.mjs|scripts/resolve-live-pilot-window\.mjs|tests/launch/live-pilot-provenance\.test\.mjs|scripts/owner-launch-run-correlation\.sh|scripts/select-new-exact-sha-workflow-run\.mjs|tests/launch/exact-sha-workflow-run-correlation\.test\.mjs|\.github/workflows/owner-privileged-cleanup-command\.yml)$'
            rules_writer_exception_count=0
            for exception_path in "$rules_writer_path" "$rules_writer_test_path"; do
              if grep -Fxq "$exception_path" <<< "$changed"; then rules_writer_exception_count=$((rules_writer_exception_count + 1)); fi
            done
            if [[ "$rules_writer_exception_count" -gt 0 ]]; then
              [[ "$rules_writer_exception_count" -eq 2 ]] || { echo "::error::The one-time PR #1770 exception requires both the rules writer and its regression test to change together."; exit 1; }
              git -C control-plane cat-file -e "$KNOWN_RULES_WRITER_COMMIT^{commit}"
              git -C control-plane merge-base --is-ancestor "$KNOWN_RULES_WRITER_COMMIT" "$CURRENT_SHA" || { echo "::error::The PR #1770 rules-writer commit is not an ancestor of the current control plane."; exit 1; }
              verify_exact_rules_writer_blob "$rules_writer_path"
              verify_exact_rules_writer_blob "$rules_writer_test_path"
            fi
            while IFS= read -r file; do
              if [[ "$file" == "$rules_writer_path" || "$file" == "$rules_writer_test_path" ]]; then continue; fi
              [[ -z "$file" || "$file" =~ $allowed || "$file" =~ $supplemental_allowed ]] || { echo "::error::Non-control-plane file changed since pilot release: $file"; exit 1; }
            done <<< "$changed"
            echo "Verified control-plane-only diff from $TARGET_SHA to $CURRENT_SHA:"
            printf '%s\n' "$changed"
          fi
          echo "CONTROL_PLANE_SCOPE_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          path: release

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Download exact production deployment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-deployment-${{ inputs.expected_commit_sha }}
          path: release/downloaded-production
          run-id: ${{ inputs.production_deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore deployment metadata
        run: |
          set -euo pipefail
          source_file="$(find downloaded-production -type f -name production-deployment.json -print -quit)"
          [[ -n "$source_file" ]] || { echo "::error::production-deployment.json was not found."; exit 1; }
          mkdir -p launch_package
          cp "$source_file" launch_package/production-deployment.json
          test -s launch_package/production-deployment.json

      - name: Resolve protected Gmail mailbox identities
        env:
          E2E_OWNER_MAILBOX_EMAIL_CONFIGURED: ${{ vars.E2E_OWNER_MAILBOX_EMAIL || secrets.E2E_OWNER_MAILBOX_EMAIL }}
          E2E_OWNER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_ID }}
          E2E_OWNER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_SECRET }}
          E2E_OWNER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_OWNER_MAILBOX_REFRESH_TOKEN }}
          E2E_BROKER_MAILBOX_EMAIL_CONFIGURED: ${{ vars.E2E_BROKER_MAILBOX_EMAIL || secrets.E2E_BROKER_MAILBOX_EMAIL }}
          E2E_BROKER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_ID }}
          E2E_BROKER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_SECRET }}
          E2E_BROKER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_BROKER_MAILBOX_REFRESH_TOKEN }}
        run: node scripts/resolve-production-mailbox-identities.mjs

      - name: Validate role credentials and App Check
        env:
          E2E_STRICT_ROLES: 'true'
          E2E_REQUIRE_FOUNDER_MFA: 'true'
          E2E_OWNER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_ID }}
          E2E_OWNER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_SECRET }}
          E2E_OWNER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_OWNER_MAILBOX_REFRESH_TOKEN }}
          E2E_BROKER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_ID }}
          E2E_BROKER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_SECRET }}
          E2E_BROKER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_BROKER_MAILBOX_REFRESH_TOKEN }}
        run: |
          node scripts/verify-e2e-env.mjs
          node scripts/ensure-appcheck.mjs

      - name: Verify protected OTP mailbox access
        env:
          E2E_OWNER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_ID }}
          E2E_OWNER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_SECRET }}
          E2E_OWNER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_OWNER_MAILBOX_REFRESH_TOKEN }}
          E2E_BROKER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_ID }}
          E2E_BROKER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_SECRET }}
          E2E_BROKER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_BROKER_MAILBOX_REFRESH_TOKEN }}
        run: node scripts/verify-production-otp-mailboxes.mjs

      - name: Seed or repair launch accounts and fixtures
        run: |
          node scripts/seed-e2e-auth.mjs
          node scripts/seed-live-role-test-data.mjs
          node scripts/ensure-phase1-manual-payment-config.mjs
          node scripts/prepare-protected-business-fixtures.mjs

      - name: Overlay reviewed live production verifier
        working-directory: .
        run: cp control-plane/scripts/verify-production-deployment.mjs release/scripts/verify-production-deployment.mjs

      - name: Overlay reviewed cleanup-aware evidence runner
        working-directory: .
        run: cp control-plane/scripts/run-critical-evidence.mjs release/scripts/run-critical-evidence.mjs

      - name: Run every required live evidence suite
        env:
          CONTROL_PLANE_COMMIT_SHA: ${{ github.sha }}
          E2E_OWNER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_ID }}
          E2E_OWNER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_SECRET }}
          E2E_OWNER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_OWNER_MAILBOX_REFRESH_TOKEN }}
          E2E_BROKER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_ID }}
          E2E_BROKER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_SECRET }}
          E2E_BROKER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_BROKER_MAILBOX_REFRESH_TOKEN }}
        run: node scripts/run-critical-evidence.mjs --suite all-required

      - name: Verify controlled-pilot eligibility
        env:
          CONTROL_PLANE_COMMIT_SHA: ${{ github.sha }}
          E2E_OWNER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_ID }}
          E2E_OWNER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_SECRET }}
          E2E_OWNER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_OWNER_MAILBOX_REFRESH_TOKEN }}
          E2E_BROKER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_ID }}
          E2E_BROKER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_SECRET }}
          E2E_BROKER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_BROKER_MAILBOX_REFRESH_TOKEN }}
        run: node scripts/launch-status.mjs

      - name: Write frozen-release/control-plane evidence binding
        if: success()
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          const { TARGET_SHA, CONTROL_PLANE_SHA, DEPLOY_RUN_ID, EVIDENCE_RUN_ID, EVIDENCE_RUN_ATTEMPT } = process.env;
          if (process.env.CONTROL_PLANE_SCOPE_VERIFIED !== 'true') throw new Error('The dual-SHA scope was not verified.');
          if (!/^[0-9a-f]{40}$/.test(TARGET_SHA || '') || !/^[0-9a-f]{40}$/.test(CONTROL_PLANE_SHA || '')) throw new Error('Release/control-plane SHAs must be full lowercase commit SHAs.');
          if (!/^\d+$/.test(DEPLOY_RUN_ID || '') || !/^\d+$/.test(EVIDENCE_RUN_ID || '') || EVIDENCE_RUN_ATTEMPT !== '1') throw new Error('Live-evidence run bindings are invalid.');
          const deployment = JSON.parse(readFileSync('launch_package/production-deployment.json', 'utf8'));
          if (String(deployment.workflowRunId || '') !== DEPLOY_RUN_ID) throw new Error('Production deployment run ID does not match its selected artifact.');
          const output = path.resolve('launch_package/live-evidence-provenance.json');
          mkdirSync(path.dirname(output), { recursive: true });
          writeFileSync(output, `${JSON.stringify({
            schemaVersion: 1,
            source: 'github-actions-live-evidence-run',
            releaseCommitSha: TARGET_SHA,
            controlPlaneCommitSha: CONTROL_PLANE_SHA,
            liveEvidenceRunId: EVIDENCE_RUN_ID,
            productionDeployRunId: DEPLOY_RUN_ID,
            runAttempt: Number(EVIDENCE_RUN_ATTEMPT),
          }, null, 2)}\n`);
          NODE

      - name: Upload live launch evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-launch-evidence-${{ inputs.expected_commit_sha }}
          path: |
            release/launch_package/production-deployment.json
            release/launch_package/launch-evidence-batch.json
            release/launch_package/launch-status.json
            release/launch_package/live-evidence-provenance.json
            release/launch_package/artifacts
          if-no-files-found: error
          retention-days: 90

  hard-clearance-production-revalidation:
    name: Freshly revalidate protected production state
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'hard-clearance'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      control_plane_scope_verified: ${{ steps.control_plane_scope.outputs.verified }}
      live_evidence_run_id: ${{ steps.resolve_live_evidence.outputs.run_id }}
    steps:
      - name: Checkout clearance control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control-plane
          fetch-depth: 0

      - name: Verify control-plane-only repair scope
        id: control_plane_scope
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
          KNOWN_RULES_WRITER_COMMIT: 86b67c4a12a4ac61037dba8201f3d5ab96b09c5f
        run: |
          set -euo pipefail
          [[ "$CURRENT_REF" == "refs/heads/main" ]] || { echo "::error::Hard clearance may only run from refs/heads/main."; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_commit_sha must be a full lowercase SHA."; exit 1; }
          git -C control-plane cat-file -e "$TARGET_SHA^{commit}" || git -C control-plane fetch origin "$TARGET_SHA"
          git -C control-plane merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_SHA" || { echo "::error::Release SHA is not an ancestor of the clearance control plane."; exit 1; }
          changed="$(git -C control-plane diff --name-only "$TARGET_SHA" "$CURRENT_SHA")"
          rules_writer_path='scripts/write-production-firestore-rules.mjs'
          rules_writer_test_path='tests/launch/design-payment-rules-artifact.test.mjs'
          verify_exact_rules_writer_blob() {
            local path="$1"
            local known_blob current_blob target_blob
            known_blob="$(git -C control-plane rev-parse "$KNOWN_RULES_WRITER_COMMIT:$path")"
            current_blob="$(git -C control-plane rev-parse "$CURRENT_SHA:$path")"
            target_blob="$(git -C control-plane rev-parse "$TARGET_SHA:$path")"
            [[ "$current_blob" == "$known_blob" ]] || { echo "::error::The one-time PR #1770 exception requires the exact approved blob for $path."; exit 1; }
            [[ "$target_blob" != "$known_blob" ]] || { echo "::error::The PR #1770 exception path is not part of the release/control-plane delta: $path"; exit 1; }
            echo "Verified exact PR #1770 blob for $path ($known_blob)."
          }
          if [[ -z "$changed" ]]; then
            [[ "$TARGET_SHA" == "$CURRENT_SHA" ]] || {
              echo "::error::Empty control-plane delta is only valid for an exact same-SHA pair."
              exit 1
            }
            echo "Exact same-SHA release/control-plane pair verified."
          else
            allowed='^(\.github/workflows/firebase-production-deploy\.yml|\.github/workflows/current-main-expression-budget-repair\.yml|\.github/workflows/pr-validation\.yml|\.github/workflows/renewal-pdf-diagnostic-owner-bridge\.yml|\.github/workflows/renewal-pdf-runtime-diagnostic\.yml|\.github/workflows/repair-frozen-sovereign-ai-runtime\.yml|\.github/workflows/live-role-smoke\.yml|\.github/workflows/operational-application-evidence\.yml|\.github/workflows/operational-provider-evidence\.yml|\.github/workflows/privileged-access-rotation-evidence\.yml|\.github/workflows/technician-physical-evidence\.yml|scripts/finalize-operational-provider-evidence\.mjs|scripts/hard-clearance-production-revalidation\.mjs|scripts/launch-status\.mjs|scripts/lib/live-pilot-provenance\.mjs|scripts/publish-direct-operational-proof\.mjs|scripts/publish-operational-application-evidence\.mjs|scripts/publish-operational-provider-evidence\.mjs|scripts/resolve-admin-app-check-site-key\.mjs|scripts/run-critical-evidence\.mjs|scripts/run-frozen-release-evidence\.mjs|scripts/verify-ai-live-evidence\.mjs|scripts/verify-hard-launch-approval\.mjs|scripts/verify-production-deployment\.mjs|scripts/verify-operational-readiness\.mjs|tests/launch/ai-operational-contract\.test\.mjs|tests/launch/external-gate-production-provenance\.test\.mjs|tests/launch/final-operational-evidence-producers\.test\.mjs|tests/launch/hard-clearance-revalidation\.test\.mjs|tests/launch/operational-application-evidence-audit\.test\.mjs|scripts/resolve-live-pilot-window\.mjs)$'
            supplemental_allowed='^(scripts/hard-launch-status\.mjs|scripts/lib/hard-launch-control\.mjs|scripts/lib/operational-proof-schema\.mjs|scripts/prepare-operational-application-evidence\.mjs|scripts/print-hard-launch-blockers\.mjs|scripts/verify-operational-application-evidence\.mjs|scripts/verify-launch-clearance\.mjs|scripts/reconcile-hard-public-evidence\.mjs|tests/launch/hard-launch-blocker-plan\.test\.mjs|tests/launch/phase1-manual-public-launch-policy\.test\.mjs|\.github/workflows/public-launch-evidence-backfill\.yml|scripts/build-command-center-evidence-manifest\.mjs|tests/launch/public-launch-evidence-workflow-bridge\.test\.mjs|scripts/resolve-live-pilot-window\.mjs|tests/launch/live-pilot-provenance\.test\.mjs|scripts/owner-launch-run-correlation\.sh|scripts/select-new-exact-sha-workflow-run\.mjs|tests/launch/exact-sha-workflow-run-correlation\.test\.mjs|\.github/workflows/owner-privileged-cleanup-command\.yml)$'
            rules_writer_exception_count=0
            for exception_path in "$rules_writer_path" "$rules_writer_test_path"; do
              if grep -Fxq "$exception_path" <<< "$changed"; then
                rules_writer_exception_count=$((rules_writer_exception_count + 1))
              fi
            done
            if [[ "$rules_writer_exception_count" -gt 0 ]]; then
              [[ "$rules_writer_exception_count" -eq 2 ]] || { echo "::error::The one-time PR #1770 exception requires both the rules writer and its regression test to change together."; exit 1; }
              git -C control-plane cat-file -e "$KNOWN_RULES_WRITER_COMMIT^{commit}"
              git -C control-plane merge-base --is-ancestor "$KNOWN_RULES_WRITER_COMMIT" "$CURRENT_SHA" || { echo "::error::The PR #1770 rules-writer commit is not an ancestor of the current control plane."; exit 1; }
              verify_exact_rules_writer_blob "$rules_writer_path"
              verify_exact_rules_writer_blob "$rules_writer_test_path"
            fi
            while IFS= read -r file; do
              if [[ "$file" == "$rules_writer_path" || "$file" == "$rules_writer_test_path" ]]; then
                continue
              fi
              [[ -z "$file" || "$file" =~ $allowed || "$file" =~ $supplemental_allowed ]] || { echo "::error::Non-control-plane file changed since pilot release: $file"; exit 1; }
            done <<< "$changed"
            echo "Verified control-plane-only diff from $TARGET_SHA to $CURRENT_SHA:"
            printf '%s\n' "$changed"
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Resolve exact successful live evidence run
        id: resolve_live_evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          REQUESTED_RUN_ID: ${{ inputs.live_evidence_run_id }}
          ARTIFACT_NAME: live-launch-evidence-${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          auth_header="Authorization: Bearer $GITHUB_TOKEN"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          validate_run() {
            local run_id="$1"
            local attempt_json artifacts_json
            attempt_json="$(curl --fail --silent --show-error -H "$auth_header" -H "$accept_header" -H "$version_header" "$api/actions/runs/$run_id/attempts/1")"
            jq -e --arg controlPlaneSha "$CONTROL_PLANE_SHA" '
              .name == "Live Role Smoke Tests" and
              .path == ".github/workflows/live-role-smoke.yml" and
              .head_branch == "main" and
              .head_sha == $controlPlaneSha and
              .event == "workflow_dispatch" and
              .run_attempt == 1 and
              .status == "completed" and
              .conclusion == "success"
            ' <<<"$attempt_json" >/dev/null || return 1

            artifacts_json="$(curl --fail --silent --show-error -H "$auth_header" -H "$accept_header" -H "$version_header" "$api/actions/runs/$run_id/artifacts?per_page=100")"
            jq -e --arg name "$ARTIFACT_NAME" --arg completed "$(jq -r '.updated_at' <<<"$attempt_json")" '
              [.artifacts[] | select(
                .name == $name and
                .expired == false and
                (.created_at | fromdateiso8601) <= ($completed | fromdateiso8601)
              )] | length == 1
            ' <<<"$artifacts_json" >/dev/null
          }

          requested="$(printf '%s' "$REQUESTED_RUN_ID" | xargs)"
          if [[ -n "$requested" ]]; then
            [[ "$requested" =~ ^[0-9]+$ ]] || { echo "::error::live_evidence_run_id must be numeric when provided."; exit 1; }
            validate_run "$requested" || { echo "::error::Requested live-evidence run is not the exact successful main workflow_dispatch run with the frozen-release artifact."; exit 1; }
            resolved="$requested"
          else
            runs_json="$(curl --fail --silent --show-error -H "$auth_header" -H "$accept_header" -H "$version_header" "$api/actions/workflows/live-role-smoke.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"
            mapfile -t candidates < <(jq -r --arg controlPlaneSha "$CONTROL_PLANE_SHA" '.workflow_runs[] | select(.name == "Live Role Smoke Tests" and .path == ".github/workflows/live-role-smoke.yml" and .head_branch == "main" and .head_sha == $controlPlaneSha and .event == "workflow_dispatch") | .id' <<<"$runs_json")
            valid=()
            for run_id in "${candidates[@]}"; do
              if validate_run "$run_id"; then valid+=("$run_id"); fi
            done
            [[ ${#valid[@]} -eq 1 ]] || { echo "::error::Expected exactly one successful live-evidence run with the exact frozen-release artifact; found ${#valid[@]}. Provide live_evidence_run_id explicitly if multiple valid runs exist."; exit 1; }
            resolved="${valid[0]}"
          fi

          echo "run_id=$resolved" >> "$GITHUB_OUTPUT"
          echo "Resolved exact successful live-evidence run: $resolved"
      - name: Checkout frozen pilot release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          path: release

      - name: Overlay reviewed clearance controls only
        run: |
          set -euo pipefail
          cp control-plane/scripts/launch-status.mjs release/scripts/launch-status.mjs
          cp control-plane/scripts/hard-clearance-production-revalidation.mjs release/scripts/hard-clearance-production-revalidation.mjs
          cp control-plane/scripts/resolve-admin-app-check-site-key.mjs release/scripts/resolve-admin-app-check-site-key.mjs
          cp control-plane/scripts/verify-hard-launch-approval.mjs release/scripts/verify-hard-launch-approval.mjs
          cp control-plane/scripts/resolve-live-pilot-window.mjs release/scripts/resolve-live-pilot-window.mjs
          cp control-plane/scripts/lib/live-pilot-provenance.mjs release/scripts/lib/live-pilot-provenance.mjs
          cp control-plane/scripts/verify-launch-clearance.mjs release/scripts/verify-launch-clearance.mjs
          cp control-plane/scripts/reconcile-hard-public-evidence.mjs release/scripts/reconcile-hard-public-evidence.mjs
          cp control-plane/scripts/verify-operational-readiness.mjs release/scripts/verify-operational-readiness.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install frozen-release dependencies
        working-directory: release
        run: bash scripts/npm-install-retry.sh

      - name: Resolve canonical Admin Enterprise App Check config
        working-directory: release
        run: node scripts/resolve-admin-app-check-site-key.mjs

      - name: Download exact successful live evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: live-launch-evidence-${{ inputs.expected_commit_sha }}
          path: release/downloaded-live-evidence
          run-id: ${{ steps.resolve_live_evidence.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore frozen release evidence
        working-directory: release
        run: |
          set -euo pipefail
          deployment_file="$(find downloaded-live-evidence -type f -name production-deployment.json -print -quit)"
          evidence_file="$(find downloaded-live-evidence -type f -name launch-evidence-batch.json -print -quit)"
          provenance_file="$(find downloaded-live-evidence -type f -name live-evidence-provenance.json -print -quit)"
          artifact_dir="$(find downloaded-live-evidence -type d -path '*/launch_package/artifacts' -print -quit)"
          if [[ -z "$artifact_dir" ]]; then artifact_dir="$(find downloaded-live-evidence -type d -name artifacts -print -quit)"; fi
          [[ -n "$deployment_file" && -n "$evidence_file" && -n "$provenance_file" && -n "$artifact_dir" ]] || { echo "::error::Selected live evidence artifact is incomplete."; exit 1; }
          mkdir -p launch_package
          cp "$deployment_file" launch_package/production-deployment.json
          cp "$evidence_file" launch_package/launch-evidence-batch.json
          cp "$provenance_file" launch_package/live-evidence-provenance.json
          rm -rf launch_package/artifacts
          cp -R "$artifact_dir" launch_package/artifacts

      - name: Verify live-evidence release/control-plane artifact binding
        working-directory: release
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          LIVE_EVIDENCE_RUN_ID: ${{ steps.resolve_live_evidence.outputs.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateLiveEvidenceArtifactBinding } from './scripts/lib/live-pilot-provenance.mjs';

          const binding = JSON.parse(readFileSync('launch_package/live-evidence-provenance.json', 'utf8'));
          const deployment = JSON.parse(readFileSync('launch_package/production-deployment.json', 'utf8'));
          const errors = validateLiveEvidenceArtifactBinding(binding, {
            expectedReleaseSha: process.env.TARGET_SHA,
            expectedControlPlaneSha: process.env.CONTROL_PLANE_SHA,
            expectedRunId: process.env.LIVE_EVIDENCE_RUN_ID,
            expectedProductionDeployRunId: String(deployment.workflowRunId || ''),
            expectedRunAttempt: 1,
          });
          if (errors.length) throw new Error(`Selected live-evidence artifact binding is invalid: ${errors.join('; ')}`);
          console.log(`[live-evidence-binding] PASS — release=${binding.releaseCommitSha} control_plane=${binding.controlPlaneCommitSha}`);
          NODE

      - name: Resolve protected Gmail mailbox identities
        working-directory: release
        env:
          E2E_OWNER_MAILBOX_EMAIL_CONFIGURED: ${{ vars.E2E_OWNER_MAILBOX_EMAIL || secrets.E2E_OWNER_MAILBOX_EMAIL }}
          E2E_OWNER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_ID }}
          E2E_OWNER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_SECRET }}
          E2E_OWNER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_OWNER_MAILBOX_REFRESH_TOKEN }}
          E2E_BROKER_MAILBOX_EMAIL_CONFIGURED: ${{ vars.E2E_BROKER_MAILBOX_EMAIL || secrets.E2E_BROKER_MAILBOX_EMAIL }}
          E2E_BROKER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_ID }}
          E2E_BROKER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_SECRET }}
          E2E_BROKER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_BROKER_MAILBOX_REFRESH_TOKEN }}
        run: node scripts/resolve-production-mailbox-identities.mjs

      - name: Prepare frozen-release evidence for current production semantics
        working-directory: release
        run: |
          set -euo pipefail
          node scripts/apply-five-role-business-evidence-fixes.mjs
          node scripts/patch-protected-admin-staff-access-interaction.mjs
          node scripts/harden-repeated-business-evidence.mjs
          node scripts/patch-phase21-postdeploy-evidence.mjs

          # The frozen Owner evidence wrapper originally varied latitude and longitude
          # by the same tiny scalar. Production identity authority rounds GEO_UNIT to
          # 5 decimals, so repeated real evidence runs eventually reused a registry
          # identity and were correctly rejected as ALREADY_EXISTS. Keep duplicate
          # detection unchanged; widen only the synthetic evidence identity space.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const target = 'scripts/run-owner-inspection-first-production-evidence-unique.mjs';
          const source = readFileSync(target, 'utf8');
          const oldCoordinates = `const coordinateOffset = ((Number.parseInt(seed.slice(0, 4), 16) % 8001) - 4000) / 10_000_000;
          const evidenceLat = (24.4958 + coordinateOffset).toFixed(7);
          const evidenceLng = (54.4074 + coordinateOffset).toFixed(7);`;
          const newCoordinates = `const latitudeOffset = ((Number.parseInt(seed.slice(0, 8), 16) % 60001) - 30000) / 10_000_000;
          const longitudeOffset = ((Number.parseInt(seed.slice(8, 16), 16) % 60001) - 30000) / 10_000_000;
          const evidenceLat = (24.4958 + latitudeOffset).toFixed(7);
          const evidenceLng = (54.4074 + longitudeOffset).toFixed(7);`;
          const oldLog = `  \`[owner-evidence-identity] isolated synthetic identity seed=\${seed.slice(0, 10)} offset=\${coordinateOffset.toFixed(7)}\`,`;
          const newLog = `  \`[owner-evidence-identity] isolated synthetic identity seed=\${seed.slice(0, 10)} latOffset=\${latitudeOffset.toFixed(7)} lngOffset=\${longitudeOffset.toFixed(7)}\`,`;

          const alreadyCollisionSafe = source.includes(
            "const { latitude: evidenceLat, longitude: evidenceLng } = await selectUnusedOwnerEvidenceLocation(db, '${seed}');",
          ) && source.includes(".replaceAll(latitudeToken, 'evidenceLat')")
            && source.includes(".replaceAll(longitudeToken, 'evidenceLng')");

          if (alreadyCollisionSafe) {
            console.log('[hard-clearance-owner-identity] frozen Owner wrapper already uses collision-safe location selection; no source patch needed.');
          } else {
            if (source.split(oldCoordinates).length !== 2 || source.split(oldLog).length !== 2) {
              throw new Error('Frozen Owner evidence identity wrapper changed unexpectedly; refusing runtime patch.');
            }
            const patched = source.replace(oldCoordinates, newCoordinates).replace(oldLog, newLog);
            writeFileSync(target, patched, { mode: 0o600 });
            console.log('[hard-clearance-owner-identity] expanded synthetic GEO identity space while preserving duplicate detection.');
          }
          NODE

          node scripts/prepare-protected-business-fixtures.mjs

      - name: Refresh role evidence without restarting the pilot
        working-directory: release
        env:
          E2E_STRICT_ROLES: 'true'
          E2E_REQUIRE_FOUNDER_MFA: 'true'
          E2E_OWNER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_ID }}
          E2E_OWNER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_SECRET }}
          E2E_OWNER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_OWNER_MAILBOX_REFRESH_TOKEN }}
          E2E_BROKER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_ID }}
          E2E_BROKER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_SECRET }}
          E2E_BROKER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_BROKER_MAILBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          print_owner_failure_diagnostic() {
            node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';

          const dir = path.resolve('launch_package/artifacts');
          if (!existsSync(dir)) {
            console.error('[hard-clearance-owner-diagnostic] no artifacts directory found');
            process.exit(0);
          }

          const files = readdirSync(dir)
            .filter((name) => /^business-owner-.*\.stdio\.log$/.test(name))
            .sort();
          if (!files.length) {
            console.error('[hard-clearance-owner-diagnostic] no Owner stdio diagnostic found');
            process.exit(0);
          }

          const source = readFileSync(path.join(dir, files.at(-1)), 'utf8');
          const selected = source.split(/\r?\n/).filter((line) =>
            /\[owner-inspection-first-evidence\]|\[owner-business-suite\]|failed HTTP \d+|callable error|Timed out waiting for/i.test(line)
          );
          const sanitize = (line) => line
            .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '[redacted-email]')
            .replace(/\b\d{6}\b/g, '[redacted-code]')
            .replace(/Bearer\s+[A-Za-z0-9._~-]+/gi, 'Bearer [redacted-token]')
            .replace(/[A-Za-z0-9_-]{80,}/g, '[redacted-long-token]')
            .slice(0, 1200);

          console.error('[hard-clearance-owner-diagnostic] sanitized Owner lifecycle failure:');
          for (const line of selected.slice(-20)) console.error(sanitize(line));
          NODE
          }

          if ! node scripts/run-critical-evidence.mjs --suite all-business; then
            echo "::warning::Fresh five-role evidence attempt 1 failed; rebuilding protected fixtures and retrying once without changing the frozen pilot."
            node scripts/prepare-protected-business-fixtures.mjs
            if ! node scripts/run-critical-evidence.mjs --suite all-business; then
              print_owner_failure_diagnostic
              echo "::error::Fresh five-role evidence failed twice after a protected fixture rebuild."
              exit 1
            fi
          fi
          node scripts/run-critical-evidence.mjs --suite launchAuditLive

      - name: Generate fresh production hard-clearance revalidation
        working-directory: release
        env:
          HARD_LAUNCH_EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          CLEARANCE_CONTROL_PLANE_SHA: ${{ github.sha }}
          CONTROL_PLANE_SCOPE_VERIFIED: 'true'
          LIVE_EVIDENCE_RUN_ID: ${{ steps.resolve_live_evidence.outputs.run_id }}
          E2E_STRICT_ROLES: 'true'
          E2E_REQUIRE_FOUNDER_MFA: 'true'
          E2E_OWNER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_ID }}
          E2E_OWNER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_OWNER_MAILBOX_CLIENT_SECRET }}
          E2E_OWNER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_OWNER_MAILBOX_REFRESH_TOKEN }}
          E2E_BROKER_MAILBOX_CLIENT_ID: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_ID }}
          E2E_BROKER_MAILBOX_CLIENT_SECRET: ${{ secrets.E2E_BROKER_MAILBOX_CLIENT_SECRET }}
          E2E_BROKER_MAILBOX_REFRESH_TOKEN: ${{ secrets.E2E_BROKER_MAILBOX_REFRESH_TOKEN }}
        run: node scripts/hard-clearance-production-revalidation.mjs --generate

      - name: Upload same-run production revalidation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hard-clearance-production-revalidation-${{ inputs.expected_commit_sha }}
          path: |
            release/launch_package/production-deployment.json
            release/launch_package/launch-evidence-batch.json
            release/launch_package/live-evidence-provenance.json
            release/launch_package/artifacts
            release/launch_package/hard-clearance-production-revalidation.json
          if-no-files-found: error
          retention-days: 30

  hard-public-launch-clearance:
    name: Verify and authorize hard public launch
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'hard-clearance'
    needs: hard-clearance-production-revalidation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: hard-public-launch
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Enforce protected release inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          LIVE_RUN_ID: ${{ needs.hard-clearance-production-revalidation.outputs.live_evidence_run_id }}
          CONTROL_PLANE_SCOPE_VERIFIED: ${{ needs.hard-clearance-production-revalidation.outputs.control_plane_scope_verified }}
          RELEASE_CONFIRMATION: ${{ fromJSON(inputs.clearance_payload_json).confirmation }}
          INCIDENT_CONFIRMATION_INPUT: ${{ fromJSON(inputs.clearance_payload_json).incident_confirmation }}
          ROLLBACK_CONFIRMATION_INPUT: ${{ fromJSON(inputs.clearance_payload_json).rollback_confirmation }}
          OPEN_P0_INPUT: ${{ fromJSON(inputs.clearance_payload_json).open_p0 }}
          OPEN_P1_INPUT: ${{ fromJSON(inputs.clearance_payload_json).open_p1 }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$CURRENT_REF" == "refs/heads/main" ]] || { echo "::error::Hard clearance may only run from refs/heads/main."; exit 1; }
          [[ "$CONTROL_PLANE_SCOPE_VERIFIED" == "true" ]] || { echo "::error::Clearance control-plane scope was not verified."; exit 1; }
          authorized_actor=false
          IFS=',' read -ra allowed_actors <<< "${AUTHORIZED_FOUNDER_ACTORS:-}"
          for allowed_actor in "${allowed_actors[@]}"; do
            allowed_actor="$(printf '%s' "$allowed_actor" | xargs)"
            if [[ -n "$allowed_actor" && "$CURRENT_ACTOR" == "$allowed_actor" ]]; then authorized_actor=true; fi
          done
          [[ "$authorized_actor" == "true" ]] || { echo "::error::The current actor is not in AUTHORIZED_FOUNDER_ACTORS."; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_commit_sha must be a full lowercase 40-character release SHA."; exit 1; }
          [[ "$LIVE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::live_evidence_run_id must be numeric."; exit 1; }
          [[ "$RELEASE_CONFIRMATION" == "AUTHORIZE_HARD_PUBLIC_LAUNCH_BIN_GROUP" ]] || { echo "::error::Hard launch confirmation phrase mismatch."; exit 1; }
          [[ "$INCIDENT_CONFIRMATION_INPUT" == "NO_OPEN_P0_P1" ]] || { echo "::error::Incident confirmation phrase mismatch."; exit 1; }
          [[ "$ROLLBACK_CONFIRMATION_INPUT" == "ROLLBACK_PLAN_VERIFIED" ]] || { echo "::error::Rollback confirmation phrase mismatch."; exit 1; }
          [[ "$OPEN_P0_INPUT" == "0" && "$OPEN_P1_INPUT" == "0" ]] || { echo "::error::Hard launch requires zero open P0 and P1 incidents."; exit 1; }

      - name: Checkout clearance control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control-plane

      - name: Checkout frozen pilot release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          path: release

      - name: Overlay reviewed clearance controls only
        run: |
          set -euo pipefail
          cp control-plane/scripts/launch-status.mjs release/scripts/launch-status.mjs
          cp control-plane/scripts/hard-clearance-production-revalidation.mjs release/scripts/hard-clearance-production-revalidation.mjs
          cp control-plane/scripts/resolve-live-pilot-window.mjs release/scripts/resolve-live-pilot-window.mjs
          cp control-plane/scripts/lib/live-pilot-provenance.mjs release/scripts/lib/live-pilot-provenance.mjs
          cp control-plane/scripts/verify-hard-launch-approval.mjs release/scripts/verify-hard-launch-approval.mjs
          cp control-plane/scripts/verify-launch-clearance.mjs release/scripts/verify-launch-clearance.mjs
          cp control-plane/scripts/reconcile-hard-public-evidence.mjs release/scripts/reconcile-hard-public-evidence.mjs
          cp control-plane/scripts/verify-operational-readiness.mjs release/scripts/verify-operational-readiness.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install frozen-release dependencies
        working-directory: release
        run: bash scripts/npm-install-retry.sh

      - name: Download same-run fresh production revalidation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hard-clearance-production-revalidation-${{ inputs.expected_commit_sha }}
          path: release/downloaded-hard-clearance-revalidation

      - name: Restore frozen evidence and fresh revalidation
        working-directory: release
        run: |
          set -euo pipefail
          deployment_file="$(find downloaded-hard-clearance-revalidation -type f -name production-deployment.json -print -quit)"
          evidence_file="$(find downloaded-hard-clearance-revalidation -type f -name launch-evidence-batch.json -print -quit)"
          provenance_file="$(find downloaded-hard-clearance-revalidation -type f -name live-evidence-provenance.json -print -quit)"
          revalidation_file="$(find downloaded-hard-clearance-revalidation -type f -name hard-clearance-production-revalidation.json -print -quit)"
          artifact_dir="$(find downloaded-hard-clearance-revalidation -type d -path '*/launch_package/artifacts' -print -quit)"
          if [[ -z "$artifact_dir" ]]; then artifact_dir="$(find downloaded-hard-clearance-revalidation -type d -name artifacts -print -quit)"; fi
          [[ -n "$deployment_file" && -n "$evidence_file" && -n "$provenance_file" && -n "$revalidation_file" && -n "$artifact_dir" ]] || { echo "::error::Same-run production revalidation artifact is incomplete."; exit 1; }
          mkdir -p launch_package
          cp "$deployment_file" launch_package/production-deployment.json
          cp "$evidence_file" launch_package/launch-evidence-batch.json
          cp "$provenance_file" launch_package/live-evidence-provenance.json
          cp "$revalidation_file" launch_package/hard-clearance-production-revalidation.json
          rm -rf launch_package/artifacts
          cp -R "$artifact_dir" launch_package/artifacts

      - name: Verify live-evidence run provenance and enforce a real 24-hour pilot
        working-directory: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIVE_EVIDENCE_RUN_ID: ${{ needs.hard-clearance-production-revalidation.outputs.live_evidence_run_id }}
          HARD_LAUNCH_EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          CONTROL_PLANE_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/resolve-live-pilot-window.mjs

      - name: Revalidate same-commit pilot evidence with fresh production proof
        working-directory: release
        env:
          HARD_CLEARANCE_REVALIDATION_MODE: consume
          HARD_LAUNCH_EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          CLEARANCE_CONTROL_PLANE_SHA: ${{ github.sha }}
          LIVE_EVIDENCE_RUN_ID: ${{ needs.hard-clearance-production-revalidation.outputs.live_evidence_run_id }}
        run: node scripts/launch-status.mjs

      - name: Snapshot canonical operational readiness
        working-directory: release
        env:
          HARD_LAUNCH_EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          CONTROL_PLANE_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/verify-operational-readiness.mjs

      - name: Write workflow-bound pilot incident report
        working-directory: release
        env:
          HARD_LAUNCH_EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          HARD_LAUNCH_CONFIRMATION: ${{ fromJSON(inputs.clearance_payload_json).confirmation }}
          INCIDENT_CONFIRMATION: ${{ fromJSON(inputs.clearance_payload_json).incident_confirmation }}
          ROLLBACK_CONFIRMATION: ${{ fromJSON(inputs.clearance_payload_json).rollback_confirmation }}
          OPEN_P0: ${{ fromJSON(inputs.clearance_payload_json).open_p0 }}
          OPEN_P1: ${{ fromJSON(inputs.clearance_payload_json).open_p1 }}
          INCIDENT_REFERENCE: ${{ fromJSON(inputs.clearance_payload_json).incident_reference }}
          ROLLBACK_REFERENCE: ${{ fromJSON(inputs.clearance_payload_json).rollback_reference }}
          MONITORING_REFERENCE: ${{ fromJSON(inputs.clearance_payload_json).monitoring_reference }}
        run: node scripts/write-pilot-incident-report.mjs

      - name: Write founder-authorized hard launch approval
        working-directory: release
        env:
          HARD_LAUNCH_EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          HARD_LAUNCH_CONFIRMATION: ${{ fromJSON(inputs.clearance_payload_json).confirmation }}
        run: node scripts/write-hard-launch-approval.mjs

      - name: Verify final hard launch status
        working-directory: release
        env:
          HARD_CLEARANCE_REVALIDATION_MODE: consume
          HARD_LAUNCH_EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          CLEARANCE_CONTROL_PLANE_SHA: ${{ github.sha }}
          LIVE_EVIDENCE_RUN_ID: ${{ needs.hard-clearance-production-revalidation.outputs.live_evidence_run_id }}
        run: |
          node scripts/launch-status.mjs --hard
          node scripts/reconcile-hard-public-evidence.mjs
          npm run launch:hard-gate

      - name: Upload hard clearance blocker diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hard-clearance-blockers-${{ inputs.expected_commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/launch_package/hard-clearance-physical-blockers.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload hard launch clearance evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hard-public-launch-clearance-${{ inputs.expected_commit_sha }}
          path: |
            release/launch_package/production-deployment.json
            release/launch_package/launch-evidence-batch.json
            release/launch_package/artifacts
            release/launch_package/live-evidence-provenance.json
            release/launch_package/hard-clearance-production-revalidation.json
            release/launch_package/operational-readiness.json
            release/launch_package/pilot-incident-report.json
            release/launch_package/hard-launch-approval.json
            release/launch_package/hard-launch-status.json
            release/launch_package/launch-status.json
          if-no-files-found: error
          retention-days: 365
