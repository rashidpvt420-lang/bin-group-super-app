name: One-time Broker Current Main Sync

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/broker-sync-current-main.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 627 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/broker-otp-hmac-real-input' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Broker branch
        uses: actions/checkout@v4
        with:
          ref: fix/broker-otp-hmac-real-input
          fetch-depth: 0

      - name: Merge exact current main without conflict bypass
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:fix/broker-otp-hmac-real-input
