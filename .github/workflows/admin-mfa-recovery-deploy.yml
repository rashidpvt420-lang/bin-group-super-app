name: RECOVERY - Deploy Admin MFA Enrollment
run-name: Admin MFA recovery - ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly DEPLOY_ADMIN_MFA_RECOVERY'
        required: true
        type: string
      recovery_reason:
        description: 'Type exactly RESTORE_ADMIN_MFA_ENROLLMENT_UI'
        required: true
        type: string
      founder_name:
        description: 'Founder/CEO legal name'
        required: true
        type: string
      founder_email:
        description: 'Authorized founder email'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: admin-mfa-recovery-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: bin-group-57c60
  CI: true
  REACT_APP_ENABLE_FIREBASE_APPCHECK: 'true'
  REACT_APP_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
  REACT_APP_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  REACT_APP_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  REACT_APP_FIREBASE_AUTH_DOMAIN: bin-group-57c60.firebaseapp.com
  REACT_APP_FIREBASE_PROJECT_ID: bin-group-57c60
  REACT_APP_FIREBASE_STORAGE_BUCKET: bin-group-57c60.firebasestorage.app

jobs:
  deploy-admin-mfa-recovery:
    name: Deploy enrollment UI and minimal security callables
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Enforce founder-authorized recovery request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
          FOUNDER_NAME: ${{ inputs.founder_name }}
          FOUNDER_EMAIL: ${{ inputs.founder_email }}
          AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
          AUTHORIZED_FOUNDER_EMAILS: ${{ secrets.AUTHORIZED_FOUNDER_EMAILS }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$CONFIRMATION" == "DEPLOY_ADMIN_MFA_RECOVERY" ]] || fail "Admin MFA recovery confirmation phrase does not match."
          [[ "$RECOVERY_REASON" == "RESTORE_ADMIN_MFA_ENROLLMENT_UI" ]] || fail "Admin MFA recovery reason does not match."
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || fail "Admin MFA recovery may run only from main."
          [[ -n "${FOUNDER_NAME// }" ]] || fail "Founder name is required."
          [[ "$FOUNDER_EMAIL" == *@*.* ]] || fail "Founder email is invalid."
          [[ -n "${AUTHORIZED_FOUNDER_ACTORS// }" ]] || fail "AUTHORIZED_FOUNDER_ACTORS is not configured."
          [[ -n "${AUTHORIZED_FOUNDER_EMAILS// }" ]] || fail "AUTHORIZED_FOUNDER_EMAILS is not configured."
          node <<'NODE'
          const split = (value) => String(value || '').split(/[\s,;]+/).map((entry) => entry.trim().toLowerCase()).filter(Boolean);
          const actor = String(process.env.GITHUB_ACTOR || '').trim().toLowerCase();
          const email = String(process.env.FOUNDER_EMAIL || '').trim().toLowerCase();
          if (!split(process.env.AUTHORIZED_FOUNDER_ACTORS).includes(actor)) {
            throw new Error(`GitHub actor ${actor || '(missing)'} is not authorized for production recovery.`);
          }
          if (!split(process.env.AUTHORIZED_FOUNDER_EMAILS).includes(email)) {
            throw new Error('Founder email is not authorized for production recovery.');
          }
          NODE

      - name: Checkout exact recovery SHA
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate to Google Cloud by Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies with retry
        run: bash scripts/npm-install-retry.sh

      - name: Create strict production environment files
        run: node scripts/write-production-env.mjs

      - name: Build shared package
        run: npm run build --workspace=@bin/shared

      - name: Build dedicated Admin panel
        run: npm run build:admin
        env:
          CI: false

      - name: Verify Admin Firebase embedding
        run: npm run verify:admin-firebase -- --build apps/admin-panel/build

      - name: Build Firebase Functions
        run: npm run build:functions

      - name: Verify exact recovery surface and callable exports
        run: |
          set -euo pipefail
          test -f apps/admin-panel/build/index.html
          grep -F 'path="/profile"' apps/admin-panel/src/App.tsx
          grep -F 'AdminMfaEnrollmentCard' apps/admin-panel/src/pages/settings/AdminSecurityProfilePage.tsx
          grep -F 'export * from "./adminSecurityProfile"' functions/runtime.ts
          grep -F 'export * from "./adminMfaRecovery"' functions/runtime.ts
          for function_name in registerAdminSecuritySession getAdminSecurityProfile revokeAdminSessions lockOwnAdminAccount; do
            grep -F "export const $function_name" functions/adminSecurityProfile.ts
          done
          grep -F 'export const finalizeOwnAdminMfaRecovery' functions/adminMfaRecovery.ts

      - name: Repair and verify Admin MFA authorized domains
        run: node scripts/ensure-admin-mfa-authorized-domains.mjs

      - name: Verify Firebase Phone Auth and MFA production configuration
        env:
          FIREBASE_PHONE_AUTH_REQUIRED_DOMAINS: bin-group-57c60.web.app,bin-group-57c60.firebaseapp.com,bin-group-admin-panel.web.app,bin-group-admin-panel.firebaseapp.com
          FIREBASE_PHONE_AUTH_REQUIRED_SMS_REGION: AE
        run: node scripts/verify-firebase-phone-auth-production.mjs

      - name: Deploy Admin enrollment UI and minimal security callables only
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.19.1 deploy \
            --project "$GCP_PROJECT_ID" \
            --only 'hosting:admin,functions:registerAdminSecuritySession,functions:getAdminSecurityProfile,functions:revokeAdminSessions,functions:lockOwnAdminAccount,functions:finalizeOwnAdminMfaRecovery' \
            --non-interactive \
            --force

      - name: Verify live Admin profile entrypoint
        run: |
          set -euo pipefail
          url="https://bin-group-admin-panel.web.app/profile?mfa=enroll&recovery_sha=$GITHUB_SHA"
          headers="$(mktemp)"
          page="$(curl --fail --silent --show-error --location --dump-header "$headers" "$url")"
          grep -q 'id="root"' <<<"$page"
          grep -qi '^cache-control:.*no-store' "$headers"
          echo "Admin MFA enrollment entrypoint is live for exact SHA $GITHUB_SHA."

      - name: Write recovery deployment evidence
        env:
          FOUNDER_NAME: ${{ inputs.founder_name }}
          FOUNDER_EMAIL: ${{ inputs.founder_email }}
        run: |
          mkdir -p launch_package
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const emailHash = crypto.createHash('sha256').update(String(process.env.FOUNDER_EMAIL || '').trim().toLowerCase()).digest('hex');
          const evidence = {
            schemaVersion: 1,
            status: 'deployed',
            purpose: 'restore-admin-mfa-enrollment',
            commitSha: process.env.GITHUB_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            ref: process.env.GITHUB_REF,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT || 0),
            approvedActor: process.env.GITHUB_ACTOR,
            founderNamePresent: Boolean(String(process.env.FOUNDER_NAME || '').trim()),
            founderEmailSha256: emailHash,
            deploymentComponents: [
              'hosting:admin',
              'functions:registerAdminSecuritySession',
              'functions:getAdminSecurityProfile',
              'functions:revokeAdminSessions',
              'functions:lockOwnAdminAccount',
              'functions:finalizeOwnAdminMfaRecovery',
            ],
            authorizedDomainsVerified: true,
            phoneAuthVerified: true,
            mfaGateBypassed: false,
            hardLaunchClaim: false,
            deployedAt: new Date().toISOString(),
          };
          fs.writeFileSync('launch_package/admin-mfa-recovery-deployment.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: admin-mfa-recovery-${{ github.sha }}
          path: launch_package/admin-mfa-recovery-deployment.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish recovery instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          ## Admin MFA recovery deployment completed

          The Admin enrollment UI and only the required security callables were deployed. The full production stack and public-launch gate were not deployed or bypassed.

          Open `https://bin-group-admin-panel.web.app/profile?mfa=enroll`, enroll the real SMS factor, sign out, and sign in again to verify the second factor.
          MARKDOWN
