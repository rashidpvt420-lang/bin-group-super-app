name: Privileged Access Rotation Evidence

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Full lowercase current control-plane main SHA'
        required: true
        type: string
      frozen_release_sha:
        description: 'Full lowercase frozen production release SHA'
        required: true
        type: string
      production_deploy_run_id:
        description: 'Successful production deploy run ID for the frozen release SHA'
        required: true
        type: string
      confirmation:
        description: 'Enter VERIFY_PRIVILEGED_ACCESS_ROTATION'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: privileged-access-rotation-${{ inputs.frozen_release_sha }}-${{ inputs.expected_commit_sha }}
  cancel-in-progress: false

jobs:
  verify-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hard-launch-operations
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      E2E_ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
      PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
      PRODUCTION_RELEASE_SHA: ${{ inputs.frozen_release_sha }}
      CONTROL_PLANE_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Enforce protected rotation inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          RELEASE_SHA: ${{ inputs.frozen_release_sha }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Rotation evidence requires refs/heads/main."
            exit 1
          fi
          authorized_actor=false
          IFS=',' read -ra allowed_actors <<< "${AUTHORIZED_FOUNDER_ACTORS:-}"
          for allowed_actor in "${allowed_actors[@]}"; do
            allowed_actor="$(printf '%s' "$allowed_actor" | xargs)"
            if [[ -n "$allowed_actor" && "$GITHUB_ACTOR" == "$allowed_actor" ]]; then authorized_actor=true; fi
          done
          if [[ "$authorized_actor" != "true" ]]; then
            echo "::error::The current actor is not in AUTHORIZED_FOUNDER_ACTORS."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::expected_commit_sha must equal the current full control-plane main SHA."
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Frozen release SHA and numeric production deploy run ID are required."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "VERIFY_PRIVILEGED_ACCESS_ROTATION" ]]; then
            echo "::error::Rotation confirmation phrase mismatch."
            exit 1
          fi

      - name: Checkout clearance control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control-plane
          fetch-depth: 0

      - name: Verify frozen-release control-plane scope
        env:
          RELEASE_SHA: ${{ inputs.frozen_release_sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C control-plane merge-base --is-ancestor "$RELEASE_SHA" "$CONTROL_PLANE_SHA" || { echo "::error::Frozen release is not an ancestor of the current control plane."; exit 1; }
          changed="$(git -C control-plane diff --name-only "$RELEASE_SHA" "$CONTROL_PLANE_SHA")"
          if [[ -z "$changed" ]]; then
            [[ "$RELEASE_SHA" == "$CONTROL_PLANE_SHA" ]] || {
              echo "::error::Empty control-plane delta is only valid for an exact same-SHA pair."
              exit 1
            }
            echo "Exact same-SHA release/control-plane pair verified."
          else
            allowed='^(\.github/workflows/firebase-production-deploy\.yml|\.github/workflows/live-role-smoke\.yml|\.github/workflows/operational-application-evidence\.yml|\.github/workflows/operational-provider-evidence\.yml|\.github/workflows/privileged-access-rotation-evidence\.yml|\.github/workflows/technician-physical-evidence\.yml|scripts/finalize-operational-provider-evidence\.mjs|scripts/hard-clearance-production-revalidation\.mjs|scripts/launch-status\.mjs|scripts/publish-direct-operational-proof\.mjs|scripts/publish-operational-application-evidence\.mjs|scripts/publish-operational-provider-evidence\.mjs|scripts/resolve-admin-app-check-site-key\.mjs|scripts/run-frozen-release-evidence\.mjs|scripts/verify-ai-live-evidence\.mjs|scripts/verify-hard-launch-approval\.mjs|scripts/verify-operational-readiness\.mjs|tests/launch/ai-operational-contract\.test\.mjs|tests/launch/external-gate-production-provenance\.test\.mjs|tests/launch/final-operational-evidence-producers\.test\.mjs|tests/launch/hard-clearance-revalidation\.test\.mjs|tests/launch/operational-application-evidence-audit\.test\.mjs)$'
            supplemental_allowed='^(scripts/hard-launch-status\.mjs|scripts/lib/hard-launch-control\.mjs|scripts/lib/operational-proof-schema\.mjs|scripts/prepare-operational-application-evidence\.mjs|scripts/print-hard-launch-blockers\.mjs|scripts/verify-operational-application-evidence\.mjs|tests/launch/hard-launch-blocker-plan\.test\.mjs|tests/launch/phase1-manual-public-launch-policy\.test\.mjs)$'
            while IFS= read -r file; do
              [[ -z "$file" || "$file" =~ $allowed || "$file" =~ $supplemental_allowed ]] || { echo "::error::Non-control-plane file changed since frozen release: $file"; exit 1; }
            done <<< "$changed"
          fi
          echo "CONTROL_PLANE_SCOPE_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Checkout frozen production release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.frozen_release_sha }}
          path: release

      - name: Overlay reviewed dual-SHA publisher and Phase 1 proof schema
        run: |
          cp control-plane/scripts/publish-direct-operational-proof.mjs release/scripts/publish-direct-operational-proof.mjs
          cp control-plane/scripts/lib/operational-proof-schema.mjs release/scripts/lib/operational-proof-schema.mjs

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        working-directory: release
        run: bash scripts/npm-install-retry.sh

      - name: Download exact production deployment metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-deployment-${{ inputs.frozen_release_sha }}
          path: release/downloaded-production
          run-id: ${{ inputs.production_deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact production deployment binding
        working-directory: release
        env:
          RELEASE_SHA: ${{ inputs.frozen_release_sha }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
        run: |
          set -euo pipefail
          source_file="$(find downloaded-production -type f -name production-deployment.json -print -quit)"
          [[ -n "$source_file" ]] || { echo "::error::production-deployment.json was not found."; exit 1; }
          mkdir -p launch_package
          cp "$source_file" launch_package/production-deployment.json
          node --input-type=module - "$source_file" <<'NODE'
          import { readFileSync } from 'node:fs';
          const doc = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (doc.status !== 'passed' || doc.projectId !== 'bin-group-57c60') throw new Error('production deployment status/project mismatch');
          if (doc.deployedCommitSha !== process.env.RELEASE_SHA || String(doc.workflowRunId || '') !== process.env.DEPLOY_RUN_ID) throw new Error('production deployment SHA/run mismatch');
          if (doc.workflowRef !== 'refs/heads/main' || doc.repository !== process.env.GITHUB_REPOSITORY) throw new Error('production deployment repository/ref mismatch');
          if (!/^sha256:[a-f0-9]{64}$/.test(String(doc.validatedArtifactDigest || '').toLowerCase())) throw new Error('validated production artifact digest is invalid');
          NODE

      - name: Provision and rotate the ephemeral Admin for this evidence run
        working-directory: release
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          import admin from 'firebase-admin';

          const PROJECT_ID = 'bin-group-57c60';
          const FOUNDER_EMAIL = 'ceo@bin-groups.com';
          const bootstrapEmail = String(process.env.E2E_ADMIN_BOOTSTRAP_EMAIL || '').trim().toLowerCase();
          const runId = String(process.env.GITHUB_RUN_ID || '').trim();
          const runAttempt = String(process.env.GITHUB_RUN_ATTEMPT || '').trim();
          const commitSha = String(process.env.GITHUB_SHA || '').trim();
          const hash = (value) => crypto.createHash('sha256').update(String(value)).digest('hex');
          const randomPassword = () => `${crypto.randomBytes(36).toString('base64url')}!aA7`;

          const at = bootstrapEmail.lastIndexOf('@');
          if (at <= 0 || at === bootstrapEmail.length - 1) throw new Error('E2E_ADMIN_EMAIL bootstrap secret must be a valid email');
          if (!/^\d+$/.test(runId) || !/^\d+$/.test(runAttempt) || !/^[0-9a-f]{40}$/.test(commitSha)) throw new Error('exact workflow run, attempt and commit binding are required');
          const domain = bootstrapEmail.slice(at + 1);
          const local = `rotation-evidence-${runId}-${runAttempt}`;
          if (local.length > 64) throw new Error('privileged rotation run identity exceeds the email local-part limit');
          const email = `${local}@${domain}`;
          if (email.length > 254 || !/^\S+@\S+\.\S+$/.test(email)) throw new Error('derived privileged rotation email is invalid');
          if (email === FOUNDER_EMAIL) throw new Error('Canonical Founder protection refused privileged rotation provisioning');
          const provisionalPassword = randomPassword();
          console.log(`::add-mask::${provisionalPassword}`);

          if (!admin.apps.length) admin.initializeApp({ projectId: PROJECT_ID });
          const auth = admin.auth();
          const db = admin.firestore();
          let user;
          let created = false;

          try {
            user = await auth.getUserByEmail(email);
          } catch (error) {
            if (error?.code !== 'auth/user-not-found') throw error;
            user = await auth.createUser({
              email,
              password: provisionalPassword,
              emailVerified: true,
              displayName: 'E2E Admin Rotation Evidence',
              disabled: true,
            });
            created = true;
          }

          if (!created) {
            const claims = user.customClaims || {};
            const profileSnap = await db.collection('users').doc(user.uid).get();
            const profile = profileSnap.data() || {};
            const exactTestAdmin = claims.testAccount === true
              && claims.admin === true
              && String(claims.role || '').toLowerCase() === 'admin'
              && String(claims.rotationEvidenceRunId || '') === runId
              && String(claims.rotationEvidenceRunAttempt || '') === runAttempt
              && profileSnap.exists
              && profile.testAccount === true
              && String(profile.role || '').toLowerCase() === 'admin'
              && String(profile.rotationEvidenceRunId || '') === runId
              && String(profile.rotationEvidenceRunAttempt || '') === runAttempt
              && String(profile.uid || '') === user.uid
              && String(profile.email || '').trim().toLowerCase() === email;
            if (!exactTestAdmin) throw new Error('refusing to rotate an existing account without exact E2E Admin Auth and Firestore markers');
            await auth.updateUser(user.uid, {
              password: provisionalPassword,
              disabled: true,
              emailVerified: true,
              displayName: 'E2E Admin Rotation Evidence',
            });
          }

          const evidenceClaims = {
            admin: true,
            role: 'admin',
            testAccount: true,
            rotationEvidenceRunId: runId,
            rotationEvidenceRunAttempt: runAttempt,
          };
          await auth.setCustomUserClaims(user.uid, evidenceClaims);
          await db.collection('users').doc(user.uid).set({
            uid: user.uid,
            email,
            role: 'admin',
            status: 'active',
            testAccount: true,
            rotationEvidenceRunId: runId,
            rotationEvidenceRunAttempt: runAttempt,
            displayName: 'E2E Admin Rotation Evidence',
            updatedAt: admin.firestore.FieldValue.serverTimestamp(),
          }, { merge: true });

          const rotatedPassword = randomPassword();
          console.log(`::add-mask::${rotatedPassword}`);
          const passwordRotatedAt = new Date().toISOString();
          await auth.updateUser(user.uid, {
            password: rotatedPassword,
            disabled: false,
            emailVerified: true,
          });
          await auth.revokeRefreshTokens(user.uid);
          const refreshed = await auth.getUser(user.uid);
          const tokensValidAfterMs = Date.parse(String(refreshed.tokensValidAfterTime || ''));
          if (!Number.isFinite(tokensValidAfterMs)) throw new Error('Firebase did not expose a token revocation timestamp');
          const tokensRevokedAt = new Date(tokensValidAfterMs).toISOString();

          await db.collection('security_rotation_records').doc('admin-credential-latest').set({
            status: 'COMPLETED',
            passwordRotated: true,
            refreshTokensRevoked: true,
            adminUidHash: hash(user.uid),
            passwordRotatedAt,
            tokensRevokedAt,
            sourceWorkflow: 'Privileged Access Rotation Evidence',
            sourceRunId: runId,
            sourceRunAttempt: runAttempt,
            commitSha,
            ephemeralTestAdmin: true,
            canonicalFounderProtected: true,
            sensitiveValuesExcluded: true,
            updatedAt: admin.firestore.FieldValue.serverTimestamp(),
          });

          appendFileSync(process.env.GITHUB_ENV, `E2E_ADMIN_EMAIL=${email}\n`);
          appendFileSync(process.env.GITHUB_ENV, `E2E_ADMIN_PASSWORD=${rotatedPassword}\n`);
          console.log(`[privileged-rotation-bootstrap] PASS adminUidHash=${hash(user.uid).slice(0, 12)}… created=${created}`);
          NODE

      - name: Prove rotated Admin credential is accepted by Firebase Auth
        working-directory: release
        run: node ../control-plane/scripts/run-frozen-release-evidence.mjs scripts/verify-admin-credential-login.mjs

      - name: Verify provider-backed credential rotation
        working-directory: release
        run: node ../control-plane/scripts/run-frozen-release-evidence.mjs scripts/verify-privileged-access-rotation.mjs

      - name: Bind Admin login proof to the rotation record
        working-directory: release
        run: node ../control-plane/scripts/run-frozen-release-evidence.mjs scripts/bind-admin-credential-rotation-proof.mjs

      - name: Publish canonical privileged-rotation evidence
        working-directory: release
        run: node scripts/publish-direct-operational-proof.mjs

      - name: Upload secret-rotation proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: privileged-access-rotation-${{ inputs.frozen_release_sha }}
          path: release/launch_package/operational-proof.json
          if-no-files-found: error
          retention-days: 365

      - name: Upload Admin credential login proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-credential-login-${{ inputs.frozen_release_sha }}
          path: release/launch_package/admin-credential-login-proof.json
          if-no-files-found: error
          retention-days: 365

      - name: Retire only this run's ephemeral Admin
        if: ${{ always() && hashFiles('release/package.json') != '' }}
        working-directory: release
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import admin from 'firebase-admin';

          const PROJECT_ID = 'bin-group-57c60';
          const FOUNDER_EMAIL = 'ceo@bin-groups.com';
          const bootstrapEmail = String(process.env.E2E_ADMIN_BOOTSTRAP_EMAIL || '').trim().toLowerCase();
          const runId = String(process.env.GITHUB_RUN_ID || '').trim();
          const runAttempt = String(process.env.GITHUB_RUN_ATTEMPT || '').trim();
          const hash = (value) => crypto.createHash('sha256').update(String(value)).digest('hex');
          const at = bootstrapEmail.lastIndexOf('@');
          if (at <= 0 || at === bootstrapEmail.length - 1) throw new Error('cleanup refused an invalid E2E Admin bootstrap binding');
          if (!/^\d+$/.test(runId) || !/^\d+$/.test(runAttempt)) throw new Error('cleanup requires exact run and attempt binding');
          const domain = bootstrapEmail.slice(at + 1);
          const local = `rotation-evidence-${runId}-${runAttempt}`;
          const email = `${local}@${domain}`;
          if (email.length > 254 || !/^\S+@\S+\.\S+$/.test(email) || email === FOUNDER_EMAIL) {
            throw new Error('cleanup refused an invalid or Founder E2E Admin binding');
          }
          if (!admin.apps.length) admin.initializeApp({ projectId: PROJECT_ID });
          const auth = admin.auth();
          const db = admin.firestore();

          let user;
          try {
            user = await auth.getUserByEmail(email);
          } catch (error) {
            if (error?.code === 'auth/user-not-found') {
              console.log('[privileged-rotation-cleanup] temporary Admin already absent');
              process.exit(0);
            }
            throw error;
          }

          const claims = user.customClaims || {};
          const profileSnap = await db.collection('users').doc(user.uid).get();
          const profile = profileSnap.data() || {};
          const ownedByThisRun = claims.testAccount === true
            && claims.admin === true
            && String(claims.role || '').toLowerCase() === 'admin'
            && String(claims.rotationEvidenceRunId || '') === runId
            && String(claims.rotationEvidenceRunAttempt || '') === runAttempt
            && profileSnap.exists
            && profile.testAccount === true
            && String(profile.role || '').toLowerCase() === 'admin'
            && String(profile.rotationEvidenceRunId || '') === runId
            && String(profile.rotationEvidenceRunAttempt || '') === runAttempt
            && String(profile.uid || '') === user.uid
            && String(profile.email || '').trim().toLowerCase() === email;
          if (!ownedByThisRun) throw new Error('cleanup refused to delete an Admin not owned by this exact evidence run');

          await auth.updateUser(user.uid, { disabled: true });
          await auth.revokeRefreshTokens(user.uid);
          await db.collection('users').doc(user.uid).delete();
          await db.collection('audit_logs').add({
            action: 'PRIVILEGED_ROTATION_E2E_ADMIN_RETIRED',
            actorId: String(process.env.GITHUB_ACTOR || 'protected-workflow'),
            actorRole: 'protected-workflow',
            targetIdentityHash: hash(`${user.uid}|${email}`),
            sourceRunId: runId,
            sourceRunAttempt: runAttempt,
            canonicalFounderProtected: true,
            sensitiveValuesExcluded: true,
            createdAt: admin.firestore.FieldValue.serverTimestamp(),
          });
          await auth.deleteUser(user.uid);
          console.log(`[privileged-rotation-cleanup] PASS targetHash=${hash(`${user.uid}|${email}`).slice(0, 12)}…`);
          NODE
