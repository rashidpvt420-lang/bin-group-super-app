name: One-time Safe Broker Mailbox Evidence Patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/broker-mailbox-evidence-patch-safe.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 627 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/broker-otp-hmac-real-input' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.title == 'Harden Broker OTP evidence against offline derivation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Broker hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/broker-otp-hmac-real-input
          fetch-depth: 0

      - name: Apply deterministic mailbox evidence patch
        run: python .github/scripts/apply-broker-mailbox-evidence-patch.py

      - name: Commit bounded mailbox-evidence patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run-broker-production-evidence.mjs .github/workflows/firebase-production-deploy.yml .github/workflows/live-role-smoke.yml tests/launch/broker-otp-hmac-evidence.test.mjs tests/launch/broker-payout-otp-live-evidence.test.mjs tests/launch/broker-mailbox-workflow-bindings.test.mjs
          git diff --cached --quiet && { echo '::error::Mailbox patch produced no changes.'; exit 1; }
          git commit -m "test(broker): verify OTP through the real mailbox"
          git push origin HEAD:fix/broker-otp-hmac-real-input
