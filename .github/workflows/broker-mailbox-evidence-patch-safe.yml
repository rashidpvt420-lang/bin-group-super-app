name: One-time Safe Broker Mailbox Evidence Patch

on:
  push:
    branches:
      - fix/broker-otp-hmac-real-input
    paths:
      - .github/workflows/broker-mailbox-evidence-patch-safe.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Broker hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/broker-otp-hmac-real-input
          fetch-depth: 0

      - name: Bind evidence to a real received mailbox message
        shell: python
        run: |
          from pathlib import Path

          runner_path = Path('scripts/run-broker-production-evidence.mjs')
          runner = runner_path.read_text(encoding='utf-8')
          runner = runner.replace(
              "import { execFileSync } from 'node:child_process';",
              "import { execFileSync } from 'node:child_process';\nimport { createHash } from 'node:crypto';",
              1,
          )
          runner = runner.replace(
              "const brokerRealPayoutOtp = text(process.env.E2E_BROKER_REAL_PAYOUT_OTP);",
              "const mailboxClientId = text(process.env.E2E_BROKER_MAILBOX_CLIENT_ID);\nconst mailboxClientSecret = text(process.env.E2E_BROKER_MAILBOX_CLIENT_SECRET);\nconst mailboxRefreshToken = text(process.env.E2E_BROKER_MAILBOX_REFRESH_TOKEN);",
              1,
          )
          runner = runner.replace(
              "  E2E_BROKER_REAL_PAYOUT_OTP: brokerRealPayoutOtp,",
              "  E2E_BROKER_MAILBOX_CLIENT_ID: mailboxClientId,\n  E2E_BROKER_MAILBOX_CLIENT_SECRET: mailboxClientSecret,\n  E2E_BROKER_MAILBOX_REFRESH_TOKEN: mailboxRefreshToken,",
              1,
          )
          runner = runner.replace(
              "assert(/^\\d{6}$/.test(brokerRealPayoutOtp), 'E2E_BROKER_REAL_PAYOUT_OTP must be the current six-digit code read from the verified Broker mailbox.');\n",
              "",
              1,
          )

          marker = "async function exchangeAppCheckToken() {"
          helpers = r'''
          const normalizeMessageId = (value) => text(value).replace(/^<|>$/g, '').toLowerCase();
          const sha256 = (value) => createHash('sha256').update(String(value)).digest('hex');

          function decodeBase64Url(value) {
            const normalized = text(value).replace(/-/g, '+').replace(/_/g, '/');
            const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, '=');
            return Buffer.from(padded, 'base64').toString('utf8');
          }

          function gmailHeader(message, name) {
            const headers = Array.isArray(message?.payload?.headers) ? message.payload.headers : [];
            return text(headers.find((entry) => text(entry?.name).toLowerCase() === name.toLowerCase())?.value);
          }

          function gmailBody(payload) {
            if (!payload || typeof payload !== 'object') return '';
            const own = text(payload.body?.data) ? decodeBase64Url(payload.body.data) : '';
            const parts = Array.isArray(payload.parts) ? payload.parts : [];
            const plain = parts.find((part) => text(part.mimeType).toLowerCase() === 'text/plain');
            if (plain) return gmailBody(plain);
            const nested = parts.map(gmailBody).find(Boolean);
            return own || nested || '';
          }

          async function mailboxAccessToken() {
            const body = await jsonRequest('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                client_id: mailboxClientId,
                client_secret: mailboxClientSecret,
                refresh_token: mailboxRefreshToken,
                grant_type: 'refresh_token',
              }).toString(),
            }, 'Broker mailbox OAuth exchange');
            assert(text(body.access_token), 'Broker mailbox OAuth exchange did not return an access token.');
            return text(body.access_token);
          }

          async function waitForMailboxOtp({ providerMessageId, requestedAt, timeoutMs = 120000 }) {
            const accessToken = await mailboxAccessToken();
            const deadline = Date.now() + timeoutMs;
            const query = `from:ceo@bin-groups.com to:${brokerEmail} subject:\"BIN GROUP payout verification code\" newer_than:1d`;
            while (Date.now() < deadline) {
              const list = await jsonRequest(
                `https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=10&q=${encodeURIComponent(query)}`,
                { headers: { Authorization: `Bearer ${accessToken}` } },
                'Broker mailbox message search',
              );
              for (const candidate of Array.isArray(list.messages) ? list.messages : []) {
                const message = await jsonRequest(
                  `https://gmail.googleapis.com/gmail/v1/users/me/messages/${encodeURIComponent(candidate.id)}?format=full`,
                  { headers: { Authorization: `Bearer ${accessToken}` } },
                  'Broker mailbox message read',
                );
                const receivedAt = Number(message.internalDate || 0);
                if (!Number.isFinite(receivedAt) || receivedAt < requestedAt - 10000) continue;
                const to = gmailHeader(message, 'To').toLowerCase();
                const subject = gmailHeader(message, 'Subject');
                const receivedMessageId = normalizeMessageId(gmailHeader(message, 'Message-ID'));
                if (!to.includes(brokerEmail) || subject !== 'BIN GROUP payout verification code') continue;
                if (normalizeMessageId(providerMessageId) !== receivedMessageId) continue;
                const match = gmailBody(message.payload).match(/payout code is\s+(\d{6})/i);
                if (!match) continue;
                return {
                  code: match[1],
                  receivedAt: new Date(receivedAt).toISOString(),
                  messageIdHash: sha256(receivedMessageId),
                };
              }
              await sleep(5000);
            }
            throw new Error('Timed out waiting for the provider-confirmed Broker OTP in the verified mailbox.');
          }

          '''.replace('          ', '')
          if marker not in runner:
              raise SystemExit('App Check helper marker not found in Broker evidence runner')
          runner = runner.replace(marker, helpers + marker, 1)
          runner = runner.replace(
              "  const requested = await callFunction('requestBrokerPayoutOtp', { commissionIds: [commissionId] }, appCheckToken, brokerSession.idToken);",
              "  const otpRequestedAt = Date.now();\n  const requested = await callFunction('requestBrokerPayoutOtp', { commissionIds: [commissionId] }, appCheckToken, brokerSession.idToken);",
              1,
          )
          runner = runner.replace(
              "  const otpDelivery = await inspectOtpDelivery(challengeId);\n  const verified = await callFunction('verifyBrokerPayoutOtp', {\n    challengeId,\n    otp: brokerRealPayoutOtp,\n  }, appCheckToken, brokerSession.idToken);\n  assert(verified.status === 'VERIFIED' && text(verified.challengeId) === challengeId, 'Broker payout OTP verification did not complete with the mailbox-read code.');",
              "  const otpDelivery = await inspectOtpDelivery(challengeId);\n  const mailboxReceipt = await waitForMailboxOtp({ providerMessageId: otpDelivery.providerMessageId, requestedAt: otpRequestedAt });\n  const verified = await callFunction('verifyBrokerPayoutOtp', {\n    challengeId,\n    otp: mailboxReceipt.code,\n  }, appCheckToken, brokerSession.idToken);\n  assert(verified.status === 'VERIFIED' && text(verified.challengeId) === challengeId, 'Broker payout OTP verification did not complete with the mailbox-received code.');",
              1,
          )
          runner = runner.replace(
              "      realMailboxCodeUsed: true,",
              "      mailboxReceiptVerified: true,\n      mailboxReceivedAt: mailboxReceipt.receivedAt,\n      mailboxMessageIdHash: mailboxReceipt.messageIdHash,",
              1,
          )
          runner_path.write_text(runner, encoding='utf-8')

          secret_names = [
              'E2E_BROKER_MAILBOX_CLIENT_ID',
              'E2E_BROKER_MAILBOX_CLIENT_SECRET',
              'E2E_BROKER_MAILBOX_REFRESH_TOKEN',
          ]
          for workflow_path in [Path('.github/workflows/firebase-production-deploy.yml'), Path('.github/workflows/live-role-smoke.yml')]:
              workflow = workflow_path.read_text(encoding='utf-8')
              indent = '      ' if workflow_path.name == 'firebase-production-deploy.yml' else '  '
              needle = f"{indent}E2E_BROKER_PASSWORD: " + '$' + "{{ secrets.E2E_BROKER_PASSWORD }}"
              additions = ''.join(
                  f"\n{indent}{name}: " + '$' + f"{{{{ secrets.{name} }}}}"
                  for name in secret_names
              )
              if needle not in workflow:
                  raise SystemExit(f'Broker environment marker not found in {workflow_path}')
              workflow_path.write_text(workflow.replace(needle, needle + additions, 1), encoding='utf-8')

          hmac_test = Path('tests/launch/broker-otp-hmac-evidence.test.mjs')
          source = hmac_test.read_text(encoding='utf-8')
          source = source.replace(
              "  assert.match(source, /E2E_BROKER_REAL_PAYOUT_OTP/);\n  assert.match(source, /realMailboxCodeUsed:\\s*true/);",
              "  assert.match(source, /E2E_BROKER_MAILBOX_CLIENT_ID/);\n  assert.match(source, /gmail\\.googleapis\\.com\\/gmail\\/v1\\/users\\/me\\/messages/);\n  assert.match(source, /mailboxReceiptVerified:\\s*true/);\n  assert.match(source, /mailboxMessageIdHash/);",
              1,
          )
          hmac_test.write_text(source, encoding='utf-8')

          live_test = Path('tests/launch/broker-payout-otp-live-evidence.test.mjs')
          source = live_test.read_text(encoding='utf-8')
          source = source.replace(
              "  assert.match(productionRunner, /E2E_BROKER_REAL_PAYOUT_OTP/);",
              "  assert.match(productionRunner, /E2E_BROKER_MAILBOX_CLIENT_ID/);\n  assert.match(productionRunner, /gmail\\.googleapis\\.com\\/gmail\\/v1\\/users\\/me\\/messages/);",
              1,
          )
          source = source.replace(
              "  assert.match(productionRunner, /realMailboxCodeUsed: true/);",
              "  assert.match(productionRunner, /mailboxReceiptVerified: true/);\n  assert.match(productionRunner, /mailboxMessageIdHash/);",
              1,
          )
          live_test.write_text(source, encoding='utf-8')

          Path('tests/launch/broker-mailbox-workflow-bindings.test.mjs').write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const read = (path) => readFile(new URL(`../../${path}`, import.meta.url), 'utf8');

          test('protected launch workflows inject static Broker mailbox OAuth credentials', async () => {
            const workflows = await Promise.all([
              read('.github/workflows/firebase-production-deploy.yml'),
              read('.github/workflows/live-role-smoke.yml'),
            ]);
            for (const workflow of workflows) {
              assert.match(workflow, /E2E_BROKER_MAILBOX_CLIENT_ID:\\s*\\$\\{\\{ secrets\\.E2E_BROKER_MAILBOX_CLIENT_ID \\}\\}/);
              assert.match(workflow, /E2E_BROKER_MAILBOX_CLIENT_SECRET:\\s*\\$\\{\\{ secrets\\.E2E_BROKER_MAILBOX_CLIENT_SECRET \\}\\}/);
              assert.match(workflow, /E2E_BROKER_MAILBOX_REFRESH_TOKEN:\\s*\\$\\{\\{ secrets\\.E2E_BROKER_MAILBOX_REFRESH_TOKEN \\}\\}/);
            }
          });
          """.replace('          ', ''), encoding='utf-8')

      - name: Commit bounded mailbox-evidence patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run-broker-production-evidence.mjs .github/workflows/firebase-production-deploy.yml .github/workflows/live-role-smoke.yml tests/launch/broker-otp-hmac-evidence.test.mjs tests/launch/broker-payout-otp-live-evidence.test.mjs tests/launch/broker-mailbox-workflow-bindings.test.mjs
          git diff --cached --check
          git commit -m "test(broker): verify OTP through the real mailbox"
          git push origin HEAD:fix/broker-otp-hmac-real-input
