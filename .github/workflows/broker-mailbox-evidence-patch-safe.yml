name: One-time Safe Broker Mailbox Evidence Patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/broker-mailbox-evidence-patch-safe.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 627 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/broker-otp-hmac-real-input' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.title == 'Harden Broker OTP evidence against offline derivation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Broker hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/broker-otp-hmac-real-input
          fetch-depth: 0

      - name: Apply Google Secret Manager mailbox fallback
        run: python .github/scripts/apply-broker-secret-manager-fallback.py

      - name: Stage Broker Secret Manager evidence files
        run: |
          set -euo pipefail
          git add scripts/run-broker-production-evidence.mjs tests/launch/broker-otp-hmac-evidence.test.mjs tests/launch/broker-payout-otp-live-evidence.test.mjs
          git diff --cached --quiet && { echo '::error::Secret Manager patch produced no changes.'; exit 1; }
          git diff --cached --name-only

      - name: Commit Broker Secret Manager evidence patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test(broker): read mailbox OAuth from Secret Manager"

      - name: Push bounded patch to exact Broker branch
        run: git push origin HEAD:fix/broker-otp-hmac-real-input
