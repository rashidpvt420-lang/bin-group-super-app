name: Founder One-Shot Protected Release Orchestrator
run-name: Protected release orchestration · ${{ inputs.expected_commit_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Exact current main SHA to release'
        required: true
        type: string
      confirmation:
        description: 'Type exactly RUN_PROTECTED_RELEASE_BIN_GROUP'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: founder-release-orchestrator-one-shot
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Reuse or create exact-SHA deploy, live evidence, and Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Run protected release sequence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FOUNDER_NAME: Rashid AbdulGhani
          FOUNDER_EMAIL: ceo@bin-groups.com
          AUTHORIZATION_ACTOR: rashidpvt420-lang
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          gh_get() {
            local endpoint="$1"
            local output=""
            for attempt in 1 2 3 4 5; do
              if output="$(gh api "$endpoint")"; then
                printf '%s' "$output"
                return 0
              fi
              echo "GitHub API GET attempt $attempt failed; waiting before fail-closed retry." >&2
              sleep $((attempt * 3))
            done
            echo "::error::GitHub API remained unavailable for required read: $endpoint" >&2
            return 1
          }

          [[ "$CONFIRMATION" == "RUN_PROTECTED_RELEASE_BIN_GROUP" ]] \
            || fail "Invalid protected-release confirmation."
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "expected_commit_sha must be a full lowercase 40-character SHA."
          [[ "$GITHUB_SHA" == "$TARGET_SHA" ]] \
            || fail "Workflow ref SHA $GITHUB_SHA does not equal protected target $TARGET_SHA."

          assert_main() {
            local current_json current
            current_json="$(gh_get "repos/$REPOSITORY/commits/main")" \
              || fail "Unable to verify current main."
            current="$(jq -r '.sha' <<<"$current_json")"
            [[ "$current" == "$TARGET_SHA" ]] \
              || fail "main moved from protected target $TARGET_SHA to $current; refusing to continue."
          }

          workflow_ids() {
            local workflow="$1"
            local runs_json
            runs_json="$(gh_get "repos/$REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=100")" \
              || fail "Unable to snapshot $workflow before dispatch."
            jq -r '.workflow_runs[].id' <<<"$runs_json"
          }

          NEW_RUN_ID=""
          find_new_exact_sha_run() {
            local workflow="$1"
            local baseline="$2"
            local runs_json
            NEW_RUN_ID=""
            runs_json="$(gh_get "repos/$REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=100")" \
              || fail "Unable to correlate $workflow after dispatch."
            NEW_RUN_ID="$(jq -r --arg sha "$TARGET_SHA" --arg baseline "$baseline" '
                ($baseline | split("\n") | map(select(length > 0) | tonumber)) as $old
                | [.workflow_runs[]
                    | select(.head_branch == "main")
                    | select(.event == "workflow_dispatch")
                    | select(.head_sha == $sha)
                    | select((.id as $id | ($old | index($id))) == null)]
                | sort_by(.created_at)
                | last
                | .id // empty' <<<"$runs_json")"
            [[ "$NEW_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          }

          artifact_exists() {
            local run_id="$1"
            local artifact_name="$2"
            local artifacts_json
            artifacts_json="$(gh_get "repos/$REPOSITORY/actions/runs/$run_id/artifacts")" \
              || fail "Unable to verify artifact $artifact_name on run $run_id."
            jq -e --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length == 1' \
              <<<"$artifacts_json" >/dev/null
          }

          REUSABLE_RUN_ID=""
          find_reusable_success() {
            local workflow="$1"
            local artifact_name="$2"
            local runs_json run_id
            REUSABLE_RUN_ID=""
            runs_json="$(gh_get "repos/$REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=100")" \
              || fail "Unable to inspect reusable $workflow runs."
            while read -r run_id; do
              [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || continue
              if artifact_exists "$run_id" "$artifact_name"; then
                REUSABLE_RUN_ID="$run_id"
                return 0
              fi
            done < <(
              jq -r --arg sha "$TARGET_SHA" '
                [.workflow_runs[]
                  | select(.head_branch == "main")
                  | select(.event == "workflow_dispatch")
                  | select(.head_sha == $sha)
                  | select(.status == "completed" and .conclusion == "success")]
                | sort_by(.created_at) | reverse | .[].id' <<<"$runs_json"
            )
            return 1
          }

          DISPATCHED_RUN_ID=""
          dispatch_and_locate() {
            local dispatch_workflow="$1"
            local observed_workflow="$2"
            local baseline="$3"
            local label="$4"
            local payload="$5"
            local post_accepted="false"
            DISPATCHED_RUN_ID=""

            for dispatch_attempt in 1 2 3; do
              post_accepted="false"
              if printf '%s' "$payload" \
                | gh api --method POST -H 'Accept: application/vnd.github+json' \
                    "repos/$REPOSITORY/actions/workflows/$dispatch_workflow/dispatches" --input -; then
                post_accepted="true"
              else
                echo "$label dispatch POST attempt $dispatch_attempt was inconclusive; checking for an exact-SHA run before any retry." >&2
              fi

              for _ in $(seq 1 36); do
                if find_new_exact_sha_run "$observed_workflow" "$baseline"; then
                  DISPATCHED_RUN_ID="$NEW_RUN_ID"
                  echo "$label exact-SHA run correlated: $DISPATCHED_RUN_ID"
                  return 0
                fi
                sleep 5
              done

              if [[ "$post_accepted" == "true" ]]; then
                fail "$label dispatch was accepted but no exact-SHA run appeared; refusing a duplicate POST."
              fi
              echo "$label POST was not accepted and no exact-SHA run appeared; retrying safely." >&2
            done

            fail "$label could not be dispatched or correlated after protected retries."
          }

          wait_for_success() {
            local run_id="$1"
            local label="$2"
            local run_json state conclusion
            for _ in $(seq 1 300); do
              run_json="$(gh_get "repos/$REPOSITORY/actions/runs/$run_id")" \
                || fail "Unable to read $label run $run_id."
              state="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              echo "$label run $run_id: status=$state conclusion=${conclusion:-pending}"
              if [[ "$state" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] \
                  || fail "$label run $run_id completed with conclusion '$conclusion'. Downstream release steps were not started."
                return 0
              fi
              sleep 60
            done
            fail "$label run $run_id did not complete within the protected wait window."
          }

          assert_main
          production_artifact="production-deployment-$TARGET_SHA"
          production_run_id=""
          if find_reusable_success firebase-production-deploy.yml "$production_artifact"; then
            production_run_id="$REUSABLE_RUN_ID"
            echo "Reusing successful exact-SHA Firebase Production Deploy run $production_run_id"
          else
            production_baseline="$(workflow_ids firebase-production-deploy.yml)"
            echo "No reusable exact-SHA production artifact exists; dispatching protected bank-pilot deploy."
            production_payload="$(jq -nc \
              --arg ref main \
              --arg confirmation DEPLOY_PRODUCTION_BIN_GROUP_57C60 \
              --arg hard AUTHORIZE_HARD_PUBLIC_LAUNCH_BIN_GROUP \
              --arg sha "$TARGET_SHA" \
              --arg actor "$AUTHORIZATION_ACTOR" \
              --arg founderName "$FOUNDER_NAME" \
              --arg founderEmail "$FOUNDER_EMAIL" \
              '{ref:$ref,inputs:{confirmation:$confirmation,hard_launch_confirmation:$hard,expected_commit_sha:$sha,authorization_actor:$actor,authorization_source_pr:"",founder_name:$founderName,founder_email:$founderEmail,launch_mode:"bank-pilot",run_public_release_gate:false,deployment_payload_json:""}}')"
            dispatch_and_locate \
              firebase-production-dispatch-current-main.yml \
              firebase-production-deploy.yml \
              "$production_baseline" \
              "Firebase Production Deploy" \
              "$production_payload"
            production_run_id="$DISPATCHED_RUN_ID"
            wait_for_success "$production_run_id" "Firebase Production Deploy"
            artifact_exists "$production_run_id" "$production_artifact" \
              || fail "Successful production run $production_run_id did not publish exactly one non-expired $production_artifact artifact."
          fi

          assert_main
          live_artifact="live-launch-evidence-$TARGET_SHA"
          live_run_id=""
          if find_reusable_success live-role-smoke.yml "$live_artifact"; then
            live_run_id="$REUSABLE_RUN_ID"
            echo "Reusing successful exact-SHA Live Role Smoke run $live_run_id"
          else
            live_baseline="$(workflow_ids live-role-smoke.yml)"
            echo "Dispatching exact-SHA Live Role Smoke Tests live-evidence."
            live_payload="$(jq -nc --arg ref main --arg sha "$TARGET_SHA" --arg deployRun "$production_run_id" \
              '{ref:$ref,inputs:{mode:"live-evidence",expected_commit_sha:$sha,production_deploy_run_id:$deployRun}}')"
            dispatch_and_locate \
              live-role-smoke.yml \
              live-role-smoke.yml \
              "$live_baseline" \
              "Live Role Smoke Tests" \
              "$live_payload"
            live_run_id="$DISPATCHED_RUN_ID"
            wait_for_success "$live_run_id" "Live Role Smoke Tests"
            artifact_exists "$live_run_id" "$live_artifact" \
              || fail "Successful Live Role run $live_run_id did not publish exactly one non-expired $live_artifact artifact."
          fi

          assert_main
          aab_artifact="bin-group-android-release-$TARGET_SHA"
          aab_run_id=""
          if find_reusable_success android-store-release.yml "$aab_artifact"; then
            aab_run_id="$REUSABLE_RUN_ID"
            echo "Reusing successful exact-SHA Android release run $aab_run_id"
          else
            aab_baseline="$(workflow_ids android-store-release.yml)"
            echo "Dispatching signed Android AAB build."
            aab_payload="$(jq -nc --arg ref main --arg sha "$TARGET_SHA" \
              '{ref:$ref,inputs:{expected_commit_sha:$sha,confirmation:"BUILD_SIGNED_ANDROID_AAB_BIN_GROUP"}}')"
            dispatch_and_locate \
              android-store-release.yml \
              android-store-release.yml \
              "$aab_baseline" \
              "Android Store Release AAB" \
              "$aab_payload"
            aab_run_id="$DISPATCHED_RUN_ID"
            wait_for_success "$aab_run_id" "Android Store Release AAB"
            artifact_exists "$aab_run_id" "$aab_artifact" \
              || fail "Successful Android run $aab_run_id did not publish exactly one non-expired $aab_artifact artifact."
          fi

          {
            echo "## Protected release sequence complete"
            echo
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Firebase Production Deploy run: \`$production_run_id\`"
            echo "- Live Role Smoke Tests run: \`$live_run_id\`"
            echo "- Android Store Release AAB run: \`$aab_run_id\`"
          } >> "$GITHUB_STEP_SUMMARY"
