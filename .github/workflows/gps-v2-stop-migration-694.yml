name: Apply GPS v2 STOP Migration 694

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/gps-v2-stop-migration-694.yml
      - .github/scripts/apply-gps-v2-stop-migration.py

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 694 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/map-gps-client-hardening-current-main' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/map-gps-client-hardening-current-main
          fetch-depth: 0
      - name: Apply deterministic v2 STOP migration patch
        run: python .github/scripts/apply-gps-v2-stop-migration.py
      - name: Commit reviewed changes and remove one-off patch machinery
        run: |
          set -euo pipefail
          git rm .github/scripts/apply-gps-v2-stop-migration.py .github/workflows/gps-v2-stop-migration-694.yml
          git add src/utils/gpsRetryQueue.ts tests/launch/maps-gps-product-truth.test.mjs tests/launch/map-gps-state-behavior.test.mjs
          git diff --cached --quiet && { echo '::error::GPS v2 STOP migration produced no changes.'; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(gps): migrate pending v2 STOPs into scoped v3 queues'
          git push origin HEAD:fix/map-gps-client-hardening-current-main
