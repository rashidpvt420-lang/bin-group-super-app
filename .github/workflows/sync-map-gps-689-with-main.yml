name: Sync Map GPS 689 With Main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/sync-map-gps-689-with-main.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 689 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/admin-map-gps-queue-truth' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/admin-map-gps-queue-truth
          fetch-depth: 0
      - name: Merge exact current main into repair branch
        run: |
          set -euo pipefail
          git fetch origin main
          before="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$main_sha"
          after="$(git rev-parse HEAD)"
          [[ "$after" != "$before" ]] || { echo '::error::Branch was already synchronized.'; exit 1; }
          git push origin HEAD:fix/admin-map-gps-queue-truth
          echo "Synchronized map/GPS repair with main $main_sha as $after."
