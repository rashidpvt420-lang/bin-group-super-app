name: Repair supplemental allowlist consumption

on:
  push:
    branches:
      - fix/postdeploy-evidence-recovery-20260916

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/postdeploy-evidence-recovery-20260916
          fetch-depth: 0

      - name: Apply fail-closed loop repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('.github/workflows/live-role-smoke.yml'),
              Path('.github/workflows/operational-application-evidence.yml'),
              Path('.github/workflows/operational-provider-evidence.yml'),
              Path('.github/workflows/privileged-access-rotation-evidence.yml'),
              Path('.github/workflows/technician-physical-evidence.yml'),
          ]
          old = '[[ -z "$file" || "$file" =~ $allowed ]] ||'
          new = '[[ -z "$file" || "$file" =~ $allowed || "$file" =~ $supplemental_allowed ]] ||'
          total = 0
          for path in files:
              text = path.read_text()
              count = text.count(old)
              print(f'{path}: unconsumed={count}')
              total += count
              path.write_text(text.replace(old, new))
          print(f'total replacements={total}')
          if total != 6:
              raise SystemExit(f'expected exactly 6 replacements, made {total}')
          remaining = sum(path.read_text().count(old) for path in files)
          repaired = sum(path.read_text().count(new) for path in files)
          print(f'remaining={remaining} repaired={repaired}')
          if remaining != 0 or repaired < 6:
              raise SystemExit('supplemental allowlist consumption verification failed')
          PY
          git diff --check

      - name: Build repair commit and publish object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/live-role-smoke.yml \
            .github/workflows/operational-application-evidence.yml \
            .github/workflows/operational-provider-evidence.yml \
            .github/workflows/privileged-access-rotation-evidence.yml \
            .github/workflows/technician-physical-evidence.yml
          git diff --cached --quiet && { echo '::error::No repair diff produced.'; exit 1; }
          git commit -m 'Fix supplemental control-plane allowlist consumption'
          echo "REPAIR_COMMIT_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/tmp/pr1243-loopfix-object || true
          echo "REPAIR_COMMIT_SHA_AFTER_PUSH=$(git rev-parse HEAD)"
