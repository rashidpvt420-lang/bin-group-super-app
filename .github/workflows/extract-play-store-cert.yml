name: Extract Play Store Upload Certificate
run-name: Play Store certificate · ${{ github.run_id }}

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: extract-play-store-upload-certificate
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  COMMAND_ISSUE: '434'
  TRACKING_ISSUE: '478'

jobs:
  announce:
    name: Announce exact protected certificate run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.number == 434 &&
        !github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.body == '/bin-launch extract-play-store-cert'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve stable exact current main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]] || {
            echo '::error::Main moved while authorizing certificate extraction.'
            exit 1
          }
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Publish waiting-for-production status
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="## Protected Play Store certificate extraction

          - Status: \`WAITING_FOR_PRODUCTION_ENVIRONMENT\`
          - Exact SHA: \`$RELEASE_SHA\`
          - Workflow run ID: \`$GITHUB_RUN_ID\`
          - Workflow run: $run_url
          - Protected job: \`Export public Android upload certificate\`
          - Artifact: pending
          - Package: \`ae.bingroups.superapp\`
          - Private key included: \`false\`
          - Keystore included: \`false\`
          - Passwords included: \`false\`
          - Hard-launch claim: \`false\`"
          gh api --method PATCH "repos/$REPOSITORY/issues/$TRACKING_ISSUE" \
            -f state='open' \
            -f body="$body" >/dev/null
          gh api --method POST "repos/$REPOSITORY/issues/$COMMAND_ISSUE/comments" -f body="$body" >/dev/null

  export_certificate:
    name: Export public Android upload certificate
    needs: announce
    if: needs.announce.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.certificate.outputs.artifact_name }}
      fingerprint: ${{ steps.certificate.outputs.fingerprint }}
      signing_ready: ${{ steps.signing_inputs.outputs.ready }}
      missing_inputs: ${{ steps.signing_inputs.outputs.missing }}
    env:
      RELEASE_SHA: ${{ needs.announce.outputs.release_sha }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Verify main remained frozen before extraction
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Main moved from $RELEASE_SHA to $remote_main before certificate extraction."
            exit 1
          }

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Inspect protected Android signing inputs
        id: signing_inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done

          missing_csv="$(IFS=,; printf '%s' "${missing[*]-}")"
          echo "missing=$missing_csv" >> "$GITHUB_OUTPUT"
          if [[ "${#missing[@]}" -eq 0 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::error::Missing protected Android signing inputs: $missing_csv"
          fi

      - name: Fail closed when protected signing inputs are missing
        if: steps.signing_inputs.outputs.ready != 'true'
        shell: bash
        run: exit 1

      - name: Decode keystore and write signing properties
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/bin-group-upload.jks
          chmod 600 android/app/bin-group-upload.jks
          [[ -s android/app/bin-group-upload.jks ]]

          umask 077
          printf '%s\n' \
            'storeFile=app/bin-group-upload.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > android/keystore.properties
          [[ -s android/keystore.properties ]]

      - name: Export and verify public upload certificate
        id: certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play-store-certificate

          keytool -exportcert -rfc \
            -keystore android/app/bin-group-upload.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file play-store-certificate/bin-group-upload-certificate.pem

          grep -q -- '-----BEGIN CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem
          grep -q -- '-----END CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem

          keytool -printcert \
            -file play-store-certificate/bin-group-upload-certificate.pem \
            > play-store-certificate/bin-group-upload-certificate-details.txt

          fingerprint="$(awk -F': ' '/SHA256:/{print $2; exit}' play-store-certificate/bin-group-upload-certificate-details.txt)"
          [[ "$fingerprint" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]
          certificate_file_sha256="$(sha256sum play-store-certificate/bin-group-upload-certificate.pem | awk '{print $1}')"
          [[ "$certificate_file_sha256" =~ ^[0-9a-f]{64}$ ]]

          jq -n \
            --arg commitSha "$RELEASE_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg packageName 'ae.bingroups.superapp' \
            --arg certificateSha256Fingerprint "$fingerprint" \
            --arg certificateFileSha256 "$certificate_file_sha256" \
            '{
              schemaVersion: 9,
              commitSha: $commitSha,
              workflowRunId: $workflowRunId,
              packageName: $packageName,
              certificateSha256Fingerprint: $certificateSha256Fingerprint,
              certificateFileSha256: $certificateFileSha256,
              publicCertificateOnly: true,
              privateKeyExcluded: true,
              keystoreExcluded: true,
              passwordsExcluded: true,
              hardLaunchClaim: false
            }' > play-store-certificate/play-store-certificate-evidence.json

          artifact_name="bin-group-play-store-certificate-$RELEASE_SHA-$GITHUB_RUN_ID"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Verify certificate artifact allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find play-store-certificate -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(
            bin-group-upload-certificate-details.txt
            bin-group-upload-certificate.pem
            play-store-certificate-evidence.json
          )
          [[ "${files[*]}" == "${expected[*]}" ]]
          ! find play-store-certificate -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' \) | grep -q .

      - name: Upload public Play certificate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.certificate.outputs.artifact_name }}
          path: play-store-certificate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Verify main remained frozen through extraction
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Certificate exported, but main moved to $remote_main."
            exit 1
          }

      - name: Remove private Android signing material
        if: always()
        shell: bash
        run: |
          set +e
          shred -u android/app/bin-group-upload.jks 2>/dev/null || rm -f android/app/bin-group-upload.jks
          shred -u android/keystore.properties 2>/dev/null || rm -f android/keystore.properties

      - name: Publish certificate extraction outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SIGNING_READY: ${{ steps.signing_inputs.outputs.ready }}
          MISSING_INPUTS: ${{ steps.signing_inputs.outputs.missing }}
          ARTIFACT_NAME: ${{ steps.certificate.outputs.artifact_name }}
          CERTIFICATE_FINGERPRINT: ${{ steps.certificate.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ "$JOB_STATUS" == 'success' ]]; then
            body="## Protected Play Store certificate extraction

            - Status: \`SUCCESS\`
            - Exact SHA: \`$RELEASE_SHA\`
            - Workflow run ID: \`$GITHUB_RUN_ID\`
            - Workflow run: $run_url
            - Artifact: \`$ARTIFACT_NAME\`
            - Package: \`ae.bingroups.superapp\`
            - Certificate SHA-256: \`$CERTIFICATE_FINGERPRINT\`
            - Private key included: \`false\`
            - Keystore included: \`false\`
            - Passwords included: \`false\`
            - Hard-launch claim: \`false\`"
            gh api --method PATCH "repos/$REPOSITORY/issues/$TRACKING_ISSUE" \
              -f state='closed' \
              -f state_reason='completed' \
              -f body="$body" >/dev/null
            gh api --method POST "repos/$REPOSITORY/issues/$COMMAND_ISSUE/comments" -f body="$body" >/dev/null
          else
            missing="${MISSING_INPUTS:-none-reported}"
            body="## Protected Play Store certificate extraction

            - Status: \`FAILURE\`
            - Exact SHA: \`$RELEASE_SHA\`
            - Workflow run ID: \`$GITHUB_RUN_ID\`
            - Workflow run: $run_url
            - Protected signing inputs ready: \`${SIGNING_READY:-unknown}\`
            - Missing protected inputs: \`$missing\`
            - Artifact: unavailable
            - Private key included: \`false\`
            - Keystore included: \`false\`
            - Passwords included: \`false\`
            - Hard-launch claim: \`false\`"
            gh api --method PATCH "repos/$REPOSITORY/issues/$TRACKING_ISSUE" \
              -f state='open' \
              -f body="$body" >/dev/null
            gh api --method POST "repos/$REPOSITORY/issues/$COMMAND_ISSUE/comments" -f body="$body" >/dev/null
          fi
