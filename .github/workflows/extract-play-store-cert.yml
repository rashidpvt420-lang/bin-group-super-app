name: Extract Play Store Upload Certificate
run-name: Play Store certificate · ${{ github.event.comment.body }}

on:
  push:
    branches:
      - ops/extract-play-store-cert-087444d
    paths:
      - .github/workflows/extract-play-store-cert.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: extract-play-store-cert-087444d
  cancel-in-progress: false

jobs:
  export-certificate:
    name: Export protected Android upload certificate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_SHA: 087444dcd0961a0f3b941b3dabacb75b976b1152
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Verify exact main remains authorized
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_main="$(git ls-remote --exit-code https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Refusing certificate export because main moved from $RELEASE_SHA to $remote_main."
            exit 1
          }

      - name: Checkout exact accepted release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate protected signing inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || {
              echo "Missing required protected secret: $name" >&2
              exit 1
            }
          done

      - name: Decode keystore and write local signing properties
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/bin-group-upload.jks
          chmod 600 android/app/bin-group-upload.jks
          [[ -s android/app/bin-group-upload.jks ]]

          umask 077
          printf '%s\n' \
            'storeFile=app/bin-group-upload.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > android/keystore.properties
          [[ -s android/keystore.properties ]]

      - name: Export and verify public certificate
        id: certificate
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p play-store-certificate

          keytool -exportcert -rfc \
            -keystore android/app/bin-group-upload.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file play-store-certificate/bin-group-upload-certificate.pem

          grep -q -- '-----BEGIN CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem
          grep -q -- '-----END CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem

          keytool -printcert \
            -file play-store-certificate/bin-group-upload-certificate.pem \
            > play-store-certificate/bin-group-upload-certificate-details.txt

          fingerprint="$(awk -F': ' '/SHA256:/{print $2; exit}' play-store-certificate/bin-group-upload-certificate-details.txt)"
          [[ "$fingerprint" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]

          certificate_file_sha256="$(sha256sum play-store-certificate/bin-group-upload-certificate.pem | awk '{print $1}')"
          [[ "$certificate_file_sha256" =~ ^[0-9a-f]{64}$ ]]

          jq -n \
            --arg commitSha "$RELEASE_SHA" \
            --arg packageName 'ae.bingroups.superapp' \
            --arg certificateSha256Fingerprint "$fingerprint" \
            --arg certificateFileSha256 "$certificate_file_sha256" \
            '{
              schemaVersion: 1,
              commitSha: $commitSha,
              packageName: $packageName,
              certificateSha256Fingerprint: $certificateSha256Fingerprint,
              certificateFileSha256: $certificateFileSha256,
              publicCertificateOnly: true,
              privateKeyExcluded: true,
              keystoreExcluded: true,
              passwordsExcluded: true,
              hardLaunchClaim: false
            }' > play-store-certificate/play-store-certificate-evidence.json

      - name: Verify main remained frozen
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Certificate was exported, but main moved to $remote_main; refusing evidence upload."
            exit 1
          }

      - name: Upload Play upload certificate
        uses: actions/upload-artifact@v4
        with:
          name: bin-group-upload-certificate-${{ env.RELEASE_SHA }}-${{ github.run_id }}
          path: bin-group-upload-certificate.pem
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Post extraction result
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          ARTIFACT_NAME: ${{ steps.certificate.outputs.artifact_name }}
          CERTIFICATE_FINGERPRINT: ${{ steps.certificate.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="## Play Store upload certificate ready

- Exact SHA: \`$RELEASE_SHA\`
- Workflow run: $run_url
- Artifact: \`$ARTIFACT_NAME\`
- Package: \`ae.bingroups.superapp\`
- Certificate SHA-256: \`$CERTIFICATE_FINGERPRINT\`
- Private key included: \`false\`
- Keystore included: \`false\`
- Hard-launch claim: \`false\`"
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null

      - name: Remove private signing material
        if: always()
        shell: bash
        run: |
          rm -f android/app/bin-group-upload.jks android/keystore.properties
