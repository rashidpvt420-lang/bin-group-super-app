name: Extract Play Store Upload Certificate
run-name: Export Play upload certificate · 087444dcd0961a0f3b941b3dabacb75b976b1152

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extract-play-store-cert
  cancel-in-progress: false

jobs:
  export-certificate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.number == 434 &&
        !github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.body == '/bin-launch extract-play-store-cert'
      )
    name: Export protected Android upload certificate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SOURCE_SHA: 087444dcd0961a0f3b941b3dabacb75b976b1152
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout exact accepted source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate protected signing inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          required=(ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::Missing protected Android signing value: $name"
              exit 1
            }
          done

      - name: Decode keystore and write signing properties
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/bin-group-upload.jks
          chmod 600 android/app/bin-group-upload.jks
          cat > android/keystore.properties <<EOF
          storeFile=app/bin-group-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties
          test -s android/app/bin-group-upload.jks

      - name: Export public upload certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -exportcert -rfc \
            -keystore android/app/bin-group-upload.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file bin-group-upload-certificate.pem
          test -s bin-group-upload-certificate.pem
          grep -q -- '-----BEGIN CERTIFICATE-----' bin-group-upload-certificate.pem
          grep -q -- '-----END CERTIFICATE-----' bin-group-upload-certificate.pem
          keytool -printcert -file bin-group-upload-certificate.pem | sed -n '/Owner:/p;/Issuer:/p;/Serial number:/p;/SHA1:/p;/SHA256:/p;/Valid from:/p' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Play upload certificate
        uses: actions/upload-artifact@v4
        with:
          name: bin-group-upload-certificate-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: bin-group-upload-certificate.pem
          if-no-files-found: error
          retention-days: 30

      - name: Remove protected signing material
        if: always()
        shell: bash
        run: rm -f android/app/bin-group-upload.jks android/keystore.properties
