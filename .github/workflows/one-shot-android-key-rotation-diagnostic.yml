name: One-shot Android Key Rotation Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.ref == 'ops/android-key-rotation-diagnostic-32dae477'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: 32dae477e404afff6eec2c13c3e62c4662d45291
    steps:
      - name: Dispatch exact-main signed Android AAB diagnostic
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          gh_get() {
            local endpoint="$1" output=""
            for attempt in 1 2 3 4 5; do
              if output="$(gh api "$endpoint")"; then printf '%s' "$output"; return 0; fi
              sleep $((attempt * 3))
            done
            return 1
          }
          current="$(gh_get "repos/$REPOSITORY/commits/main" | jq -r '.sha')" || fail "Unable to verify current main."
          [[ "$current" == "$TARGET_SHA" ]] || fail "main moved from $TARGET_SHA to $current; refusing stale Android dispatch."
          find_exact_run() {
            gh_get "repos/$REPOSITORY/actions/workflows/android-store-release.yml/runs?branch=main&event=workflow_dispatch&per_page=100" |
              jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_branch=="main" and .event=="workflow_dispatch" and .head_sha==$sha) | select(.status != "completed" or .conclusion == "success")] | sort_by(.created_at) | reverse | .[0].id // empty'
          }
          existing="$(find_exact_run || true)"
          if [[ "$existing" =~ ^[1-9][0-9]*$ ]]; then echo "Exact-SHA Android run already exists: $existing"; exit 0; fi
          payload="$(jq -nc --arg ref main --arg sha "$TARGET_SHA" '{ref:$ref,inputs:{expected_commit_sha:$sha,confirmation:"BUILD_SIGNED_ANDROID_AAB_BIN_GROUP"}}')"
          accepted=false
          if printf '%s' "$payload" | gh api --method POST -H 'Accept: application/vnd.github+json' "repos/$REPOSITORY/actions/workflows/android-store-release.yml/dispatches" --input -; then accepted=true; fi
          for _ in $(seq 1 36); do
            run_id="$(find_exact_run || true)"
            if [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then echo "Android Store Release exact-SHA run: $run_id"; exit 0; fi
            sleep 5
          done
          [[ "$accepted" == "false" ]] || fail "Android dispatch accepted but exact-SHA run not visible; refusing duplicate POST."
          fail "Unable to safely correlate Android diagnostic run."
