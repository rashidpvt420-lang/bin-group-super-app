name: Apply validator regression fixture fixes

on:
  push:
    branches:
      - fix/hard-launch-validator-tests

permissions:
  contents: write

concurrency:
  group: apply-validator-regression-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hard-launch-validator-tests
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply test fixture patches
        run: python .ci-fix/patch.py
      - name: Install dependencies
        run: npm ci
      - name: Run complete launch-honesty suite
        run: npm run test:launch-honesty
      - name: Commit clean correction
        run: |
          set -euo pipefail
          rm -rf .ci-fix
          rm -f .github/workflows/apply-hard-launch-validator-test-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align launch validator regression fixtures"
          git push origin HEAD:fix/hard-launch-validator-tests
