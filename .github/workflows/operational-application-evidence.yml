name: Operational Application Evidence

on:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Application gate to verify and publish; all runs the complete application batch'
        required: true
        type: choice
        options:
          - all
          - ownerPaymentActivation
          - paymentUnlockExactlyOnce
          - tenantNotificationDelivery
          - brokerCommissionLockExactlyOnce
          - adminStaffClaims
          - renewalScheduler
      expected_commit_sha:
        description: 'Full lowercase current production main SHA'
        required: true
        type: string
      confirmation:
        description: 'Enter PUBLISH_OPERATIONAL_APPLICATION_EVIDENCE'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: operational-application-evidence-${{ inputs.gate }}-${{ inputs.expected_commit_sha }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: hard-public-launch
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
      OPERATIONAL_GATE: ${{ inputs.gate }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}

    steps:
      - name: Enforce protected application evidence inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          SELECTED_GATE: ${{ inputs.gate }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Application evidence requires refs/heads/main."
            exit 1
          fi
          authorized_actor=false
          IFS=',' read -ra allowed_actors <<< "${AUTHORIZED_FOUNDER_ACTORS:-}"
          for allowed_actor in "${allowed_actors[@]}"; do
            allowed_actor="$(printf '%s' "$allowed_actor" | xargs)"
            if [[ -n "$allowed_actor" && "$GITHUB_ACTOR" == "$allowed_actor" ]]; then authorized_actor=true; fi
          done
          if [[ "$authorized_actor" != "true" ]]; then
            echo "::error::The current actor is not in AUTHORIZED_FOUNDER_ACTORS."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::expected_commit_sha must equal the current full main SHA."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "PUBLISH_OPERATIONAL_APPLICATION_EVIDENCE" ]]; then
            echo "::error::Application evidence confirmation phrase mismatch."
            exit 1
          fi
          case "$SELECTED_GATE" in
            all|ownerPaymentActivation|paymentUnlockExactlyOnce|tenantNotificationDelivery|brokerCommissionLockExactlyOnce|adminStaffClaims|renewalScheduler) ;;
            *)
              echo "::error::Unsupported application gate."
              exit 1
              ;;
          esac

      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Auto-discover, verify, and publish application evidence
        env:
          SELECTED_GATE: ${{ inputs.gate }}
        run: |
          set -euo pipefail
          if [[ "$SELECTED_GATE" == "all" ]]; then
            gates=(
              ownerPaymentActivation
              paymentUnlockExactlyOnce
              tenantNotificationDelivery
              brokerCommissionLockExactlyOnce
              adminStaffClaims
              renewalScheduler
            )
          else
            gates=("$SELECTED_GATE")
          fi

          mkdir -p launch_package/application-proofs
          for gate in "${gates[@]}"; do
            echo "::group::Verify and publish ${gate}"
            OPERATIONAL_GATE="$gate" node scripts/verify-operational-application-evidence.mjs
            OPERATIONAL_GATE="$gate" node scripts/publish-operational-application-evidence.mjs
            cp launch_package/application-proof.json "launch_package/application-proofs/${gate}.json"
            echo "::endgroup::"
          done

      - name: Upload application proof batch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: operational-application-${{ inputs.gate }}-${{ inputs.expected_commit_sha }}
          path: |
            launch_package/application-proof.json
            launch_package/application-proofs
          if-no-files-found: error
          retention-days: 365
