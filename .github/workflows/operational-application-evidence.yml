name: Operational Application Evidence

on:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Application gate to verify and publish; all runs the complete application batch'
        required: true
        type: choice
        options:
          - all
          - ownerPaymentActivation
          - paymentUnlockExactlyOnce
          - tenantNotificationDelivery
          - brokerCommissionLockExactlyOnce
          - adminStaffClaims
          - renewalScheduler
      expected_commit_sha:
        description: 'Full lowercase current production main SHA'
        required: true
        type: string
      production_deploy_run_id:
        description: 'Successful Firebase Production Deploy run ID for the same exact SHA'
        required: true
        type: string
      confirmation:
        description: 'Enter PUBLISH_OPERATIONAL_APPLICATION_EVIDENCE'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: operational-application-evidence-${{ inputs.gate }}-${{ inputs.expected_commit_sha }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: hard-public-launch
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
      OPERATIONAL_GATE: ${{ inputs.gate }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
      PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}

    steps:
      - name: Enforce protected application evidence inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          SELECTED_GATE: ${{ inputs.gate }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Application evidence requires refs/heads/main."
            exit 1
          fi
          authorized_actor=false
          IFS=',' read -ra allowed_actors <<< "${AUTHORIZED_FOUNDER_ACTORS:-}"
          for allowed_actor in "${allowed_actors[@]}"; do
            allowed_actor="$(printf '%s' "$allowed_actor" | xargs)"
            if [[ -n "$allowed_actor" && "$GITHUB_ACTOR" == "$allowed_actor" ]]; then authorized_actor=true; fi
          done
          if [[ "$authorized_actor" != "true" ]]; then
            echo "::error::The current actor is not in AUTHORIZED_FOUNDER_ACTORS."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::expected_commit_sha must equal the current full main SHA."
            exit 1
          fi
          if [[ ! "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::production_deploy_run_id must be numeric."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "PUBLISH_OPERATIONAL_APPLICATION_EVIDENCE" ]]; then
            echo "::error::Application evidence confirmation phrase mismatch."
            exit 1
          fi
          case "$SELECTED_GATE" in
            all|ownerPaymentActivation|paymentUnlockExactlyOnce|tenantNotificationDelivery|brokerCommissionLockExactlyOnce|adminStaffClaims|renewalScheduler) ;;
            *)
              echo "::error::Unsupported application gate."
              exit 1
              ;;
          esac

      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify trusted production deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_commit_sha }}
        run: node scripts/verify-trusted-production-deploy-source.mjs

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Download exact production deployment metadata
        uses: actions/download-artifact@v4
        with:
          name: production-deployment-${{ inputs.expected_commit_sha }}
          path: downloaded-production
          run-id: ${{ inputs.production_deploy_run_id }}
          github-token: ${{ github.token }}

      - name: Restore and validate production deployment binding
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
        run: |
          set -euo pipefail
          source_file="$(find downloaded-production -type f -name production-deployment.json -print -quit)"
          if [[ -z "$source_file" ]]; then
            echo "::error::production-deployment.json was not found."
            exit 1
          fi
          mkdir -p launch_package
          cp "$source_file" launch_package/production-deployment.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const doc = JSON.parse(readFileSync('launch_package/production-deployment.json', 'utf8'));
          const expectedSha = process.env.TARGET_SHA;
          const deployRunId = process.env.DEPLOY_RUN_ID;
          const failures = [];
          if (doc.status !== 'passed') failures.push('deployment status is not passed');
          if (doc.projectId !== 'bin-group-57c60') failures.push('deployment project mismatch');
          if (doc.deployedCommitSha !== expectedSha) failures.push('deployment commit mismatch');
          if (String(doc.workflowRunId || '') !== deployRunId) failures.push('deployment run mismatch');
          if (doc.workflowRef !== 'refs/heads/main') failures.push('deployment ref mismatch');
          if (doc.repository !== process.env.GITHUB_REPOSITORY) failures.push('deployment repository mismatch');
          if (!/^sha256:[a-f0-9]{64}$/.test(String(doc.validatedArtifactDigest || '').toLowerCase())) failures.push('validated artifact digest is invalid');
          const deployedAt = Date.parse(String(doc.deployedAt || ''));
          if (!Number.isFinite(deployedAt)) failures.push('deployment timestamp is invalid');
          if (failures.length) {
            for (const failure of failures) console.error(`::error::${failure}`);
            process.exit(1);
          }
          NODE

      - name: Auto-discover, verify, and publish application evidence
        env:
          SELECTED_GATE: ${{ inputs.gate }}
          E2E_FOUNDER_EMAIL: ${{ secrets.E2E_FOUNDER_EMAIL }}
          E2E_FOUNDER_PASSWORD: ${{ secrets.E2E_FOUNDER_PASSWORD }}
          E2E_FOUNDER_TOTP_SECRET: ${{ secrets.E2E_FOUNDER_TOTP_SECRET }}
        run: |
          set -euo pipefail
          if [[ "$SELECTED_GATE" == "all" ]]; then
            gates=(
              ownerPaymentActivation
              paymentUnlockExactlyOnce
              tenantNotificationDelivery
              brokerCommissionLockExactlyOnce
              adminStaffClaims
              renewalScheduler
            )
          else
            gates=("$SELECTED_GATE")
          fi

          mkdir -p launch_package/application-proofs launch_package/application-provenance
          for gate in "${gates[@]}"; do
            echo "::group::Verify and publish ${gate}"
            OPERATIONAL_GATE="$gate" node scripts/verify-operational-application-provenance.mjs
            OPERATIONAL_GATE="$gate" node scripts/verify-operational-application-evidence-mfa.mjs
            OPERATIONAL_GATE="$gate" node scripts/bind-operational-application-provenance.mjs
            OPERATIONAL_GATE="$gate" node scripts/publish-operational-application-evidence.mjs
            cp launch_package/application-proof.json "launch_package/application-proofs/${gate}.json"
            cp launch_package/application-provenance.json "launch_package/application-provenance/${gate}.json"
            echo "::endgroup::"
          done

      - name: Upload application proof batch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: operational-application-${{ inputs.gate }}-${{ inputs.expected_commit_sha }}
          path: |
            launch_package/trusted-production-deploy-source.json
            launch_package/production-deployment.json
            launch_package/application-proof.json
            launch_package/application-provenance.json
            launch_package/application-proofs
            launch_package/application-provenance
          if-no-files-found: error
          retention-days: 365
