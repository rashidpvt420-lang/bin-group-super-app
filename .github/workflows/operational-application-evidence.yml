name: Operational Application Evidence

on:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Application gate to verify and publish'
        required: true
        type: choice
        options:
          - ownerPaymentActivation
          - paymentUnlockExactlyOnce
          - tenantNotificationDelivery
          - brokerCommissionLockExactlyOnce
          - adminStaffClaims
          - renewalScheduler
      expected_commit_sha:
        description: 'Full lowercase current production main SHA'
        required: true
        type: string
      confirmation:
        description: 'Enter PUBLISH_OPERATIONAL_APPLICATION_EVIDENCE'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: operational-application-evidence-${{ inputs.gate }}-${{ inputs.expected_commit_sha }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hard-public-launch
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      OPERATIONAL_GATE: ${{ inputs.gate }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}

    steps:
      - name: Enforce protected application evidence inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          SELECTED_GATE: ${{ inputs.gate }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]] || [[ "$GITHUB_ACTOR" != "rashidpvt420-lang" ]]; then
            echo "::error::Application evidence requires the authorized founder on refs/heads/main."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::expected_commit_sha must equal the current full main SHA."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "PUBLISH_OPERATIONAL_APPLICATION_EVIDENCE" ]]; then
            echo "::error::Application evidence confirmation phrase mismatch."
            exit 1
          fi
          case "$SELECTED_GATE" in
            ownerPaymentActivation|paymentUnlockExactlyOnce|tenantNotificationDelivery|brokerCommissionLockExactlyOnce|adminStaffClaims|renewalScheduler) ;;
            *)
              echo "::error::Unsupported application gate."
              exit 1
              ;;
          esac

      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Auto-discover and verify production application evidence
        run: node scripts/verify-operational-application-evidence.mjs

      - name: Publish canonical application evidence
        run: node scripts/publish-operational-application-evidence.mjs

      - name: Upload application proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: operational-application-${{ inputs.gate }}-${{ inputs.expected_commit_sha }}
          path: launch_package/application-${{ inputs.gate }}.json
          if-no-files-found: error
          retention-days: 365
