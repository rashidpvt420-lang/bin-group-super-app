name: Apply Current Main Map GPS Client Hardening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/client-map-gps-hardening.yml
      - .github/scripts/apply-client-map-gps-hardening.py

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/map-gps-client-hardening-current-main' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/map-gps-client-hardening-current-main
          fetch-depth: 0
      - name: Apply deterministic client map and GPS hardening
        run: python .github/scripts/apply-client-map-gps-hardening.py
      - name: Commit reviewed changes and remove one-off patch machinery
        run: |
          set -euo pipefail
          git rm .github/scripts/apply-client-map-gps-hardening.py .github/workflows/client-map-gps-hardening.yml
          git add apps/admin-panel/src/pages/map/LiveMapPage.tsx src/components/PortalSessionControls.tsx src/utils/liveTracking.ts tests/launch/map-gps-state-behavior.test.mjs tests/launch/maps-gps-product-truth.test.mjs
          git diff --cached --quiet && { echo '::error::Client map/GPS hardening produced no changes.'; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(map-gps): preserve viewport and minimize retry exposure'
          git push origin HEAD:fix/map-gps-client-hardening-current-main
