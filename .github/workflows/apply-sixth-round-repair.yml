name: Apply sixth-round production evidence repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/sixth-round-repair.py
      - .github/workflows/apply-sixth-round-repair.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-sixth-round-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply exact reviewed sixth-round repair
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.ref == 'agent/repair-sixth-round-business-evidence-20260806' &&
      github.event.pull_request.title == 'Repair sixth-round live production business evidence failures'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic source transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/sixth-round-repair.py
          git rm .github/sixth-round-repair.py .github/workflows/apply-sixth-round-repair.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(production): repair sixth-round business evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
