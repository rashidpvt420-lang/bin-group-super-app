name: Five Profile and Onboarding Audit

on:
  pull_request:
    paths:
      - '.github/workflows/five-profile-onboarding-audit.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'TESTING.md'
      - 'LAUNCH_READINESS_AUDIT.md'
      - 'FIVE_PROFILE_ONBOARDING_AUDIT.md'
      - 'docs/RELEASE_BLOCKERS.md'
      - 'docs/FULL_FIVE_PROFILE_AUDIT.md'
      - 'docs/PROPERTY_ONBOARDING_AUDIT.md'
      - 'docs/POST_LAUNCH_MONITORING.md'
      - 'apps/admin-panel/src/**'
      - 'functions/**'
      - 'scripts/optimize-current-main-technician-ticket-rule.mjs'
      - 'scripts/windows-ai-live-recovery.ps1'
      - 'src/App.tsx'
      - 'src/admin/**'
      - 'src/broker/**'
      - 'src/components/onboarding/**'
      - 'src/context/LanguageContext.tsx'
      - 'src/context/RoleContext.tsx'
      - 'src/lib/onboardingStateMachine.ts'
      - 'src/owner/**'
      - 'src/pages/PropertyOnboardingPage.tsx'
      - 'src/store/onboardingStore.ts'
      - 'src/technician/**'
      - 'src/tenant/**'
      - 'src/utils/geoAnchor.ts'
      - 'tests/launch/arabic-visible-copy-audit.test.mjs'
      - 'tests/launch/canonical-readiness-docs.test.mjs'
      - 'tests/launch/five-profile-completeness-audit.test.mjs'
      - 'tests/launch/owner-property-proof-authority-audit.test.mjs'
      - 'tests/launch/profile-lifecycle-commercial-audit.test.mjs'
      - 'tests/launch/technician-dispatch-authority-audit.test.mjs'
      - 'tests/launch/tenant-readiness-authority-audit.test.mjs'
      - 'tests/launch/windows-ai-recovery-deploy-guard.test.mjs'
  push:
    branches:
      - main
      - 'agent/five-profile-onboarding-hardening'
      - 'agent/profile-readiness-authority-hardening'

permissions:
  contents: read

concurrency:
  group: five-profile-onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused launch audits
        run: >-
          node --test
          tests/launch/five-profile-completeness-audit.test.mjs
          tests/launch/profile-lifecycle-commercial-audit.test.mjs
          tests/launch/arabic-visible-copy-audit.test.mjs
          tests/launch/canonical-readiness-docs.test.mjs
          tests/launch/windows-ai-recovery-deploy-guard.test.mjs
          tests/launch/technician-dispatch-authority-audit.test.mjs
          tests/launch/owner-property-proof-authority-audit.test.mjs
          tests/launch/tenant-readiness-authority-audit.test.mjs

      - name: Build main application
        run: npm run build

      - name: Build dedicated Admin application
        id: build_admin
        shell: bash
        env:
          CI: false
        run: |
          set +e
          npm run build:admin > admin-build-output.txt 2>&1
          status=$?
          cat admin-build-output.txt
          exit $status

      - name: Upload Admin build diagnostics
        if: failure() && steps.build_admin.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: five-profile-admin-build-diagnostics-${{ github.sha }}
          path: admin-build-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Build Cloud Functions
        run: npm run build:functions
