name: Five Profile and Onboarding Audit

on:
  pull_request:
    paths:
      - '.github/workflows/five-profile-onboarding-audit.yml'
      - '.github/workflows/admin-mfa-recovery-deploy.yml'
      - '.github/workflows/privileged-account-cleanup-dry-run.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'TESTING.md'
      - 'LAUNCH_READINESS_AUDIT.md'
      - 'FIVE_PROFILE_ONBOARDING_AUDIT.md'
      - 'ADMIN_COMMAND_CENTER.md'
      - 'DEPLOY.md'
      - 'docs/DEPLOYMENT.md'
      - 'docs/RELEASE_BLOCKERS.md'
      - 'docs/FULL_FIVE_PROFILE_AUDIT.md'
      - 'docs/PROPERTY_ONBOARDING_AUDIT.md'
      - 'docs/POST_LAUNCH_MONITORING.md'
      - 'apps/admin-panel/src/**'
      - 'functions/**'
      - 'packages/shared/src/**'
      - 'scripts/deploy-firebase-production.mjs'
      - 'scripts/delete-obsolete-privileged-accounts-production.mjs'
      - 'scripts/ensure-admin-mfa-authorized-domains.mjs'
      - 'scripts/grant-admin.mjs'
      - 'scripts/harden-hr-privacy-rules.mjs'
      - 'scripts/optimize-current-main-technician-ticket-rule.mjs'
      - 'scripts/setup-ai-secrets.ps1'
      - 'scripts/verify-admin-access.mjs'
      - 'scripts/verify-firebase-production-secrets.mjs'
      - 'scripts/windows-ai-live-recovery.ps1'
      - 'src/App.tsx'
      - 'src/admin/**'
      - 'src/broker/**'
      - 'src/components/onboarding/**'
      - 'src/context/LanguageContext.tsx'
      - 'src/context/RoleContext.tsx'
      - 'src/lib/onboardingStateMachine.ts'
      - 'src/owner/**'
      - 'src/pages/PropertyOnboardingPage.tsx'
      - 'src/store/onboardingStore.ts'
      - 'src/technician/**'
      - 'src/tenant/**'
      - 'src/utils/geoAnchor.ts'
      - 'tests/launch/admin-mfa-recovery-deployment.test.mjs'
      - 'tests/launch/admin-property-review-authority.test.mjs'
      - 'tests/launch/admin-staff-invitation-provisioning.test.mjs'
      - 'tests/launch/staff-provisioning-fail-closed.test.mjs'
      - 'tests/launch/ai-secret-setup-deploy-guard.test.mjs'
      - 'tests/launch/arabic-visible-copy-audit.test.mjs'
      - 'tests/launch/canonical-readiness-docs.test.mjs'
      - 'tests/launch/five-profile-completeness-audit.test.mjs'
      - 'tests/launch/owner-property-proof-authority-audit.test.mjs'
      - 'tests/launch/privileged-account-cleanup-dry-run.test.mjs'
      - 'tests/launch/profile-lifecycle-commercial-audit.test.mjs'
      - 'tests/launch/protected-admin-deployment-docs.test.mjs'
      - 'tests/launch/technician-dispatch-authority-audit.test.mjs'
      - 'tests/launch/tenant-readiness-authority-audit.test.mjs'
      - 'tests/launch/windows-ai-recovery-deploy-guard.test.mjs'
  push:
    branches:
      - main
      - 'agent/five-profile-onboarding-hardening'
      - 'agent/profile-readiness-authority-hardening'

permissions:
  contents: read

concurrency:
  group: five-profile-onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        id: install_dependencies
        shell: bash
        run: |
          set +e
          npm ci > npm-ci-output.txt 2>&1
          status=$?
          cat npm-ci-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload dependency-install diagnostics
        if: steps.install_dependencies.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: five-profile-npm-ci-diagnostics-${{ github.sha }}
          path: npm-ci-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce dependency installation
        shell: bash
        run: |
          if [ "${{ steps.install_dependencies.outputs.status }}" != "0" ]; then
            echo "Frozen dependency installation failed. See the uploaded npm-ci diagnostic artifact."
            exit 1
          fi

      - name: Run focused launch audits
        run: >-
          node --test
          tests/launch/five-profile-completeness-audit.test.mjs
          tests/launch/profile-lifecycle-commercial-audit.test.mjs
          tests/launch/arabic-visible-copy-audit.test.mjs
          tests/launch/canonical-readiness-docs.test.mjs
          tests/launch/admin-mfa-recovery-deployment.test.mjs
          tests/launch/admin-property-review-authority.test.mjs
          tests/launch/admin-staff-invitation-provisioning.test.mjs
          tests/launch/staff-provisioning-fail-closed.test.mjs
          tests/launch/ai-secret-setup-deploy-guard.test.mjs
          tests/launch/windows-ai-recovery-deploy-guard.test.mjs
          tests/launch/protected-admin-deployment-docs.test.mjs
          tests/launch/privileged-account-cleanup-dry-run.test.mjs
          tests/launch/technician-dispatch-authority-audit.test.mjs
          tests/launch/owner-property-proof-authority-audit.test.mjs
          tests/launch/tenant-readiness-authority-audit.test.mjs

      - name: Build main application
        run: npm run build

      - name: Build dedicated Admin application
        id: build_admin
        shell: bash
        env:
          CI: false
        run: |
          set +e
          npm run build:admin > admin-build-output.txt 2>&1
          status=$?
          cat admin-build-output.txt
          exit $status

      - name: Upload Admin build diagnostics
        if: failure() && steps.build_admin.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: five-profile-admin-build-diagnostics-${{ github.sha }}
          path: admin-build-output.txt
          if-no-files-found: error

      - name: Build Cloud Functions
        run: npm run build:functions
