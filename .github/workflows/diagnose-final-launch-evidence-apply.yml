name: Diagnose Final Launch Evidence Apply

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/diagnose-final-launch-evidence-apply.yml
      - scripts/apply-final-launch-evidence-corrections.mjs
      - scripts/apply-final-launch-evidence-corrections.payload.mjs
      - scripts/fix-launch-evidence-test-contracts.mjs

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/finalize-launch-evidence-sequence' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-launch-evidence-sequence
          fetch-depth: 0
      - name: Extract embedded runtime patcher
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          const wrapper = readFileSync('scripts/apply-final-launch-evidence-corrections.payload.mjs', 'utf8');
          const match = wrapper.match(/const payload = '([^']+)'/);
          if (!match) throw new Error('Compressed launch evidence payload is missing.');
          writeFileSync('/tmp/final-launch-evidence-runtime.mjs', gunzipSync(Buffer.from(match[1], 'base64')));
          NODE
      - name: Capture patcher and staging result
        shell: bash
        run: |
          set +e
          {
            node scripts/apply-final-launch-evidence-corrections.mjs
            first=$?
            if [ "$first" -eq 0 ]; then
              node scripts/fix-launch-evidence-test-contracts.mjs
              second=$?
            else
              second=0
            fi
            printf 'apply_status=%s\ncontract_status=%s\n' "$first" "$second"

            if [ "$first" -eq 0 ] && [ "$second" -eq 0 ]; then
              git rm --ignore-unmatch -- \
                .github/workflows/apply-final-launch-evidence-corrections.yml \
                .github/workflows/diagnose-final-launch-evidence-apply.yml \
                scripts/apply-final-launch-evidence-corrections.mjs \
                scripts/apply-final-launch-evidence-corrections.payload.mjs \
                scripts/fix-launch-evidence-test-contracts.mjs
              git add -A
              printf '\n--- staged name/status ---\n'
              git diff --cached --name-status
              printf '\n--- worktree status ---\n'
              git status --short
              printf '\n--- staged diff check ---\n'
              git diff --cached --check
              stage_status=$?
            else
              stage_status=1
            fi
            printf 'stage_status=%s\n' "$stage_status"
            test "$first" -eq 0 -a "$second" -eq 0 -a "$stage_status" -eq 0
          } > /tmp/final-launch-evidence-apply.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/final-launch-evidence-apply.status
          cat /tmp/final-launch-evidence-apply.log
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: final-launch-evidence-apply-${{ github.sha }}
          path: |
            /tmp/final-launch-evidence-runtime.mjs
            /tmp/final-launch-evidence-apply.log
            /tmp/final-launch-evidence-apply.status
          if-no-files-found: error
          retention-days: 7
