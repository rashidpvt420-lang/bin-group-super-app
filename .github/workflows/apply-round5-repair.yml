name: Apply round-five production evidence repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/round5-repair.patch
      - .github/workflows/apply-round5-repair.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-round5-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply exact reviewed repair patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.ref == 'agent/repair-live-business-evidence-round-5-20260806' &&
      github.event.pull_request.title == 'Repair fifth-round live production business evidence failures'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact reviewed patch and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/round5-repair.patch
          git apply .github/round5-repair.patch
          git rm .github/round5-repair.patch .github/workflows/apply-round5-repair.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(production): repair fifth-round live business evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
