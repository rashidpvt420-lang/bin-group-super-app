name: Repair OTP Pepper Secret Access
run-name: Repair OTP pepper Secret Manager access · ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: repair-otp-pepper-secret-access-production
  cancel-in-progress: false

jobs:
  authorize-owner-command:
    name: Authorize exact owner access-repair command
    if: >-
      github.event.issue.number == 434 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/bin-launch repair-otp-pepper-secret-access' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.bind.outputs.authorized }}
      commit_sha: ${{ steps.bind.outputs.commit_sha }}
    steps:
      - name: Bind command to stable current main
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          first_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$second_sha" == "$first_sha" ]] || {
            echo '::error::main advanced during OTP pepper Secret Manager access-repair authorization.'
            exit 1
          }
          echo "commit_sha=$second_sha" >> "$GITHUB_OUTPUT"
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  repair-production-secret-access:
    name: Ensure deployment identity can access OTP peppers
    needs: authorize-owner-command
    if: needs.authorize-owner-command.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      GCP_PROJECT_ID: bin-group-57c60
      EXPECTED_COMMIT_SHA: ${{ needs.authorize-owner-command.outputs.commit_sha }}
      DEPLOYMENT_ENVIRONMENT: production
      DEPLOYMENT_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '434'
    steps:
      - name: Checkout exact authorized main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize-owner-command.outputs.commit_sha }}
          persist-credentials: false

      - name: Verify exact checkout binding
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          [[ "$checked_out_sha" == "$EXPECTED_COMMIT_SHA" ]] || {
            echo '::error::Checked-out SHA does not match authorized main.'
            exit 1
          }
          current_main="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$EXPECTED_COMMIT_SHA" ]] || {
            echo '::error::Current main advanced before OTP pepper Secret Manager access repair.'
            exit 1
          }
          echo "CHECKED_OUT_COMMIT_SHA=$checked_out_sha" >> "$GITHUB_ENV"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Authenticate Google Cloud by Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 416.0.0'
          project_id: bin-group-57c60

      - name: Ensure exact Secret Manager accessor bindings and validate values
        run: node scripts/repair-otp-pepper-secret-access.mjs

      - name: Reverify exact main after protected IAM repair
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$EXPECTED_COMMIT_SHA" ]] || {
            echo '::error::Current main advanced after OTP pepper Secret Manager access repair.'
            exit 1
          }

      - name: Upload sanitized access-repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: otp-pepper-secret-access-repair-${{ needs.authorize-owner-command.outputs.commit_sha }}
          path: launch_package/otp-pepper-secret-access-repair.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish sanitized access-repair result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence='launch_package/otp-pepper-secret-access-repair.json'
          [[ -f "$evidence" ]] || {
            echo '::error::Sanitized OTP pepper access-repair evidence is missing.'
            exit 1
          }
          status="$(jq -r '.status' "$evidence")"
          action="$(jq -r '.action // "none"' "$evidence")"
          failure_code="$(jq -r '.failureCode // empty' "$evidence")"
          body="## OTP pepper Secret Manager access repair\n\n- Exact main SHA: \`$EXPECTED_COMMIT_SHA\`\n- Status: \`$status\`\n- Action: \`$action\`\n- Scope: \`BROKER_PAYOUT_OTP_PEPPER\`, \`OWNER_CONTRACT_OTP_PEPPER\` only\n- Role: \`roles/secretmanager.secretAccessor\`\n- Secret values logged: \`false\`\n- Secret values persisted to runner disk: \`false\`\n- Hard-launch claim: \`false\`"
          if [[ -n "$failure_code" ]]; then
            body="$body\n- Failure code: \`$failure_code\`"
          fi
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
