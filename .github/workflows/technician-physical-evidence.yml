name: Technician Physical Evidence

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Full lowercase current production main SHA'
        required: true
        type: string
      production_deploy_run_id:
        description: 'Successful Firebase Production Deploy run ID for the same exact SHA'
        required: true
        type: string
      confirmation:
        description: 'Enter VERIFY_TECHNICIAN_PHYSICAL_EVIDENCE'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: technician-physical-evidence-${{ inputs.expected_commit_sha }}
  cancel-in-progress: false

jobs:
  verify-physical-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hard-launch-operations
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
      PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}

    steps:
      - name: Enforce protected physical-evidence inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Physical evidence requires refs/heads/main."
            exit 1
          fi
          authorized_actor=false
          IFS=',' read -ra allowed_actors <<< "${AUTHORIZED_FOUNDER_ACTORS:-}"
          for allowed_actor in "${allowed_actors[@]}"; do
            allowed_actor="$(printf '%s' "$allowed_actor" | xargs)"
            if [[ -n "$allowed_actor" && "$GITHUB_ACTOR" == "$allowed_actor" ]]; then authorized_actor=true; fi
          done
          if [[ "$authorized_actor" != "true" ]]; then
            echo "::error::The current actor is not in AUTHORIZED_FOUNDER_ACTORS."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::expected_commit_sha must equal the current full main SHA."
            exit 1
          fi
          if [[ ! "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::production_deploy_run_id must be numeric."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "VERIFY_TECHNICIAN_PHYSICAL_EVIDENCE" ]]; then
            echo "::error::Physical evidence confirmation phrase mismatch."
            exit 1
          fi

      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify trusted production deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_commit_sha }}
        run: node scripts/verify-trusted-production-deploy-source.mjs

      - name: Download exact production deployment metadata
        uses: actions/download-artifact@v4
        with:
          name: production-deployment-${{ inputs.expected_commit_sha }}
          path: downloaded-production
          run-id: ${{ inputs.production_deploy_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact production deployment binding
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          source_file="$(find downloaded-production -type f -name production-deployment.json -print -quit)"
          if [[ -z "$source_file" ]]; then
            echo "::error::production-deployment.json was not found."
            exit 1
          fi
          mkdir -p launch_package
          cp "$source_file" launch_package/production-deployment.json
          node scripts/verify-exact-production-deployment-artifact.mjs

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Verify real physical technician mission
        run: node scripts/verify-technician-physical-evidence.mjs

      - name: Publish canonical technician operational evidence
        run: node scripts/publish-direct-operational-proof.mjs

      - name: Upload physical-device proof
        uses: actions/upload-artifact@v4
        with:
          name: technician-physical-evidence-${{ inputs.expected_commit_sha }}
          path: |
            launch_package/trusted-production-deploy-source.json
            launch_package/production-deployment.json
            launch_package/operational-proof.json
          if-no-files-found: error
          retention-days: 365
