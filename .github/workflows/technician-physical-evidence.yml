name: Technician Physical Evidence

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Full lowercase current control-plane main SHA'
        required: true
        type: string
      frozen_release_sha:
        description: 'Full lowercase frozen production release SHA'
        required: true
        type: string
      production_deploy_run_id:
        description: 'Successful production deploy run ID for the frozen release SHA'
        required: true
        type: string
      confirmation:
        description: 'Enter VERIFY_TECHNICIAN_PHYSICAL_EVIDENCE'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: technician-physical-evidence-${{ github.event_name }}-${{ inputs.frozen_release_sha || github.event.issue.number || 'none' }}-${{ inputs.expected_commit_sha || github.event.comment.id || github.sha }}
  cancel-in-progress: false

jobs:
  owner-evidence-dispatch-bridge:
    name: Dispatch protected launch evidence from owner command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 434 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/bin-launch evidence ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMAND_BODY: ${{ github.event.comment.body }}
      EXPECTED_REPOSITORY: rashidpvt420-lang/bin-group-super-app
      EXPECTED_REPOSITORY_ID: '1173943093'
      FROZEN_RELEASE_SHA: 15b09519222e749808c2a18b5d1ab1c3126fcb42
      FROZEN_DEPLOY_RUN_ID: '34500748478'
      FROZEN_LIVE_EVIDENCE_RUN_ID: '34515320876'
    steps:
      - name: Validate exact owner command and current main
        id: command
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$GITHUB_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]

          read -r command namespace target control_sha frozen_sha source_run_id extra <<< "$COMMAND_BODY"
          [[ "$command" == "/bin-launch" && "$namespace" == "evidence" ]]
          [[ -z "${extra:-}" ]]
          [[ "$control_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$frozen_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          [[ "$COMMAND_BODY" == "/bin-launch evidence $target $control_sha $frozen_sha $source_run_id" ]]

          validate_production_run() {
            local run_json
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id")"
            [[ "$(jq -r '.name' <<<"$run_json")" == "Firebase Production Deploy" ]]
            [[ "$(jq -r '.status' <<<"$run_json")" == "completed" ]]
            [[ "$(jq -r '.conclusion' <<<"$run_json")" == "success" ]]
            [[ "$(jq -r '.head_branch' <<<"$run_json")" == "main" ]]
            [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$frozen_sha" ]]
            [[ "$(jq -r '.event' <<<"$run_json")" == "workflow_dispatch" ]]
          }

          validate_live_evidence_run() {
            local run_json artifacts expected_artifact
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id")"
            [[ "$(jq -r '.name' <<<"$run_json")" == "Live Role Smoke Tests" ]]
            [[ "$(jq -r '.status' <<<"$run_json")" == "completed" ]]
            [[ "$(jq -r '.conclusion' <<<"$run_json")" == "success" ]]
            [[ "$(jq -r '.head_branch' <<<"$run_json")" == "main" ]]
            [[ "$(jq -r '.event' <<<"$run_json")" == "workflow_dispatch" ]]
            expected_artifact="live-launch-evidence-$frozen_sha"
            artifacts="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100" | jq -ce '{artifacts:[.[].artifacts[]]}')"
            jq -e --arg expected "$expected_artifact" '[.artifacts[] | select(.name == $expected and .expired == false)] | length == 1' <<<"$artifacts" >/dev/null
          }

          case "$target" in
            application-all|provider-baseline|provider-ai|privileged-rotation|technician)
              [[ "$frozen_sha" == "$FROZEN_RELEASE_SHA" ]]
              [[ "$source_run_id" == "$FROZEN_DEPLOY_RUN_ID" ]]
              ;;
            hard-clearance)
              [[ "$frozen_sha" == "$FROZEN_RELEASE_SHA" ]]
              [[ "$source_run_id" == "$FROZEN_LIVE_EVIDENCE_RUN_ID" ]]
              ;;
            application-current|provider-baseline-current|provider-ai-current|privileged-rotation-current|technician-current)
              validate_production_run
              ;;
            hard-clearance-current)
              validate_live_evidence_run
              ;;
            *)
              echo "::error::Unsupported owner evidence target: $target"
              exit 1
              ;;
          esac

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          [[ "$current_main" == "$control_sha" ]] || { echo "::error::Owner evidence command is stale: expected current main $control_sha, observed $current_main."; exit 1; }
          [[ "$GITHUB_SHA" == "$control_sha" ]] || { echo "::error::Issue-comment workflow SHA is not the commanded current main SHA."; exit 1; }

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "control_sha=$control_sha" >> "$GITHUB_OUTPUT"
          echo "frozen_sha=$frozen_sha" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact protected evidence workflow
        env:
          TARGET: ${{ steps.command.outputs.target }}
          CONTROL_SHA: ${{ steps.command.outputs.control_sha }}
          RELEASE_SHA: ${{ steps.command.outputs.frozen_sha }}
          SOURCE_RUN_ID: ${{ steps.command.outputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch() {
            local workflow="$1"
            local payload_file="$2"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              --input "$payload_file"
          }

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$CONTROL_SHA" ]] || { echo "::error::main advanced before protected evidence dispatch."; exit 1; }

          case "$TARGET" in
            application-all)
              jq -n \
                --arg ref main \
                --arg gate all \
                --arg operation verify \
                --arg control "$CONTROL_SHA" \
                --arg release "$RELEASE_SHA" \
                --arg deploy "$SOURCE_RUN_ID" \
                '{ref:$ref,inputs:{gate:$gate,founder_totp_operation:$operation,expected_commit_sha:$control,frozen_release_sha:$release,production_deploy_run_id:$deploy,confirmation:"VERIFY_PRODUCTION_FOUNDER_TOTP"}}' \
                > dispatch.json
              dispatch operational-application-evidence.yml dispatch.json
              ;;
            application-current)
              jq -n \
                --arg ref main \
                --arg gate all \
                --arg operation none \
                --arg control "$CONTROL_SHA" \
                --arg release "$RELEASE_SHA" \
                --arg deploy "$SOURCE_RUN_ID" \
                '{ref:$ref,inputs:{gate:$gate,founder_totp_operation:$operation,expected_commit_sha:$control,frozen_release_sha:$release,production_deploy_run_id:$deploy,confirmation:"PUBLISH_OPERATIONAL_APPLICATION_EVIDENCE"}}' \
                > dispatch.json
              dispatch operational-application-evidence.yml dispatch.json
              ;;
            provider-baseline|provider-baseline-current)
              jq -n \
                --arg ref main \
                --arg control "$CONTROL_SHA" \
                --arg release "$RELEASE_SHA" \
                --arg deploy "$SOURCE_RUN_ID" \
                '{ref:$ref,inputs:{gate:"all-baseline",expected_commit_sha:$control,frozen_release_sha:$release,production_deploy_run_id:$deploy,stripe_checkout_session_id:"",stripe_webhook_event_id:"",confirmation:"PUBLISH_OPERATIONAL_PROVIDER_EVIDENCE"}}' \
                > dispatch.json
              dispatch operational-provider-evidence.yml dispatch.json
              ;;
            provider-ai|provider-ai-current)
              jq -n \
                --arg ref main \
                --arg control "$CONTROL_SHA" \
                --arg release "$RELEASE_SHA" \
                --arg deploy "$SOURCE_RUN_ID" \
                '{ref:$ref,inputs:{gate:"aiProviderHealth",expected_commit_sha:$control,frozen_release_sha:$release,production_deploy_run_id:$deploy,stripe_checkout_session_id:"",stripe_webhook_event_id:"",confirmation:"PUBLISH_OPERATIONAL_PROVIDER_EVIDENCE"}}' \
                > dispatch.json
              dispatch operational-provider-evidence.yml dispatch.json
              ;;
            privileged-rotation|privileged-rotation-current)
              jq -n \
                --arg ref main \
                --arg control "$CONTROL_SHA" \
                --arg release "$RELEASE_SHA" \
                --arg deploy "$SOURCE_RUN_ID" \
                '{ref:$ref,inputs:{expected_commit_sha:$control,frozen_release_sha:$release,production_deploy_run_id:$deploy,confirmation:"VERIFY_PRIVILEGED_ACCESS_ROTATION"}}' \
                > dispatch.json
              dispatch privileged-access-rotation-evidence.yml dispatch.json
              ;;
            technician|technician-current)
              jq -n \
                --arg ref main \
                --arg control "$CONTROL_SHA" \
                --arg release "$RELEASE_SHA" \
                --arg deploy "$SOURCE_RUN_ID" \
                '{ref:$ref,inputs:{expected_commit_sha:$control,frozen_release_sha:$release,production_deploy_run_id:$deploy,confirmation:"VERIFY_TECHNICIAN_PHYSICAL_EVIDENCE"}}' \
                > dispatch.json
              dispatch technician-physical-evidence.yml dispatch.json
              ;;
            hard-clearance)
              clearance_payload='{"confirmation":"AUTHORIZE_HARD_PUBLIC_LAUNCH_BIN_GROUP","incident_confirmation":"NO_OPEN_P0_P1","rollback_confirmation":"ROLLBACK_PLAN_VERIFIED","open_p0":"0","open_p1":"0","incident_reference":"https://github.com/rashidpvt420-lang/bin-group-super-app/actions/runs/34515320876","rollback_reference":"https://github.com/rashidpvt420-lang/bin-group-super-app/actions/runs/34500748478","monitoring_reference":"https://github.com/rashidpvt420-lang/bin-group-super-app/issues/1166"}'
              jq -n \
                --arg ref main \
                --arg release "$RELEASE_SHA" \
                --arg live "$SOURCE_RUN_ID" \
                --arg payload "$clearance_payload" \
                '{ref:$ref,inputs:{mode:"hard-clearance",expected_commit_sha:$release,production_deploy_run_id:"",live_evidence_run_id:$live,clearance_payload_json:$payload}}' \
                > dispatch.json
              dispatch live-role-smoke.yml dispatch.json
              ;;
            hard-clearance-current)
              expected_artifact="live-launch-evidence-$RELEASE_SHA"
              artifacts="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" | jq -ce '{artifacts:[.[].artifacts[]]}')"
              artifact_id="$(jq -r --arg expected "$expected_artifact" '[.artifacts[] | select(.name == $expected and .expired == false)] | if length == 1 then .[0].id else empty end' <<<"$artifacts")"
              [[ "$artifact_id" =~ ^[0-9]+$ ]] || { echo "::error::Expected exactly one non-expired $expected_artifact artifact."; exit 1; }
              rm -rf current-live-evidence current-live-evidence.zip
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > current-live-evidence.zip
              mkdir -p current-live-evidence
              unzip -q current-live-evidence.zip -d current-live-evidence
              mapfile -t deployment_files < <(find current-live-evidence -type f -name production-deployment.json)
              [[ "${#deployment_files[@]}" == "1" ]] || { echo "::error::Expected exactly one production-deployment.json in live evidence."; exit 1; }
              deploy_run_id="$(jq -er --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" '
                select(.status == "passed") |
                select(.deployedCommitSha == $sha) |
                select(.workflowRef == "refs/heads/main") |
                select(.repository == $repo) |
                .workflowRunId | tostring | select(test("^[0-9]+$"))
              ' "${deployment_files[0]}")"
              clearance_payload="$(jq -cn \
                --arg incident "https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
                --arg rollback "https://github.com/$GITHUB_REPOSITORY/actions/runs/$deploy_run_id" \
                '{confirmation:"AUTHORIZE_HARD_PUBLIC_LAUNCH_BIN_GROUP",incident_confirmation:"NO_OPEN_P0_P1",rollback_confirmation:"ROLLBACK_PLAN_VERIFIED",open_p0:"0",open_p1:"0",incident_reference:$incident,rollback_reference:$rollback,monitoring_reference:"https://github.com/rashidpvt420-lang/bin-group-super-app/issues/1166"}')"
              jq -n \
                --arg ref main \
                --arg release "$RELEASE_SHA" \
                --arg live "$SOURCE_RUN_ID" \
                --arg payload "$clearance_payload" \
                '{ref:$ref,inputs:{mode:"hard-clearance",expected_commit_sha:$release,production_deploy_run_id:"",live_evidence_run_id:$live,clearance_payload_json:$payload}}' \
                > dispatch.json
              dispatch live-role-smoke.yml dispatch.json
              rm -rf current-live-evidence current-live-evidence.zip
              ;;
          esac

          rm -f dispatch.json
          echo "[owner-evidence-dispatch] PASS target=$TARGET control=$CONTROL_SHA release=$RELEASE_SHA sourceRun=$SOURCE_RUN_ID"

  verify-physical-evidence:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hard-launch-operations
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
      PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
      PRODUCTION_RELEASE_SHA: ${{ inputs.frozen_release_sha }}
      CONTROL_PLANE_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Enforce protected physical-evidence inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          RELEASE_SHA: ${{ inputs.frozen_release_sha }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Physical evidence requires refs/heads/main."
            exit 1
          fi
          authorized_actor=false
          IFS=',' read -ra allowed_actors <<< "${AUTHORIZED_FOUNDER_ACTORS:-}"
          for allowed_actor in "${allowed_actors[@]}"; do
            allowed_actor="$(printf '%s' "$allowed_actor" | xargs)"
            if [[ -n "$allowed_actor" && "$GITHUB_ACTOR" == "$allowed_actor" ]]; then authorized_actor=true; fi
          done
          if [[ "$authorized_actor" != "true" ]]; then
            echo "::error::The current actor is not in AUTHORIZED_FOUNDER_ACTORS."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::expected_commit_sha must equal the current full control-plane main SHA."
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Frozen release SHA and numeric production deploy run ID are required."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "VERIFY_TECHNICIAN_PHYSICAL_EVIDENCE" ]]; then
            echo "::error::Physical evidence confirmation phrase mismatch."
            exit 1
          fi

      - name: Checkout clearance control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control-plane
          fetch-depth: 0

      - name: Verify frozen-release control-plane scope
        env:
          RELEASE_SHA: ${{ inputs.frozen_release_sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C control-plane merge-base --is-ancestor "$RELEASE_SHA" "$CONTROL_PLANE_SHA" || { echo "::error::Frozen release is not an ancestor of the current control plane."; exit 1; }
          changed="$(git -C control-plane diff --name-only "$RELEASE_SHA" "$CONTROL_PLANE_SHA")"
          if [[ -z "$changed" ]]; then
            [[ "$RELEASE_SHA" == "$CONTROL_PLANE_SHA" ]] || {
              echo "::error::Empty control-plane delta is only valid for an exact same-SHA pair."
              exit 1
            }
            echo "Exact same-SHA release/control-plane pair verified."
          else
            allowed='^(\.github/workflows/firebase-production-deploy\.yml|\.github/workflows/live-role-smoke\.yml|\.github/workflows/operational-application-evidence\.yml|\.github/workflows/operational-provider-evidence\.yml|\.github/workflows/privileged-access-rotation-evidence\.yml|\.github/workflows/technician-physical-evidence\.yml|scripts/finalize-operational-provider-evidence\.mjs|scripts/hard-clearance-production-revalidation\.mjs|scripts/launch-status\.mjs|scripts/publish-direct-operational-proof\.mjs|scripts/publish-operational-application-evidence\.mjs|scripts/publish-operational-provider-evidence\.mjs|scripts/resolve-admin-app-check-site-key\.mjs|scripts/run-frozen-release-evidence\.mjs|scripts/verify-hard-launch-approval\.mjs|scripts/verify-operational-readiness\.mjs|tests/launch/ai-operational-contract\.test\.mjs|tests/launch/external-gate-production-provenance\.test\.mjs|tests/launch/final-operational-evidence-producers\.test\.mjs|tests/launch/hard-clearance-revalidation\.test\.mjs|tests/launch/operational-application-evidence-audit\.test\.mjs)$'
            while IFS= read -r file; do
              [[ -z "$file" || "$file" =~ $allowed ]] || { echo "::error::Non-control-plane file changed since frozen release: $file"; exit 1; }
            done <<< "$changed"
          fi
          echo "CONTROL_PLANE_SCOPE_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Checkout frozen production release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.frozen_release_sha }}
          path: release

      - name: Overlay reviewed dual-SHA publisher only
        run: cp control-plane/scripts/publish-direct-operational-proof.mjs release/scripts/publish-direct-operational-proof.mjs

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        working-directory: release
        run: bash scripts/npm-install-retry.sh

      - name: Download exact production deployment metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-deployment-${{ inputs.frozen_release_sha }}
          path: release/downloaded-production
          run-id: ${{ inputs.production_deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact production deployment binding
        working-directory: release
        env:
          RELEASE_SHA: ${{ inputs.frozen_release_sha }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
        run: |
          set -euo pipefail
          source_file="$(find downloaded-production -type f -name production-deployment.json -print -quit)"
          [[ -n "$source_file" ]] || { echo "::error::production-deployment.json was not found."; exit 1; }
          mkdir -p launch_package
          cp "$source_file" launch_package/production-deployment.json
          node --input-type=module - "$source_file" <<'NODE'
          import { readFileSync } from 'node:fs';
          const doc = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (doc.status !== 'passed' || doc.projectId !== 'bin-group-57c60') throw new Error('production deployment status/project mismatch');
          if (doc.deployedCommitSha !== process.env.RELEASE_SHA || String(doc.workflowRunId || '') !== process.env.DEPLOY_RUN_ID) throw new Error('production deployment SHA/run mismatch');
          if (doc.workflowRef !== 'refs/heads/main' || doc.repository !== process.env.GITHUB_REPOSITORY) throw new Error('production deployment repository/ref mismatch');
          if (!/^sha256:[a-f0-9]{64}$/.test(String(doc.validatedArtifactDigest || '').toLowerCase())) throw new Error('validated production artifact digest is invalid');
          NODE

      - name: Verify real physical technician mission
        working-directory: release
        run: node ../control-plane/scripts/run-frozen-release-evidence.mjs scripts/verify-technician-physical-evidence.mjs

      - name: Publish canonical technician operational evidence
        working-directory: release
        run: node scripts/publish-direct-operational-proof.mjs

      - name: Upload physical-device proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: technician-physical-evidence-${{ inputs.frozen_release_sha }}
          path: release/launch_package/operational-proof.json
          if-no-files-found: error
          retention-days: 365
