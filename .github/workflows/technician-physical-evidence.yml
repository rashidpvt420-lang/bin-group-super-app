name: Technician Physical Evidence

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Full lowercase current production main SHA'
        required: true
        type: string
      confirmation:
        description: 'Enter VERIFY_TECHNICIAN_PHYSICAL_EVIDENCE'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: technician-physical-evidence-${{ inputs.expected_commit_sha }}
  cancel-in-progress: false

jobs:
  verify-physical-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hard-launch-operations
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}

    steps:
      - name: Enforce protected physical-evidence inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]] || [[ "$GITHUB_ACTOR" != "rashidpvt420-lang" ]]; then
            echo "::error::Physical evidence requires the authorized founder on refs/heads/main."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::expected_commit_sha must equal the current full main SHA."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "VERIFY_TECHNICIAN_PHYSICAL_EVIDENCE" ]]; then
            echo "::error::Physical evidence confirmation phrase mismatch."
            exit 1
          fi

      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Verify real physical technician mission
        run: node scripts/verify-technician-physical-evidence.mjs

      - name: Upload physical-device proof
        uses: actions/upload-artifact@v4
        with:
          name: technician-physical-evidence-${{ inputs.expected_commit_sha }}
          path: launch_package/operational-proof.json
          if-no-files-found: error
          retention-days: 365
