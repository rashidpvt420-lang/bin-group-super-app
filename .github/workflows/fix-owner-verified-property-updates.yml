name: Fix Verified Owner Property Updates

on:
  push:
    branches:
      - agent/property-geo-server-authority
    paths:
      - .github/workflows/fix-owner-verified-property-updates.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/fix-owner-verified-property-updates.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-test-clean:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.actor == github.repository_owner &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/agent/property-geo-server-authority') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/property-geo-server-authority'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact property authority branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/property-geo-server-authority
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Separate create-time canonical prohibition from update-time immutability
        run: python .github/scripts/fix-owner-verified-property-updates.py

      - name: Capture canonical submission and promotion contract
        id: canonical_contract
        continue-on-error: true
        run: |
          set +e
          node --test --test-name-pattern="canonical property geo is server-authoritative" tests/launch/property-geo-authority.test.mjs > owner-geo-contract-output.txt 2>&1
          status=$?
          cat owner-geo-contract-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload canonical geo contract diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-geo-contract-${{ github.sha }}
          path: owner-geo-contract-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Enforce canonical submission and promotion contract
        run: test "${{ steps.canonical_contract.outputs.status }}" = "0"

      - name: Validate ordinary Owner updates after verification
        run: node --test --test-name-pattern="verified properties keep ordinary Owner updates" tests/launch/property-geo-authority.test.mjs

      - name: Validate property geo catch-all contract
        run: node --test tests/launch/property-geo-catchall-authority.test.mjs

      - name: Validate final Firestore authority contract
        run: node --test tests/launch/firestore-final-authority.test.mjs

      - name: Prepare deterministic Firestore rules
        run: |
          set -euo pipefail
          npm run normalize:rule-tests
          npm run prepare:rules
          npm run verify:rules-hardening

      - name: Validate focused canonical property geo authority
        run: npx firebase emulators:exec --only firestore --project bin-group-57c60 "node --test --test-concurrency=1 test/property-geo-authority-rules.test.js"

      - name: Validate complete Firestore and Storage authority
        run: npx firebase emulators:exec --only firestore,storage --project bin-group-57c60 "node --test --test-concurrency=1 test/security-rules.test.js test/storage-rules.test.js"

      - name: Commit product changes and remove one-off machinery
        run: |
          set -euo pipefail
          git add \
            firestore.rules \
            test/property-geo-authority-rules.test.js \
            tests/launch/property-geo-authority.test.mjs
          git rm \
            .github/scripts/fix-owner-verified-property-updates.py \
            .github/workflows/fix-owner-verified-property-updates.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/fix-owner-verified-property-updates.py \
            .github/workflows/fix-owner-verified-property-updates.yml \
            firestore.rules \
            test/property-geo-authority-rules.test.js \
            tests/launch/property-geo-authority.test.mjs | sort)"
          [[ "$changed" == "$expected" ]] || {
            echo '::error::Verified Owner property update repair touched unexpected files.'
            printf 'Changed:\n%s\nExpected:\n%s\n' "$changed" "$expected"
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(properties): preserve ordinary Owner updates after geo verification'
          git push origin HEAD:agent/property-geo-server-authority
