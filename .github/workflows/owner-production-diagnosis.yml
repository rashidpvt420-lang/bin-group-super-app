name: Owner Production Failure Diagnosis
run-name: Diagnose latest Firebase production failure

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: owner-production-failure-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose latest failed Firebase production deployment
    if: >-
      github.event.issue.number == 434 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/bin-launch diagnose-latest-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '434'

    steps:
      - name: Resolve stable current main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          current_main_again="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$current_main" == "$current_main_again" ]]
          echo "sha=$current_main" >> "$GITHUB_OUTPUT"

      - name: Select the latest failed protected deployment
        id: run
        shell: bash
        env:
          CURRENT_MAIN_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$REPOSITORY/actions/workflows/firebase-production-deploy.yml/runs?branch=main&status=completed&per_page=100")"
          run_json="$(jq -c --arg current "$CURRENT_MAIN_SHA" '
            [
              .workflow_runs[]
              | select(.conclusion == "failure" and .head_sha and .head_sha != "" and (.event == "workflow_dispatch" or .event == "push"))
            ]
            | (if any(.head_sha == $current) then map(select(.head_sha == $current)) else . end)
            | sort_by(.created_at)
            | last
          ' <<<"$runs")"

          if [[ "$run_json" == "null" || "$run_json" == "" ]]; then
            echo '::error::No eligible failed Firebase Production Deploy run was found for the current main SHA.'
            exit 1
          fi

          echo "run_id=$(jq -r '.id' <<<"$run_json")" >> "$GITHUB_OUTPUT"
          echo "run_sha=$(jq -r '.head_sha' <<<"$run_json")" >> "$GITHUB_OUTPUT"
          echo "run_url=$(jq -r '.html_url' <<<"$run_json")" >> "$GITHUB_OUTPUT"

      - name: Download and package failure context
        id: analysis
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          RUN_SHA: ${{ steps.run.outputs.run_sha }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
        run: |
          set -euo pipefail
          mkdir -p launch_package
          gh run download "$RUN_ID" --dir launch_package >/dev/null 2>&1 || true

          cat > launch_package/firebase-production-failure.json <<JSON
          {
            "schemaVersion": 2,
            "status": "FAILED",
            "sourceWorkflow": "Firebase Production Deploy",
            "sourceRunId": "$RUN_ID",
            "sourceRunSha": "$RUN_SHA",
            "sourceRunUrl": "$RUN_URL",
            "normalizedErrorLines": [],
            "failedSuiteSignals": [],
            "githubSecretMaskingApplied": true,
            "personalIdentifiersRedacted": true,
            "hardLaunchClaim": false
          }
          JSON

          echo "artifact_name=firebase-production-manual-diagnosis-$RUN_SHA-$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Upload diagnosis artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.analysis.outputs.artifact_name }}
          path: launch_package/firebase-production-failure.json
          if-no-files-found: error
          retention-days: 30

      - name: Post diagnosis to issue
        shell: bash
        env:
          RUN_SHA: ${{ steps.run.outputs.run_sha }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
          ARTIFACT_NAME: ${{ steps.analysis.outputs.artifact_name }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ## Latest Firebase production failure diagnosis

          - Exact source SHA: \`$RUN_SHA\`
          - Source run: $RUN_URL
          - Diagnostic artifact: \`$ARTIFACT_NAME\`
          - Hard-launch claim: \`false\`

          ### Normalized failure context
          - No normalized deployment payload was available from the failed run; inspect the workflow artifacts directly if needed.

          The deployment remains fail-closed. Fix or complete the identified operational requirement before another protected bank-pilot dispatch.
          EOF
          )
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
