name: Owner Production Failure Diagnosis
run-name: Diagnose latest Firebase production failure

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: owner-production-failure-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose latest failed Firebase production deployment
    if: >-
      github.event.issue.number == 434 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == '/bin-launch diagnose-latest-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '434'

    steps:
      - name: Validate owner command authority
        shell: bash
        env:
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail
          [[ "$COMMENT_ACTOR" == "$REPOSITORY_OWNER" ]] || {
            echo "::error::Only the repository owner may run production diagnosis."
            exit 1
          }
          [[ "$COMMENT_BODY" == "/bin-launch diagnose-latest-deploy" ]] || {
            echo "::error::Production diagnosis command does not match the authorized command."
            exit 1
          }
          echo "Authorized owner command accepted (association=${COMMENT_ASSOCIATION:-unknown})."

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve stable current main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Unable to resolve the current main branch SHA.'
            exit 1
          }
          checkout_sha="$(git rev-parse HEAD)"
          [[ "$checkout_sha" == "$main_sha" ]] || {
            echo "::error::Checked-out SHA $checkout_sha does not match current main $main_sha."
            exit 1
          }
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Paginate and select the latest failed protected deployment
        id: run
        shell: bash
        env:
          CURRENT_MAIN_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          runs_json="$(
            gh api --paginate --slurp \
              "repos/$REPOSITORY/actions/workflows/firebase-production-deploy.yml/runs?event=workflow_dispatch&branch=main&status=completed&per_page=100" |
            jq -c '[.[].workflow_runs[]]'
          )"
          jq -e 'type == "array"' <<<"$runs_json" >/dev/null || {
            echo '::error::Paginated run result is malformed (expected JSON array).'
            exit 1
          }
          result="$(printf '%s' "$runs_json" | node scripts/select-production-diagnosis-run.mjs "$CURRENT_MAIN_SHA")" || {
            echo '::error::No completed failed Firebase Production Deploy run was found.'
            exit 1
          }
          run_id="$(jq -r '.runId' <<<"$result")"
          run_sha="$(jq -r '.runSha' <<<"$result")"
          run_url="$(jq -r '.runUrl' <<<"$result")"
          age_seconds="$(jq -r '.ageSeconds' <<<"$result")"
          matches_main="$(jq -r '.matchesCurrentMain' <<<"$result")"
          stale_evidence="$(jq -r '.staleEvidence' <<<"$result")"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo '::error::Missing run_id diagnostic metadata.'; exit 1; }
          [[ "$run_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Malformed run_sha diagnostic metadata: expected 40-char hex.'; exit 1; }
          [[ "$run_url" =~ ^https://github\.com/ ]] || { echo '::error::Malformed run_url diagnostic metadata: unexpected URL.'; exit 1; }
          [[ "$age_seconds" =~ ^[0-9]+$ ]] || { echo '::error::Malformed run age diagnostic metadata.'; exit 1; }
          [[ "$matches_main" =~ ^(true|false)$ ]] || { echo '::error::Malformed main-SHA match diagnostic metadata.'; exit 1; }
          [[ "$stale_evidence" =~ ^(true|false)$ ]] || { echo '::error::Malformed stale-evidence diagnostic metadata.'; exit 1; }
          if [[ "$stale_evidence" == "true" ]]; then
            echo "::warning::Source run is stale failure: $run_sha ($age_seconds seconds old)"
          fi
          echo "main_sha=$CURRENT_MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_sha=$run_sha" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "run_age_seconds=$age_seconds" >> "$GITHUB_OUTPUT"
          echo "run_matches_main_sha=$matches_main" >> "$GITHUB_OUTPUT"
          echo "run_is_stale=$stale_evidence" >> "$GITHUB_OUTPUT"

      - name: Collect and sanitize GitHub-masked failed-job logs
        env:
          SOURCE_RUN_ID: ${{ steps.run.outputs.run_id }}
          SOURCE_RUN_SHA: ${{ steps.run.outputs.run_sha }}
          SOURCE_RUN_MAIN_SHA: ${{ steps.run.outputs.main_sha }}
          SOURCE_RUN_AGE_SECONDS: ${{ steps.run.outputs.run_age_seconds }}
          SOURCE_RUN_MATCHES_MAIN_SHA: ${{ steps.run.outputs.run_matches_main_sha }}
          SOURCE_RUN_IS_STALE: ${{ steps.run.outputs.run_is_stale }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p launch_package
          jobs="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" | jq -c '{jobs: [.[].jobs[]]}')"
          jq -e '.jobs | any(.conclusion == "failure")' <<<"$jobs" >/dev/null || {
            echo '::error::Selected production run has no failed job.'
            exit 1
          }
          raw_log="$(mktemp)"
          trap 'rm -f "$raw_log"' EXIT
          mapfile -t failed_job_ids < <(jq -r '.jobs[] | select(.conclusion == "failure") | .id' <<<"$jobs")
          for job_id in "${failed_job_ids[@]}"; do
            [[ "$job_id" =~ ^[0-9]+$ ]]
            printf '\n===== FAILED JOB %s =====\n' "$job_id" >> "$raw_log"
            gh api "repos/$REPOSITORY/actions/jobs/$job_id/logs" >> "$raw_log"
          done
          test -s "$raw_log"
          node scripts/sanitize-production-diagnostic-log.mjs \
            "$raw_log" \
            launch_package/firebase-production-failure.log
          test -s launch_package/firebase-production-failure.log

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const requireEnv = (name, pattern) => {
            const value = String(process.env[name] || '').trim();
            if (!value) throw new Error(`Missing ${name} diagnostic metadata.`);
            if (pattern && !pattern.test(value)) throw new Error(`Malformed ${name} diagnostic metadata.`);
            return value;
          };

          const sourceRunId = requireEnv('SOURCE_RUN_ID', /^[0-9]+$/);
          const sourceRunSha = requireEnv('SOURCE_RUN_SHA', /^[0-9a-f]{40}$/);
          const resolvedMainSha = requireEnv('SOURCE_RUN_MAIN_SHA', /^[0-9a-f]{40}$/);
          const sourceRunAgeSeconds = requireEnv('SOURCE_RUN_AGE_SECONDS', /^[0-9]+$/);
          const sourceRunMatchesMainSha = requireEnv('SOURCE_RUN_MATCHES_MAIN_SHA', /^(true|false)$/);
          const sourceRunIsStale = requireEnv('SOURCE_RUN_IS_STALE', /^(true|false)$/);
          const sanitizedLog = readFileSync('launch_package/firebase-production-failure.log', 'utf8');
          const lines = sanitizedLog.split(/\r?\n/);
          const signal = /##\[error\]|\[production-deploy\]|\[deploy-verify\]|FirebaseError|admin[- ]mfa|multi[- ]factor|privileged|deployment (?:failed|stopped|blocked)|deploy failed|functions:|hosting:|firestore:|storage:|\[critical-evidence\]|business-(?:admin|owner|tenant|technician|broker|global)|tests\/e2e\/[^\s]+\.spec\.ts|playwright|error:|timeout|expect\(|locator|strict mode violation|unexpected|skipped=|failed=/i;
          const selectedIndexes = new Set();
          for (let index = 0; index < lines.length; index += 1) {
            if (!signal.test(lines[index])) continue;
            for (let offset = -3; offset <= 3; offset += 1) {
              const candidate = index + offset;
              if (candidate >= 0 && candidate < lines.length) selectedIndexes.add(candidate);
            }
          }
          const selected = [...selectedIndexes]
            .sort((a, b) => a - b)
            .map((index) => lines[index].slice(0, 900))
            .filter((line, index, all) => line && all.indexOf(line) === index)
            .slice(-120);
          const failedSuiteSignals = selected
            .filter((line) => /\[critical-evidence\].*(?:failed|not recorded)|business-(?:admin|owner|tenant|technician|broker|global)|tests\/e2e\/[^\s]+\.spec\.ts|\d+ failed/i.test(line))
            .slice(-30);
          const report = {
            schemaVersion: 4,
            status: 'FAILED',
            sourceWorkflow: 'Firebase Production Deploy',
            sourceRunId,
            sourceRunSha,
            resolvedMainSha,
            sourceRunAgeSeconds: Number.parseInt(sourceRunAgeSeconds, 10),
            sourceRunMatchesResolvedMainSha: sourceRunMatchesMainSha === 'true',
            sourceRunStaleFailureEvidence: sourceRunIsStale === 'true',
            normalizedErrorLines: selected,
            failedSuiteSignals,
            githubSecretMaskingApplied: true,
            personalIdentifiersRedacted: true,
            fullArtifactLogRedacted: true,
            rawJobLogUploaded: false,
            hardLaunchClaim: false,
            generatedAt: new Date().toISOString(),
          };
          writeFileSync('launch_package/firebase-production-failure.json', `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Upload safe diagnostic evidence
        uses: actions/upload-artifact@v7
        with:
          name: firebase-production-manual-diagnosis-${{ steps.run.outputs.run_sha }}-${{ steps.run.outputs.run_id }}
          path: |
            launch_package/firebase-production-failure.json
            launch_package/firebase-production-failure.log
          if-no-files-found: error
          retention-days: 30

      - name: Post normalized diagnosis to canonical pilot issue
        env:
          RESOLVED_MAIN_SHA: ${{ steps.run.outputs.main_sha }}
          SOURCE_RUN_ID: ${{ steps.run.outputs.run_id }}
          SOURCE_RUN_SHA: ${{ steps.run.outputs.run_sha }}
          SOURCE_RUN_URL: ${{ steps.run.outputs.run_url }}
          SOURCE_RUN_AGE_SECONDS: ${{ steps.run.outputs.run_age_seconds }}
          SOURCE_RUN_MATCHES_MAIN_SHA: ${{ steps.run.outputs.run_matches_main_sha }}
          SOURCE_RUN_IS_STALE: ${{ steps.run.outputs.run_is_stale }}
        shell: bash
        run: |
          set -euo pipefail
          errors="$(jq -r 'if (.normalizedErrorLines | length) == 0 then "- No normalized error line was found; inspect the redacted artifact." else (.normalizedErrorLines | map("- `" + . + "`") | join("\n")) end' launch_package/firebase-production-failure.json)"
          suites="$(jq -r 'if (.failedSuiteSignals | length) == 0 then "- No failed-suite signal was extracted; inspect the redacted artifact." else (.failedSuiteSignals | map("- `" + . + "`") | join("\n")) end' launch_package/firebase-production-failure.json)"
          artifact="firebase-production-manual-diagnosis-$SOURCE_RUN_SHA-$SOURCE_RUN_ID"
          body="## Latest Firebase production failure diagnosis

- Resolved origin/main SHA: \`$RESOLVED_MAIN_SHA\`
- Exact source SHA: \`$SOURCE_RUN_SHA\`
- Source run: $SOURCE_RUN_URL
- Source run matches resolved main SHA: \`$SOURCE_RUN_MATCHES_MAIN_SHA\`
- Source run age (seconds): \`$SOURCE_RUN_AGE_SECONDS\`
- Source run is stale failure: \`$SOURCE_RUN_IS_STALE\`
- Diagnostic artifact: \`$artifact\`
- Full artifact log redacted: \`true\`
- Raw job log uploaded: \`false\`
- Hard-launch claim: \`false\`

### Failed suite signals
$suites

### Normalized error lines
$errors

The deployment remains fail-closed. Fix or complete the identified operational requirement before another protected bank-pilot dispatch."
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
