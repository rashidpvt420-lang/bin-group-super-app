name: One-shot PR 866 Enterprise wiring repair

on:
  push:
    branches:
      - fix/admin-enterprise-appcheck-provider
    paths:
      - .github/workflows/repair-pr866-enterprise-wiring.yml
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/repair-pr866-enterprise-wiring.yml

permissions:
  contents: write

concurrency:
  group: repair-pr866-enterprise-wiring
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      (github.ref == 'refs/heads/fix/admin-enterprise-appcheck-provider' ||
       github.event.pull_request.head.ref == 'fix/admin-enterprise-appcheck-provider')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/admin-enterprise-appcheck-provider
          fetch-depth: 0

      - name: Patch only the remaining verified wiring and test-harness gaps
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/firebase-production-deploy.yml')
          text = workflow_path.read_text(encoding='utf-8')
          dollar = chr(36)

          def expression(name: str) -> str:
              return f"{dollar}{{{{ {name} }}}}"

          old_site = f"REACT_APP_APP_CHECK_SITE_KEY: {expression('secrets.VITE_APP_CHECK_SITE_KEY')}"
          new_site = f"REACT_APP_APP_CHECK_SITE_KEY: {expression('secrets.FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY')}"
          old_app_id = f"REACT_APP_FIREBASE_APP_ID: {expression('secrets.VITE_FIREBASE_APP_ID')}"
          new_app_id = "REACT_APP_ADMIN_FIREBASE_APP_ID: 1:123413252227:web:285cb53bc26626d699f3b6"
          top_level_public = f"  VITE_APP_CHECK_SITE_KEY: {expression('secrets.VITE_APP_CHECK_SITE_KEY')}\n  VITE_ENABLE_FIREBASE_APPCHECK: 'true'\n"
          top_level_enterprise = (
              f"  VITE_APP_CHECK_SITE_KEY: {expression('secrets.VITE_APP_CHECK_SITE_KEY')}\n"
              f"  FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY: {expression('secrets.FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY')}\n"
              "  VITE_ENABLE_FIREBASE_APPCHECK: 'true'\n"
          )
          malformed_enterprise = f"\n  FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY: {expression('secrets.FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY')}\n          E2E_BASE_URL:"

          if text.count(old_site) != 2:
              raise SystemExit(f'Expected exactly 2 legacy Admin site-key mappings, found {text.count(old_site)}')
          if text.count(old_app_id) != 2:
              raise SystemExit(f'Expected exactly 2 legacy Admin app-ID mappings, found {text.count(old_app_id)}')
          if text.count(top_level_public) != 1:
              raise SystemExit(f'Expected exactly 1 top-level public App Check block, found {text.count(top_level_public)}')
          if 'FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY:' in text:
              raise SystemExit('Dedicated Enterprise environment mapping already exists; refusing ambiguous rewrite')

          text = text.replace(old_site, new_site)
          text = text.replace(old_app_id, new_app_id)
          text = text.replace(top_level_public, top_level_enterprise, 1)

          if old_site in text or old_app_id in text:
              raise SystemExit('Legacy Admin mapping remained after replacement')
          if text.count(new_site) != 2:
              raise SystemExit('Enterprise Admin site-key mapping count is not exactly 2')
          if text.count(new_app_id) != 2:
              raise SystemExit('Canonical Admin app-ID mapping count is not exactly 2')
          if text.count('  FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY:') != 1:
              raise SystemExit('Enterprise workflow-scope mapping count is not exactly 1')
          if malformed_enterprise in text:
              raise SystemExit('Enterprise variable was inserted at invalid E2E-step indentation')

          workflow_path.write_text(text, encoding='utf-8')

          test_path = Path('apps/admin-panel/src/__tests__/components/UnifiedLogin.test.tsx')
          test_source = test_path.read_text(encoding='utf-8')
          old_mock = """jest.mock('@bin/shared', () => ({
            __esModule: true,
            useLanguage: () => ({ t: (k: string) => k, isRTL: false }),
          }));"""
          new_mock = """jest.mock('@bin/shared', () => ({
            __esModule: true,
            useLanguage: () => ({ t: (k: string) => k, isRTL: false }),
          }), { virtual: true });"""
          if test_source.count(old_mock) != 1:
              raise SystemExit(f'Expected exactly 1 non-virtual shared mock, found {test_source.count(old_mock)}')
          test_path.write_text(test_source.replace(old_mock, new_mock, 1), encoding='utf-8')
          PY

          git diff --check
          node scripts/verify-audit-write-bridge.mjs
          node --test tests/launch/admin-production-security-registration.test.mjs

      - name: Commit repair and report exact commit
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-pr866-enterprise-wiring.yml
          git add \
            .github/workflows/firebase-production-deploy.yml \
            apps/admin-panel/src/__tests__/components/UnifiedLogin.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(admin): finish Enterprise recovery wiring"
          echo "REPAIR_COMMIT_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:fix/admin-enterprise-appcheck-provider
