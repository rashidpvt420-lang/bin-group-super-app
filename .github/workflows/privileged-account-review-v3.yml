name: Privileged Account Review V3
run-name: Privileged review v3 · ${{ github.run_id }}

on:
  push:
    branches:
      - main
    paths:
      - .github/privileged-review-request-v3

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: privileged-account-review-v3
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  ISSUE_NUMBER: '434'

jobs:
  review:
    name: Review privileged accounts without mutation
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: bin-group-57c60

    steps:
      - name: Authorize canonical main marker merge
        id: authorize
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == 'push' ]]
          [[ "$CURRENT_REF" == 'refs/heads/main' ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          remote_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Main moved from $RELEASE_SHA to $remote_main before review authorization."
            exit 1
          }

          commit_json="$(gh api "repos/$REPOSITORY/commits/$RELEASE_SHA")"
          mapfile -t files < <(jq -r '.files[].filename' <<<"$commit_json")
          [[ "${#files[@]}" -eq 1 && "${files[0]}" == '.github/privileged-review-request-v3' ]] || {
            printf '::error::Dispatch commit must change only .github/privileged-review-request-v3. Found: %s\n' "${files[*]:-none}"
            exit 1
          }

          parent_sha="$(jq -r '.parents[0].sha // empty' <<<"$commit_json")"
          [[ "$parent_sha" =~ ^[0-9a-f]{40}$ ]]
          marker="$(gh api "repos/$REPOSITORY/contents/.github/privileged-review-request-v3?ref=$RELEASE_SHA" --jq '.content' | tr -d '\n' | base64 --decode)"

          request="$(awk -F= '$1=="request"{print $2}' <<<"$marker")"
          requested_from_main="$(awk -F= '$1=="requested_from_main"{print $2}' <<<"$marker")"
          mutation_allowed="$(awk -F= '$1=="mutation_allowed"{print $2}' <<<"$marker")"
          hard_launch_claim="$(awk -F= '$1=="hard_launch_claim"{print $2}' <<<"$marker")"
          request_nonce="$(awk -F= '$1=="request_nonce"{print $2}' <<<"$marker")"

          [[ "$request" == 'review-privileged-accounts-v3' ]]
          [[ "$requested_from_main" == "$parent_sha" ]]
          [[ "$mutation_allowed" == 'false' ]]
          [[ "$hard_launch_claim" == 'false' ]]
          [[ "$request_nonce" =~ ^[1-9][0-9]*$ ]]
          [[ "$(printf '%s\n' "$marker" | wc -l | tr -d ' ')" == '5' ]]

          echo "parent_sha=$parent_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact authorized main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify main remained frozen before review
        env:
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Main moved from $RELEASE_SHA to $remote_main before privileged review."
            exit 1
          }

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Build read-only privileged-account inventory
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: refs/heads/main
        run: node scripts/review-privileged-accounts-production.mjs

      - name: Validate exact-SHA no-mutation review evidence
        env:
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          report='launch_package/privileged-account-cleanup.json'
          [[ -s "$report" ]]
          jq -e --arg sha "$RELEASE_SHA" '
            .schemaVersion == 2 and
            .status == "dry-run" and
            .projectId == "bin-group-57c60" and
            .commitSha == $sha and
            .mutationPerformed == false and
            .deletedAccountCount == 0 and
            .deletedProfileDocumentCount == 0 and
            .sensitiveValuesExcluded == true and
            .auditLogsPreserved == true and
            .nonPrivilegedAccountsUntouched == true and
            .hardLaunchClaim == false and
            (.canonicalFounderReady | type) == "boolean" and
            (.founderEmailVerified | type) == "boolean" and
            (.founderPhoneMfaReady | type) == "boolean" and
            (.executionEligible | type) == "boolean" and
            (.deletionTargetCount | type) == "number"
          ' "$report" >/dev/null

      - name: Verify main remained frozen through review
        env:
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Privileged review completed, but main moved to $remote_main."
            exit 1
          }

      - name: Upload sanitized privileged review artifact
        uses: actions/upload-artifact@v4
        with:
          name: privileged-account-cleanup-review-${{ github.sha }}-${{ github.run_id }}
          path: launch_package/privileged-account-cleanup.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Publish sanitized review result
        env:
          RELEASE_SHA: ${{ github.sha }}
          REQUESTED_FROM_MAIN: ${{ steps.authorize.outputs.parent_sha }}
        shell: bash
        run: |
          set -euo pipefail
          report='launch_package/privileged-account-cleanup.json'
          ready="$(jq -r '.canonicalFounderReady' "$report")"
          email_verified="$(jq -r '.founderEmailVerified' "$report")"
          phone_mfa="$(jq -r '.founderPhoneMfaReady' "$report")"
          eligible="$(jq -r '.executionEligible' "$report")"
          privileged_count="$(jq -r '.privilegedAccountCountBefore' "$report")"
          target_count="$(jq -r '.deletionTargetCount' "$report")"
          blockers="$(jq -r '.executionBlockers | join("; ") | if length == 0 then "none" else . end' "$report")"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          artifact="privileged-account-cleanup-review-$RELEASE_SHA-$GITHUB_RUN_ID"
          body="## Privileged-account review v3

- Exact SHA: \`$RELEASE_SHA\`
- Requested from main: \`$REQUESTED_FROM_MAIN\`
- Review run ID: \`$GITHUB_RUN_ID\`
- Review run: $run_url
- Artifact: \`$artifact\`
- Canonical Founder ready: \`$ready\`
- Founder email verified: \`$email_verified\`
- Founder phone MFA ready: \`$phone_mfa\`
- Privileged accounts: \`$privileged_count\`
- Unexpected deletion targets: \`$target_count\`
- Cleanup execution eligible: \`$eligible\`
- Execution blockers: \`$blockers\`
- Mutation performed: \`false\`
- Hard-launch claim: \`false\`"
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
