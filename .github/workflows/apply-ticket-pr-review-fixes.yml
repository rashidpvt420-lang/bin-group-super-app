name: Apply Ticket PR Review Fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-ticket-pr-review-fixes.yml
      - scripts/apply-ticket-pr-review-fixes.mjs

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-ticket-pr-review-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/canonical-ticket-authority-db102' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-ticket-authority-db102
          fetch-depth: 0

      - name: Apply reviewed ticket corrections
        run: node scripts/apply-ticket-pr-review-fixes.mjs

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Run focused review-blocker tests
        run: |
          node --test --test-reporter=spec \
            tests/launch/ticket-review-blockers.test.mjs \
            test/five-profile-audit-guards.test.mjs \
            tests/launch/property-geo-authority.test.mjs \
            tests/launch/canonical-ticket-authority.test.mjs

      - name: Capture complete launch-honesty suite
        id: launch_honesty
        shell: bash
        run: |
          set +e
          npm run test:launch-honesty > /tmp/ticket-launch-honesty.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/ticket-launch-honesty.status
          tail -n 220 /tmp/ticket-launch-honesty.log
          exit 0

      - name: Upload launch-honesty diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-launch-honesty-${{ github.sha }}
          path: |
            /tmp/ticket-launch-honesty.log
            /tmp/ticket-launch-honesty.status
          if-no-files-found: error
          retention-days: 7

      - name: Enforce launch-honesty result
        run: test "$(cat /tmp/ticket-launch-honesty.status)" = "0"

      - name: TypeScript check
        run: npm run typecheck

      - name: Build Firebase Functions
        run: npm run build:functions

      - name: Commit permanent corrections and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-ticket-pr-review-fixes.yml \
            scripts/apply-ticket-pr-review-fixes.mjs
          git add \
            functions/tenantTicketOperations.ts \
            src/lib/ticketSystemService.ts \
            src/tenant/pages/TenantRequestPage.tsx \
            test/five-profile-audit-guards.test.mjs \
            tests/launch/property-geo-authority.test.mjs \
            tests/launch/ticket-review-blockers.test.mjs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(tickets): resolve protected gate review blockers'
          git push origin HEAD:fix/canonical-ticket-authority-db102
