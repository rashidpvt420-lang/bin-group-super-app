name: Admin MFA Regression

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main
    paths:
      - apps/admin-panel/src/context/AuthContext.tsx
      - apps/admin-panel/src/components/UnifiedLogin.tsx
      - apps/admin-panel/src/components/security/AdminMfaSignInChallenge.tsx
      - apps/admin-panel/src/pages/auth/LoginPage.tsx
      - apps/admin-panel/src/lib/adminAuthRedirect.ts
      - apps/admin-panel/src/lib/firebase.ts
      - apps/admin-panel/src/__tests__/context/AuthContextPostMfa.test.ts
      - apps/admin-panel/src/__tests__/components/AdminMfaSignInChallenge.test.tsx
      - apps/admin-panel/src/__tests__/components/UnifiedLogin.test.tsx
      - apps/admin-panel/src/__tests__/components/UnifiedLoginMfaResolution.test.tsx
      - apps/admin-panel/src/__tests__/lib/adminAuthRedirect.test.ts
      - apps/admin-panel/package.json
      - apps/admin-panel/package-lock.json
      - tests/launch/admin-production-security-registration.test.mjs
      - SECURITY_REGISTRATION.md
      - .github/workflows/admin-mfa-regression.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  focused-admin-mfa-tests:
    name: Phone, TOTP, routing, and fail-closed regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record tested commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-panel/package-lock.json

      - name: Install Admin panel dependencies
        run: npm --prefix apps/admin-panel ci --legacy-peer-deps

      - name: Run focused Admin MFA regressions
        run: |
          npm --prefix apps/admin-panel test -- \
            --watchAll=false \
            --runInBand \
            src/__tests__/context/AuthContextPostMfa.test.ts \
            src/__tests__/components/AdminMfaSignInChallenge.test.tsx \
            src/__tests__/components/UnifiedLogin.test.tsx \
            src/__tests__/components/UnifiedLoginMfaResolution.test.tsx \
            src/__tests__/lib/adminAuthRedirect.test.ts

  deploy-founder-preview:
    name: Clone exact head to temporary Founder site
    needs: focused-admin-mfa-tests
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy-founder-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: founder-enrollment-preview
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: bin-group-57c60
      FOUNDER_PREVIEW_SITE: bin-founder-totp-260801174030
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enforce exact-head and temporary-site boundaries
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$EXACT_HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"
          test "$EXACT_HEAD_SHA" = "$(git rev-parse HEAD)"
          test "$GCP_PROJECT_ID" = "bin-group-57c60"
          test "$FOUNDER_PREVIEW_SITE" = "bin-founder-totp-260801174030"
          test "$FOUNDER_PREVIEW_SITE" != "bin-group-57c60"
          test "$FOUNDER_PREVIEW_SITE" != "bin-group-admin-panel"
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud by Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies with retry
        run: bash scripts/npm-install-retry.sh

      - name: Verify the hardcoded Founder site exists in the expected project
        run: |
          set -euo pipefail
          npx firebase-tools hosting:sites:list --project "$GCP_PROJECT_ID" --json > "$RUNNER_TEMP/firebase-sites.json"
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/firebase-sites.json', 'utf8'));
          const sites = payload?.result?.sites || payload?.sites || [];
          const ids = sites.map((site) => site.site || String(site.name || '').split('/').pop()).filter(Boolean);
          const expected = process.env.FOUNDER_PREVIEW_SITE;
          if (!ids.includes(expected)) {
            console.error(`Expected temporary Founder site ${expected} was not found in the configured project.`);
            process.exit(1);
          }
          if (expected === 'bin-group-57c60' || expected === 'bin-group-admin-panel') {
            console.error('Refusing to use a production Hosting site as the Founder preview destination.');
            process.exit(1);
          }
          console.log('Verified the dedicated temporary Founder Hosting site.');
          NODE

      - name: Build shared package
        run: npm run build --workspace=@bin/shared

      - name: Verify protected Enterprise App Check site-key presence
        env:
          FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY"

      - name: Build App Check-enforced Admin panel
        run: npm run build:admin
        env:
          CI: false
          REACT_APP_ENABLE_FIREBASE_APPCHECK: 'true'
          REACT_APP_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY }}
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          REACT_APP_ADMIN_FIREBASE_APP_ID: 1:123413252227:web:285cb53bc26626d699f3b6
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: bin-group-57c60.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: bin-group-57c60
          REACT_APP_FIREBASE_STORAGE_BUCKET: bin-group-57c60.firebasestorage.app

      - name: Verify embedded Firebase project and write exact-SHA manifest
        run: |
          set -euo pipefail
          npm run verify:admin-firebase -- --build apps/admin-panel/build
          MANIFEST="apps/admin-panel/build/founder-preview-${EXACT_HEAD_SHA}.json"
          node <<'NODE'
          const fs = require('fs');
          const path = `apps/admin-panel/build/founder-preview-${process.env.EXACT_HEAD_SHA}.json`;
          const evidence = {
            schemaVersion: 1,
            commitSha: process.env.EXACT_HEAD_SHA,
            firebaseProjectId: process.env.GCP_PROJECT_ID,
            hostingSite: process.env.FOUNDER_PREVIEW_SITE,
            deploymentScope: 'temporary-founder-mfa-preview',
            appCheckEnabled: true,
            appCheckProvider: 'recaptcha-enterprise',
            publicReleaseGate: false,
            hardLaunchClaim: false,
          };
          fs.writeFileSync(path, `${JSON.stringify(evidence, null, 2)}\n`);
          NODE
          test -f "$MANIFEST"

      - name: Generate an isolated Hosting-only configuration
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const entries = Array.isArray(source.hosting) ? source.hosting : [source.hosting];
          const admin = entries.find((entry) => entry && entry.target === 'admin');
          if (!admin || admin.public !== 'apps/admin-panel/build') {
            console.error('The canonical Admin Hosting configuration could not be resolved.');
            process.exit(1);
          }
          const isolated = JSON.parse(JSON.stringify(admin));
          isolated.target = 'founder-preview';
          fs.writeFileSync(
            'firebase.founder-preview.json',
            `${JSON.stringify({ hosting: [isolated] }, null, 2)}\n`,
          );
          NODE
          node -e "const c=require('./firebase.founder-preview.json'); if(c.hosting.length!==1||c.hosting[0].target!=='founder-preview'||c.hosting[0].public!=='apps/admin-panel/build') process.exit(1)"
          npx firebase-tools target:apply hosting founder-preview "$FOUNDER_PREVIEW_SITE" --project "$GCP_PROJECT_ID" --non-interactive

      - name: Deploy exact head to a temporary preview channel
        id: preview_channel
        run: |
          set -euo pipefail
          CHANNEL_ID="mfa-${EXACT_HEAD_SHA:0:12}"
          npx firebase-tools hosting:channel:deploy "$CHANNEL_ID" \
            --only founder-preview \
            --config firebase.founder-preview.json \
            --project "$GCP_PROJECT_ID" \
            --expires 1d \
            --non-interactive
          echo "channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"

      - name: Clone the verified preview version to the temporary Founder site's live channel
        run: |
          set -euo pipefail
          CHANNEL_ID="${{ steps.preview_channel.outputs.channel_id }}"
          npx firebase-tools hosting:clone \
            "$FOUNDER_PREVIEW_SITE:$CHANNEL_ID" \
            "$FOUNDER_PREVIEW_SITE:live" \
            --project "$GCP_PROJECT_ID" \
            --non-interactive

      - name: Verify the temporary site serves the exact head
        run: |
          set -euo pipefail
          LIVE_MANIFEST="https://${FOUNDER_PREVIEW_SITE}.web.app/founder-preview-${EXACT_HEAD_SHA}.json"
          VERIFIED=false
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${LIVE_MANIFEST}?attempt=${attempt}" \
              > "$RUNNER_TEMP/founder-preview-live.json" || true
            if node <<'NODE'
          const fs = require('fs');
          try {
            const evidence = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/founder-preview-live.json', 'utf8'));
            const valid =
              evidence.commitSha === process.env.EXACT_HEAD_SHA &&
              evidence.hostingSite === process.env.FOUNDER_PREVIEW_SITE &&
              evidence.firebaseProjectId === process.env.GCP_PROJECT_ID &&
              evidence.appCheckEnabled === true &&
              evidence.appCheckProvider === 'recaptcha-enterprise' &&
              evidence.publicReleaseGate === false &&
              evidence.hardLaunchClaim === false;
            process.exit(valid ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
            then
              VERIFIED=true
              break
            fi
            sleep 3
          done
          test "$VERIFIED" = true

      - name: Write controlled-preview evidence
        run: |
          set -euo pipefail
          mkdir -p founder_preview_evidence
          node <<'NODE'
          const fs = require('fs');
          const evidence = {
            schemaVersion: 1,
            commitSha: process.env.EXACT_HEAD_SHA,
            pullRequest: Number(process.env.PR_NUMBER),
            baseSha: process.env.PR_BASE_SHA,
            firebaseProjectId: process.env.GCP_PROJECT_ID,
            hostingSite: process.env.FOUNDER_PREVIEW_SITE,
            previewChannel: process.env.PREVIEW_CHANNEL,
            clonedToTemporaryLive: true,
            liveManifestVerified: true,
            appCheckProvider: 'recaptcha-enterprise',
            phoneMfaAuthorization: 'pending-human',
            profileAccess: 'pending-human',
            founderTotpEnrollment: 'pending-human',
            freshTotpLogin: 'pending-human',
            protectedFounderE2eSecrets: 'not-configured',
            publicReleaseGate: false,
            hardLaunchClaim: false,
            verifiedAt: new Date().toISOString(),
          };
          fs.writeFileSync('founder_preview_evidence/founder-preview-deployment.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE
        env:
          PREVIEW_CHANNEL: ${{ steps.preview_channel.outputs.channel_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Upload exact-SHA controlled-preview evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: founder-preview-${{ github.event.pull_request.head.sha }}
          path: founder_preview_evidence/founder-preview-deployment.json
          if-no-files-found: error
          retention-days: 30
