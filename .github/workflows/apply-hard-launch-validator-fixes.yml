name: Apply hard-launch validator fixes

on:
  push:
    branches:
      - fix/hard-launch-validator-fail-closed

permissions:
  contents: write

concurrency:
  group: apply-hard-launch-validator-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/hard-launch-validator-fail-closed
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply source and test patches
        run: |
          set -euo pipefail
          python .hardfix/patch1.py
          python .hardfix/patch2.py
          python .hardfix/patch3.py
          python .hardfix/patch5.py

      - name: Verify syntax and focused tests
        run: |
          set -euo pipefail
          node --check scripts/lib/authorized-approvers.mjs
          node --check scripts/lib/hard-launch-gate.mjs
          node --check scripts/lib/operational-proof-schema.mjs
          node --check scripts/verify-launch-gate-live.mjs
          node --check scripts/verify-operational-readiness.mjs
          node --check scripts/write-pilot-incident-report.mjs
          node --check scripts/write-hard-launch-approval.mjs
          node --check scripts/verify-hard-launch-approval.mjs
          node --check scripts/publish-operational-application-evidence.mjs
          node --test test/hard-launch-gate.test.mjs test/hard-launch-validator-hardening.test.mjs

      - name: Commit clean hardening change
        run: |
          set -euo pipefail
          rm -rf .hardfix
          rm -f .github/workflows/apply-hard-launch-validator-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden final hard-launch validator"
          git push origin HEAD:fix/hard-launch-validator-fail-closed
