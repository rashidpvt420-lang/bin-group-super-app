name: Owner Public Launch Hardening Command
run-name: Owner public launch hardening · ${{ github.event.comment.body }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: owner-public-launch-hardening
  cancel-in-progress: false

jobs:
  repair-promoted-phase1-coherence:
    if: >-
      github.event.issue.number == 434 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/bin-launch repair-promoted-phase1-coherence'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve stable current main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]]
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remove retired generator fallback
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tests/launch/firebase-production-workflow-coherence.test.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const stale = "  const policyGenerator = readFileSync(path.join(root, 'scripts/apply-phase1-manual-public-launch-policy.mjs'), 'utf8');\n  const proofDecision = decision.includes('paymentProofOk') ? decision : policyGenerator;\n";
          const replacement = "  const proofDecision = decision;\n  assert.match(decision, /phase1-manual-payment-proof\\.json/);\n";
          const count = source.split(stale).length - 1;
          if (count !== 1) {
            throw new Error(`retired policy-generator fallback: expected one exact match, found ${count}`);
          }
          source = source.replace(stale, replacement);
          fs.writeFileSync(file, source);
          NODE

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Run focused production workflow coherence regression
        run: node --test tests/launch/firebase-production-workflow-coherence.test.mjs

      - name: Run launch honesty and workflow security
        run: npm run test:launch-honesty

      - name: Run production stability guard
        run: npm run test:stability

      - name: Commit validated coherence repair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          START_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$current_main" == "$START_SHA" ]] || {
            echo '::error::Main changed during validation; refusing to overwrite concurrent work.'
            exit 1
          }
          git diff --exit-code -- . ':(exclude)tests/launch/firebase-production-workflow-coherence.test.mjs' || {
            echo '::error::Repair changed files outside the exact coherence regression.'
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/launch/firebase-production-workflow-coherence.test.mjs
          git diff --cached --check
          git commit -m 'fix: stop launch coherence from reading retired generator'
          git push origin HEAD:main

      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          final_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="Promoted Phase 1 coherence repair passed in run \`$RUN_ID\` and was committed at \`$final_sha\`. The retired generator fallback is removed; launch-honesty and stability passed. A fresh exact-SHA review and deployment are still required before any YES-GO claim." >/dev/null

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="Promoted Phase 1 coherence repair failed in run \`$RUN_ID\`: https://github.com/$REPOSITORY/actions/runs/$RUN_ID . No deployment or YES-GO claim was made." >/dev/null