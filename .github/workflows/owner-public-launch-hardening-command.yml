name: Owner Public Launch Hardening Command
run-name: Owner public launch hardening · ${{ github.event.comment.body }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: owner-public-launch-hardening
  cancel-in-progress: false

jobs:
  apply-phase1-manual-public-policy:
    if: >-
      github.event.issue.number == 434 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/bin-launch apply-phase1-manual-public-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve stable current main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]]
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply Phase 1 source and workflow policy
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/apply-phase1-manual-public-launch-policy.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const removeReplaceBlock = (label, functionName = 'replaceOnce') => {
            const endMarker = `    '${label}',\n  );`;
            const labelIndex = source.indexOf(endMarker);
            if (labelIndex < 0) throw new Error(`redundant transformation label missing: ${label}`);
            const startIndex = source.lastIndexOf(`  source = ${functionName}(`, labelIndex);
            if (startIndex < 0) throw new Error(`${functionName} start missing for: ${label}`);
            source = `${source.slice(0, startIndex)}${source.slice(labelIndex + endMarker.length)}`;
          };
          removeReplaceBlock('workflow job payment policy env', 'replaceCount');
          removeReplaceBlock('workflow postdeploy gate policy env');
          removeReplaceBlock('workflow final decision policy env');
          const writeMarker = "  write(file, source);\n  write('launch_package/generated/firebase-production-deploy-phase1.yml', source);";
          const insertion = `  {\n    const paymentExpression = "$" + "{{ inputs.payment_policy }}";\n    let launchModeBindingCount = 0;\n    source = source.split("\\n").map((line) => {\n      const match = line.match(/^(\\s*)LAUNCH_MODE:/);\n      if (!match || !line.includes("inputs.launch_mode")) return line;\n      launchModeBindingCount += 1;\n      return \`\${line}\\n\${match[1]}PAYMENT_POLICY: \${paymentExpression}\`;\n    }).join("\\n");\n    if (launchModeBindingCount !== 6) throw new Error(\`workflow job payment policy env: expected 6 bindings, found \${launchModeBindingCount}\`);\n  }\n`;
          if (!source.includes(writeMarker)) throw new Error('workflow write marker missing');
          source = source.replace(writeMarker, insertion + writeMarker);
          fs.writeFileSync(file, source);
          NODE
          node scripts/apply-phase1-manual-public-launch-policy.mjs
          node <<'NODE'
          const fs = require('fs');
          const file = 'tests/launch/phase1-manual-public-launch-policy.test.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const broken = "  assert.match(workflow, /Verify Phase 1 manual Cash/Cheque production policy/);";
          const repaired = "  assert.ok(workflow.includes('Verify Phase 1 manual Cash/Cheque production policy'));";
          if (!source.includes(broken)) throw new Error('Phase 1 Cash/Cheque regression syntax anchor missing');
          source = source.replace(broken, repaired);
          fs.writeFileSync(file, source);
          NODE

      - name: Validate generated workflow YAML
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/firebase-production-deploy.yml'); puts 'workflow yaml parsed'"

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Run focused Owner and payment-policy regressions
        run: node --test tests/launch/owner-public-launch-hardening.test.mjs tests/launch/phase1-manual-public-launch-policy.test.mjs

      - name: Run launch honesty and workflow security
        run: npm run test:launch-honesty

      - name: Run production stability guard
        run: npm run test:stability

      - name: Validate policy scripts
        run: |
          node --check scripts/verify-phase1-manual-payment-proof.mjs
          node --check scripts/postdeploy-release-gate.mjs
          node --check scripts/hard-launch-decision-gate.mjs

      - name: Commit validated source and generated workflow candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          START_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$current_main" == "$START_SHA" ]] || {
            echo '::error::Main changed during policy validation; refusing to overwrite concurrent work.'
            exit 1
          }
          test -s launch_package/generated/firebase-production-deploy-phase1.yml
          git restore --source="$START_SHA" -- .github/workflows/firebase-production-deploy.yml
          rm -f scripts/apply-phase1-manual-public-launch-policy.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: bind public launch to Phase 1 manual payment proof'
          git push origin HEAD:main

      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          final_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="Phase 1 manual public-launch policy validation passed in run \`$RUN_ID\` and source proof logic was committed at \`$final_sha\`. The generated production workflow candidate is ready for the authorised Git tree promotion step. No deployment or YES-GO claim has been made." >/dev/null

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="Phase 1 manual public-launch policy validation failed in run \`$RUN_ID\`: https://github.com/$REPOSITORY/actions/runs/$RUN_ID . No workflow promotion, deployment or YES-GO claim was made." >/dev/null
