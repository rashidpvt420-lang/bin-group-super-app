name: Owner Public Launch Hardening Command
run-name: Owner public launch hardening · ${{ github.event.comment.body }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: owner-public-launch-hardening
  cancel-in-progress: false

jobs:
  repair-owner-public-launch:
    if: >-
      github.event.issue.number == 434 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/bin-launch repair-owner-public-launch'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Resolve stable current main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]]
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Sanitize temporary repair script
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/apply-owner-public-launch-hardening.mjs';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace(
            /\/\/ 3\) Replace notes-only completion[\s\S]*?(?=\/\/ 4\) Capture Broker referral)/,
            '// 3) Evidence-backed completion file was committed directly.\n\n',
          );
          source = source.replace(
            /\/\/ 5\) Guided Admin inspection evidence UI\.\nwrite\('apps\/admin-panel\/src\/components\/admin\/OwnerInspectionEvidenceDialog\.tsx',[\s\S]*?\n`\);\n\n(?=\{\n  const file = 'apps\/admin-panel\/src\/pages\/admin\/IntakeVaultPage\.tsx')/,
            '// 5) Guided Admin evidence component was committed directly.\n',
          );
          source = source.replace(
            /\/\/ 7\) Launch regression[\s\S]*?(?=console\.log\('\[owner-launch-hardening\])/,
            '// 7) Launch regression file was committed directly.\n\n',
          );
          fs.writeFileSync(file, source);
          NODE

      - name: Apply remaining source repairs
        run: node scripts/apply-owner-public-launch-hardening.mjs

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Run focused hardening regression
        run: node --test tests/launch/owner-public-launch-hardening.test.mjs

      - name: Run production stability guard
        run: npm run test:stability

      - name: TypeScript check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build Firebase Functions
        run: npm run build:functions

      - name: Build Admin panel
        run: npm run build:admin
        env:
          CI: false
          REACT_APP_ENABLE_FIREBASE_APPCHECK: 'false'

      - name: Commit verified repairs and remove temporary command
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          START_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$current_main" == "$START_SHA" ]] || {
            echo '::error::Main changed during repair; refusing to overwrite concurrent work.'
            exit 1
          }
          rm -f scripts/apply-owner-public-launch-hardening.mjs
          rm -f .github/workflows/owner-public-launch-hardening-command.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: complete Owner public launch activation hardening'
          git push origin HEAD:main

      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          final_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="Owner public-launch source hardening passed and was committed to main at \`$final_sha\`. Property IDs, payment evidence, verified Broker referral timing, evidence-backed property visits, Admin workflow and Phase 1 public payment policy were validated. Live deployment evidence is still required before a YES-GO claim." >/dev/null

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="Owner public-launch source hardening failed. Review this protected workflow run; no YES-GO or deployment claim was made." >/dev/null
