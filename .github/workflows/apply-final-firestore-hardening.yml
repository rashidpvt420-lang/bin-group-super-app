name: Apply Final Firestore Hardening

on:
  push:
    branches:
      - fix/final-firestore-security-clearance
    paths:
      - .github/workflows/apply-final-firestore-hardening.yml
      - scripts/apply-final-firestore-security-hardening.mjs
      - scripts/final-firestore-postpatch-cleanup.mjs
      - scripts/harden-system-secrets-rules.mjs
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-final-firestore-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/final-firestore-security-clearance

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic Firestore hardening when absent
        shell: bash
        run: |
          if grep -Fq "match /fcmTokens/{tokenId}" firestore.rules; then
            echo "Primary Firestore hardening already applied."
          else
            node scripts/apply-final-firestore-security-hardening.mjs
          fi
          node scripts/final-firestore-postpatch-cleanup.mjs

      - name: Verify generated state
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff -- firestore.rules test/security-rules.test.js

      - name: Commit generated repair when needed
        shell: bash
        run: |
          if git diff --quiet -- firestore.rules test/security-rules.test.js; then
            echo "Rule and test patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- firestore.rules test/security-rules.test.js
          git diff --cached --check
          git commit -m "Normalize final Firestore security hardening"
          git push origin HEAD:fix/final-firestore-security-clearance

      - name: Run Firestore and Storage rule tests
        id: rule_tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-test-output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist complete rule-test diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p launch_package
          cp rules-test-output.log launch_package/firestore-rule-test-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- launch_package/firestore-rule-test-output.txt
          git commit -m "Record Firestore rule-test diagnostics" || true
          git push origin HEAD:fix/final-firestore-security-clearance

      - name: Enforce clean rule-test result
        shell: bash
        run: |
          if grep -F "maximum of 1000 expressions" rules-test-output.log; then
            echo "Firestore expression-limit failure detected."
            exit 1
          fi
          if [ "${{ steps.rule_tests.outputs.exit_code }}" != "0" ]; then
            echo "Firestore/Storage rule suite failed."
            exit 1
          fi

      - name: Run stability and launch-honesty suites
        run: |
          npm run test:stability
          npm run test:launch-honesty
