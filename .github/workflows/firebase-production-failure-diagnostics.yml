name: Firebase Production Failure Diagnostics
run-name: Diagnose Firebase production run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - Firebase Production Deploy
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: firebase-production-failure-diagnostics-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect safe production failure evidence
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      ISSUE_NUMBER: '434'

    steps:
      - name: Collect failed jobs and GitHub-masked logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p launch_package
          : > launch_package/firebase-production-failure.log

          jobs_json="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100")"
          jq '{
            schemaVersion: 1,
            status: "FAILED",
            sourceWorkflow: "Firebase Production Deploy",
            sourceRunId: env.SOURCE_RUN_ID,
            sourceRunSha: env.SOURCE_RUN_SHA,
            repository: env.REPOSITORY,
            collectedAt: (now | todateiso8601),
            failedJobs: [
              .jobs[]
              | select(.conclusion == "failure")
              | {
                  id,
                  name,
                  status,
                  conclusion,
                  failedSteps: [
                    .steps[]?
                    | select(.conclusion == "failure")
                    | {number, name, status, conclusion}
                  ]
                }
            ],
            githubSecretMaskingApplied: true,
            secretValuesIntentionallyCollected: false,
            hardLaunchClaim: false
          }' <<<"$jobs_json" > launch_package/firebase-production-failure.json

          mapfile -t failed_job_ids < <(jq -r '.jobs[] | select(.conclusion == "failure") | .id' <<<"$jobs_json")
          for job_id in "${failed_job_ids[@]}"; do
            [[ "$job_id" =~ ^[0-9]+$ ]]
            printf '\n===== FAILED JOB %s =====\n' "$job_id" >> launch_package/firebase-production-failure.log
            gh api "repos/$REPOSITORY/actions/jobs/$job_id/logs" >> launch_package/firebase-production-failure.log
          done

          jq -e '.failedJobs | length > 0' launch_package/firebase-production-failure.json >/dev/null
          test -s launch_package/firebase-production-failure.log

      - name: Upload production failure evidence
        uses: actions/upload-artifact@v7
        with:
          name: firebase-production-failure-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}
          path: |
            launch_package/firebase-production-failure.json
            launch_package/firebase-production-failure.log
          if-no-files-found: error
          retention-days: 30

      - name: Record failure in canonical pilot issue
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/$REPOSITORY/actions/runs/$SOURCE_RUN_ID"
          artifact_name="firebase-production-failure-$SOURCE_RUN_SHA-$SOURCE_RUN_ID"
          failed_steps="$(jq -r '[.failedJobs[] | .failedSteps[]?.name] | unique | join(", ")' launch_package/firebase-production-failure.json)"
          body="## Firebase production deployment failed\n\n- Exact SHA: \`$SOURCE_RUN_SHA\`\n- Source run: $run_url\n- Failed step(s): \`${failed_steps:-unknown}\`\n- Diagnostic artifact: \`$artifact_name\`\n- Public launch claim: \`false\`\n\nThe deployment remains fail-closed. Review the diagnostic artifact before another protected dispatch."
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
