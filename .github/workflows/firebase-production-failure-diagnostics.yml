name: Firebase Production Failure Diagnostics
run-name: Diagnose Firebase production run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - Firebase Production Deploy
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: firebase-production-failure-diagnostics-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect safe production failure evidence
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      ISSUE_NUMBER: '434'

    steps:
      - name: Validate protected source run through GitHub API
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::Malformed Firebase Production Deploy run ID.'
            exit 1
          }
          [[ "$SOURCE_RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Malformed Firebase Production Deploy source SHA.'
            exit 1
          }

          source_run="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e \
            --arg repository "$REPOSITORY" \
            --arg sha "$SOURCE_RUN_SHA" '
              .name == "Firebase Production Deploy" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .head_sha == $sha and
              .repository.full_name == $repository and
              .conclusion == "failure"
            ' <<<"$source_run" >/dev/null || {
              echo '::error::Refusing diagnostics for a run that is not the failed same-repository main workflow_dispatch Firebase Production Deploy.'
              exit 1
            }
          echo "Validated protected failed production run $SOURCE_RUN_ID at exact SHA $SOURCE_RUN_SHA."

      - name: Checkout trusted diagnostic implementation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect and sanitize GitHub-masked failed-job logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p launch_package
          raw_log="$(mktemp)"
          trap 'rm -f "$raw_log"' EXIT

          jobs_json="$(
            gh api --paginate --slurp \
              "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" |
              jq -ce '{jobs: [.[].jobs[]]}'
          )"
          jq -e '.jobs | any(.conclusion == "failure")' <<<"$jobs_json" >/dev/null || {
            echo '::error::Selected Firebase Production Deploy run contains no failed job.'
            exit 1
          }

          mapfile -t failed_job_ids < <(
            jq -r '.jobs[] | select(.conclusion == "failure") | .id' <<<"$jobs_json"
          )
          for job_id in "${failed_job_ids[@]}"; do
            [[ "$job_id" =~ ^[1-9][0-9]*$ ]]
            printf '\n===== FAILED JOB %s =====\n' "$job_id" >> "$raw_log"
            gh api "repos/$REPOSITORY/actions/jobs/$job_id/logs" >> "$raw_log"
          done
          test -s "$raw_log"

          node scripts/sanitize-production-diagnostic-log.mjs \
            "$raw_log" \
            launch_package/firebase-production-failure.log
          test -s launch_package/firebase-production-failure.log

          JOBS_JSON="$jobs_json" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const runId = String(process.env.SOURCE_RUN_ID || '').trim();
          const runSha = String(process.env.SOURCE_RUN_SHA || '').trim();
          const repository = String(process.env.REPOSITORY || '').trim();
          if (!/^[1-9][0-9]*$/.test(runId)) throw new Error('Malformed SOURCE_RUN_ID.');
          if (!/^[0-9a-f]{40}$/.test(runSha)) throw new Error('Malformed SOURCE_RUN_SHA.');
          if (!repository.includes('/')) throw new Error('Malformed REPOSITORY.');

          const jobs = JSON.parse(process.env.JOBS_JSON || '{"jobs":[]}');
          const sanitizedLog = readFileSync('launch_package/firebase-production-failure.log', 'utf8');
          const lines = sanitizedLog.split(/\r?\n/);
          const signal = /##\[error\]|\[production-deploy\]|\[deploy-verify\]|FirebaseError|deployment (?:failed|stopped|blocked)|deploy failed|functions:|hosting:|firestore:|storage:|error:|timeout|unexpected|permission|quota|operation|failed after 3 attempts/i;
          const selectedIndexes = new Set();
          for (let index = 0; index < lines.length; index += 1) {
            if (!signal.test(lines[index])) continue;
            for (let offset = -3; offset <= 3; offset += 1) {
              const candidate = index + offset;
              if (candidate >= 0 && candidate < lines.length) selectedIndexes.add(candidate);
            }
          }
          const normalizedErrorLines = [...selectedIndexes]
            .sort((left, right) => left - right)
            .map((index) => lines[index].slice(0, 900))
            .filter((line, index, all) => line && all.indexOf(line) === index)
            .slice(-120);

          const failedJobs = jobs.jobs
            .filter((job) => job?.conclusion === 'failure')
            .map((job) => ({
              id: String(job.id || ''),
              name: String(job.name || ''),
              status: String(job.status || ''),
              conclusion: String(job.conclusion || ''),
              failedSteps: (job.steps || [])
                .filter((step) => step?.conclusion === 'failure')
                .map((step) => ({
                  number: Number(step.number || 0),
                  name: String(step.name || ''),
                  status: String(step.status || ''),
                  conclusion: String(step.conclusion || ''),
                })),
            }));

          const report = {
            schemaVersion: 2,
            status: 'FAILED',
            sourceWorkflow: 'Firebase Production Deploy',
            sourceRunId: runId,
            sourceRunSha: runSha,
            repository,
            collectedAt: new Date().toISOString(),
            failedJobs,
            normalizedErrorLines,
            githubSecretMaskingApplied: true,
            personalIdentifiersRedacted: true,
            fullArtifactLogRedacted: true,
            rawJobLogUploaded: false,
            secretValuesIntentionallyCollected: false,
            hardLaunchClaim: false,
          };
          writeFileSync(
            'launch_package/firebase-production-failure.json',
            `${JSON.stringify(report, null, 2)}\n`,
          );
          NODE

          jq -e '
            .schemaVersion == 2 and
            .status == "FAILED" and
            .sourceRunId == env.SOURCE_RUN_ID and
            .sourceRunSha == env.SOURCE_RUN_SHA and
            ((.failedJobs | length) > 0)
          ' launch_package/firebase-production-failure.json >/dev/null

      - name: Upload redacted production failure evidence
        uses: actions/upload-artifact@v4
        with:
          name: firebase-production-failure-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}
          path: |
            launch_package/firebase-production-failure.json
            launch_package/firebase-production-failure.log
          if-no-files-found: error
          retention-days: 30

      - name: Record sanitized failure in canonical pilot issue
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/$REPOSITORY/actions/runs/$SOURCE_RUN_ID"
          artifact_name="firebase-production-failure-$SOURCE_RUN_SHA-$SOURCE_RUN_ID"
          failed_steps="$(jq -r '[.failedJobs[] | .failedSteps[]?.name] | unique | join(", ")' launch_package/firebase-production-failure.json)"
          errors="$(jq -r 'if (.normalizedErrorLines | length) == 0 then "- No normalized terminal error was extracted; inspect the redacted artifact." else (.normalizedErrorLines | map("- `" + . + "`") | join("\n")) end' launch_package/firebase-production-failure.json)"
          body="## Firebase production deployment failed
          
          - Exact SHA: \`$SOURCE_RUN_SHA\`
          - Source run: $run_url
          - Failed step(s): \`${failed_steps:-unknown}\`
          - Diagnostic artifact: \`$artifact_name\`
          - Full artifact log redacted: \`true\`
          - Raw job log uploaded: \`false\`
          - Public launch claim: \`false\`
          
          ### Normalized terminal errors
          $errors
          
          The deployment remains fail-closed. Fix only the identified software or operational requirement before another protected dispatch."
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
