name: Operational Provider Evidence

on:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Provider gate to verify and publish; all-baseline runs SMTP and App Check together'
        required: true
        type: choice
        options:
          - all-baseline
          - brandedEmailDelivery
          - appCheckEnforcement
          - aiProviderHealth
          - stripeLiveBilling
      expected_commit_sha:
        description: 'Full lowercase current control-plane main SHA'
        required: true
        type: string
      frozen_release_sha:
        description: 'Full lowercase frozen production release SHA'
        required: true
        type: string
      production_deploy_run_id:
        description: 'Successful production deploy run ID for the frozen release SHA'
        required: true
        type: string
      stripe_checkout_session_id:
        description: 'Stripe only: paid cs_live_ checkout session ID'
        required: false
        type: string
      stripe_webhook_event_id:
        description: 'Stripe only: matching evt_ checkout.session.completed event ID'
        required: false
        type: string
      confirmation:
        description: 'Enter PUBLISH_OPERATIONAL_PROVIDER_EVIDENCE'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: operational-provider-evidence-${{ inputs.gate }}-${{ inputs.frozen_release_sha }}-${{ inputs.expected_commit_sha }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: hard-public-launch
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
      E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
      PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
      PRODUCTION_RELEASE_SHA: ${{ inputs.frozen_release_sha }}
      CONTROL_PLANE_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Enforce protected provider evidence inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          RELEASE_SHA: ${{ inputs.frozen_release_sha }}
          SELECTED_GATE: ${{ inputs.gate }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
          STRIPE_SESSION: ${{ inputs.stripe_checkout_session_id }}
          STRIPE_EVENT: ${{ inputs.stripe_webhook_event_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Provider evidence may only run from refs/heads/main."
            exit 1
          fi
          authorized_actor=false
          IFS=',' read -ra allowed_actors <<< "${AUTHORIZED_FOUNDER_ACTORS:-}"
          for allowed_actor in "${allowed_actors[@]}"; do
            allowed_actor="$(printf '%s' "$allowed_actor" | xargs)"
            if [[ -n "$allowed_actor" && "$GITHUB_ACTOR" == "$allowed_actor" ]]; then authorized_actor=true; fi
          done
          if [[ "$authorized_actor" != "true" ]]; then
            echo "::error::The current actor is not in AUTHORIZED_FOUNDER_ACTORS."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::expected_commit_sha must equal the full current control-plane main SHA."
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::frozen_release_sha must be a full lowercase release SHA."
            exit 1
          fi
          if [[ ! "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::production_deploy_run_id must be numeric."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "PUBLISH_OPERATIONAL_PROVIDER_EVIDENCE" ]]; then
            echo "::error::Provider evidence confirmation phrase mismatch."
            exit 1
          fi
          case "$SELECTED_GATE" in
            all-baseline)
              if [[ -n "${STRIPE_SESSION}${STRIPE_EVENT}" ]]; then
                echo "::error::all-baseline must not receive Stripe-only inputs."
                exit 1
              fi
              ;;
            brandedEmailDelivery|appCheckEnforcement)
              if [[ -n "${STRIPE_SESSION}${STRIPE_EVENT}" ]]; then
                echo "::error::The selected baseline gate must not receive Stripe-only inputs."
                exit 1
              fi
              ;;
            aiProviderHealth)
              if [[ -n "${STRIPE_SESSION}${STRIPE_EVENT}" ]]; then
                echo "::error::AI proof must not receive Stripe transaction inputs."
                exit 1
              fi
              ;;
            stripeLiveBilling)
              if [[ ! "$STRIPE_SESSION" =~ ^cs_live_ ]] || [[ ! "$STRIPE_EVENT" =~ ^evt_ ]]; then
                echo "::error::Stripe proof requires matching live checkout and event IDs."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported provider gate."
              exit 1
              ;;
          esac

      - name: Checkout clearance control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control-plane
          fetch-depth: 0

      - name: Verify frozen-release control-plane scope
        env:
          RELEASE_SHA: ${{ inputs.frozen_release_sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C control-plane merge-base --is-ancestor "$RELEASE_SHA" "$CONTROL_PLANE_SHA" || { echo "::error::Frozen release is not an ancestor of the current control plane."; exit 1; }
          changed="$(git -C control-plane diff --name-only "$RELEASE_SHA" "$CONTROL_PLANE_SHA")"
          [[ -n "$changed" ]] || { echo "::error::No reviewed control-plane repair exists above the frozen release."; exit 1; }
          allowed='^(\.github/workflows/firebase-production-deploy\.yml|\.github/workflows/live-role-smoke\.yml|\.github/workflows/operational-application-evidence\.yml|\.github/workflows/operational-provider-evidence\.yml|\.github/workflows/privileged-access-rotation-evidence\.yml|\.github/workflows/technician-physical-evidence\.yml|scripts/finalize-operational-provider-evidence\.mjs|scripts/hard-clearance-production-revalidation\.mjs|scripts/launch-status\.mjs|scripts/publish-direct-operational-proof\.mjs|scripts/publish-operational-application-evidence\.mjs|scripts/publish-operational-provider-evidence\.mjs|scripts/resolve-admin-app-check-site-key\.mjs|scripts/run-frozen-release-evidence\.mjs|scripts/verify-hard-launch-approval\.mjs|scripts/verify-operational-readiness\.mjs|tests/launch/ai-operational-contract\.test\.mjs|tests/launch/external-gate-production-provenance\.test\.mjs|tests/launch/final-operational-evidence-producers\.test\.mjs|tests/launch/hard-clearance-revalidation\.test\.mjs|tests/launch/operational-application-evidence-audit\.test\.mjs)$'
          while IFS= read -r file; do
            [[ -z "$file" || "$file" =~ $allowed ]] || { echo "::error::Non-control-plane file changed since frozen release: $file"; exit 1; }
          done <<< "$changed"
          echo "CONTROL_PLANE_SCOPE_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Checkout frozen production release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.frozen_release_sha }}
          path: release

      - name: Overlay reviewed dual-SHA publishers only
        run: |
          cp control-plane/scripts/publish-operational-provider-evidence.mjs release/scripts/publish-operational-provider-evidence.mjs
          cp control-plane/scripts/finalize-operational-provider-evidence.mjs release/scripts/finalize-operational-provider-evidence.mjs

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        working-directory: release
        run: bash scripts/npm-install-retry.sh

      - name: Download exact production deployment metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-deployment-${{ inputs.frozen_release_sha }}
          path: release/downloaded-production
          run-id: ${{ inputs.production_deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore and validate production deployment binding
        working-directory: release
        env:
          TARGET_SHA: ${{ inputs.frozen_release_sha }}
          DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
        run: |
          set -euo pipefail
          source_file="$(find downloaded-production -type f -name production-deployment.json -print -quit)"
          [[ -n "$source_file" ]] || { echo "::error::production-deployment.json was not found."; exit 1; }
          mkdir -p launch_package
          cp "$source_file" launch_package/production-deployment.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const doc = JSON.parse(readFileSync('launch_package/production-deployment.json', 'utf8'));
          const failures = [];
          if (doc.status !== 'passed') failures.push('deployment status is not passed');
          if (doc.projectId !== 'bin-group-57c60') failures.push('deployment project mismatch');
          if (doc.deployedCommitSha !== process.env.TARGET_SHA) failures.push('deployment commit mismatch');
          if (String(doc.workflowRunId || '') !== process.env.DEPLOY_RUN_ID) failures.push('deployment run mismatch');
          if (doc.workflowRef !== 'refs/heads/main' || doc.repository !== process.env.GITHUB_REPOSITORY) failures.push('deployment repository/ref mismatch');
          const digest = String(doc.validatedArtifactDigest || '').toLowerCase();
          if (!/^sha256:[a-f0-9]{64}$/.test(digest)) failures.push('validated artifact digest is invalid');
          if (failures.length) { failures.forEach((failure) => console.error(`::error::${failure}`)); process.exit(1); }
          appendFileSync(process.env.GITHUB_ENV, `VALIDATED_ARTIFACT_DIGEST=${digest}\n`);
          NODE

      - name: Verify BIN GROUP branded SMTP delivery
        if: inputs.gate == 'brandedEmailDelivery' || inputs.gate == 'all-baseline'
        working-directory: release
        run: node ../control-plane/scripts/run-frozen-release-evidence.mjs scripts/verify-smtp-live-delivery.mjs

      - name: Verify production App Check enforcement
        if: inputs.gate == 'appCheckEnforcement' || inputs.gate == 'all-baseline'
        working-directory: release
        run: node ../control-plane/scripts/run-frozen-release-evidence.mjs scripts/verify-appcheck-enforcement.mjs

      - name: Verify live Sovereign AI providers, privacy, quota and SLO
        if: inputs.gate == 'aiProviderHealth'
        working-directory: release
        env:
          PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
        run: node ../control-plane/scripts/run-frozen-release-evidence.mjs scripts/verify-ai-live-evidence.mjs

      - name: Verify live Stripe payment and exactly-once webhook replay
        if: inputs.gate == 'stripeLiveBilling'
        working-directory: release
        env:
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STRIPE_LIVE_CHECKOUT_SESSION_ID: ${{ inputs.stripe_checkout_session_id }}
          STRIPE_LIVE_WEBHOOK_EVENT_ID: ${{ inputs.stripe_webhook_event_id }}
          STRIPE_REQUIRE_REPLAY_PROOF: 'true'
        run: |
          set -euo pipefail
          stripe_key="$(gcloud secrets versions access latest --secret=STRIPE_SECRET_KEY --project="$GCP_PROJECT_ID")"
          webhook_secret="$(gcloud secrets versions access latest --secret=STRIPE_WEBHOOK_SECRET --project="$GCP_PROJECT_ID")"
          if [[ "$stripe_key" != sk_live_* ]]; then
            echo "::error::STRIPE_SECRET_KEY is not a live key."
            exit 1
          fi
          if [[ "$webhook_secret" != whsec_* ]]; then
            echo "::error::STRIPE_WEBHOOK_SECRET is invalid."
            exit 1
          fi
          echo "::add-mask::$stripe_key"
          echo "::add-mask::$webhook_secret"
          STRIPE_SECRET_KEY="$stripe_key" STRIPE_WEBHOOK_SECRET="$webhook_secret" \
            node ../control-plane/scripts/run-frozen-release-evidence.mjs scripts/verify-stripe-live-proof.mjs

      - name: Publish and finalize canonical provider evidence
        working-directory: release
        env:
          SELECTED_GATE: ${{ inputs.gate }}
        run: |
          set -euo pipefail
          if [[ "$SELECTED_GATE" == "all-baseline" ]]; then
            gates=(brandedEmailDelivery appCheckEnforcement)
          else
            gates=("$SELECTED_GATE")
          fi

          for gate in "${gates[@]}"; do
            echo "::group::Publish and finalize ${gate}"
            OPERATIONAL_GATE="$gate" node scripts/publish-operational-provider-evidence.mjs
            OPERATIONAL_GATE="$gate" node scripts/finalize-operational-provider-evidence.mjs
            echo "::endgroup::"
          done

      - name: Upload provider proof batch
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operational-provider-${{ inputs.gate }}-${{ inputs.frozen_release_sha }}
          path: |
            release/launch_package/smtp-live-proof.json
            release/launch_package/appcheck-enforcement-proof.json
            release/launch_package/ai-provider-health-proof.json
            release/launch_package/stripe-live-proof.json
            release/launch_package/production-deployment.json
          if-no-files-found: ignore
          retention-days: 365
