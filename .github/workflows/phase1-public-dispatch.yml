name: Phase 1 Public Owner Authorization Dispatcher

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: phase1-public-owner-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate Owner request and dispatch protected production release
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.title == 'Authorize protected Phase 1 public release' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'ops/dispatch-phase1-public-')
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact Owner request marker and current main
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          files="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"
          jq -e 'length == 1 and .[0].filename == ".github/phase1-public-dispatch-request"' <<<"$files" >/dev/null \
            || fail "Request must change only .github/phase1-public-dispatch-request."

          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')"
          [[ "$main_sha" == "$PR_BASE_SHA" ]] || fail "Authorization PR must be based on the exact current main SHA."

          marker_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/phase1-public-dispatch-request?ref=$PR_HEAD_SHA")"
          marker="$(jq -r '.content' <<<"$marker_json" | tr -d '\n' | base64 --decode)"
          expected_marker=$(cat <<EOF
          request=dispatch-protected-phase1-public
          expected_main_sha=$PR_BASE_SHA
          payment_methods=CASH,CHEQUE
          bank_transfer_enabled=false
          stripe_enabled=false
          hard_launch_claim=conditional-on-live-proof
          EOF
          )
          [[ "$marker" == "$expected_marker" ]] || fail "Phase 1 request marker is malformed or stale."
          echo "expected_sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "authorization_actor=$PR_ACTOR" >> "$GITHUB_OUTPUT"

      - name: Snapshot existing protected release runs
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/phase1-public-production-deploy.yml/runs?event=workflow_dispatch&per_page=50" \
            | jq -c '[.workflow_runs[].id]')"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-main Phase 1 public production release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.validate.outputs.expected_sha }}
          AUTHORIZATION_ACTOR: ${{ steps.validate.outputs.authorization_actor }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg ref main \
            --arg sha "$EXPECTED_SHA" \
            --arg actor "$AUTHORIZATION_ACTOR" \
            --arg pr "$SOURCE_PR" \
            '{ref:$ref,inputs:{expected_commit_sha:$sha,authorization_actor:$actor,authorization_source_pr:$pr,confirmation:"DEPLOY_PHASE1_PUBLIC_BIN_GROUP",hard_launch_confirmation:"AUTHORIZE_PHASE1_PUBLIC_YES_GO"}}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/phase1-public-production-deploy.yml/dispatches" \
            -d "$payload"

      - name: Correlate the new exact-SHA protected release run
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.validate.outputs.expected_sha }}
          BEFORE_IDS: ${{ steps.snapshot.outputs.ids }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p launch_package
          run_json=''
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/phase1-public-production-deploy.yml/runs?event=workflow_dispatch&branch=main&per_page=50")"
            run_json="$(jq -c \
              --arg sha "$EXPECTED_SHA" \
              --argjson before "$BEFORE_IDS" \
              '[.workflow_runs[] | select(.head_sha == $sha and ((.id as $id | $before | index($id)) == null))] | sort_by(.id) | last // empty' \
              <<<"$response")"
            [[ -n "$run_json" ]] && break
            sleep 2
          done
          [[ -n "$run_json" ]] || { echo "::error::The protected exact-SHA Phase 1 release run could not be correlated."; exit 1; }
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commitSha "$EXPECTED_SHA" \
            --arg sourcePr "$SOURCE_PR" \
            --arg authorizationActor "${{ steps.validate.outputs.authorization_actor }}" \
            --argjson run "$run_json" \
            '{schemaVersion:1,status:"dispatched",source:"owner-draft-pr",repository:$repository,commitSha:$commitSha,authorizationSourcePullRequest:($sourcePr|tonumber),authorizationActor:$authorizationActor,workflowRunId:$run.id,workflowRunUrl:$run.html_url,event:$run.event,headBranch:$run.head_branch,dispatchedAt:(now|todateiso8601),hardLaunchClaim:false}' \
            > launch_package/phase1-public-dispatch-evidence.json
          cat launch_package/phase1-public-dispatch-evidence.json

      - name: Upload sanitized dispatch evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-public-dispatch-${{ github.event.pull_request.base.sha }}
          path: launch_package/phase1-public-dispatch-evidence.json
          if-no-files-found: error
          retention-days: 90
