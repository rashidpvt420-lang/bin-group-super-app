name: Post-Merge Firestore Cleanup Verification

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: post-merge-firestore-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/remove-temporary-firestore-repair-runner

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical bounded Firestore rules
        run: node scripts/apply-current-main-firestore-expression-budget.mjs

      - name: Verify generated source state
        shell: bash
        run: |
          node --check scripts/verify-firestore-launch-hardening.mjs
          node scripts/verify-firestore-launch-hardening.mjs
          git diff --check
          git diff --stat

      - name: Commit generated Firestore rules when needed
        shell: bash
        run: |
          if git diff --quiet -- firestore.rules; then
            echo "Canonical Firestore rules are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- firestore.rules
          git diff --cached --check
          git commit -m "Commit bounded Firestore technician authorization"
          git push origin HEAD:chore/remove-temporary-firestore-repair-runner

      - name: Run Firestore and Storage rules suite
        id: rules
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce clean Firestore result
        shell: bash
        run: |
          if grep -F "maximum of 1000 expressions" rules-output.log; then
            echo "Firestore 1000-expression overflow remains."
            exit 1
          fi
          if [ "${{ steps.rules.outputs.exit_code }}" != "0" ]; then
            echo "Firestore/Storage rules suite failed."
            exit 1
          fi

      - name: Run stability suite
        run: npm run test:stability

      - name: Run launch-honesty suite
        run: npm run test:launch-honesty

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build unified app
        run: npm run build

      - name: Build admin app
        run: npm run build:admin

      - name: Build owner app
        run: npm run build:owner

      - name: Build functions
        run: npm run build:functions