name: Renewal PDF Runtime Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Full lowercase current main SHA
        required: true
        type: string
      confirmation:
        description: Enter DIAGNOSE_RENEWAL_PDF_RUNTIME
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hard-public-launch
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
      TARGET_REVISION: generateinstitutionalcontract-00247-fox
      WINDOW_START: '2026-09-20T04:46:12Z'
      WINDOW_END: '2026-09-20T04:46:16Z'
    steps:
      - name: Enforce protected diagnostic inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$TARGET_SHA" ]]
          [[ "$CONFIRMATION" == "DIAGNOSE_RENEWAL_PDF_RUNTIME" ]]
          authorized=false
          IFS=',' read -ra allowed <<< "${AUTHORIZED_FOUNDER_ACTORS:-}"
          for actor in "${allowed[@]}"; do
            actor="$(printf '%s' "$actor" | xargs)"
            if [[ -n "$actor" && "$GITHUB_ACTOR" == "$actor" ]]; then authorized=true; fi
          done
          [[ "$authorized" == "true" ]]

      - name: Checkout frozen renewal release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2ecfad30cc48f3004fc78f2db86a655e94215a15
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Inspect deployed PDF runtime identity and permissions
        shell: bash
        run: |
          set -euo pipefail

          function_json="$(gcloud functions describe generateInstitutionalContract             --gen2             --region=europe-west3             --project="$GCP_PROJECT_ID"             --format=json)"

          runtime_sa="$(jq -r '.serviceConfig.serviceAccountEmail // empty' <<< "$function_json")"
          service_resource="$(jq -r '.serviceConfig.service // empty' <<< "$function_json")"
          service_name="${service_resource##*/}"

          if [[ "$runtime_sa" != *@*.iam.gserviceaccount.com ]]; then
            [[ -n "$service_name" && "$service_name" != "$service_resource" ]] || {
              echo "::error::Unable to resolve Cloud Run service backing generateInstitutionalContract."
              exit 1
            }
            runtime_sa="$(gcloud run services describe "$service_name"               --region=europe-west3               --project="$GCP_PROJECT_ID"               --format='value(spec.template.spec.serviceAccountName)')"
          fi

          if [[ "$runtime_sa" != *@*.iam.gserviceaccount.com ]]; then
            project_number="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
            [[ "$project_number" =~ ^[0-9]+$ ]] || {
              echo "::error::Unable to resolve Google Cloud project number for default runtime identity."
              exit 1
            }
            runtime_sa="${project_number}-compute@developer.gserviceaccount.com"
            echo "::notice::No explicit runtime identity is configured; using the default Compute Engine service account."
          fi

          [[ "$runtime_sa" == *@*.iam.gserviceaccount.com ]] || {
            echo "::error::Unable to resolve production runtime service account."
            exit 1
          }

          echo "::notice::Production PDF runtime service account: $runtime_sa"

          project_roles="$(gcloud projects get-iam-policy "$GCP_PROJECT_ID"             --flatten='bindings[].members'             --filter="bindings.members:serviceAccount:$runtime_sa"             --format='value(bindings.role)' | sort -u || true)"

          if [[ -n "$project_roles" ]]; then
            while IFS= read -r role; do
              [[ -n "$role" ]] && echo "::notice::Runtime project IAM role: $role"
            done <<< "$project_roles"
          else
            echo "::warning::No project-level IAM role was visible for the runtime service account."
          fi

          self_policy="$(gcloud iam service-accounts get-iam-policy "$runtime_sa"             --project="$GCP_PROJECT_ID"             --format=json 2>/dev/null || printf '{}')"

          self_can_sign=false
          if jq -e --arg member "serviceAccount:$runtime_sa" '
            any(.bindings[]?;
              .role == "roles/iam.serviceAccountTokenCreator" and
              any(.members[]?; . == $member)
            )
          ' <<< "$self_policy" >/dev/null; then
            self_can_sign=true
          fi

          project_can_sign=false
          if grep -Fxq 'roles/iam.serviceAccountTokenCreator' <<< "$project_roles"; then
            project_can_sign=true
          fi

          if [[ "$self_can_sign" == "true" || "$project_can_sign" == "true" ]]; then
            echo "::notice::Runtime signing permission binding is present."
          else
            echo "::warning::No Service Account Token Creator binding is visible for the production runtime service account; getSignedUrl may fail at IAM signBlob."
          fi

          bucket_policy="$(gcloud storage buckets get-iam-policy "gs://bin-group-57c60.firebasestorage.app"             --project="$GCP_PROJECT_ID"             --format=json 2>/dev/null || printf '{}')"

          bucket_roles="$(jq -r --arg member "serviceAccount:$runtime_sa" '
            .bindings[]? | select(any(.members[]?; . == $member)) | .role
          ' <<< "$bucket_policy" | sort -u)"

          if [[ -n "$bucket_roles" ]]; then
            while IFS= read -r role; do
              [[ -n "$role" ]] && echo "::notice::Runtime bucket IAM role: $role"
            done <<< "$bucket_roles"
          else
            echo "::warning::No bucket-level IAM role was visible for the production runtime service account."
          fi

      - name: Apply exact reviewed storage binding for direct diagnostic
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'functions/pdfEngine.ts';
          const source = fs.readFileSync(file, 'utf8');
          const before = '    const bucket = storage.bucket();';
          const after = "    const bucket = storage.bucket('bin-group-57c60.firebasestorage.app');";
          const count = source.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected exactly one implicit bucket, found ${count}`);
          fs.writeFileSync(file, source.replace(before, after));
          NODE
          [[ "$(git hash-object functions/pdfEngine.ts)" == "62e5c8cf5fbfb25f371ee377e59c1f6ae06ec74d" ]]

      - name: Build repaired frozen Functions
        run: npm run build:functions

      - name: Run direct repaired PDF engine probe
        env:
          GOOGLE_CLOUD_PROJECT: bin-group-57c60
        run: |
          set -euo pipefail
          export DIRECT_PDF_PROBE_ID="renewal_pdf_direct_${GITHUB_RUN_ID}"
          echo "DIRECT_PDF_PROBE_ID=$DIRECT_PDF_PROBE_ID" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import admin from 'firebase-admin';
          import { generateContractPDF } from './functions/lib/pdfEngine.js';
          if (!admin.apps.length) {
            admin.initializeApp({
              projectId: 'bin-group-57c60',
              storageBucket: 'bin-group-57c60.firebasestorage.app',
            });
          }
          const id = process.env.DIRECT_PDF_PROBE_ID;
          try {
            const url = await generateContractPDF({
              contractId: id,
              propertyId: id + '_property',
              propertyName: 'Protected direct renewal PDF diagnostic',
              ownerId: 'protected-diagnostic',
            });
            if (!/^https:\/\//i.test(String(url || ''))) throw new Error('Direct PDF engine returned a non-HTTPS URL.');
            console.log('::notice::Direct repaired PDF engine probe succeeded.');
          } catch (error) {
            const message = String(error?.stack || error?.message || error || '')
              .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '[redacted-email]')
              .replace(/Bearer\s+[A-Za-z0-9._~-]+/gi, 'Bearer [redacted]')
              .replace(/AIza[0-9A-Za-z_-]{20,}/g, '[redacted-api-key]');
            console.error('::error::Direct repaired PDF engine probe failed: ' + message.slice(0, 1800));
            process.exit(1);
          }
          NODE

      - name: Clean up direct PDF probe
        if: always()
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import admin from 'firebase-admin';
          const id = String(process.env.DIRECT_PDF_PROBE_ID || '').trim();
          if (!/^renewal_pdf_direct_[0-9]+$/.test(id)) process.exit(0);
          if (!admin.apps.length) admin.initializeApp({ projectId: 'bin-group-57c60', storageBucket: 'bin-group-57c60.firebasestorage.app' });
          await admin.storage().bucket('bin-group-57c60.firebasestorage.app').deleteFiles({ prefix: `contracts/${id}/` });
          console.log('::notice::Direct PDF diagnostic cleanup complete.');
          NODE

      - name: Read exact renewal PDF runtime window
        run: |
          set -euo pipefail
          gcloud logging read             "resource.type=\"cloud_run_revision\" AND resource.labels.revision_name=\"$TARGET_REVISION\" AND timestamp>=\"$WINDOW_START\" AND timestamp<=\"$WINDOW_END\""             --project="$GCP_PROJECT_ID"             --limit=100             --order=asc             --format=json > "$RUNNER_TEMP/renewal-pdf-runtime.json"

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const entries = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/renewal-pdf-runtime.json', 'utf8'));
          const redact = (value) => String(value ?? '')
            .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '[redacted-email]')
            .replace(/Bearer\s+[A-Za-z0-9._~-]+/gi, 'Bearer [redacted]')
            .replace(/AIza[0-9A-Za-z_-]{20,}/g, '[redacted-api-key]')
            .replace(/[A-Za-z0-9_=-]{32,}/g, '[redacted-token]');
          const signals = [];
          for (const entry of entries) {
            const candidate = entry.textPayload ?? entry.jsonPayload?.message ?? entry.jsonPayload?.error ?? '';
            if (!candidate) continue;
            const text = redact(typeof candidate === 'string' ? candidate : JSON.stringify(candidate));
            if (/error|exception|failed|permission|denied|signblob|storage|bucket|pdf|font|audit|contract synthesis/i.test(text)) {
              signals.push(text.slice(0, 1200));
            }
          }
          if (!signals.length) {
            console.log('::warning::No application exception text was emitted in the exact failing revision window.');
            process.exit(0);
          }
          for (const signal of [...new Set(signals)].slice(0, 30)) {
            console.log('::notice::Renewal PDF runtime signal: ' + signal);
          }
          NODE
