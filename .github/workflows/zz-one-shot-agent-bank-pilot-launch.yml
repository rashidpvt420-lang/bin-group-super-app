name: One-shot agent bank-pilot launch
run-name: Agent bank-pilot launch · ${{ github.run_id }}

on:
  push:
    branches:
      - main
    paths:
      - .github/agent-bank-pilot-launch-trigger

permissions:
  actions: write
  contents: write

concurrency:
  group: one-shot-agent-bank-pilot-launch
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  FOUNDER_NAME: Rashid Abdul Ghani Abdul Ghani
  FOUNDER_EMAIL: ceo@bin-groups.com
  AUTHORIZATION_ACTOR: ${{ github.repository_owner }}
  INCIDENT_REFERENCE: https://github.com/rashidpvt420-lang/bin-group-super-app/issues/434

jobs:
  launch:
    name: Review, Private-HR, and dispatch bank-pilot
    if: contains(fromJSON('["cursor[bot]","rashidpvt420-lang","github-actions[bot]"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve stable main and wait out deploy cooling
        id: release
        shell: bash
        run: |
          set -euo pipefail

          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]] || {
            echo '::error::Main moved while preparing agent bank-pilot launch.'
            exit 1
          }
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

          completed_runs="$(gh api "repos/$REPOSITORY/actions/workflows/firebase-production-deploy.yml/runs?event=workflow_dispatch&branch=main&status=completed&per_page=50")"
          latest_run="$(jq -c '[.workflow_runs[]] | sort_by(.created_at) | last // empty' <<<"$completed_runs")"
          if [[ -n "$latest_run" ]]; then
            latest_conclusion="$(jq -r '.conclusion // empty' <<<"$latest_run")"
            latest_updated_at="$(jq -r '.updated_at // .created_at // empty' <<<"$latest_run")"
            if [[ "$latest_conclusion" =~ ^(failure|cancelled|timed_out)$ && -n "$latest_updated_at" ]]; then
              failed_epoch="$(date -d "$latest_updated_at" +%s)"
              now_epoch="$(date -u +%s)"
              failure_age=$((now_epoch - failed_epoch))
              if (( failure_age < 1800 )); then
                remaining=$((1800 - failure_age))
                echo "Waiting ${remaining}s for the mandatory 30-minute deploy cooling period."
                sleep "$remaining"
              fi
            fi
          fi

          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$second_sha" ]] || {
            echo "::error::Main advanced from $second_sha to $latest_main during cooling."
            exit 1
          }

      - name: Dispatch and verify exact-main privileged review
        id: review
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/owner-launch-run-correlation.sh

          wait_for_success() {
            local run_id="$1"
            for _ in $(seq 1 160); do
              local run_json status conclusion
              run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
              if [[ "$status" == 'completed' ]]; then
                [[ "$conclusion" == 'success' ]]
                return
              fi
              sleep 15
            done
            return 1
          }

          owner_snapshot_workflow_run_ids \
            privileged-account-cleanup-dry-run.yml \
            privileged-review-baseline-run-ids.json

          jq -n \
            --arg ref main \
            --arg sha "$RELEASE_SHA" \
            '{ref:$ref,inputs:{expected_commit_sha:$sha,confirmation:"REVIEW_PRIVILEGED_ACCOUNT_CLEANUP_BIN_GROUP"}}' \
            > privileged-review-dispatch.json

          gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/privileged-account-cleanup-dry-run.yml/dispatches" \
            --input privileged-review-dispatch.json

          run_record="$(
            owner_locate_new_exact_sha_workflow_run \
              privileged-account-cleanup-dry-run.yml \
              "$RELEASE_SHA" \
              privileged-review-baseline-run-ids.json \
              60 \
              5
          )"
          run_id="$(jq -r '.runId' <<<"$run_record")"
          run_url="$(jq -r '.runUrl' <<<"$run_record")"
          wait_for_success "$run_id"

          artifacts="$(
            gh api --paginate --slurp \
              "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" |
              jq -ce '{artifacts:[.[].artifacts[]]}'
          )"
          expected_artifact="privileged-account-cleanup-review-$RELEASE_SHA"
          artifact_id="$(jq -r --arg expected "$expected_artifact" '[.artifacts[] | select(.name == $expected and .expired == false)] | first | .id // empty' <<<"$artifacts")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]

          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > privileged-review.zip
          mkdir -p privileged-review
          unzip -q privileged-review.zip -d privileged-review
          report_path="$(find privileged-review -type f -name 'privileged-account-cleanup.json' -print -quit)"
          [[ -n "$report_path" && -s "$report_path" ]]

          jq -e --arg sha "$RELEASE_SHA" --arg workflow_run_id "$run_id" '
            .schemaVersion == 2 and
            .status == "dry-run" and
            .commitSha == $sha and
            .workflowRunId == $workflow_run_id and
            .canonicalFounderCount == 1 and
            .canonicalFounderReady == true and
            .founderAccountEnabled == true and
            .founderProfileActive == true and
            .founderEmailVerified == true and
            .founderPhoneMfaReady == true and
            .executionEligible == true and
            (.executionBlockers | length) == 0 and
            .privilegedAccountCountBefore == 1 and
            .deletionTargetCount == 0 and
            .deletedAccountCount == 0 and
            .mutationPerformed == false and
            .sensitiveValuesExcluded == true and
            .auditLogsPreserved == true and
            .nonPrivilegedAccountsUntouched == true and
            .hardLaunchClaim == false
          ' "$report_path" >/dev/null

          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]]

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Protected privileged review passed: $run_url"

      - name: Dispatch and verify Private-HR dry run
        id: private_hr
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/owner-launch-run-correlation.sh

          wait_for_success() {
            local run_id="$1"
            for _ in $(seq 1 160); do
              local run_json status conclusion
              run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
              if [[ "$status" == 'completed' ]]; then
                [[ "$conclusion" == 'success' ]]
                return
              fi
              sleep 15
            done
            return 1
          }

          owner_snapshot_workflow_run_ids \
            private-hr-migration-dispatch-current-main.yml \
            private-hr-baseline-run-ids.json

          jq -n --arg ref main \
            '{ref:$ref,inputs:{mode:"dry-run",confirmation:"REVIEW_PRIVATE_HR_MIGRATION_BIN_GROUP"}}' \
            > private-hr-dispatch.json

          gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/private-hr-migration-dispatch-current-main.yml/dispatches" \
            --input private-hr-dispatch.json

          run_record="$(
            owner_locate_new_exact_sha_workflow_run \
              private-hr-migration-dispatch-current-main.yml \
              "$RELEASE_SHA" \
              private-hr-baseline-run-ids.json \
              40 \
              5
          )"
          run_id="$(jq -r '.runId' <<<"$run_record")"
          run_url="$(jq -r '.runUrl' <<<"$run_record")"
          wait_for_success "$run_id"

          artifacts="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" | jq -ce '{artifacts:[.[].artifacts[]]}')"
          expected_artifact="private-hr-migration-dry-run-$RELEASE_SHA"
          artifact_id="$(jq -r --arg expected "$expected_artifact" '[.artifacts[] | select(.name == $expected and .expired == false)] | first | .id // empty' <<<"$artifacts")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]

          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > private-hr-report.zip
          mkdir -p private-hr-report
          unzip -q private-hr-report.zip -d private-hr-report
          report_path="$(find private-hr-report -type f -name private-hr-migration.json -print -quit)"
          [[ -n "$report_path" && -s "$report_path" ]]

          jq -e --arg sha "$RELEASE_SHA" '
            .schemaVersion == 2 and
            .commitSha == $sha and
            .mode == "DRY_RUN" and
            .failureCount == 0 and
            .executionRequired == false and
            .recommendedNextAction == "SKIP_EXECUTE_PROCEED_TO_BANK_PILOT" and
            .sensitiveValuesLogged == false and
            .rawIdentifiersLogged == false and
            .hardLaunchClaim == false
          ' "$report_path" >/dev/null

          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]]

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Private-HR dry run passed: $run_url"

      - name: Snapshot and dispatch protected bank-pilot production wrapper
        id: dispatch
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/owner-launch-run-correlation.sh

          # Re-check cooling immediately before dispatch in case another deploy failed mid-launch.
          completed_runs="$(gh api "repos/$REPOSITORY/actions/workflows/firebase-production-deploy.yml/runs?event=workflow_dispatch&branch=main&status=completed&per_page=50")"
          latest_run="$(jq -c '[.workflow_runs[]] | sort_by(.created_at) | last // empty' <<<"$completed_runs")"
          if [[ -n "$latest_run" ]]; then
            latest_conclusion="$(jq -r '.conclusion // empty' <<<"$latest_run")"
            latest_updated_at="$(jq -r '.updated_at // .created_at // empty' <<<"$latest_run")"
            if [[ "$latest_conclusion" =~ ^(failure|cancelled|timed_out)$ && -n "$latest_updated_at" ]]; then
              failed_epoch="$(date -d "$latest_updated_at" +%s)"
              now_epoch="$(date -u +%s)"
              failure_age=$((now_epoch - failed_epoch))
              if (( failure_age < 1800 )); then
                remaining=$((1800 - failure_age))
                echo "Pre-dispatch cooling wait ${remaining}s."
                sleep "$remaining"
              fi
            fi
          fi
          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Main advanced to $latest_main before bank-pilot dispatch of $RELEASE_SHA."
            exit 1
          }

          owner_snapshot_workflow_run_ids \
            firebase-production-dispatch-current-main.yml \
            bank-pilot-wrapper-baseline-run-ids.json
          owner_snapshot_workflow_run_ids \
            firebase-production-deploy.yml \
            firebase-production-baseline-run-ids.json

          jq -n \
            --arg ref main \
            --arg confirmation DEPLOY_PRODUCTION_BIN_GROUP_57C60 \
            --arg hard AUTHORIZE_HARD_PUBLIC_LAUNCH_BIN_GROUP \
            --arg expectedSha "$RELEASE_SHA" \
            --arg authorizationActor "$AUTHORIZATION_ACTOR" \
            --arg founderName "$FOUNDER_NAME" \
            --arg founderEmail "$FOUNDER_EMAIL" \
            --arg incidentReferences "$INCIDENT_REFERENCE" \
            '{ref:$ref,inputs:{
              confirmation:$confirmation,
              hard_launch_confirmation:$hard,
              expected_commit_sha:$expectedSha,
              authorization_actor:$authorizationActor,
              authorization_source_pr:"",
              founder_name:$founderName,
              founder_email:$founderEmail,
              launch_mode:"bank-pilot",
              run_public_release_gate:"false",
              deployment_payload_json:({
                incident_active_json:"[]",
                incident_requires_rollback:"false",
                incident_rollback_reason:"",
                incident_evidence_refs:$incidentReferences,
                hard_clearance_run_id:"",
                stripe_live_checkout_session_id:"",
                stripe_live_webhook_event_id:""
              } | tostring)
            }}' > bank-pilot-dispatch.json

          gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/firebase-production-dispatch-current-main.yml/dispatches" \
            --input bank-pilot-dispatch.json

          wrapper_record="$(
            owner_locate_new_exact_sha_workflow_run \
              firebase-production-dispatch-current-main.yml \
              "$RELEASE_SHA" \
              bank-pilot-wrapper-baseline-run-ids.json \
              60 \
              5
          )"
          production_record="$(
            owner_locate_new_exact_sha_workflow_run \
              firebase-production-deploy.yml \
              "$RELEASE_SHA" \
              firebase-production-baseline-run-ids.json \
              60 \
              5
          )"

          wrapper_run_id="$(jq -r '.runId' <<<"$wrapper_record")"
          production_run_id="$(jq -r '.runId' <<<"$production_record")"
          production_run_url="$(jq -r '.runUrl' <<<"$production_record")"

          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]]

          echo "wrapper_run_id=$wrapper_run_id" >> "$GITHUB_OUTPUT"
          echo "production_run_id=$production_run_id" >> "$GITHUB_OUTPUT"
          echo "production_run_url=$production_run_url" >> "$GITHUB_OUTPUT"
          echo "Protected Firebase Production Deploy: $production_run_url"

      - name: Publish launch summary
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REVIEW_RUN_ID: ${{ steps.review.outputs.run_id }}
          PRIVATE_HR_RUN_ID: ${{ steps.private_hr.outputs.run_id }}
          WRAPPER_RUN_ID: ${{ steps.dispatch.outputs.wrapper_run_id }}
          PRODUCTION_RUN_ID: ${{ steps.dispatch.outputs.production_run_id }}
          PRODUCTION_RUN_URL: ${{ steps.dispatch.outputs.production_run_url }}
        shell: bash
        run: |
          {
            echo '## Agent bank-pilot launch dispatched'
            echo
            echo "- Exact main SHA: \`$RELEASE_SHA\`"
            echo "- Privileged review run: \`$REVIEW_RUN_ID\`"
            echo "- Private-HR dry run: \`$PRIVATE_HR_RUN_ID\`"
            echo "- Wrapper run: \`$WRAPPER_RUN_ID\`"
            echo "- Firebase Production Deploy: $PRODUCTION_RUN_URL"
            echo '- Launch mode: bank-pilot'
            echo '- Public-release gate: false'
            echo '- Hard-launch claim: false'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Firebase Production Deploy success before mutating main
        env:
          PRODUCTION_RUN_ID: ${{ steps.dispatch.outputs.production_run_id }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCTION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          echo "Waiting for Firebase Production Deploy run $PRODUCTION_RUN_ID (SHA $RELEASE_SHA)"
          for _ in $(seq 1 240); do
            run_json="$(gh api "repos/$REPOSITORY/actions/runs/$PRODUCTION_RUN_ID")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
            head_sha="$(jq -r '.head_sha' <<<"$run_json")"
            [[ "$head_sha" == "$RELEASE_SHA" ]]
            if [[ "$status" == 'completed' ]]; then
              [[ "$conclusion" == 'success' ]] || {
                echo "::error::Firebase Production Deploy $PRODUCTION_RUN_ID concluded '$conclusion'."
                exit 1
              }
              # Confirm main was not advanced during the protected deploy window.
              current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
              [[ "$current_main" == "$RELEASE_SHA" ]] || {
                echo "::error::Main advanced to $current_main during deploy of $RELEASE_SHA."
                exit 1
              }
              echo "Firebase Production Deploy $PRODUCTION_RUN_ID succeeded for $RELEASE_SHA."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for Firebase Production Deploy $PRODUCTION_RUN_ID."
          exit 1

      - name: Remove one-shot launcher from main after green deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          rm -f .github/workflows/zz-one-shot-agent-bank-pilot-launch.yml \
                .github/agent-bank-pilot-launch-trigger
          if [[ ! -e .github/workflows/zz-one-shot-agent-bank-pilot-launch.yml && ! -e .github/agent-bank-pilot-launch-trigger ]]; then
            # files may already be absent after rm -f; stage deletions if they existed in HEAD
            :
          fi
          if git diff --quiet -- .github/workflows/zz-one-shot-agent-bank-pilot-launch.yml .github/agent-bank-pilot-launch-trigger; then
            echo 'One-shot files already absent.'
            exit 0
          fi
          git add -A .github/workflows/zz-one-shot-agent-bank-pilot-launch.yml \
                     .github/agent-bank-pilot-launch-trigger
          git commit -m "chore: remove one-shot agent bank-pilot launcher after green deploy"
          git push origin HEAD:main
