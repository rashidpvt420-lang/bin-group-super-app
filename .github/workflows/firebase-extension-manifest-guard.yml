name: Firebase Extension Manifest Guard

on:
  # This check is required by branch protection, so it must always report a
  # result for pull requests. Path-filtering a required PR check leaves it in
  # an indefinite "Expected" state on unrelated changes and blocks merges.
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - 'firebase.json'
      - 'extensions/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'tests/launch/firebase-extensions-decommission-guard.test.mjs'

permissions:
  contents: read

jobs:
  extension-manifest-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse Firebase Extension repository coupling
        run: node scripts/verify-no-firebase-extension-manifest.mjs
      - name: Verify decommission control contract
        run: node --test tests/launch/firebase-extensions-decommission-guard.test.mjs
