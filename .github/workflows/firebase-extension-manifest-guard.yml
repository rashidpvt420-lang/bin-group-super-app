name: Firebase Extension Manifest Guard

on:
  pull_request:
    paths:
      - 'firebase.json'
      - 'extensions/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'tests/launch/firebase-extensions-decommission-guard.test.mjs'
  push:
    branches:
      - main
    paths:
      - 'firebase.json'
      - 'extensions/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'tests/launch/firebase-extensions-decommission-guard.test.mjs'

permissions:
  contents: read

jobs:
  extension-manifest-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse Firebase Extension repository coupling
        run: node scripts/verify-no-firebase-extension-manifest.mjs
      - name: Verify decommission control contract
        run: node --test tests/launch/firebase-extensions-decommission-guard.test.mjs

  staff-os-staging-auth-probe:
    name: Staff OS staging WIF probe
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/staff-operating-system'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_PROJECT_ID: studio-5724711541-8a962
      PRODUCTION_PROJECT_ID: bin-group-57c60
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.STAGING_GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Enforce exact PR and staging-only boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_PROJECT_ID" = "studio-5724711541-8a962"
          test "$STAGING_PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$EXACT_HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"

      - name: Authenticate to Google Cloud by Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud CLI for staging read probe
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '>= 416.0.0'
          project_id: ${{ env.STAGING_PROJECT_ID }}

      - name: Verify staging project read access without mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project 2>/dev/null)" = "$STAGING_PROJECT_ID"
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectId)')" = "$STAGING_PROJECT_ID"
          echo "WIF token accepted and staging project is readable. No Firebase mutation performed."
