name: One-shot dispatch privileged review

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/zz-one-shot-dispatch-privileged-review.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: one-shot-dispatch-privileged-review
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Dispatch exact-main privileged cleanup dry-run
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          baseline="$(gh api "repos/$REPOSITORY/actions/workflows/privileged-account-cleanup-dry-run.yml/runs?event=workflow_dispatch&branch=main&per_page=100" --jq '.workflow_runs[].id')"

          jq -n --arg ref main --arg sha "$RELEASE_SHA" \
            '{ref:$ref,inputs:{expected_commit_sha:$sha,confirmation:"REVIEW_PRIVILEGED_ACCOUNT_CLEANUP_BIN_GROUP"}}' \
            > privileged-review-dispatch.json

          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/actions/workflows/privileged-account-cleanup-dry-run.yml/dispatches" \
            --input privileged-review-dispatch.json

          run_id=''
          for _ in $(seq 1 60); do
            runs="$(gh api "repos/$REPOSITORY/actions/workflows/privileged-account-cleanup-dry-run.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"
            selected="$(jq -c --arg sha "$RELEASE_SHA" --arg baseline "$baseline" '
              ($baseline | split("\n") | map(select(length > 0) | tonumber)) as $old
              | [.workflow_runs[]
                  | select(.head_sha == $sha)
                  | select((.id as $id | ($old | index($id))) == null)]
              | sort_by(.created_at)
              | last // empty
            ' <<<"$runs")"
            if [[ -n "$selected" ]]; then
              run_id="$(jq -r '.id // empty' <<<"$selected")"
              [[ "$run_id" =~ ^[1-9][0-9]*$ ]] && break
            fi
            sleep 2
          done

          [[ -n "$run_id" ]] || {
            echo "::error::Privileged review dispatch accepted but no new exact-SHA run was observed."
            exit 1
          }
          echo "Dispatched privileged review run $run_id for $RELEASE_SHA"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/zz-one-shot-dispatch-privileged-review.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Already removed"
            exit 0
          fi
          git commit -m "chore: remove one-shot privileged review dispatcher"
          git push origin HEAD:main
