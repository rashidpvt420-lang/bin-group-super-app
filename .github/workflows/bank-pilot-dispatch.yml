name: Dispatch Protected Bank Pilot
run-name: Bank-pilot dispatch · ${{ github.run_id }}

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, converted_to_draft]
    paths:
      - .github/bank-pilot-dispatch-request

permissions:
  actions: write
  contents: read
  pull-requests: read

# Serialize every owner bank-pilot request across the repository. A per-PR
# concurrency key allowed two draft requests for the same main SHA to race.
concurrency:
  group: bank-pilot-dispatch
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  REQUEST_PR: ${{ github.event.pull_request.number }}
  REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  FOUNDER_NAME: Rashid Abdul Ghani Abdul Ghani
  FOUNDER_EMAIL: ceo@bin-groups.com

jobs:
  dispatch:
    name: Validate exact-main gates and dispatch bank pilot
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'ops/dispatch-bank-pilot-workflow-') &&
      github.event.pull_request.title == 'Dispatch protected bank pilot workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate canonical one-file owner bank-pilot request
        id: request
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(gh api --paginate "repos/$REPOSITORY/pulls/$REQUEST_PR/files" --jq '.[].filename')
          [[ "${#files[@]}" -eq 1 && "${files[0]}" == '.github/bank-pilot-dispatch-request' ]] || {
            printf '::error::Request must change only .github/bank-pilot-dispatch-request. Found: %s\n' "${files[*]:-none}"
            exit 1
          }

          marker="$(gh api "repos/$REPOSITORY/contents/.github/bank-pilot-dispatch-request?ref=$REQUEST_HEAD_SHA" --jq '.content' | tr -d '\n' | base64 --decode)"
          request="$(sed -n 's/^request=//p' <<<"$marker")"
          review_run_id="$(sed -n 's/^review_workflow_run_id=//p' <<<"$marker")"
          incident_reference="$(sed -n 's/^incident_evidence_refs=//p' <<<"$marker")"
          public_gate="$(sed -n 's/^public_release_gate=//p' <<<"$marker")"
          hard_launch_claim="$(sed -n 's/^hard_launch_claim=//p' <<<"$marker")"
          line_count="$(awk 'END{print NR}' <<<"$marker")"

          [[ "$line_count" -eq 5 ]]
          [[ "$request" == 'dispatch-protected-bank-pilot' ]]
          [[ "$review_run_id" =~ ^[0-9]+$ ]]
          [[ "$incident_reference" == 'https://github.com/rashidpvt420-lang/bin-group-super-app/issues/434' ]]
          [[ "$public_gate" == 'false' ]]
          [[ "$hard_launch_claim" == 'false' ]]

          echo "review_run_id=$review_run_id" >> "$GITHUB_OUTPUT"
          echo "incident_reference=$incident_reference" >> "$GITHUB_OUTPUT"

      - name: Resolve stable exact current main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]] || {
            echo '::error::Main moved while preparing bank-pilot dispatch.'
            exit 1
          }
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Validate post-cleanup schema-v2 privileged review
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REVIEW_RUN_ID: ${{ steps.request.outputs.review_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$REVIEW_RUN_ID")"
          [[ "$(jq -r '.status' <<<"$run_json")" == 'completed' ]]
          [[ "$(jq -r '.conclusion' <<<"$run_json")" == 'success' ]]
          [[ "$(jq -r '.event' <<<"$run_json")" == 'workflow_dispatch' ]]
          [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$RELEASE_SHA" ]]

          artifact_name="privileged-account-cleanup-review-$RELEASE_SHA"
          artifacts="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$REVIEW_RUN_ID/artifacts?per_page=100" | jq -ce '{artifacts:[.[].artifacts[]]}')"
          artifact_id="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | first | .id // empty' <<<"$artifacts")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]

          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > privileged-review.zip
          mkdir -p privileged-review
          unzip -q privileged-review.zip -d privileged-review
          report_path="$(find privileged-review -type f -name 'privileged-account-cleanup.json' -print -quit)"
          [[ -n "$report_path" && -s "$report_path" ]]

          jq -e --arg sha "$RELEASE_SHA" --arg workflow_run_id "$REVIEW_RUN_ID" '
            .schemaVersion == 2 and
            .status == "dry-run" and
            .commitSha == $sha and
            .workflowRunId == $workflow_run_id and
            .canonicalFounderCount == 1 and
            .canonicalFounderReady == true and
            .founderAccountEnabled == true and
            .founderProfileActive == true and
            .founderEmailVerified == true and
            .founderPhoneMfaReady == true and
            .executionEligible == true and
            (.executionBlockers | length) == 0 and
            .privilegedAccountCountBefore == 1 and
            .deletionTargetCount == 0 and
            .deletedAccountCount == 0 and
            .mutationPerformed == false and
            .sensitiveValuesExcluded == true and
            .auditLogsPreserved == true and
            .nonPrivilegedAccountsUntouched == true and
            .hardLaunchClaim == false
          ' "$report_path" >/dev/null

      - name: Refuse duplicate exact-SHA production deployment
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          duplicate="$(
            gh api --paginate \
              "repos/$REPOSITORY/actions/workflows/firebase-production-deploy.yml/runs?event=workflow_dispatch&branch=main&per_page=100" \
              --jq '.workflow_runs[] | [.id, .head_sha, .status, (.conclusion // "")] | @tsv' |
            awk -F '\t' -v sha="$RELEASE_SHA" '
              $2 == sha && ($3 != "completed" || $4 == "success") {
                print
                exit
              }
            '
          )"

          if [[ -n "$duplicate" ]]; then
            IFS=$'\t' read -r duplicate_run_id _ duplicate_status duplicate_conclusion <<<"$duplicate"
            echo "::error::Exact-SHA production deployment already exists for $RELEASE_SHA: run $duplicate_run_id status=$duplicate_status conclusion=${duplicate_conclusion:-none}. Refusing duplicate dispatch."
            exit 1
          fi

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dispatch and verify current-main Private-HR dry run
        id: private_hr
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/owner-launch-run-correlation.sh

          wait_for_success() {
            local run_id="$1"
            for _ in $(seq 1 160); do
              local run_json status conclusion
              run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
              if [[ "$status" == 'completed' ]]; then
                [[ "$conclusion" == 'success' ]]
                return
              fi
              sleep 15
            done
            return 1
          }

          owner_snapshot_workflow_run_ids \
            private-hr-migration-dispatch-current-main.yml \
            private-hr-baseline-run-ids.json

          jq -n --arg ref main \
            '{ref:$ref,inputs:{mode:"dry-run",confirmation:"REVIEW_PRIVATE_HR_MIGRATION_BIN_GROUP"}}' \
            > private-hr-dispatch.json

          gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/private-hr-migration-dispatch-current-main.yml/dispatches" \
            --input private-hr-dispatch.json

          run_record="$(
            owner_locate_new_exact_sha_workflow_run \
              private-hr-migration-dispatch-current-main.yml \
              "$RELEASE_SHA" \
              private-hr-baseline-run-ids.json \
              40 \
              5
          )"
          run_id="$(jq -r '.runId' <<<"$run_record")"
          run_url="$(jq -r '.runUrl' <<<"$run_record")"
          wait_for_success "$run_id"

          artifacts="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" | jq -ce '{artifacts:[.[].artifacts[]]}')"
          expected_artifact="private-hr-migration-dry-run-$RELEASE_SHA"
          artifact_id="$(jq -r --arg expected "$expected_artifact" '[.artifacts[] | select(.name == $expected and .expired == false)] | first | .id // empty' <<<"$artifacts")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]

          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > private-hr-report.zip
          mkdir -p private-hr-report
          unzip -q private-hr-report.zip -d private-hr-report
          report_path="$(find private-hr-report -type f -name private-hr-migration.json -print -quit)"
          [[ -n "$report_path" && -s "$report_path" ]]

          jq -e --arg sha "$RELEASE_SHA" '
            .schemaVersion == 2 and
            .commitSha == $sha and
            .mode == "DRY_RUN" and
            .failureCount == 0 and
            .executionRequired == false and
            .recommendedNextAction == "SKIP_EXECUTE_PROCEED_TO_BANK_PILOT" and
            .sensitiveValuesLogged == false and
            .rawIdentifiersLogged == false and
            .hardLaunchClaim == false
          ' "$report_path" >/dev/null

          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]]

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Snapshot bank-pilot and production workflows
        shell: bash
        run: |
          set -euo pipefail
          source scripts/owner-launch-run-correlation.sh
          owner_snapshot_workflow_run_ids \
            firebase-production-dispatch-current-main.yml \
            bank-pilot-wrapper-baseline-run-ids.json
          owner_snapshot_workflow_run_ids \
            firebase-production-deploy.yml \
            firebase-production-baseline-run-ids.json

      - name: Dispatch protected exact-main bank-pilot wrapper
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          INCIDENT_REFERENCE: ${{ steps.request.outputs.incident_reference }}
          AUTHORIZATION_ACTOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          owner_request_reference="https://github.com/$REPOSITORY/pull/$REQUEST_PR"
          incident_references="$INCIDENT_REFERENCE,$owner_request_reference"

          jq -n \
            --arg ref main \
            --arg confirmation DEPLOY_PRODUCTION_BIN_GROUP_57C60 \
            --arg hard AUTHORIZE_HARD_PUBLIC_LAUNCH_BIN_GROUP \
            --arg expectedSha "$RELEASE_SHA" \
            --arg authorizationActor "$AUTHORIZATION_ACTOR" \
            --arg authorizationSourcePr "$REQUEST_PR" \
            --arg founderName "$FOUNDER_NAME" \
            --arg founderEmail "$FOUNDER_EMAIL" \
            --arg incidentReferences "$incident_references" \
            '{ref:$ref,inputs:{
              confirmation:$confirmation,
              hard_launch_confirmation:$hard,
              expected_commit_sha:$expectedSha,
              authorization_actor:$authorizationActor,
              authorization_source_pr:$authorizationSourcePr,
              founder_name:$founderName,
              founder_email:$founderEmail,
              launch_mode:"bank-pilot",
              run_public_release_gate:"false",
              deployment_payload_json:({
                incident_active_json:"[]",
                incident_requires_rollback:"false",
                incident_rollback_reason:"",
                incident_evidence_refs:$incidentReferences,
                hard_clearance_run_id:"",
                stripe_live_checkout_session_id:"",
                stripe_live_webhook_event_id:""
              } | tostring)
            }}' > bank-pilot-dispatch.json

          gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/firebase-production-dispatch-current-main.yml/dispatches" \
            --input bank-pilot-dispatch.json

      - name: Correlate bank-pilot wrapper and protected production run
        id: correlate
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REVIEW_RUN_ID: ${{ steps.request.outputs.review_run_id }}
          PRIVATE_HR_RUN_ID: ${{ steps.private_hr.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/owner-launch-run-correlation.sh
          trap 'rc=$?; if [[ "$rc" -ne 0 ]]; then jq -n --arg commitSha "$RELEASE_SHA" --arg reviewWorkflowRunId "$REVIEW_RUN_ID" --arg privateHrWorkflowRunId "$PRIVATE_HR_RUN_ID" --arg ownerRequestPullRequest "$REQUEST_PR" "{schemaVersion:1,commitSha:\$commitSha,reviewWorkflowRunId:\$reviewWorkflowRunId,privateHrWorkflowRunId:\$privateHrWorkflowRunId,ownerRequestPullRequest:\$ownerRequestPullRequest,launchMode:\"bank-pilot\",publicReleaseGate:false,hardLaunchClaim:false,correlationStatus:\"FAILED_CLOSED\",wrapperBaseline:\"bank-pilot-wrapper-baseline-run-ids.json\",productionBaseline:\"firebase-production-baseline-run-ids.json\",secretValuesLogged:false}" > bank-pilot-dispatch-correlation-failure.json; fi; exit "$rc"' EXIT

          wrapper_record="$(
            owner_locate_new_exact_sha_workflow_run \
              firebase-production-dispatch-current-main.yml \
              "$RELEASE_SHA" \
              bank-pilot-wrapper-baseline-run-ids.json \
              60 \
              5
          )"
          wrapper_run_id="$(jq -r '.runId' <<<"$wrapper_record")"
          wrapper_run_url="$(jq -r '.runUrl' <<<"$wrapper_record")"

          production_record="$(
            owner_locate_new_exact_sha_workflow_run \
              firebase-production-deploy.yml \
              "$RELEASE_SHA" \
              firebase-production-baseline-run-ids.json \
              60 \
              5
          )"
          production_run_id="$(jq -r '.runId' <<<"$production_record")"
          production_run_url="$(jq -r '.runUrl' <<<"$production_record")"

          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]]

          jq -n \
            --arg commitSha "$RELEASE_SHA" \
            --arg reviewWorkflowRunId "$REVIEW_RUN_ID" \
            --arg privateHrWorkflowRunId "$PRIVATE_HR_RUN_ID" \
            --arg wrapperWorkflowRunId "$wrapper_run_id" \
            --arg wrapperWorkflowRunUrl "$wrapper_run_url" \
            --arg productionWorkflowRunId "$production_run_id" \
            --arg productionWorkflowRunUrl "$production_run_url" \
            --arg ownerRequestPullRequest "$REQUEST_PR" \
            '{schemaVersion:1,commitSha:$commitSha,reviewWorkflowRunId:$reviewWorkflowRunId,privateHrWorkflowRunId:$privateHrWorkflowRunId,wrapperWorkflowRunId:$wrapperWorkflowRunId,wrapperWorkflowRunUrl:$wrapperWorkflowRunUrl,productionWorkflowRunId:$productionWorkflowRunId,productionWorkflowRunUrl:$productionWorkflowRunUrl,ownerRequestPullRequest:$ownerRequestPullRequest,launchMode:"bank-pilot",publicReleaseGate:false,hardLaunchClaim:false}' \
            > bank-pilot-dispatch-evidence.json

          echo "wrapper_run_id=$wrapper_run_id" >> "$GITHUB_OUTPUT"
          echo "production_run_id=$production_run_id" >> "$GITHUB_OUTPUT"
          echo "Protected bank-pilot wrapper: $wrapper_run_url"
          echo "Protected Firebase Production Deploy: $production_run_url"

      - name: Upload sanitized bank-pilot dispatch evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bank-pilot-dispatch-${{ steps.release.outputs.sha }}-${{ steps.correlate.outputs.production_run_id }}
          path: bank-pilot-dispatch-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload sanitized bank-pilot correlation failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bank-pilot-dispatch-correlation-failure-${{ steps.release.outputs.sha }}-${{ github.run_id }}
          path: bank-pilot-dispatch-correlation-failure.json
          if-no-files-found: ignore
          retention-days: 14
