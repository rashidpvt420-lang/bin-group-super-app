name: START HERE - Firebase Production Deploy
run-name: Production dispatch - ${{ inputs.launch_mode }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly DEPLOY_PRODUCTION_BIN_GROUP_57C60'
        required: true
        type: string
      hard_launch_confirmation:
        description: 'Type exactly AUTHORIZE_HARD_PUBLIC_LAUNCH_BIN_GROUP'
        required: true
        type: string
      expected_commit_sha:
        description: 'Optional automation-only exact current main SHA; leave blank for normal manual dispatch'
        required: false
        type: string
        default: ''
      authorization_actor:
        description: 'Automation-only verified Founder actor; leave blank for normal manual dispatch'
        required: false
        type: string
        default: ''
      authorization_source_pr:
        description: 'Automation-only open draft Owner request PR paired with authorization_actor'
        required: false
        type: string
        default: ''
      founder_name:
        description: 'Founder/CEO legal name'
        required: true
        type: string
      founder_email:
        description: 'Founder/CEO authorized email'
        required: true
        type: string
      launch_mode:
        description: 'Deployment mode'
        required: true
        type: choice
        options:
          - bank-pilot
          - public
        default: bank-pilot
      run_public_release_gate:
        description: 'Enable only for public launch mode'
        required: true
        type: boolean
        default: false
      deployment_payload_json:
        description: 'JSON containing incident, hard-clearance, and Stripe live-proof fields'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: firebase-production-current-main-dispatch
  cancel-in-progress: false

jobs:
  dispatch-current-main:
    name: Atomically bind and dispatch current main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate production dispatch inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          HARD_CONFIRMATION: ${{ inputs.hard_launch_confirmation }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          AUTHORIZATION_ACTOR_INPUT: ${{ inputs.authorization_actor }}
          AUTHORIZATION_SOURCE_PR_INPUT: ${{ inputs.authorization_source_pr }}
          FOUNDER_NAME: ${{ inputs.founder_name }}
          FOUNDER_EMAIL: ${{ inputs.founder_email }}
          LAUNCH_MODE: ${{ inputs.launch_mode }}
          PUBLIC_GATE: ${{ inputs.run_public_release_gate }}
          DEPLOYMENT_PAYLOAD_JSON: ${{ inputs.deployment_payload_json }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }

          if [[ "$LAUNCH_MODE" == "bank-pilot" && -z "${DEPLOYMENT_PAYLOAD_JSON// }" ]]; then
            normalized_payload='{"incident_active_json":"[]","incident_requires_rollback":"false","incident_rollback_reason":"","incident_evidence_refs":"ADMIN_MFA_BOOTSTRAP_HOSTING","hard_clearance_run_id":"","stripe_live_checkout_session_id":"","stripe_live_webhook_event_id":""}'
          else
            normalized_payload="$(printf '%s' "$DEPLOYMENT_PAYLOAD_JSON" | jq -Rsce '
              def decode_payload:
                if length == 0 then {}
                else
                  (try fromjson catch error("invalid-json"))
                  | if type == "string" then (try fromjson catch error("invalid-json-string")) else . end
                end;
              decode_payload
              | if type != "object" then error("not-object") else . end
              | {
                incident_active_json: (.incident_active_json // "[]"),
                incident_requires_rollback: ((.incident_requires_rollback // "false") | tostring),
                incident_rollback_reason: (.incident_rollback_reason // ""),
                incident_evidence_refs: (.incident_evidence_refs // ""),
                hard_clearance_run_id: (.hard_clearance_run_id // ""),
                stripe_live_checkout_session_id: (.stripe_live_checkout_session_id // ""),
                stripe_live_webhook_event_id: (.stripe_live_webhook_event_id // "")
              }
            ')" || fail "deployment_payload_json must be valid JSON object."
          fi
          INCIDENT_ACTIVE_JSON="$(jq -r '.incident_active_json' <<<"$normalized_payload")"
          INCIDENT_REQUIRES_ROLLBACK="$(jq -r '.incident_requires_rollback' <<<"$normalized_payload")"
          INCIDENT_ROLLBACK_REASON="$(jq -r '.incident_rollback_reason' <<<"$normalized_payload")"
          INCIDENT_EVIDENCE_REFS="$(jq -r '.incident_evidence_refs' <<<"$normalized_payload")"
          HARD_CLEARANCE_RUN_ID="$(jq -r '.hard_clearance_run_id' <<<"$normalized_payload")"
          STRIPE_SESSION_ID="$(jq -r '.stripe_live_checkout_session_id' <<<"$normalized_payload")"
          STRIPE_EVENT_ID="$(jq -r '.stripe_live_webhook_event_id' <<<"$normalized_payload")"

          [[ "$CONFIRMATION" == "DEPLOY_PRODUCTION_BIN_GROUP_57C60" ]] || fail "Production confirmation phrase does not match."
          [[ "$HARD_CONFIRMATION" == "AUTHORIZE_HARD_PUBLIC_LAUNCH_BIN_GROUP" ]] || fail "Hard-launch confirmation phrase does not match."
          if [[ -n "$EXPECTED_COMMIT_SHA" ]]; then
            [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "expected_commit_sha must be blank or a full lowercase 40-character SHA."
          fi
          if [[ "$GITHUB_ACTOR" == "github-actions[bot]" ]]; then
            [[ "$AUTHORIZATION_ACTOR_INPUT" =~ ^[a-z0-9-]+$ ]] || fail "Automated dispatch requires a valid verified Founder actor."
            [[ "$AUTHORIZATION_SOURCE_PR_INPUT" =~ ^[1-9][0-9]*$ ]] || fail "Automated dispatch requires a numeric Owner request PR."
          else
            [[ -z "${AUTHORIZATION_ACTOR_INPUT}${AUTHORIZATION_SOURCE_PR_INPUT}" ]] || fail "Manual dispatch cannot supply delegated Founder provenance."
            [[ "$GITHUB_ACTOR" =~ ^[a-z0-9-]+$ ]] || fail "Manual dispatch actor is invalid."
          fi
          [[ -n "${FOUNDER_NAME// }" ]] || fail "Founder name is required."
          [[ "$FOUNDER_EMAIL" == *@*.* ]] || fail "Founder email must be a valid authorized email address."
          [[ -n "${INCIDENT_EVIDENCE_REFS// }" ]] || fail "At least one incident evidence reference is required."

          jq -er 'if type == "array" then . else error("not-array") end' <<<"$INCIDENT_ACTIVE_JSON" >/dev/null \
            || fail "incident_active_json must be a valid JSON array."

          if [[ "$INCIDENT_REQUIRES_ROLLBACK" == "true" && -z "${INCIDENT_ROLLBACK_REASON// }" ]]; then
            fail "A rollback reason is required when the rollback hold is enabled."
          fi

          if [[ "$LAUNCH_MODE" == "public" ]]; then
            [[ "$PUBLIC_GATE" == "true" ]] || fail "Public mode requires the public-release gate."
            [[ "$INCIDENT_EVIDENCE_REFS" != "ADMIN_MFA_BOOTSTRAP_HOSTING" ]] || fail "ADMIN_MFA_BOOTSTRAP_HOSTING is permitted only in bank-pilot mode."
            [[ "$HARD_CLEARANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || fail "Public mode requires a numeric hard-clearance workflow run ID."
            [[ "$STRIPE_SESSION_ID" =~ ^cs_live_[A-Za-z0-9_]+$ ]] || fail "Public mode requires a valid live Stripe checkout session ID."
            [[ "$STRIPE_EVENT_ID" =~ ^evt_[A-Za-z0-9_]+$ ]] || fail "Public mode requires a valid Stripe webhook event ID."
          else
            [[ "$PUBLIC_GATE" == "false" ]] || fail "Bank-pilot mode requires the public-release gate to remain disabled."
            [[ -z "${HARD_CLEARANCE_RUN_ID}${STRIPE_SESSION_ID}${STRIPE_EVENT_ID}" ]] || fail "Bank-pilot mode requires all public-only evidence fields to remain blank."
          fi

      - name: Derive incident state and dispatch protected workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CONFIRMATION: ${{ inputs.confirmation }}
          HARD_CONFIRMATION: ${{ inputs.hard_launch_confirmation }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          AUTHORIZATION_ACTOR_INPUT: ${{ inputs.authorization_actor }}
          AUTHORIZATION_SOURCE_PR_INPUT: ${{ inputs.authorization_source_pr }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          FOUNDER_NAME: ${{ inputs.founder_name }}
          FOUNDER_EMAIL: ${{ inputs.founder_email }}
          LAUNCH_MODE: ${{ inputs.launch_mode }}
          PUBLIC_GATE: ${{ inputs.run_public_release_gate }}
          DEPLOYMENT_PAYLOAD_JSON: ${{ inputs.deployment_payload_json }}
        run: |
          set -euo pipefail

          authorization_actor="$GITHUB_ACTOR"
          if [[ "$GITHUB_ACTOR" == "github-actions[bot]" ]]; then
            [[ "$AUTHORIZATION_ACTOR_INPUT" =~ ^[a-z0-9-]+$ ]]
            [[ "$AUTHORIZATION_SOURCE_PR_INPUT" =~ ^[1-9][0-9]*$ ]]
            source_pr="$(gh api "repos/$REPOSITORY/pulls/$AUTHORIZATION_SOURCE_PR_INPUT")"
            [[ "$(jq -r '.state' <<<"$source_pr")" == "open" ]]
            [[ "$(jq -r '.draft' <<<"$source_pr")" == "true" ]]
            [[ "$(jq -r '.title' <<<"$source_pr")" == "Dispatch protected bank pilot workflow" ]]
            [[ "$(jq -r '.base.ref' <<<"$source_pr")" == "main" ]]
            [[ "$(jq -r '.head.repo.full_name' <<<"$source_pr")" == "$REPOSITORY" ]]
            [[ "$(jq -r '.user.login' <<<"$source_pr")" == "$AUTHORIZATION_ACTOR_INPUT" ]]
            [[ "$AUTHORIZATION_ACTOR_INPUT" == "$REPOSITORY_OWNER" ]]
            [[ "$(jq -r '.head.ref' <<<"$source_pr")" == ops/dispatch-bank-pilot-workflow-* ]]
            mapfile -t source_files < <(gh api --paginate "repos/$REPOSITORY/pulls/$AUTHORIZATION_SOURCE_PR_INPUT/files" --jq '.[].filename')
            [[ "${#source_files[@]}" -eq 1 && "${source_files[0]}" == '.github/bank-pilot-dispatch-request' ]]
            authorization_actor="$AUTHORIZATION_ACTOR_INPUT"
          else
            [[ -z "${AUTHORIZATION_ACTOR_INPUT}${AUTHORIZATION_SOURCE_PR_INPUT}" ]]
            [[ "$GITHUB_ACTOR" =~ ^[a-z0-9-]+$ ]]
          fi

          if [[ "$LAUNCH_MODE" == "bank-pilot" && -z "${DEPLOYMENT_PAYLOAD_JSON// }" ]]; then
            normalized_payload='{"incident_active_json":"[]","incident_requires_rollback":"false","incident_rollback_reason":"","incident_evidence_refs":"ADMIN_MFA_BOOTSTRAP_HOSTING","hard_clearance_run_id":"","stripe_live_checkout_session_id":"","stripe_live_webhook_event_id":""}'
          else
            normalized_payload="$(printf '%s' "$DEPLOYMENT_PAYLOAD_JSON" | jq -Rsce '
              def decode_payload:
                if length == 0 then {}
                else
                  (try fromjson catch error("invalid-json"))
                  | if type == "string" then (try fromjson catch error("invalid-json-string")) else . end
                end;
              decode_payload
              | if type != "object" then error("not-object") else . end
              | {
                incident_active_json: (.incident_active_json // "[]"),
                incident_requires_rollback: ((.incident_requires_rollback // "false") | tostring),
                incident_rollback_reason: (.incident_rollback_reason // ""),
                incident_evidence_refs: (.incident_evidence_refs // ""),
                hard_clearance_run_id: (.hard_clearance_run_id // ""),
                stripe_live_checkout_session_id: (.stripe_live_checkout_session_id // ""),
                stripe_live_webhook_event_id: (.stripe_live_webhook_event_id // "")
              }
            ')" || {
              echo "::error::deployment_payload_json must be valid JSON object."
              exit 1
            }
          fi
          INCIDENT_ACTIVE_JSON="$(jq -r '.incident_active_json' <<<"$normalized_payload")"
          INCIDENT_REQUIRES_ROLLBACK="$(jq -r '.incident_requires_rollback' <<<"$normalized_payload")"
          INCIDENT_ROLLBACK_REASON="$(jq -r '.incident_rollback_reason' <<<"$normalized_payload")"
          INCIDENT_EVIDENCE_REFS="$(jq -r '.incident_evidence_refs' <<<"$normalized_payload")"
          HARD_CLEARANCE_RUN_ID="$(jq -r '.hard_clearance_run_id' <<<"$normalized_payload")"
          STRIPE_SESSION_ID="$(jq -r '.stripe_live_checkout_session_id' <<<"$normalized_payload")"
          STRIPE_EVENT_ID="$(jq -r '.stripe_live_webhook_event_id' <<<"$normalized_payload")"

          active_count="$(jq -er 'length' <<<"$INCIDENT_ACTIVE_JSON")"
          incident_failed='false'
          resolved_failed_at=''
          latest_run_id=''

          completed_runs="$(gh api "repos/$REPOSITORY/actions/workflows/firebase-production-deploy.yml/runs?event=workflow_dispatch&branch=main&status=completed&per_page=50")"
          latest_run="$(jq -c '[.workflow_runs[]] | sort_by(.created_at) | last // empty' <<<"$completed_runs")"

          if [[ -n "$latest_run" ]]; then
            latest_run_id="$(jq -r '.id // empty' <<<"$latest_run")"
            latest_conclusion="$(jq -r '.conclusion // empty' <<<"$latest_run")"
            latest_created_at="$(jq -r '.created_at // empty' <<<"$latest_run")"
            latest_updated_at="$(jq -r '.updated_at // empty' <<<"$latest_run")"

            if [[ "$latest_conclusion" =~ ^(failure|cancelled|timed_out)$ ]]; then
              incident_failed='true'
              resolved_failed_at="${latest_updated_at:-$latest_created_at}"
              [[ -n "$resolved_failed_at" ]] || {
                echo "::error::The latest unsuccessful Firebase Production Deploy run has no usable timestamp."
                exit 1
              }
              failed_epoch="$(date -d "$resolved_failed_at" +%s 2>/dev/null || true)"
              [[ -n "$failed_epoch" ]] || {
                echo "::error::The latest unsuccessful deployment timestamp is not valid ISO-8601."
                exit 1
              }
              now_epoch="$(date -u +%s)"
              failure_age=$((now_epoch - failed_epoch))
              if (( failure_age < 0 )); then
                echo "::error::The latest unsuccessful deployment timestamp cannot be in the future."
                exit 1
              fi
              if (( failure_age < 1800 )); then
                remaining=$((1800 - failure_age))
                echo "::error::The unsuccessful deployment is still inside the mandatory 30-minute cooling period. Retry after approximately $(((remaining + 59) / 60)) minute(s)."
                exit 1
              fi
              echo "Automatically detected unsuccessful Firebase Production Deploy run $latest_run_id ($latest_conclusion) at $resolved_failed_at."
            else
              echo "Latest completed Firebase Production Deploy run $latest_run_id concluded '$latest_conclusion'; unsuccessful-state recovery is not required."
            fi
          else
            echo "No completed Firebase Production Deploy run exists; treating this as the first protected deployment."
          fi

          if [[ "$active_count" == "0" && "$INCIDENT_REQUIRES_ROLLBACK" == "false" && "$incident_failed" == "false" ]]; then
            incident_attestation='ATTEST_PRODUCTION_INCIDENT_STATE_CLEAR'
          else
            incident_attestation='ATTEST_PRODUCTION_INCIDENT_STATE_WITH_HOLDS'
          fi
          echo "Derived incident attestation: $incident_attestation"

          resolved_evidence_refs="$INCIDENT_EVIDENCE_REFS"
          if [[ "$incident_failed" == "true" && -n "$latest_run_id" ]]; then
            resolved_evidence_refs="$resolved_evidence_refs,GITHUB_PRODUCTION_RUN_$latest_run_id"
          fi

          main_sha=''
          for attempt in 1 2 3 4 5; do
            main_before="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
            [[ "$main_before" =~ ^[0-9a-f]{40}$ ]]
            if [[ -n "$EXPECTED_COMMIT_SHA" && "$main_before" != "$EXPECTED_COMMIT_SHA" ]]; then
              echo "::error::Current main $main_before no longer matches verified expected SHA $EXPECTED_COMMIT_SHA."
              exit 1
            fi
            sleep 3
            main_after="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
            if [[ "$main_before" == "$main_after" ]]; then
              main_sha="$main_after"
              break
            fi
            echo "main advanced during stability check; retrying ($attempt/5)."
          done

          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Unable to resolve a stable current main SHA after five attempts."
            exit 1
          }
          if [[ -n "$EXPECTED_COMMIT_SHA" && "$main_sha" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "::error::Stable current main $main_sha does not match verified expected SHA $EXPECTED_COMMIT_SHA."
            exit 1
          fi

          baseline_ids="$(gh api "repos/$REPOSITORY/actions/workflows/firebase-production-deploy.yml/runs?event=workflow_dispatch&branch=main&per_page=100" --jq '.workflow_runs[].id')"
          production_payload="$(
            jq -cn \
              --arg incidentAttestation "$incident_attestation" \
              --arg incidentActive "$INCIDENT_ACTIVE_JSON" \
              --arg incidentRollback "$INCIDENT_REQUIRES_ROLLBACK" \
              --arg incidentRollbackReason "$INCIDENT_ROLLBACK_REASON" \
              --arg incidentFailed "$incident_failed" \
              --arg incidentFailedAt "$resolved_failed_at" \
              --arg evidenceRefs "$resolved_evidence_refs" \
              --arg clearanceRun "$HARD_CLEARANCE_RUN_ID" \
              --arg stripeSession "$STRIPE_SESSION_ID" \
              --arg stripeEvent "$STRIPE_EVENT_ID" \
              '{incident_attestation:$incidentAttestation,incident_active_json:$incidentActive,incident_requires_rollback:$incidentRollback,incident_rollback_reason:$incidentRollbackReason,incident_last_deployment_failed:$incidentFailed,incident_last_deployment_failed_at:$incidentFailedAt,incident_evidence_refs:$evidenceRefs,hard_clearance_run_id:$clearanceRun,stripe_live_checkout_session_id:$stripeSession,stripe_live_webhook_event_id:$stripeEvent}'
          )"

          jq -n \
            --arg ref main \
            --arg confirmation "$CONFIRMATION" \
            --arg hard "$HARD_CONFIRMATION" \
            --arg sha "$main_sha" \
            --arg authorizationActor "$authorization_actor" \
            --arg founderName "$FOUNDER_NAME" \
            --arg founderEmail "$FOUNDER_EMAIL" \
            --arg launchMode "$LAUNCH_MODE" \
            --arg publicGate "$PUBLIC_GATE" \
            --arg deploymentPayload "$production_payload" \
            '{ref:$ref,inputs:{confirmation:$confirmation,hard_launch_confirmation:$hard,expected_commit_sha:$sha,authorization_actor:$authorizationActor,founder_name:$founderName,founder_email:$founderEmail,launch_mode:$launchMode,run_public_release_gate:$publicGate,deployment_payload_json:$deploymentPayload}}' \
            > dispatch.json

          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/actions/workflows/firebase-production-deploy.yml/dispatches" \
            --input dispatch.json

          run_id=''
          run_sha=''
          for poll in $(seq 1 60); do
            runs_json="$(gh api "repos/$REPOSITORY/actions/workflows/firebase-production-deploy.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"
            selected="$(jq -c --arg sha "$main_sha" --arg baseline "$baseline_ids" '
              ($baseline | split("\n") | map(select(length > 0) | tonumber)) as $old
              | [.workflow_runs[]
                  | select(.head_sha == $sha)
                  | select((.id as $id | ($old | index($id))) == null)]
              | sort_by(.created_at)
              | last // empty
            ' <<<"$runs_json")"
            if [[ -n "$selected" ]]; then
              run_id="$(jq -r '.id // empty' <<<"$selected")"
              run_sha="$(jq -r '.head_sha // empty' <<<"$selected")"
              [[ "$run_id" =~ ^[1-9][0-9]*$ && "$run_sha" =~ ^[0-9a-f]{40}$ ]] && break
            fi
            sleep 2
          done

          if [[ -z "$run_id" || -z "$run_sha" ]]; then
            echo "::error::The protected deployment dispatch was accepted, but no new exact-SHA run was observable after 120 seconds. No duplicate dispatch was attempted."
            exit 1
          fi

          current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$current_main" != "$main_sha" ]]; then
            echo "Dispatch race detected: main advanced from $main_sha to $current_main. Cancelling run $run_id."
            gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" || true
            exit 1
          fi

          [[ "$run_sha" == "$main_sha" ]] || {
            echo "Dispatch race detected: expected $main_sha but GitHub resolved $run_sha. Cancelling run $run_id."
            gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" || true
            exit 1
          }

          echo "Protected Firebase Production Deploy run $run_id is bound to exact SHA $main_sha."
          echo "Delegated Founder authorization actor: $authorization_actor"
