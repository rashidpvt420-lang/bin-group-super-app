name: Fix Final OTP Contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/fix-final-otp-contract.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: fix-final-otp-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix-test-commit:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/finalize-launch-evidence-sequence' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-launch-evidence-sequence
          fetch-depth: 0

      - name: Apply exact reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fix-final-otp-review-blockers.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-final-otp-review-corrections.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-final-otp-review-corrections.py

          python3 <<'PY'
          from pathlib import Path

          path = Path('test/hard-launch-gate.test.mjs')
          source = path.read_text(encoding='utf-8')
          before = """  const owner = readFileSync('tests/e2e/business-owner.spec.ts', 'utf8');
            const tenant = readFileSync('tests/e2e/business-tenant.spec.ts', 'utf8');
            assert.match(owner, /E2E_OWNER_MAILBOX_EMAIL/);"""
          after = """  const owner = readFileSync('tests/e2e/business-owner.spec.ts', 'utf8');
            const broker = readFileSync('tests/e2e/business-broker.spec.ts', 'utf8');
            const tenant = readFileSync('tests/e2e/business-tenant.spec.ts', 'utf8');
            assert.match(owner, /E2E_OWNER_EMAIL/);
            assert.doesNotMatch(owner, /E2E_OWNER_MAILBOX_EMAIL/);
            assert.match(broker, /E2E_BROKER_EMAIL/);
            assert.doesNotMatch(broker, /E2E_BROKER_MAILBOX_EMAIL/);"""
          before_count = source.count(before)
          after_count = source.count(after)
          if before_count == 1:
              path.write_text(source.replace(before, after), encoding='utf-8')
          elif not (before_count == 0 and after_count == 1):
              raise RuntimeError(
                  'hard-launch identity contract is ambiguous: '
                  f'legacy={before_count} canonical={after_count}'
              )
          PY

      - name: Verify generated JavaScript syntax
        run: |
          node --check scripts/run-owner-onboarding-production-evidence-secure.mjs
          node --check scripts/run-broker-production-evidence.mjs
          node --check test/hard-launch-gate.test.mjs

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: TypeScript check
        run: npm run typecheck

      - name: Run focused OTP and identity contracts
        run: |
          node --test --test-reporter=spec \
            test/hard-launch-gate.test.mjs \
            tests/launch/e2e-mailbox-env-contract.test.mjs \
            tests/launch/owner-onboarding-production-proof.test.mjs \
            tests/launch/broker-payout-otp-live-evidence.test.mjs \
            tests/launch/broker-otp-hmac-evidence.test.mjs \
            tests/launch/otp-correlation-contract.test.mjs \
            tests/launch/workflow-mailbox-secret-scope.test.mjs

      - name: Run complete launch-honesty suite
        run: npm run test:launch-honesty

      - name: Commit only reviewed permanent files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            functions/contractSignatureOtpMailbox.ts
            scripts/run-owner-onboarding-production-evidence-secure.mjs
            scripts/run-broker-production-evidence.mjs
            src/broker/pages/BrokerCommissionsPage.tsx
            test/hard-launch-gate.test.mjs
            tests/e2e/business-owner.spec.ts
            tests/e2e/business-broker.spec.ts
          )
          git add -- "${files[@]}"
          diff -u \
            <(printf '%s\n' "${files[@]}" | sort) \
            <(git diff --cached --name-only | sort)
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(launch): resolve final OTP identity contracts'
          git push origin HEAD:agent/finalize-launch-evidence-sequence
