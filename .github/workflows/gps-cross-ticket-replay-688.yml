name: Apply GPS Cross Ticket Replay Safeguard 688

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/gps-cross-ticket-replay-688.yml
      - .github/scripts/apply-gps-cross-ticket-replay-688.py

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 688 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/map-gps-truth-p1-current-main' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/map-gps-truth-p1-current-main
          fetch-depth: 0
      - name: Apply deterministic cross-ticket replay patch
        run: python .github/scripts/apply-gps-cross-ticket-replay-688.py
      - name: Commit reviewed changes and remove one-off patch machinery
        run: |
          set -euo pipefail
          git rm .github/scripts/apply-gps-cross-ticket-replay-688.py .github/workflows/gps-cross-ticket-replay-688.yml
          git add src/utils/liveTracking.ts tests/launch/gps-queue-durability-privacy.test.mjs
          git diff --cached --quiet && { echo '::error::Cross-ticket replay patch produced no changes.'; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(gps): discard stale updates before STOP reconciliation'
          git push origin HEAD:fix/map-gps-truth-p1-current-main
