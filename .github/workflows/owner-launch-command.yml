name: Owner Launch Command
run-name: Owner launch command · ${{ github.event.comment.body }}

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: owner-launch-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch-controlled-launch:
    name: Dispatch protected controlled-launch workflows
    if: >-
      github.event.issue.number == 434 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      (github.event.comment.body == '/bin-launch prepare-bank-pilot' ||
       github.event.comment.body == '/bin-launch bank-pilot-after-mfa')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '434'
      COMMAND: ${{ github.event.comment.body }}
      FOUNDER_NAME: Rashid Abdul Ghani Abdul Ghani
      FOUNDER_EMAIL: ceo@bin-groups.com

    steps:
      - name: Validate exact owner command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND" in
            '/bin-launch prepare-bank-pilot')
              echo 'kind=prepare-bank-pilot' >> "$GITHUB_OUTPUT"
              echo 'incident_reference=ADMIN_MFA_BOOTSTRAP_HOSTING' >> "$GITHUB_OUTPUT"
              ;;
            '/bin-launch bank-pilot-after-mfa')
              echo 'kind=bank-pilot-after-mfa' >> "$GITHUB_OUTPUT"
              echo 'incident_reference=https://github.com/rashidpvt420-lang/bin-group-super-app/issues/434' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo '::error::Unsupported owner command. Use exactly /bin-launch prepare-bank-pilot or /bin-launch bank-pilot-after-mfa.'
              exit 1
              ;;
          esac

      - name: Resolve stable current main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]]
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dispatch and verify current-main private HR dry run
        id: private_hr
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/owner-launch-run-correlation.sh

          post_comment() {
            gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$1" >/dev/null
          }

          wait_for_success() {
            local run_id="$1"
            for _ in $(seq 1 160); do
              local run_json status conclusion
              run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
              if [[ "$status" == 'completed' ]]; then
                [[ "$conclusion" == 'success' ]]
                return
              fi
              sleep 15
            done
            return 1
          }

          owner_snapshot_workflow_run_ids \
            private-hr-migration-dispatch-current-main.yml \
            private-hr-baseline-run-ids.json

          jq -n \
            --arg ref main \
            '{ref:$ref,inputs:{mode:"dry-run",confirmation:"REVIEW_PRIVATE_HR_MIGRATION_BIN_GROUP"}}' \
            > private-hr-dispatch.json

          gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/private-hr-migration-dispatch-current-main.yml/dispatches" \
            --input private-hr-dispatch.json

          run_record="$(
            owner_locate_new_exact_sha_workflow_run \
              private-hr-migration-dispatch-current-main.yml \
              "$RELEASE_SHA" \
              private-hr-baseline-run-ids.json \
              40 \
              5
          )" || {
            post_comment "The current-main Private-HR dispatch was accepted once for \`$RELEASE_SHA\`, but no unique new exact-SHA run could be correlated. No duplicate dispatch was attempted. Launch preparation stopped."
            exit 1
          }
          run_id="$(jq -r '.runId' <<<"$run_record")"
          run_url="$(jq -r '.runUrl' <<<"$run_record")"
          post_comment "Current-main Private-HR dry run started for exact SHA \`$RELEASE_SHA\`: $run_url"

          if ! wait_for_success "$run_id"; then
            post_comment "Private-HR dry run failed or timed out for \`$RELEASE_SHA\`: $run_url. Bank-pilot was not dispatched."
            exit 1
          fi

          artifacts="$(
            gh api --paginate --slurp \
              "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" |
              jq -ce '{artifacts: [.[].artifacts[]]}'
          )"
          expected_artifact="private-hr-migration-dry-run-$RELEASE_SHA"
          artifact_id="$(jq -r --arg expected "$expected_artifact" '[.artifacts[] | select(.name == $expected and .expired == false)] | first | .id // empty' <<<"$artifacts")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || {
            post_comment "Private-HR run succeeded but exact-SHA artifact \`$expected_artifact\` is missing. Bank-pilot was not dispatched."
            exit 1
          }

          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > private-hr-report.zip
          mkdir -p private-hr-report
          unzip -q private-hr-report.zip -d private-hr-report
          report_path="$(find private-hr-report -type f -name private-hr-migration.json -print -quit)"
          [[ -n "$report_path" && -s "$report_path" ]]
          jq -e --arg sha "$RELEASE_SHA" '
            .schemaVersion == 2 and
            .commitSha == $sha and
            .mode == "DRY_RUN" and
            .failureCount == 0 and
            .sensitiveValuesLogged == false and
            .rawIdentifiersLogged == false and
            .hardLaunchClaim == false
          ' "$report_path" >/dev/null

          execution_required="$(jq -r '.executionRequired' "$report_path")"
          recommended_action="$(jq -r '.recommendedNextAction' "$report_path")"
          if [[ "$execution_required" != 'false' || "$recommended_action" != 'SKIP_EXECUTE_PROCEED_TO_BANK_PILOT' ]]; then
            candidate_count="$(jq -r '.recordsRequiringMigration' "$report_path")"
            post_comment "Private-HR dry run found \`$candidate_count\` migration candidate(s) for \`$RELEASE_SHA\`. Execute mode requires separate protected review; bank-pilot was not dispatched."
            exit 1
          fi

          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]] || {
            post_comment "Main advanced from \`$RELEASE_SHA\` to \`$latest_main\` after the Private-HR run. Launch preparation stopped and must restart."
            exit 1
          }

          post_comment "Private-HR decision for \`$RELEASE_SHA\`: zero failures, execution not required, proceed to protected bank-pilot."
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Dispatch protected bank-pilot wrapper
        id: deployment
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          INCIDENT_REFERENCE: ${{ steps.command.outputs.incident_reference }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/owner-launch-run-correlation.sh

          post_comment() {
            gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$1" >/dev/null
          }

          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]]

          owner_snapshot_workflow_run_ids \
            firebase-production-dispatch-current-main.yml \
            bank-pilot-wrapper-baseline-run-ids.json
          owner_snapshot_workflow_run_ids \
            firebase-production-deploy.yml \
            firebase-production-baseline-run-ids.json

          jq -n \
            --arg ref main \
            --arg confirmation DEPLOY_PRODUCTION_BIN_GROUP_57C60 \
            --arg hard AUTHORIZE_HARD_PUBLIC_LAUNCH_BIN_GROUP \
            --arg expectedSha "$RELEASE_SHA" \
            --arg founderName "$FOUNDER_NAME" \
            --arg founderEmail "$FOUNDER_EMAIL" \
            --arg incidentReference "$INCIDENT_REFERENCE" \
            '{ref:$ref,inputs:{
              confirmation:$confirmation,
              hard_launch_confirmation:$hard,
              expected_commit_sha:$expectedSha,
              founder_name:$founderName,
              founder_email:$founderEmail,
              launch_mode:"bank-pilot",
              run_public_release_gate:"false",
              incident_active_json:"[]",
              incident_requires_rollback:"false",
              incident_rollback_reason:"",
              incident_evidence_refs:$incidentReference,
              hard_clearance_run_id:"",
              stripe_live_checkout_session_id:"",
              stripe_live_webhook_event_id:""
            }}' > bank-pilot-dispatch.json

          gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/firebase-production-dispatch-current-main.yml/dispatches" \
            --input bank-pilot-dispatch.json

          dispatcher_record="$(
            owner_locate_new_exact_sha_workflow_run \
              firebase-production-dispatch-current-main.yml \
              "$RELEASE_SHA" \
              bank-pilot-wrapper-baseline-run-ids.json \
              60 \
              5
          )" || {
            post_comment "Bank-pilot wrapper was accepted once for \`$RELEASE_SHA\`, but no unique new exact-SHA wrapper run could be correlated. No duplicate dispatch was attempted and no mismatched deployment is authorized."
            exit 1
          }
          dispatcher_run="$(jq -r '.runId' <<<"$dispatcher_record")"
          dispatcher_url="$(jq -r '.runUrl' <<<"$dispatcher_record")"
          post_comment "Exact-SHA bank-pilot wrapper started for \`$RELEASE_SHA\`: $dispatcher_url"

          if production_record="$(
            owner_locate_new_exact_sha_workflow_run \
              firebase-production-deploy.yml \
              "$RELEASE_SHA" \
              firebase-production-baseline-run-ids.json \
              60 \
              5
          )"; then
            production_run="$(jq -r '.runId' <<<"$production_record")"
            production_url="$(jq -r '.runUrl' <<<"$production_record")"
          else
            dispatcher_json="$(gh api "repos/$REPOSITORY/actions/runs/$dispatcher_run")"
            dispatcher_status="$(jq -r '.status' <<<"$dispatcher_json")"
            dispatcher_conclusion="$(jq -r '.conclusion // empty' <<<"$dispatcher_json")"
            post_comment "The exact-SHA bank-pilot wrapper did not create a uniquely correlated Firebase Production Deploy run. Wrapper status: \`$dispatcher_status\`; conclusion: \`${dispatcher_conclusion:-pending}\`. Review $dispatcher_url. No duplicate dispatch was attempted."
            exit 1
          fi

          post_comment "Protected Firebase Production Deploy created for exact SHA \`$RELEASE_SHA\`: $production_url"

          echo "dispatcher_run_url=$dispatcher_url" >> "$GITHUB_OUTPUT"
          echo "production_run_url=$production_url" >> "$GITHUB_OUTPUT"

      - name: Publish controlled-launch command summary
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          PRIVATE_HR_RUN: ${{ steps.private_hr.outputs.run_url }}
          DISPATCHER_RUN: ${{ steps.deployment.outputs.dispatcher_run_url }}
          PRODUCTION_RUN: ${{ steps.deployment.outputs.production_run_url }}
        shell: bash
        run: |
          {
            echo '## Owner controlled-launch command accepted'
            echo
            echo "- Exact main SHA: \`$RELEASE_SHA\`"
            echo "- Private-HR dry run: $PRIVATE_HR_RUN"
            echo "- Bank-pilot wrapper: $DISPATCHER_RUN"
            echo "- Protected production run: $PRODUCTION_RUN"
            echo '- Public deployment: not requested'
            echo '- Hard-clearance: not requested'
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-production-diagnosis:
    name: Run protected production diagnosis
    if: >-
      github.event.issue.number == 434 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/bin-launch diagnose-latest-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '434'

    steps:
      - name: Resolve stable current main for diagnosis
        id: release
        shell: bash
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]] || {
            echo '::error::Main changed while authorizing production diagnosis.'
            exit 1
          }
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main for diagnosis
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run exact-main sanitized diagnosis
        id: diagnosis
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: bash scripts/run-owner-production-diagnosis.sh

      - name: Upload safe diagnostic evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.diagnosis.outputs.artifact_name }}
          path: |
            launch_package/firebase-production-failure.json
            launch_package/firebase-production-failure.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish owner diagnosis summary
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SOURCE_RUN_URL: ${{ steps.diagnosis.outputs.run_url }}
          ARTIFACT_NAME: ${{ steps.diagnosis.outputs.artifact_name }}
        shell: bash
        run: |
          {
            echo '## Owner production diagnosis completed'
            echo
            echo "- Resolved main SHA: \`$RELEASE_SHA\`"
            echo "- Diagnosed production run: $SOURCE_RUN_URL"
            echo "- Sanitized artifact: \`$ARTIFACT_NAME\`"
            echo '- Production mutation: none'
            echo '- Raw job log uploaded: false'
            echo '- Hard-launch claim: false'
          } >> "$GITHUB_STEP_SUMMARY"
