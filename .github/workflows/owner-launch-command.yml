name: Owner Launch Command
run-name: Owner launch command · ${{ github.event.comment.body }}

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: owner-launch-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare-protected-bank-pilot:
    name: Generate exact-main privileged review for protected PR handoff
    if: >-
      github.event.issue.number == 434 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      (github.event.comment.body == '/bin-launch prepare-bank-pilot' ||
       github.event.comment.body == '/bin-launch bank-pilot-after-mfa')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '434'
      COMMAND: ${{ github.event.comment.body }}

    steps:
      - name: Validate exact owner command
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND" in
            '/bin-launch prepare-bank-pilot'|'/bin-launch bank-pilot-after-mfa') ;;
            *)
              echo '::error::Unsupported owner command.'
              exit 1
              ;;
          esac

      - name: Resolve stable current main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]] || {
            echo '::error::Main moved while preparing the protected review.'
            exit 1
          }
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dispatch and verify exact-main privileged account review
        id: review
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/owner-launch-run-correlation.sh

          post_comment() {
            gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$1" >/dev/null
          }

          wait_for_success() {
            local run_id="$1"
            for _ in $(seq 1 160); do
              local run_json status conclusion
              run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
              if [[ "$status" == 'completed' ]]; then
                [[ "$conclusion" == 'success' ]]
                return
              fi
              sleep 15
            done
            return 1
          }

          owner_snapshot_workflow_run_ids \
            privileged-account-cleanup-dry-run.yml \
            privileged-review-baseline-run-ids.json

          jq -n \
            --arg ref main \
            --arg sha "$RELEASE_SHA" \
            '{ref:$ref,inputs:{expected_commit_sha:$sha,confirmation:"REVIEW_PRIVILEGED_ACCOUNT_CLEANUP_BIN_GROUP"}}' \
            > privileged-review-dispatch.json

          gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/privileged-account-cleanup-dry-run.yml/dispatches" \
            --input privileged-review-dispatch.json

          run_record="$(
            owner_locate_new_exact_sha_workflow_run \
              privileged-account-cleanup-dry-run.yml \
              "$RELEASE_SHA" \
              privileged-review-baseline-run-ids.json \
              60 \
              5
          )" || {
            post_comment "The privileged-account review was accepted once for \`$RELEASE_SHA\`, but no unique new exact-SHA run could be correlated. No duplicate dispatch was attempted."
            exit 1
          }

          run_id="$(jq -r '.runId' <<<"$run_record")"
          run_url="$(jq -r '.runUrl' <<<"$run_record")"
          post_comment "Exact-SHA privileged-account review started for \`$RELEASE_SHA\`: $run_url"

          if ! wait_for_success "$run_id"; then
            post_comment "Privileged-account review failed or timed out for \`$RELEASE_SHA\`: $run_url. No bank-pilot request was authorized."
            exit 1
          fi

          artifacts="$(
            gh api --paginate --slurp \
              "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" |
              jq -ce '{artifacts:[.[].artifacts[]]}'
          )"
          expected_artifact="privileged-account-cleanup-review-$RELEASE_SHA"
          artifact_id="$(jq -r --arg expected "$expected_artifact" '[.artifacts[] | select(.name == $expected and .expired == false)] | first | .id // empty' <<<"$artifacts")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || {
            post_comment "Privileged-account review succeeded but exact-SHA artifact \`$expected_artifact\` is missing."
            exit 1
          }

          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > privileged-review.zip
          mkdir -p privileged-review
          unzip -q privileged-review.zip -d privileged-review
          report_path="$(find privileged-review -type f -name 'privileged-account-cleanup.json' -print -quit)"
          [[ -n "$report_path" && -s "$report_path" ]]

          jq -e --arg sha "$RELEASE_SHA" --arg workflow_run_id "$run_id" '
            .schemaVersion == 2 and
            .status == "dry-run" and
            .commitSha == $sha and
            .workflowRunId == $workflow_run_id and
            .canonicalFounderCount == 1 and
            .canonicalFounderReady == true and
            .founderAccountEnabled == true and
            .founderProfileActive == true and
            .founderEmailVerified == true and
            .founderPhoneMfaReady == true and
            .executionEligible == true and
            (.executionBlockers | length) == 0 and
            .privilegedAccountCountBefore == 1 and
            .deletionTargetCount == 0 and
            .deletedAccountCount == 0 and
            .mutationPerformed == false and
            .sensitiveValuesExcluded == true and
            .auditLogsPreserved == true and
            .nonPrivilegedAccountsUntouched == true and
            .hardLaunchClaim == false
          ' "$report_path" >/dev/null

          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]] || {
            post_comment "Main advanced from \`$RELEASE_SHA\` to \`$latest_main\` after the privileged review. The review is stale and no request PR should be created."
            exit 1
          }

          post_comment "Protected privileged review passed for exact SHA \`$RELEASE_SHA\`. Review workflow run ID: \`$run_id\`. The next authorized step is one open draft Owner-request PR changing only \`.github/bank-pilot-dispatch-request\`; the PR dispatcher will run Private-HR and the controlled bank-pilot."
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Publish protected handoff summary
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REVIEW_RUN_ID: ${{ steps.review.outputs.run_id }}
          REVIEW_RUN_URL: ${{ steps.review.outputs.run_url }}
        shell: bash
        run: |
          {
            echo '## Owner protected bank-pilot preparation complete'
            echo
            echo "- Exact main SHA: \`$RELEASE_SHA\`"
            echo "- Privileged review run ID: \`$REVIEW_RUN_ID\`"
            echo "- Privileged review: $REVIEW_RUN_URL"
            echo '- Production deployment: not dispatched by this command'
            echo '- Next authority: open draft Owner-request PR and protected PR dispatcher'
            echo '- Public-release gate: disabled'
            echo '- Hard-launch claim: false'
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-production-diagnosis:
    name: Run protected production diagnosis
    if: >-
      github.event.issue.number == 434 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/bin-launch diagnose-latest-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '434'

    steps:
      - name: Resolve stable current main for diagnosis
        id: release
        shell: bash
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]] || {
            echo '::error::Main changed while authorizing production diagnosis.'
            exit 1
          }
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main for diagnosis
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run exact-main sanitized diagnosis
        id: diagnosis
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: bash scripts/run-owner-production-diagnosis.sh

      - name: Upload safe diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.diagnosis.outputs.artifact_name }}
          path: |
            launch_package/firebase-production-failure.json
            launch_package/firebase-production-failure.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish owner diagnosis summary
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SOURCE_RUN_URL: ${{ steps.diagnosis.outputs.run_url }}
          ARTIFACT_NAME: ${{ steps.diagnosis.outputs.artifact_name }}
        shell: bash
        run: |
          {
            echo '## Owner production diagnosis completed'
            echo
            echo "- Resolved main SHA: \`$RELEASE_SHA\`"
            echo "- Diagnosed production run: $SOURCE_RUN_URL"
            echo "- Sanitized artifact: \`$ARTIFACT_NAME\`"
            echo '- Production mutation: none'
            echo '- Raw job log uploaded: false'
            echo '- Hard-launch claim: false'
          } >> "$GITHUB_STEP_SUMMARY"
