name: Operational Provider Evidence
run-name: Operational Provider Evidence source-deploy-${{ inputs.source_deploy_run_id }}

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Exact successful Firebase Production Deploy main SHA'
        required: true
        type: string
      source_deploy_run_id:
        description: 'Successful Firebase Production Deploy workflow run ID'
        required: true
        type: string
      confirmation:
        description: 'Enter PUBLISH_OPERATIONAL_PROVIDER_EVIDENCE'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: postdeploy-operational-provider-${{ inputs.source_deploy_run_id }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: hard-public-launch
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
      SOURCE_DEPLOY_RUN_ID: ${{ inputs.source_deploy_run_id }}

    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify trusted parent production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-trusted-production-deploy-source.mjs

      - name: Enforce deployment-triggered provider evidence inputs
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_ACTOR" == "github-actions[bot]" ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" == "$GITHUB_SHA" ]]
          [[ "$SOURCE_DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TRUSTED_PRODUCTION_DEPLOY_EVIDENCE" == "true" ]]
          [[ "$TRUSTED_PRODUCTION_DEPLOY_RUN_ID" == "$SOURCE_DEPLOY_RUN_ID" ]]
          [[ "$CONFIRMATION" == "PUBLISH_OPERATIONAL_PROVIDER_EVIDENCE" ]]

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Verify BIN GROUP branded SMTP delivery
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
        run: node scripts/verify-smtp-live-delivery.mjs

      - name: Verify production App Check enforcement
        env:
          E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
          E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
        run: node scripts/verify-appcheck-enforcement.mjs

      - name: Publish and finalize baseline provider evidence
        run: |
          set -euo pipefail
          for gate in brandedEmailDelivery appCheckEnforcement; do
            echo "::group::Publish and finalize ${gate}"
            OPERATIONAL_GATE="$gate" node scripts/publish-operational-provider-evidence.mjs
            OPERATIONAL_GATE="$gate" node scripts/finalize-operational-provider-evidence.mjs
            echo "::endgroup::"
          done

      - name: Upload deployment-triggered provider proof batch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: postdeploy-operational-provider-${{ inputs.expected_commit_sha }}
          path: |
            launch_package/trusted-production-deploy-source.json
            launch_package/smtp-live-proof.json
            launch_package/appcheck-enforcement-proof.json
          if-no-files-found: error
          retention-days: 365
