name: Apply Five-Role Evidence Repair On PR
run-name: Apply remaining five-role evidence repair to PR branch

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/apply-five-role-repair-on-pr.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-five-role-evidence-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-repair:
    name: Apply exact self-removing evidence repair
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.head_ref, 'repair/five-role-evidence-direct-pr-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Enforce exact owner PR context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_BRANCH" == repair/five-role-evidence-direct-pr-* ]]
          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$BASE_SHA" ]] || {
            echo '::error::Main moved before the direct repair began.'
            exit 1
          }

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact fail-closed repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-five-role-production-evidence-repair-v2.mjs
          node scripts/apply-five-role-production-evidence-repair-v2.mjs
          rm .github/workflows/owner-five-role-evidence-repair-command-v3.yml
          rm .github/workflows/apply-five-role-repair-on-pr.yml

      - name: Verify exact repair scope and regression
        shell: bash
        run: |
          set -euo pipefail
          git add -N tests/launch/five-role-production-evidence-repair.test.mjs
          git diff --check
          node --test tests/launch/five-role-production-evidence-repair.test.mjs
          test ! -e .github/workflows/owner-five-role-evidence-repair-command.yml
          test ! -e scripts/apply-five-role-production-evidence-repair.mjs
          test ! -e .github/workflows/owner-five-role-evidence-repair-command-v2.yml
          test ! -e scripts/apply-five-role-production-evidence-repair-v2.mjs
          test ! -e .github/workflows/owner-five-role-evidence-repair-command-v3.yml
          test ! -e .github/workflows/apply-five-role-repair-on-pr.yml
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/apply-five-role-repair-on-pr.yml
            .github/workflows/owner-five-role-evidence-repair-command-v2.yml
            .github/workflows/owner-five-role-evidence-repair-command-v3.yml
            .github/workflows/owner-five-role-evidence-repair-command.yml
            scripts/apply-five-role-production-evidence-repair-v2.mjs
            scripts/apply-five-role-production-evidence-repair.mjs
            scripts/prepare-protected-business-fixtures.mjs
            src/technician/pages/TechnicianJobDetailPage.tsx
            tests/e2e/business-technician.spec.ts
            tests/e2e/business-tenant.spec.ts
            tests/launch/five-role-production-evidence-repair.test.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Commit exact repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$BASE_SHA" ]] || {
            echo '::error::Main moved before the repair commit.'
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make five-role production evidence deterministic'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
