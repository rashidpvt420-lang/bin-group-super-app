name: Redesign UI Guards
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/launch/redesign-*.test.mjs'
      - '.github/workflows/redesign-ui-guards.yml'
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Redesign source guards
        run: node --test tests/launch/redesign-*.test.mjs
