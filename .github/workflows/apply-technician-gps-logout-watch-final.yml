name: Apply Final Technician GPS Lifecycle

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/technician-gps-logout-watch-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply fail-closed GPS startup and logout lifecycle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/main)" = 'ccddf4e1bcc9a9c30684ec141e44699c8b65c6ee'
          python .github/scripts/apply-technician-gps-logout-watch-final.py
          rm -f \
            .github/scripts/apply-technician-gps-logout-watch-final.py \
            .github/workflows/apply-technician-gps-logout-watch-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo '::error::No GPS lifecycle changes were produced.'; exit 1; }
          git commit -m 'Make Technician GPS startup and logout fail closed'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
