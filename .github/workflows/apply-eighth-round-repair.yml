name: Apply eighth-round production evidence repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/eighth-round-repair.py
      - .github/workflows/apply-eighth-round-repair.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-eighth-round-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply exact reviewed eighth-round repair
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.ref == 'agent/repair-eighth-round-five-role-evidence-20260806' &&
      github.event.pull_request.title == 'Repair eighth-round five-role production evidence failures'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic transformations and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/eighth-round-repair.py
          git rm .github/eighth-round-repair.py .github/workflows/apply-eighth-round-repair.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(production): repair eighth-round five-role evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
