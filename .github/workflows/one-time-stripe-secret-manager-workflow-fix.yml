name: One-time Stripe Secret Manager Workflow Fix

on:
  push:
    branches:
      - fix/stripe-live-proof-secret-manager
    paths:
      - scripts/one-time-stripe-secret-manager-workflow-fix.mjs
      - .github/workflows/one-time-stripe-secret-manager-workflow-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stripe-live-proof-secret-manager
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact workflow fix
        run: node scripts/one-time-stripe-secret-manager-workflow-fix.mjs
      - name: Commit corrected workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use Secret Manager for Stripe live proof'
          git push origin HEAD:fix/stripe-live-proof-secret-manager
