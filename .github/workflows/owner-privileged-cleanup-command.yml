name: Owner Privileged Account Cleanup Command

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: owner-privileged-account-cleanup
  cancel-in-progress: false

jobs:
  review-and-clean:
    name: Authorize, review, and conditionally clean privileged identities
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_ISSUE_NUMBER: '434'

    steps:
      - name: Authorize exact issue command and resolve main
        id: authorize
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          PULL_REQUEST_URL: ${{ github.event.issue.pull_request.url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          authorized='false'
          execute='false'
          release_sha=''

          if [[ "$EVENT_NAME" == 'issue_comment' && "$EVENT_ISSUE_NUMBER" == "$TARGET_ISSUE_NUMBER" && -z "$PULL_REQUEST_URL" ]]; then
            if [[ "$COMMENT_BODY" == '/bin-launch review-privileged-accounts' ]]; then
              authorized='true'
            elif [[ "$COMMENT_BODY" == '/bin-launch execute-privileged-cleanup' && "$COMMENT_AUTHOR" == "$REPOSITORY_OWNER" ]]; then
              authorized='true'
              execute='true'
            fi
          fi

          if [[ "$authorized" == 'true' ]]; then
            first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
            [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
            sleep 3
            second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
            [[ "$first_sha" == "$second_sha" ]]
            release_sha="$second_sha"
          else
            echo 'Ignoring non-canonical or unauthorized issue comment.'
          fi

          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "execute=$execute" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        if: steps.authorize.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.authorize.outputs.release_sha }}
          persist-credentials: false

      - name: Use Node.js 22
        if: steps.authorize.outputs.authorized == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dispatch fresh exact-SHA privileged review
        if: steps.authorize.outputs.authorized == 'true'
        id: review
        env:
          RELEASE_SHA: ${{ steps.authorize.outputs.release_sha }}
          ISSUE_NUMBER: ${{ env.TARGET_ISSUE_NUMBER }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/owner-launch-run-correlation.sh

          post_comment() {
            gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$1" >/dev/null
          }

          wait_for_success() {
            local run_id="$1"
            for _ in $(seq 1 160); do
              local run_json status conclusion
              run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
              if [[ "$status" == 'completed' ]]; then
                [[ "$conclusion" == 'success' ]]
                return
              fi
              sleep 15
            done
            return 1
          }

          owner_snapshot_workflow_run_ids \
            privileged-account-cleanup-dry-run.yml \
            privileged-review-baseline-run-ids.json

          jq -n \
            --arg ref main \
            --arg sha "$RELEASE_SHA" \
            '{ref:$ref,inputs:{expected_commit_sha:$sha,confirmation:"REVIEW_PRIVILEGED_ACCOUNT_CLEANUP_BIN_GROUP"}}' \
            > privileged-review-dispatch.json

          gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/privileged-account-cleanup-dry-run.yml/dispatches" \
            --input privileged-review-dispatch.json

          run_record="$(
            owner_locate_new_exact_sha_workflow_run \
              privileged-account-cleanup-dry-run.yml \
              "$RELEASE_SHA" \
              privileged-review-baseline-run-ids.json \
              60 \
              5
          )" || {
            post_comment "Privileged-account review was dispatched once for \`$RELEASE_SHA\`, but no unique new exact-SHA run could be correlated. No duplicate review was attempted."
            exit 1
          }
          run_id="$(jq -r '.runId' <<<"$run_record")"
          run_url="$(jq -r '.runUrl' <<<"$run_record")"
          post_comment "Privileged-account review started for exact SHA \`$RELEASE_SHA\`: $run_url"

          if ! wait_for_success "$run_id"; then
            post_comment "Privileged-account review failed or timed out for \`$RELEASE_SHA\`: $run_url"
            exit 1
          fi

          artifacts="$(
            gh api --paginate --slurp \
              "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" |
              jq -ce '{artifacts: [.[].artifacts[]]}'
          )"
          expected="privileged-account-cleanup-review-$RELEASE_SHA"
          artifact_id="$(jq -r --arg expected "$expected" '[.artifacts[] | select(.name == $expected and .expired == false)] | first | .id // empty' <<<"$artifacts")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || {
            post_comment "Privileged-account review completed but the exact-SHA artifact \`$expected\` is missing."
            exit 1
          }

          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > privileged-review.zip
          mkdir -p privileged-review
          unzip -q privileged-review.zip -d privileged-review
          report_path="$(find privileged-review -type f -name 'privileged-account-cleanup.json' -print -quit)"
          [[ -n "$report_path" && -s "$report_path" ]]

          jq -e --arg sha "$RELEASE_SHA" '
            .schemaVersion == 2 and
            .commitSha == $sha and
            .status == "dry-run" and
            .mutationPerformed == false and
            .deletedAccountCount == 0 and
            .sensitiveValuesExcluded == true and
            .auditLogsPreserved == true and
            .nonPrivilegedAccountsUntouched == true and
            .hardLaunchClaim == false
          ' "$report_path" >/dev/null

          ready="$(jq -r '.canonicalFounderReady' "$report_path")"
          eligible="$(jq -r '.executionEligible' "$report_path")"
          target_count="$(jq -r '.deletionTargetCount' "$report_path")"
          privileged_count="$(jq -r '.privilegedAccountCountBefore' "$report_path")"
          email_verified="$(jq -r '.founderEmailVerified' "$report_path")"
          phone_mfa="$(jq -r '.founderPhoneMfaReady' "$report_path")"
          blockers="$(jq -r '.executionBlockers | join("; ") | if length == 0 then "none" else . end' "$report_path")"

          body="## Privileged-account review
          
          - Exact SHA: \`$RELEASE_SHA\`
          - Review run: $run_url
          - Privileged accounts: \`$privileged_count\`
          - Unexpected deletion targets: \`$target_count\`
          - Canonical Founder ready: \`$ready\`
          - Cleanup execution eligible: \`$eligible\`
          - Hard-launch claim: \`false\`"
          post_comment "$body"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "target_count=$target_count" >> "$GITHUB_OUTPUT"

      - name: Enforce destructive execution eligibility
        if: steps.authorize.outputs.execute == 'true'
        env:
          RELEASE_SHA: ${{ steps.authorize.outputs.release_sha }}
          FOUNDER_READY: ${{ steps.review.outputs.ready }}
          EXECUTION_ELIGIBLE: ${{ steps.review.outputs.eligible }}
          TARGET_COUNT: ${{ steps.review.outputs.target_count }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]]
          [[ "$COMMENT_AUTHOR" == "$REPOSITORY_OWNER" ]]
          [[ "$FOUNDER_READY" == 'true' ]]
          [[ "$EXECUTION_ELIGIBLE" == 'true' ]]
          [[ "$TARGET_COUNT" =~ ^[1-9][0-9]*$ ]]

      - name: Execute and verify exact-SHA privileged cleanup
        if: steps.authorize.outputs.execute == 'true'
        id: cleanup
        env:
          RELEASE_SHA: ${{ steps.authorize.outputs.release_sha }}
          EXPECTED_TARGET_COUNT: ${{ steps.review.outputs.target_count }}
          ISSUE_NUMBER: ${{ env.TARGET_ISSUE_NUMBER }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/owner-launch-run-correlation.sh

          post_comment() {
            gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$1" >/dev/null
          }

          wait_for_success() {
            local run_id="$1"
            for _ in $(seq 1 120); do
              local run_json status conclusion
              run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
              if [[ "$status" == 'completed' ]]; then
                [[ "$conclusion" == 'success' ]]
                return
              fi
              sleep 15
            done
            return 1
          }

          owner_snapshot_workflow_run_ids \
            privileged-account-cleanup-production.yml \
            privileged-cleanup-baseline-run-ids.json

          jq -n \
            --arg ref main \
            --arg sha "$RELEASE_SHA" \
            '{ref:$ref,inputs:{expected_commit_sha:$sha,confirmation:"REVIEW_SINGLE_FOUNDER_PRIVILEGED_ACCOUNTS",canonical_founder_email:"ceo@bin-groups.com",execute_cleanup:true,destructive_confirmation:"DELETE_ALL_OTHER_PRIVILEGED_ACCOUNTS_BIN_GROUP"}}' \
            > cleanup-dispatch.json

          gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/privileged-account-cleanup-production.yml/dispatches" \
            --input cleanup-dispatch.json

          run_record="$(
            owner_locate_new_exact_sha_workflow_run \
              privileged-account-cleanup-production.yml \
              "$RELEASE_SHA" \
              privileged-cleanup-baseline-run-ids.json \
              60 \
              5
          )" || {
            post_comment "Protected cleanup was dispatched once for \`$RELEASE_SHA\`, but no unique new exact-SHA run could be correlated. No duplicate destructive dispatch was attempted."
            exit 1
          }
          run_id="$(jq -r '.runId' <<<"$run_record")"
          run_url="$(jq -r '.runUrl' <<<"$run_record")"
          post_comment "Protected privileged-account cleanup started for exact SHA \`$RELEASE_SHA\`: $run_url"

          cleanup_completed='false'
          if wait_for_success "$run_id"; then
            cleanup_completed='true'
          else
            post_comment "Protected privileged-account cleanup failed or timed out for \`$RELEASE_SHA\`: $run_url"
            exit 1
          fi
          [[ "$cleanup_completed" == 'true' ]]

          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]] || {
            post_comment "Protected cleanup completed, but main moved away from \`$RELEASE_SHA\`; its result cannot be used as current launch evidence."
            exit 1
          }

          artifacts="$(
            gh api --paginate --slurp \
              "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" |
              jq -ce '{artifacts: [.[].artifacts[]]}'
          )"
          prefix="privileged-account-cleanup-$RELEASE_SHA-$run_id-"
          artifact_id="$(jq -r --arg prefix "$prefix" '[.artifacts[] | select((.name | startswith($prefix)) and .expired == false)] | first | .id // empty' <<<"$artifacts")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || {
            post_comment "Protected cleanup completed but its exact-SHA evidence artifact is missing: $run_url"
            exit 1
          }

          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > privileged-cleanup.zip
          mkdir -p privileged-cleanup
          unzip -q privileged-cleanup.zip -d privileged-cleanup
          report_path="$(find privileged-cleanup -type f -name 'privileged-account-cleanup.json' -print -quit)"
          [[ -n "$report_path" && -s "$report_path" ]]

          jq -e \
            --arg sha "$RELEASE_SHA" \
            --arg workflow_run_id "$run_id" \
            --argjson expected "$EXPECTED_TARGET_COUNT" '
              .schemaVersion == 1 and
              .status == "executed" and
              .commitSha == $sha and
              .workflowRunId == $workflow_run_id and
              .canonicalFounderReady == true and
              .deletionTargetCount == $expected and
              .deletedAccountCount == $expected and
              .sensitiveValuesExcluded == true and
              .auditLogsPreserved == true and
              .nonPrivilegedAccountsUntouched == true and
              .hardLaunchClaim == false
            ' "$report_path" >/dev/null

          deleted="$(jq -r '.deletedAccountCount' "$report_path")"
          body="## Privileged-account cleanup completed
          
          - Exact SHA: \`$RELEASE_SHA\`
          - Cleanup run: $run_url
          - Unexpected privileged accounts deleted: \`$deleted\`
          - Canonical Founder retained: \`true\`
          - Audit logs preserved: \`true\`
          - Non-privileged accounts untouched: \`true\`
          - Hard-launch claim: \`false\`
          
          Next protected action: run \`/bin-launch bank-pilot-after-mfa\`."
          post_comment "$body"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "deleted_count=$deleted" >> "$GITHUB_OUTPUT"
