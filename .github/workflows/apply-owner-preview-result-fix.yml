name: Apply Owner Preview Result Fix

on:
  push:
    branches:
      - feat/owner-contract-commercial-authority
    paths:
      - scripts/fix-owner-preview-handler-result.mjs
      - .github/workflows/apply-owner-preview-result-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[owner-preview-result-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact result fix
        run: node scripts/fix-owner-preview-handler-result.mjs

      - name: Remove one-time automation
        run: |
          rm scripts/fix-owner-preview-handler-result.mjs
          rm .github/workflows/apply-owner-preview-result-fix.yml

      - name: Commit result fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/secureOwnerRegistrationRequest.ts scripts/fix-owner-preview-handler-result.mjs .github/workflows/apply-owner-preview-result-fix.yml
          git commit -m "Fix Owner preview handler result [owner-preview-result-fixed]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
