name: Actionlint Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate protected review workflow
        run: actionlint -color .github/workflows/privileged-account-review-request.yml
