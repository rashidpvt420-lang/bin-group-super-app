name: Actionlint Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  actionlint:
    name: Repair and validate GitHub Actions workflow
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/privileged-review-workflow-startup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/privileged-review-workflow-startup
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair exactly four malformed multiline blocks
        run: node scripts/repair-privileged-review-workflow-yaml.mjs

      - name: Use Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate protected review workflow
        id: actionlint
        shell: bash
        run: |
          set -o pipefail
          actionlint -no-color .github/workflows/privileged-account-review-request.yml 2>&1 | tee actionlint-report.txt

      - name: Stage validated workflow as non-workflow blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflow-fixes
          cp .github/workflows/privileged-account-review-request.yml \
            .github/workflow-fixes/privileged-account-review-request.yml
          git checkout -- .github/workflows/privileged-account-review-request.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflow-fixes/privileged-account-review-request.yml
          if git diff --cached --quiet; then
            echo 'Validated staging blob already exists.'
            exit 0
          fi
          git commit -m 'ci: stage actionlint-validated protected workflow blob'
          git push origin HEAD:fix/privileged-review-workflow-startup

      - name: Upload complete actionlint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actionlint-privileged-review-${{ github.sha }}
          path: |
            actionlint-report.txt
            .github/workflow-fixes/privileged-account-review-request.yml
          if-no-files-found: error
          retention-days: 3
