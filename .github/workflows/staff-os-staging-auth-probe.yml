name: Staff OS Staging Auth Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/staff-os-staging-auth-probe.yml

permissions:
  contents: read
  id-token: write

env:
  STAGING_PROJECT_ID: studio-5724711541-8a962
  PRODUCTION_PROJECT_ID: bin-group-57c60

jobs:
  staging-auth-probe:
    name: Verify PR-scoped staging deployment identity
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/staff-operating-system'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.STAGING_GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Enforce staging-only and exact-PR boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_PROJECT_ID" = "studio-5724711541-8a962"
          test "$STAGING_PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$EXACT_HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"

      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"

      - name: Authenticate with configured Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '>= 416.0.0'

      - name: Verify explicit staging access without mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectId)' > "$RUNNER_TEMP/project-id.txt"
          test "$(cat "$RUNNER_TEMP/project-id.txt")" = "$STAGING_PROJECT_ID"
          echo "PR-scoped WIF identity can read the staging project. No Firebase mutation was performed."
