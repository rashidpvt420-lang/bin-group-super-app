name: Sync Technician CAS 697 With Main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/sync-technician-cas-697-with-main.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 697 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/technician-gps-session-cas-clean-v2' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/technician-gps-session-cas-clean-v2
          fetch-depth: 0
      - name: Merge exact current main
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$main_sha"
          git push origin HEAD:fix/technician-gps-session-cas-clean-v2
          echo "Synchronized clean Technician CAS repair with $main_sha."
