name: One-time Broker Mailbox Proof Tightening

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/broker-mailbox-proof-tightening.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 627 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/broker-otp-hmac-real-input' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Broker branch
        uses: actions/checkout@v4
        with:
          ref: fix/broker-otp-hmac-real-input
          fetch-depth: 0

      - name: Tighten mailbox identity and Message-ID evidence
        run: python .github/scripts/apply-broker-mailbox-proof-tightening.py

      - name: Commit bounded proof tightening
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run-broker-production-evidence.mjs tests/launch/broker-otp-hmac-evidence.test.mjs tests/launch/broker-payout-otp-live-evidence.test.mjs
          git diff --cached --quiet && { echo '::error::Proof tightening produced no changes.'; exit 1; }
          git commit -m "test(broker): bind mailbox identity and Message-ID fingerprint"
          git push origin HEAD:fix/broker-otp-hmac-real-input
