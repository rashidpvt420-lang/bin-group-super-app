name: One-shot Live Role OAuth Scope Repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/zz-fix-live-role-oauth-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/live-role-oauth-scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-role-oauth-scope
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch Live Role OAuth scope and regression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const workflowPath = '.github/workflows/live-role-smoke.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          const oldBlock = `      - name: Validate role credentials and App Check
        env:
          E2E_STRICT_ROLES: 'true'
          E2E_REQUIRE_FOUNDER_MFA: 'true'
`;
          const newBlock = `      - name: Validate role credentials and App Check
        env:
          E2E_OWNER_MAILBOX_CLIENT_ID: \${{ secrets.E2E_OWNER_MAILBOX_CLIENT_ID }}
          E2E_OWNER_MAILBOX_CLIENT_SECRET: \${{ secrets.E2E_OWNER_MAILBOX_CLIENT_SECRET }}
          E2E_OWNER_MAILBOX_REFRESH_TOKEN: \${{ secrets.E2E_OWNER_MAILBOX_REFRESH_TOKEN }}
          E2E_BROKER_MAILBOX_CLIENT_ID: \${{ secrets.E2E_BROKER_MAILBOX_CLIENT_ID }}
          E2E_BROKER_MAILBOX_CLIENT_SECRET: \${{ secrets.E2E_BROKER_MAILBOX_CLIENT_SECRET }}
          E2E_BROKER_MAILBOX_REFRESH_TOKEN: \${{ secrets.E2E_BROKER_MAILBOX_REFRESH_TOKEN }}
          E2E_STRICT_ROLES: 'true'
          E2E_REQUIRE_FOUNDER_MFA: 'true'
`;
          const workflowMatches = workflow.split(oldBlock).length - 1;
          if (workflowMatches !== 1) throw new Error(`expected one Live Role validation block, found ${workflowMatches}`);
          workflow = workflow.replace(oldBlock, newBlock);
          fs.writeFileSync(workflowPath, workflow);

          const testPath = 'tests/launch/workflow-mailbox-secret-scope.test.mjs';
          let testSource = fs.readFileSync(testPath, 'utf8');
          const marker = `test('public live-proof environment validates OAuth credentials without persisting them', () => {`;
          if (!testSource.includes(marker)) throw new Error('mailbox regression insertion marker missing');
          const newTest = `test('every Live Role Smoke strict-live consumer receives protected Gmail OAuth secrets', () => {
  const source = readFileSync('.github/workflows/live-role-smoke.yml', 'utf8');
  const consumers = [
    {
      name: 'Validate role credentials and App Check',
      command: /node scripts\\/verify-e2e-env\\.mjs/,
    },
    {
      name: 'Run every required live evidence suite',
      command: /node scripts\\/run-critical-evidence\\.mjs --suite all-required/,
    },
  ];

  for (const consumer of consumers) {
    const step = workflowStep(source, consumer.name);
    assert.match(step, consumer.command, \`${consumer.name} no longer invokes the expected strict-live guard path\`);
    assertOAuthMappings(step, \`Live Role Smoke: ${consumer.name}\`);
  }
});

`;
          if (testSource.includes("every Live Role Smoke strict-live consumer")) throw new Error('Live Role regression already exists');
          testSource = testSource.replace(marker, newTest + marker);
          fs.writeFileSync(testPath, testSource);
          NODE

      - name: Run focused mailbox scope regression
        run: node --test tests/launch/workflow-mailbox-secret-scope.test.mjs

      - name: Commit only the validated fix
        env:
          BRANCH: fix/live-role-oauth-scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-fix-live-role-oauth-once.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/live-role-smoke.yml' 'tests/launch/workflow-mailbox-secret-scope.test.mjs' | sort)"
          [[ "$changed" == "$expected" ]] || {
            echo '::error::One-shot repair changed unexpected files.'
            git status --short
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/live-role-smoke.yml tests/launch/workflow-mailbox-secret-scope.test.mjs
          git commit -m 'fix: scope mailbox OAuth secrets to live role guard'
          git push origin HEAD:"$BRANCH"
