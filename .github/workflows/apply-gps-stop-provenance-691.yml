name: Apply GPS STOP Provenance 691

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-gps-stop-provenance-691.yml
      - .github/scripts/apply-gps-stop-provenance-691.py

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-gps-stop-provenance-691
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.number == 691 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/technician-gps-session-cas' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/technician-gps-session-cas
          fetch-depth: 0
      - name: Apply deterministic stopped-ticket provenance
        run: python .github/scripts/apply-gps-stop-provenance-691.py
      - name: Validate focused CAS scenarios
        run: node --test tests/launch/technician-live-location-cas.test.mjs
      - name: Commit reviewed changes and remove one-off machinery
        run: |
          set -euo pipefail
          git rm .github/scripts/apply-gps-stop-provenance-691.py .github/workflows/apply-gps-stop-provenance-691.yml
          git add functions/technicianLiveLocation.ts tests/launch/technician-live-location-cas.test.mjs
          git diff --cached --quiet && { echo '::error::GPS STOP provenance patch produced no changes.'; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(gps): persist stopped-ticket session provenance'
          git push origin HEAD:fix/technician-gps-session-cas
