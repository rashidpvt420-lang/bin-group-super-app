name: Apply Property Geo Server Authority

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-property-geo-server-authority.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-test-clean:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/property-geo-server-authority' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/property-geo-server-authority
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Normalize legacy Owner geo component markers
        run: python .github/scripts/prepare-owner-geo-authority-markers.py

      - name: Apply deterministic property geo authority repair
        run: python .github/scripts/apply-property-geo-server-authority.py

      - name: Exclude properties from generic Admin catch-all writes
        run: python .github/scripts/harden-property-geo-catchall.py

      - name: Validate canonical property geo source contract
        run: node --test tests/launch/property-geo-authority.test.mjs

      - name: Catch-all - named list exists
        run: node --test --test-name-pattern="named list exists" tests/launch/property-geo-catchall-authority.test.mjs

      - name: Catch-all - properties exclusion order
        run: node --test --test-name-pattern="excludes properties between" tests/launch/property-geo-catchall-authority.test.mjs

      - name: Catch-all - private HR compatibility
        run: node --test --test-name-pattern="private HR hardener preserves" tests/launch/property-geo-catchall-authority.test.mjs

      - name: Catch-all - launch verifier compatibility
        run: node --test --test-name-pattern="launch hardening verifier requires" tests/launch/property-geo-catchall-authority.test.mjs

      - name: Catch-all - browser denial regression
        run: node --test --test-name-pattern="names browser denial" tests/launch/property-geo-catchall-authority.test.mjs

      - name: Catch-all - Admin geo mutation rejection
        run: node --test --test-name-pattern="rejects Admin canonical geo mutation" tests/launch/property-geo-catchall-authority.test.mjs

      - name: Validate Admin property review callable authority
        run: node --test tests/launch/admin-property-review-authority.test.mjs

      - name: TypeScript check
        run: npm run typecheck

      - name: Build Cloud Functions
        run: npm run build:functions

      - name: Normalize rule-test sources
        run: npm run normalize:rule-tests

      - name: Prepare canonical Firestore rules
        id: prepare_rules
        shell: bash
        run: |
          set +e
          npm run prepare:rules > property-geo-prepare-rules-output.txt 2>&1
          status=$?
          cat property-geo-prepare-rules-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload canonical rules diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-geo-prepare-rules-${{ github.sha }}
          path: property-geo-prepare-rules-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce canonical Firestore preparation
        run: test "${{ steps.prepare_rules.outputs.status }}" = "0"

      - name: Verify Firestore rules hardening
        run: npm run verify:rules-hardening

      - name: Run focused property geo Firestore authority
        id: focused_geo_rules
        shell: bash
        run: |
          set +e
          npx firebase emulators:exec --only firestore --project bin-group-57c60 "node --test --test-concurrency=1 test/property-geo-authority-rules.test.js" > property-geo-rules-output.txt 2>&1
          status=$?
          cat property-geo-rules-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload focused property geo diagnostics
        if: always() && steps.focused_geo_rules.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: property-geo-rules-diagnostics-${{ github.sha }}
          path: property-geo-rules-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce focused property geo authority
        run: test "${{ steps.focused_geo_rules.outputs.status }}" = "0"

      - name: Validate complete Firestore and Storage authority
        run: npx firebase emulators:exec --only firestore,storage --project bin-group-57c60 "node --test --test-concurrency=1 test/security-rules.test.js test/storage-rules.test.js"

      - name: Commit product changes and remove one-off machinery
        run: |
          set -euo pipefail
          git add \
            firestore.rules \
            functions/adminPropertyReview.ts \
            scripts/harden-final-firestore-authority.mjs \
            scripts/harden-private-hr-authority.mjs \
            scripts/verify-firestore-launch-hardening.mjs \
            src/components/onboarding/PropertyLocationStep.tsx \
            apps/owner-app/src/components/onboarding/PropertyLocationStep.tsx \
            apps/admin-panel/src/pages/admin/AdminPropertyApprovalsPage.tsx \
            test/security-rules.test.js \
            test/property-geo-authority-rules.test.js \
            tests/launch/property-geo-authority.test.mjs \
            tests/launch/property-geo-catchall-authority.test.mjs \
            tests/launch/admin-property-review-authority.test.mjs
          git rm \
            .github/scripts/apply-property-geo-server-authority.py \
            .github/scripts/prepare-owner-geo-authority-markers.py \
            .github/scripts/harden-property-geo-catchall.py \
            .github/workflows/apply-property-geo-server-authority.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/apply-property-geo-server-authority.py \
            .github/scripts/prepare-owner-geo-authority-markers.py \
            .github/scripts/harden-property-geo-catchall.py \
            .github/workflows/apply-property-geo-server-authority.yml \
            apps/admin-panel/src/pages/admin/AdminPropertyApprovalsPage.tsx \
            apps/owner-app/src/components/onboarding/PropertyLocationStep.tsx \
            firestore.rules \
            functions/adminPropertyReview.ts \
            scripts/harden-final-firestore-authority.mjs \
            scripts/harden-private-hr-authority.mjs \
            scripts/verify-firestore-launch-hardening.mjs \
            src/components/onboarding/PropertyLocationStep.tsx \
            test/property-geo-authority-rules.test.js \
            test/security-rules.test.js \
            tests/launch/admin-property-review-authority.test.mjs \
            tests/launch/property-geo-authority.test.mjs \
            tests/launch/property-geo-catchall-authority.test.mjs | sort)"
          [[ "$changed" == "$expected" ]] || {
            echo '::error::Property geo repair touched unexpected files.'
            printf 'Changed:\n%s\nExpected:\n%s\n' "$changed" "$expected"
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(properties): make canonical geo server-authoritative'
          git push origin HEAD:agent/property-geo-server-authority
