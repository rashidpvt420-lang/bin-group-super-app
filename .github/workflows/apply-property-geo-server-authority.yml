name: Apply Property Geo Server Authority

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-property-geo-server-authority.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-test-clean:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/property-geo-server-authority' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/property-geo-server-authority
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Apply deterministic property geo authority repair
        run: python .github/scripts/apply-property-geo-server-authority.py

      - name: Validate focused source contracts
        run: |
          set -euo pipefail
          node --test tests/launch/property-geo-authority.test.mjs tests/launch/admin-property-review-authority.test.mjs
          npm run typecheck
          npm run build:functions

      - name: Validate Firestore authority
        run: npm run test:rules

      - name: Commit product changes and remove one-off machinery
        run: |
          set -euo pipefail
          git add \
            firestore.rules \
            functions/adminPropertyReview.ts \
            src/components/onboarding/PropertyLocationStep.tsx \
            apps/owner-app/src/components/onboarding/PropertyLocationStep.tsx \
            apps/admin-panel/src/pages/admin/AdminPropertyApprovalsPage.tsx \
            test/security-rules.test.js \
            test/property-geo-authority-rules.test.js \
            tests/launch/property-geo-authority.test.mjs \
            tests/launch/admin-property-review-authority.test.mjs
          git rm \
            .github/scripts/apply-property-geo-server-authority.py \
            .github/workflows/apply-property-geo-server-authority.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/apply-property-geo-server-authority.py \
            .github/workflows/apply-property-geo-server-authority.yml \
            apps/admin-panel/src/pages/admin/AdminPropertyApprovalsPage.tsx \
            apps/owner-app/src/components/onboarding/PropertyLocationStep.tsx \
            firestore.rules \
            functions/adminPropertyReview.ts \
            src/components/onboarding/PropertyLocationStep.tsx \
            test/property-geo-authority-rules.test.js \
            test/security-rules.test.js \
            tests/launch/admin-property-review-authority.test.mjs \
            tests/launch/property-geo-authority.test.mjs | sort)"
          [[ "$changed" == "$expected" ]] || {
            echo '::error::Property geo repair touched unexpected files.'
            printf 'Changed:\n%s\nExpected:\n%s\n' "$changed" "$expected"
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(properties): make canonical geo server-authoritative'
          git push origin HEAD:agent/property-geo-server-authority
