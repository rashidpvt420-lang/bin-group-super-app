name: iOS Apple Silicon arm64 Build
run-name: "iOS arm64 ${{ github.event_name }} ${{ github.sha }}"

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-apple-silicon-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-arm64:
    name: Build iOS Simulator on Apple Silicon
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and verify arm64 iOS Simulator application
        run: bash scripts/run-ios-arm64-build.sh

      - name: Publish arm64 build evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-build-evidence-${{ github.sha }}
          path: |
            ios-arm64-build-evidence.json
            ios-arm64-xcodebuild.log
          if-no-files-found: error
          retention-days: 30

      - name: Summarize Apple Silicon result
        shell: bash
        run: |
          {
            echo '## iOS Apple Silicon arm64 build'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Runner: \`macos-26 / $(uname -m)\`"
            echo "- Xcode: \`$(xcodebuild -version | awk 'NR == 1 { print $2 }')\`"
            echo "- Simulator SDK: \`$(xcrun --sdk iphonesimulator --show-sdk-version)\`"
            echo '- Executable architecture: `arm64`'
            echo '- Code signing: disabled for simulator verification'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-build-diagnostics-${{ github.sha }}
          path: |
            ios-arm64-xcodebuild.log
            ios/App/Podfile.lock
          if-no-files-found: warn
          retention-days: 14
