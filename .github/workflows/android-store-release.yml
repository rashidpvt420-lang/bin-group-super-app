name: Android Store Release AAB
run-name: Android store operation · ${{ inputs.operation }} · ${{ inputs.expected_commit_sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Android store operation to perform
        required: true
        type: choice
        options:
          - build_signed_aab
          - export_public_certificate
        default: build_signed_aab
      expected_commit_sha:
        description: Exact current main SHA to process for Google Play
        required: true
        type: string
      confirmation:
        description: Exact confirmation required by the selected operation
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: android-store-release-${{ inputs.operation }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  COMMAND_ISSUE: '434'
  TRACKING_ISSUE: '478'

jobs:
  authorize-operation:
    name: Authorize exact-main Android store operation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.authorize.outputs.operation }}
      release_sha: ${{ steps.authorize.outputs.release_sha }}
    steps:
      - name: Enforce owner-authorized exact-main operation
        id: authorize
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_COMMIT_SHA" == "$GITHUB_SHA" ]]

          case "$OPERATION" in
            build_signed_aab)
              [[ "$CONFIRMATION" == 'BUILD_SIGNED_ANDROID_AAB_BIN_GROUP' ]]
              ;;
            export_public_certificate)
              [[ "$CONFIRMATION" == 'EXPORT_PUBLIC_PLAY_CERTIFICATE_BIN_GROUP' ]]
              ;;
            *)
              echo "::error::Unsupported Android store operation: $OPERATION"
              exit 1
              ;;
          esac

          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish certificate waiting-for-production status
        if: inputs.operation == 'export_public_certificate'
        env:
          RELEASE_SHA: ${{ steps.authorize.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="## Protected Play Store certificate extraction

- Status: \`WAITING_FOR_PRODUCTION_ENVIRONMENT\`
- Exact SHA: \`$RELEASE_SHA\`
- Workflow run ID: \`$GITHUB_RUN_ID\`
- Workflow run: $run_url
- Workflow: \`Android Store Release AAB\`
- Operation: \`export_public_certificate\`
- Protected job: \`Export public Android upload certificate\`
- Artifact: pending
- Package: \`ae.bingroups.superapp\`
- Private key included: \`false\`
- Keystore included: \`false\`
- Passwords included: \`false\`
- Hard-launch claim: \`false\`"
          gh api --method PATCH "repos/$REPOSITORY/issues/$TRACKING_ISSUE" \
            -f state='open' \
            -f body="$body" >/dev/null
          gh api --method POST "repos/$REPOSITORY/issues/$COMMAND_ISSUE/comments" -f body="$body" >/dev/null

  build-signed-aab:
    name: Build and verify production-signed Android App Bundle
    needs: authorize-operation
    if: needs.authorize-operation.outputs.operation == 'build_signed_aab'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      CI: 'true'
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: bin-group-57c60.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: bin-group-57c60
      VITE_FIREBASE_STORAGE_BUCKET: bin-group-57c60.firebasestorage.app
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ''
      VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
      VITE_ENABLE_FIREBASE_APPCHECK: 'true'
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize-operation.outputs.release_sha }}
          persist-credentials: false

      - name: Verify main has not moved before signing
        env:
          RELEASE_SHA: ${{ needs.authorize-operation.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Refusing Android signing because main moved from $RELEASE_SHA to $remote_main."
            exit 1
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify protected signing and production configuration inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_APP_ID
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_VAPID_KEY
            VITE_APP_CHECK_SITE_KEY
            VITE_GOOGLE_MAPS_API_KEY
            ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::Missing protected Android release value: $name"
              exit 1
            }
          done
          [[ "$VITE_FIREBASE_AUTH_DOMAIN" == 'bin-group-57c60.firebaseapp.com' ]]
          [[ "$VITE_FIREBASE_PROJECT_ID" == 'bin-group-57c60' ]]
          [[ "$VITE_FIREBASE_STORAGE_BUCKET" == 'bin-group-57c60.firebasestorage.app' ]]
          [[ "$VITE_ENABLE_FIREBASE_APPCHECK" == 'true' ]]
          [[ -z "$VITE_FIREBASE_APPCHECK_DEBUG_TOKEN" ]]

      - name: Build and cryptographically verify signed AAB
        run: bash scripts/run-android-store-release.sh

      - name: Verify main remained frozen through signing
        env:
          RELEASE_SHA: ${{ needs.authorize-operation.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Android artifact completed, but main moved to $remote_main; refusing release evidence."
            exit 1
          }

      - name: Upload signed Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-store-release-${{ needs.authorize-operation.outputs.release_sha }}-${{ github.run_id }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android-store-release-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android release diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-store-release-diagnostics-${{ needs.authorize-operation.outputs.release_sha }}-${{ github.run_id }}
          path: |
            android-store-release-gradle.log
            android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f android/app/bin-group-upload.jks android/keystore.properties

  export-public-certificate:
    name: Export public Android upload certificate
    needs: authorize-operation
    if: needs.authorize-operation.outputs.operation == 'export_public_certificate'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.certificate.outputs.artifact_name }}
      fingerprint: ${{ steps.certificate.outputs.fingerprint }}
      signing_ready: ${{ steps.signing_inputs.outputs.ready }}
      missing_inputs: ${{ steps.signing_inputs.outputs.missing }}
    env:
      RELEASE_SHA: ${{ needs.authorize-operation.outputs.release_sha }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Verify main remained frozen before extraction
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Main moved from $RELEASE_SHA to $remote_main before certificate extraction."
            exit 1
          }

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Inspect protected Android signing inputs
        id: signing_inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done

          missing_csv="$(IFS=,; printf '%s' "${missing[*]-}")"
          echo "missing=$missing_csv" >> "$GITHUB_OUTPUT"
          if [[ "${#missing[@]}" -eq 0 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::error::Missing protected Android signing inputs: $missing_csv"
          fi

      - name: Fail closed when protected signing inputs are missing
        if: steps.signing_inputs.outputs.ready != 'true'
        shell: bash
        run: exit 1

      - name: Decode keystore and write signing properties
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/bin-group-upload.jks
          chmod 600 android/app/bin-group-upload.jks
          [[ -s android/app/bin-group-upload.jks ]]

          umask 077
          printf '%s\n' \
            'storeFile=app/bin-group-upload.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > android/keystore.properties
          [[ -s android/keystore.properties ]]

      - name: Export and verify public upload certificate
        id: certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play-store-certificate

          keytool -exportcert -rfc \
            -keystore android/app/bin-group-upload.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file play-store-certificate/bin-group-upload-certificate.pem

          grep -q -- '-----BEGIN CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem
          grep -q -- '-----END CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem

          keytool -printcert \
            -file play-store-certificate/bin-group-upload-certificate.pem \
            > play-store-certificate/bin-group-upload-certificate-details.txt

          fingerprint="$(awk -F': ' '/SHA256:/{print $2; exit}' play-store-certificate/bin-group-upload-certificate-details.txt)"
          [[ "$fingerprint" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]
          certificate_file_sha256="$(sha256sum play-store-certificate/bin-group-upload-certificate.pem | awk '{print $1}')"
          [[ "$certificate_file_sha256" =~ ^[0-9a-f]{64}$ ]]

          jq -n \
            --arg commitSha "$RELEASE_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg packageName 'ae.bingroups.superapp' \
            --arg certificateSha256Fingerprint "$fingerprint" \
            --arg certificateFileSha256 "$certificate_file_sha256" \
            '{
              schemaVersion: 10,
              commitSha: $commitSha,
              workflowRunId: $workflowRunId,
              workflow: "Android Store Release AAB",
              operation: "export_public_certificate",
              packageName: $packageName,
              certificateSha256Fingerprint: $certificateSha256Fingerprint,
              certificateFileSha256: $certificateFileSha256,
              publicCertificateOnly: true,
              privateKeyExcluded: true,
              keystoreExcluded: true,
              passwordsExcluded: true,
              hardLaunchClaim: false
            }' > play-store-certificate/play-store-certificate-evidence.json

          artifact_name="bin-group-play-store-certificate-$RELEASE_SHA-$GITHUB_RUN_ID"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Verify certificate artifact allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find play-store-certificate -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(
            bin-group-upload-certificate-details.txt
            bin-group-upload-certificate.pem
            play-store-certificate-evidence.json
          )
          [[ "${files[*]}" == "${expected[*]}" ]]
          ! find play-store-certificate -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' \) | grep -q .

      - name: Upload public Play certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.certificate.outputs.artifact_name }}
          path: play-store-certificate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Verify main remained frozen through extraction
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Certificate exported, but main moved to $remote_main."
            exit 1
          }

      - name: Remove private Android signing material
        if: always()
        shell: bash
        run: |
          set +e
          shred -u android/app/bin-group-upload.jks 2>/dev/null || rm -f android/app/bin-group-upload.jks
          shred -u android/keystore.properties 2>/dev/null || rm -f android/keystore.properties

      - name: Publish certificate extraction outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SIGNING_READY: ${{ steps.signing_inputs.outputs.ready }}
          MISSING_INPUTS: ${{ steps.signing_inputs.outputs.missing }}
          ARTIFACT_NAME: ${{ steps.certificate.outputs.artifact_name }}
          CERTIFICATE_FINGERPRINT: ${{ steps.certificate.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ "$JOB_STATUS" == 'success' ]]; then
            body="## Protected Play Store certificate extraction

- Status: \`SUCCESS\`
- Exact SHA: \`$RELEASE_SHA\`
- Workflow run ID: \`$GITHUB_RUN_ID\`
- Workflow run: $run_url
- Workflow: \`Android Store Release AAB\`
- Operation: \`export_public_certificate\`
- Artifact: \`$ARTIFACT_NAME\`
- Package: \`ae.bingroups.superapp\`
- Certificate SHA-256: \`$CERTIFICATE_FINGERPRINT\`
- Private key included: \`false\`
- Keystore included: \`false\`
- Passwords included: \`false\`
- Hard-launch claim: \`false\`"
            gh api --method PATCH "repos/$REPOSITORY/issues/$TRACKING_ISSUE" \
              -f state='closed' \
              -f state_reason='completed' \
              -f body="$body" >/dev/null
            gh api --method POST "repos/$REPOSITORY/issues/$COMMAND_ISSUE/comments" -f body="$body" >/dev/null
          else
            missing="${MISSING_INPUTS:-none-reported}"
            body="## Protected Play Store certificate extraction

- Status: \`FAILURE\`
- Exact SHA: \`$RELEASE_SHA\`
- Workflow run ID: \`$GITHUB_RUN_ID\`
- Workflow run: $run_url
- Workflow: \`Android Store Release AAB\`
- Operation: \`export_public_certificate\`
- Protected signing inputs ready: \`${SIGNING_READY:-unknown}\`
- Missing protected inputs: \`$missing\`
- Artifact: unavailable
- Private key included: \`false\`
- Keystore included: \`false\`
- Passwords included: \`false\`
- Hard-launch claim: \`false\`"
            gh api --method PATCH "repos/$REPOSITORY/issues/$TRACKING_ISSUE" \
              -f state='open' \
              -f body="$body" >/dev/null
            gh api --method POST "repos/$REPOSITORY/issues/$COMMAND_ISSUE/comments" -f body="$body" >/dev/null
          fi