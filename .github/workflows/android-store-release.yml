name: Android Store Release AAB
run-name: Android signed AAB · ${{ inputs.expected_commit_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Exact current main SHA to sign for Google Play
        required: true
        type: string
      confirmation:
        description: Type BUILD_SIGNED_ANDROID_AAB_BIN_GROUP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-store-release
  cancel-in-progress: false

jobs:
  build-signed-aab:
    name: Build and verify production-signed Android App Bundle
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      CI: 'true'
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ''
      VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
      VITE_ENABLE_FIREBASE_APPCHECK: 'true'
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Enforce owner-authorized exact-main release
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == 'BUILD_SIGNED_ANDROID_AAB_BIN_GROUP' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_COMMIT_SHA" == "$GITHUB_SHA" ]]

      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          persist-credentials: false

      - name: Verify main has not moved before signing
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$GITHUB_SHA" ]] || {
            echo "::error::Refusing Android signing because main moved from $GITHUB_SHA to $remote_main."
            exit 1
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify protected signing and production configuration inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_APP_ID
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_APP_CHECK_SITE_KEY
            VITE_GOOGLE_MAPS_API_KEY
            ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::Missing protected Android release value: $name"
              exit 1
            }
          done

      - name: Build and cryptographically verify signed AAB
        run: bash scripts/run-android-store-release.sh

      - name: Verify main remained frozen through signing
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$GITHUB_SHA" ]] || {
            echo "::error::Android artifact completed, but main moved to $remote_main; refusing release evidence."
            exit 1
          }

      - name: Upload signed Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-store-release-${{ github.sha }}-${{ github.run_id }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android-store-release-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android release diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-store-release-diagnostics-${{ github.sha }}-${{ github.run_id }}
          path: |
            android-store-release-gradle.log
            android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f android/app/bin-group-upload.jks android/keystore.properties
