name: Private HR Data Migration
run-name: Private HR ${{ inputs.mode }} · ${{ inputs.expected_commit_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: "Full lowercase current production main SHA"
        required: true
        type: string
      mode:
        description: "Review only or execute the migration"
        required: true
        type: choice
        options:
          - dry-run
          - execute
      confirmation:
        description: "REVIEW_PRIVATE_HR_MIGRATION_BIN_GROUP or MIGRATE_PRIVATE_HR_BIN_GROUP_57C60"
        required: true
        type: string
  workflow_call:
    inputs:
      expected_commit_sha:
        description: "Exact current main SHA bound by the START HERE dispatcher"
        required: true
        type: string
      mode:
        description: "dry-run or execute"
        required: true
        type: string
      confirmation:
        description: "Protected migration confirmation phrase"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-hr-data-migration-${{ inputs.expected_commit_sha }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Review or migrate legacy private HR fields
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hard-launch-operations
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
      PRIVATE_HR_MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
      AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}

    steps:
      - name: Enforce protected exact-main context
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.expected_commit_sha }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "$GITHUB_REF" == "refs/heads/main" ]] \
            || fail "Private HR migration must run from refs/heads/main; received $GITHUB_REF."
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "expected_commit_sha must be a full lowercase 40-character Git commit SHA."
          [[ "$TARGET_SHA" == "$GITHUB_SHA" ]] \
            || fail "Stale SHA: expected_commit_sha=$TARGET_SHA but this workflow is running at $GITHUB_SHA. Start a new START HERE - Private HR Data Migration run instead of rerunning this job."
          [[ -n "${AUTHORIZED_FOUNDER_ACTORS:-}" ]] \
            || fail "AUTHORIZED_FOUNDER_ACTORS is not configured in the hard-launch-operations environment."

          authorized_actor=false
          IFS=',' read -ra allowed_actors <<< "${AUTHORIZED_FOUNDER_ACTORS:-}"
          for allowed_actor in "${allowed_actors[@]}"; do
            allowed_actor="$(printf '%s' "$allowed_actor" | xargs)"
            if [[ -n "$allowed_actor" && "$GITHUB_ACTOR" == "$allowed_actor" ]]; then authorized_actor=true; fi
          done
          [[ "$authorized_actor" == "true" ]] \
            || fail "GitHub actor $GITHUB_ACTOR is not authorized to run the protected private HR migration."

          case "$MODE" in
            dry-run)
              [[ "$CONFIRMATION" == "REVIEW_PRIVATE_HR_MIGRATION_BIN_GROUP" ]] \
                || fail "Dry-run confirmation must equal REVIEW_PRIVATE_HR_MIGRATION_BIN_GROUP."
              ;;
            execute)
              [[ "$CONFIRMATION" == "MIGRATE_PRIVATE_HR_BIN_GROUP_57C60" ]] \
                || fail "Execute confirmation must equal MIGRATE_PRIVATE_HR_BIN_GROUP_57C60."
              ;;
            *)
              fail "Migration mode must be dry-run or execute."
              ;;
          esac

      - name: Checkout exact main
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_commit_sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Review legacy HR duplication
        if: inputs.mode == 'dry-run'
        run: node scripts/migrate-private-hr-profiles.mjs

      - name: Execute and verify private HR migration
        if: inputs.mode == 'execute'
        run: node scripts/migrate-private-hr-profiles.mjs --execute

      - name: Upload migration report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-hr-migration-${{ inputs.mode }}-${{ github.sha }}
          path: launch_package/private-hr-migration.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish safe decision summary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('launch_package/private-hr-migration.json', 'utf8'));
          const lines = [
            '## Private HR migration decision',
            '',
            `- Exact SHA: \`${process.env.GITHUB_SHA}\``,
            `- Mode: \`${report.mode}\``,
            `- HR profiles scanned: \`${report.hrProfilesScanned}\``,
            `- Records requiring migration: \`${report.recordsRequiringMigration}\``,
            `- Records migrated: \`${report.migrated}\``,
            `- Records verified: \`${report.verified}\``,
            `- Failures: \`${report.failureCount}\``,
            `- Execution required: \`${report.executionRequired}\``,
            `- Recommended next action: \`${report.recommendedNextAction}\``,
            '- Sensitive values logged: `false`',
            '- Raw identifiers logged: `false`',
            '- Hard-launch claim: `false`',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
