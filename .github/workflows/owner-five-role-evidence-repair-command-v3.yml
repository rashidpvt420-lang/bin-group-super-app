name: One-Shot Five-Role Evidence Repair Generator
run-name: Generate remaining five-role evidence repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-five-role-evidence-repair-command-v3.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: one-shot-five-role-evidence-repair-v3
  cancel-in-progress: false

jobs:
  generate-repair:
    name: Generate self-removing five-role evidence repair PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '434'
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Enforce exact main push context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]] || {
            echo '::error::Main moved before the one-shot repair began.'
            exit 1
          }

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check and apply exact fail-closed repair
        run: |
          node --check scripts/apply-five-role-production-evidence-repair-v2.mjs
          node scripts/apply-five-role-production-evidence-repair-v2.mjs
          rm .github/workflows/owner-five-role-evidence-repair-command-v3.yml

      - name: Verify generated repair scope and regression
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --test tests/launch/five-role-production-evidence-repair.test.mjs
          test ! -e .github/workflows/owner-five-role-evidence-repair-command.yml
          test ! -e scripts/apply-five-role-production-evidence-repair.mjs
          test ! -e .github/workflows/owner-five-role-evidence-repair-command-v2.yml
          test ! -e scripts/apply-five-role-production-evidence-repair-v2.mjs
          test ! -e .github/workflows/owner-five-role-evidence-repair-command-v3.yml
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/owner-five-role-evidence-repair-command-v2.yml
            .github/workflows/owner-five-role-evidence-repair-command-v3.yml
            .github/workflows/owner-five-role-evidence-repair-command.yml
            scripts/apply-five-role-production-evidence-repair-v2.mjs
            scripts/apply-five-role-production-evidence-repair.mjs
            scripts/prepare-protected-business-fixtures.mjs
            src/technician/pages/TechnicianJobDetailPage.tsx
            tests/e2e/business-technician.spec.ts
            tests/e2e/business-tenant.spec.ts
            tests/launch/five-role-production-evidence-repair.test.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Commit repair to isolated branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_main" == "$RELEASE_SHA" ]] || {
            echo '::error::Main moved before generated repair branch creation.'
            exit 1
          }
          short="${RELEASE_SHA:0:8}"
          branch="fix/five-role-production-evidence-${short}-generated-v3"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add -A
          git commit -m 'fix: make five-role production evidence deterministic'
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open protected repair PR
        id: pr
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(cat <<BODY
          ## Verified failure
          Firebase Production Deploy run 30615219518 deployed the stack, then failed at current-commit five-role business evidence.

          ## Repairs included
          - Protected Founder MFA workflow wiring from PR #831 remains enforced.
          - Technician operational readiness is seeded and read back before Tenant lifecycle evidence.
          - Technician ticket IDs are run-specific and acceptance proof is status-aware.
          - Tenant Start Trip proves exact production Firestore EN_ROUTE state plus visible UI confirmation.
          - Online callable rejections are visible instead of being mislabeled as offline queued success.

          ## Safety
          - Base exact main: \`$RELEASE_SHA\`
          - All temporary repair bootstrap files delete themselves in this PR.
          - Public release gate and hard-launch claim remain disabled.
          - Stripe and Bank Transfer remain disabled.
          - No deployment was triggered by this generator.
          BODY
          )"
          pr_url="$(gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" --draft --title 'Fix remaining five-role production evidence failures' --body "$body")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Post repair handoff
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="Remaining five-role production evidence repair PR created: $PR_URL (head \`$HEAD_SHA\`). No deployment was retriggered."
