name: Diagnose hard-launch validator

on:
  push:
    branches:
      - fix/hard-launch-validator-ci
  pull_request:
    paths:
      - '.github/workflows/diagnose-hard-launch-validator.yml'
      - '.github/workflows/live-role-smoke.yml'
      - '.github/workflows/operational-application-evidence.yml'
      - '.github/workflows/operational-proof.yml'
      - 'scripts/**'
      - 'test/**'
      - 'tests/launch/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete launch-honesty suite and capture output
        shell: bash
        run: |
          set -o pipefail
          npm run test:launch-honesty 2>&1 | tee hard-launch-validator-test.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard-launch-validator-diagnostics
          path: hard-launch-validator-test.log
          if-no-files-found: error
          retention-days: 3
