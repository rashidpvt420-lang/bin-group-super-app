name: Apply final map GPS client hardening

on:
  push:
    branches:
      - fix/map-gps-client-hardening-v2
    paths:
      - .github/workflows/apply-map-gps-client-hardening-v2.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-map-gps-client-hardening-v2
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/fix/map-gps-client-hardening-v2') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/map-gps-client-hardening-v2'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/map-gps-client-hardening-v2
          fetch-depth: 0

      - name: Apply deterministic current-main reconciliation
        run: python .github/scripts/apply-map-gps-client-hardening-v2.py

      - name: Test complete Admin ticket lifecycle
        run: node --test tests/launch/admin-map-ticket-lifecycle.test.mjs

      - name: Test GPS STOP migration source contract
        run: node --test tests/launch/gps-stop-migration-source-contract.test.mjs

      - name: Behaviour - verified property pins
        run: node --test --test-name-pattern="unverified or incomplete" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - live GPS freshness clock
        run: node --test --test-name-pattern="live GPS expires" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - latest UPDATE coordinate
        run: node --test --test-name-pattern="UPDATE retries retain" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - STOP before UPDATE replay
        run: node --test --test-name-pattern="STOP retries persist" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - failed STOP blocks newer actions
        run: node --test --test-name-pattern="failed STOP remains" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - account disposal and expiry
        run: node --test --test-name-pattern="account change is" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - terminal STOP and saturation
        run: node --test --test-name-pattern="terminal STOP reconciliation" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - startup failure rejection
        run: node --test --test-name-pattern="GPS startup failures" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - UID scoped memory storage
        run: node --test --test-name-pattern="browser queue defaults" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - Admin viewport retention
        run: node --test --test-name-pattern="freshness ticks update" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - discard stale UPDATE on startup
        run: node --test --test-name-pattern="new ticket startup" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - legacy STOP authority migration
        run: node --test --test-name-pattern="legacy v2 STOP migration" tests/launch/map-gps-state-behavior.test.mjs

      - name: Behaviour - verified migration deletion order
        run: node --test --test-name-pattern="legacy keys are deleted" tests/launch/map-gps-state-behavior.test.mjs

      - name: Test map and GPS product truth
        run: node --test tests/launch/maps-gps-product-truth.test.mjs

      - name: Test server GPS session compare-and-set
        run: node --test tests/launch/technician-live-location-cas.test.mjs

      - name: Commit only permanent product and test files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/scripts/apply-map-gps-client-hardening-v2.py
          rm .github/workflows/apply-map-gps-client-hardening-v2.yml
          git add \
            apps/admin-panel/src/pages/map/LiveMapPage.tsx \
            src/utils/liveTracking.ts \
            tests/launch/maps-gps-product-truth.test.mjs \
            .github/scripts/apply-map-gps-client-hardening-v2.py \
            .github/workflows/apply-map-gps-client-hardening-v2.yml
          git diff --cached --quiet && { echo '::error::Expected map/GPS reconciliation changes were not produced.'; exit 1; }
          git commit -m 'Reconcile Admin map lifecycle with GPS client privacy'
          git push origin HEAD:fix/map-gps-client-hardening-v2
