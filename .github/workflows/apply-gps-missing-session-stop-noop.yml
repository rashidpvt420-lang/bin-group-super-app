name: Apply GPS Missing Session STOP No-op

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-gps-missing-session-stop-noop.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-test-clean:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/gps-missing-session-stop-noop' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/gps-missing-session-stop-noop
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: Apply missing-session STOP no-op repair
        run: python .github/scripts/apply-gps-missing-session-stop-noop.py

      - name: Validate server and client GPS contracts
        run: |
          set -euo pipefail
          node --test \
            tests/launch/technician-live-location-cas.test.mjs \
            tests/launch/gps-missing-session-stop-contract.test.mjs \
            tests/launch/map-gps-state-behavior.test.mjs
          npm run typecheck
          npm run build:functions
          npm run lint
          npm run build

      - name: Commit product changes and remove one-off machinery
        run: |
          set -euo pipefail
          git add \
            functions/technicianLiveLocation.ts \
            src/utils/liveTracking.ts \
            tests/launch/technician-live-location-cas.test.mjs \
            tests/launch/gps-missing-session-stop-contract.test.mjs
          git rm \
            .github/scripts/apply-gps-missing-session-stop-noop.py \
            .github/workflows/apply-gps-missing-session-stop-noop.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/apply-gps-missing-session-stop-noop.py \
            .github/workflows/apply-gps-missing-session-stop-noop.yml \
            functions/technicianLiveLocation.ts \
            src/utils/liveTracking.ts \
            tests/launch/gps-missing-session-stop-contract.test.mjs \
            tests/launch/technician-live-location-cas.test.mjs | sort)"
          [[ "$changed" == "$expected" ]] || {
            echo '::error::Missing-session STOP repair touched unexpected files.'
            printf 'Changed:\n%s\nExpected:\n%s\n' "$changed" "$expected"
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(gps): acknowledge absent canonical STOP sessions'
          git push origin HEAD:agent/gps-missing-session-stop-noop
