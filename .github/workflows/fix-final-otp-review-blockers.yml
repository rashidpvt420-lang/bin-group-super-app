name: Fix Final OTP Review Blockers

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/fix-final-otp-review-blockers.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: fix-final-otp-review-blockers-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix-test-commit:
    if: >-
      github.repository == 'rashidpvt420-lang/bin-group-super-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/finalize-launch-evidence-sequence' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-launch-evidence-sequence
          fetch-depth: 0

      - name: Apply exact review corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, before: str, after: str) -> None:
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              before_count = source.count(before)
              after_count = source.count(after)
              if before_count == 1:
                  file.write_text(source.replace(before, after), encoding='utf-8')
                  return
              if before_count == 0 and after_count == 1:
                  return
              raise RuntimeError(
                  f'{path}: expected one legacy or canonical block; '
                  f'legacy={before_count} canonical={after_count}'
              )

          replace_exact(
              'functions/contractSignatureOtpMailbox.ts',
              r'''      <p>Contract reference: ${args.contractId || args.requestId}</p>\n      <p>Verification reference: <code>${args.requestId}</code></p>''',
              '''      <p>Contract reference: ${args.contractId || args.requestId}</p>
              <p>Verification reference: <code>${args.requestId}</code></p>''',
          )
          replace_exact(
              'scripts/run-owner-onboarding-production-evidence-secure.mjs',
              r'''  "from './lib/gmail-otp-reader.mjs'",\n  'expectedMailboxEmail: ownerMailboxEmail',\n  'correlationId: requestId',''',
              '''  "from './lib/gmail-otp-reader.mjs'",
              'expectedMailboxEmail: ownerMailboxEmail',
              'correlationId: requestId',''',
          )
          replace_exact(
              'scripts/run-broker-production-evidence.mjs',
              r'''  const correlationId = text(value.correlationId);\n  assert(correlationId, 'Broker payout OTP correlation ID is missing.');\n  return { providerMessageId, bindingHash, correlationId, otpHashVersion: text(value.otpHashVersion) };''',
              '''  const correlationId = text(value.correlationId);
              assert(correlationId, 'Broker payout OTP correlation ID is missing.');
              return { providerMessageId, bindingHash, correlationId, otpHashVersion: text(value.otpHashVersion) };''',
          )
          replace_exact(
              'scripts/run-broker-production-evidence.mjs',
              r'''  const challengeId = text(requested.challengeId);\n  const correlationId = text(requested.correlationId);\n  assert(requested.status === 'OTP_SENT' && challengeId && correlationId, 'Broker payout OTP request did not return a challenge and correlation ID.');''',
              '''  const challengeId = text(requested.challengeId);
              const correlationId = text(requested.correlationId);
              assert(requested.status === 'OTP_SENT' && challengeId && correlationId, 'Broker payout OTP request did not return a challenge and correlation ID.');''',
          )
          replace_exact(
              'scripts/run-broker-production-evidence.mjs',
              r'''  const otpDelivery = await inspectOtpDelivery(challengeId);\n  assert(otpDelivery.correlationId === correlationId, 'Broker payout OTP correlation ID is not backend-bound.');\n  const mailboxReceipt = await waitForMailboxOtp({\n    providerMessageId: otpDelivery.providerMessageId,\n    requestedAt: otpRequestedAt,\n    correlationId,\n  });''',
              '''  const otpDelivery = await inspectOtpDelivery(challengeId);
              assert(otpDelivery.correlationId === correlationId, 'Broker payout OTP correlation ID is not backend-bound.');
              const mailboxReceipt = await waitForMailboxOtp({
                providerMessageId: otpDelivery.providerMessageId,
                requestedAt: otpRequestedAt,
                correlationId,
              });''',
          )
          replace_exact(
              'src/broker/pages/BrokerCommissionsPage.tsx',
              r'''          <Alert severity="info" sx={{ mb: 2 }}>Code sent for AED {otp.amount.toLocaleString()} across {otp.commissionCount} commission(s). It expires in 10 minutes.</Alert>\n          <Typography data-testid="broker-payout-otp-correlation" variant="caption" sx={{ display: 'block', mb: 2, wordBreak: 'break-all' }}>Verification reference: {otp.correlationId}</Typography>''',
              '''          <Alert severity="info" sx={{ mb: 2 }}>Code sent for AED {otp.amount.toLocaleString()} across {otp.commissionCount} commission(s). It expires in 10 minutes.</Alert>
              <Typography data-testid="broker-payout-otp-correlation" variant="caption" sx={{ display: 'block', mb: 2, wordBreak: 'break-all' }}>Verification reference: {otp.correlationId}</Typography>''',
          )
          replace_exact(
              'tests/e2e/business-owner.spec.ts',
              r'''test.use({ trace: 'off', video: 'off', screenshot: 'off' });\n\nconst __dirname = path.dirname(fileURLToPath(import.meta.url));''',
              '''test.use({ trace: 'off', video: 'off', screenshot: 'off' });

              const __dirname = path.dirname(fileURLToPath(import.meta.url));''',
          )
          replace_exact(
              'tests/e2e/business-owner.spec.ts',
              "const EMAIL = process.env.E2E_OWNER_MAILBOX_EMAIL ?? '';",
              "const EMAIL = process.env.E2E_OWNER_EMAIL ?? '';",
          )
          replace_exact(
              'tests/e2e/business-owner.spec.ts',
              "    ['E2E_OWNER_MAILBOX_EMAIL', EMAIL],",
              "    ['E2E_OWNER_EMAIL', EMAIL],",
          )
          replace_exact(
              'tests/e2e/business-broker.spec.ts',
              r'''test.use({ trace: 'off', video: 'off', screenshot: 'off' });\n\nconst __dirname = path.dirname(fileURLToPath(import.meta.url));''',
              '''test.use({ trace: 'off', video: 'off', screenshot: 'off' });

              const __dirname = path.dirname(fileURLToPath(import.meta.url));''',
          )
          replace_exact(
              'tests/e2e/business-broker.spec.ts',
              "const EMAIL = process.env.E2E_BROKER_MAILBOX_EMAIL ?? '';",
              "const EMAIL = process.env.E2E_BROKER_EMAIL ?? '';",
          )
          replace_exact(
              'tests/e2e/business-broker.spec.ts',
              "    ['E2E_BROKER_MAILBOX_EMAIL', EMAIL],",
              "    ['E2E_BROKER_EMAIL', EMAIL],",
          )
          PY

      - name: Verify generated JavaScript syntax
        run: |
          node --check scripts/run-owner-onboarding-production-evidence-secure.mjs
          node --check scripts/run-broker-production-evidence.mjs

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: bash scripts/npm-install-retry.sh

      - name: TypeScript check
        run: npm run typecheck

      - name: Run focused OTP and identity contracts
        run: |
          node --test --test-reporter=spec \
            tests/launch/e2e-mailbox-env-contract.test.mjs \
            tests/launch/owner-onboarding-production-proof.test.mjs \
            tests/launch/broker-payout-otp-live-evidence.test.mjs \
            tests/launch/broker-otp-hmac-evidence.test.mjs \
            tests/launch/otp-correlation-contract.test.mjs \
            tests/launch/workflow-mailbox-secret-scope.test.mjs

      - name: Run complete launch-honesty suite
        run: npm run test:launch-honesty

      - name: Commit only reviewed permanent files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            functions/contractSignatureOtpMailbox.ts
            scripts/run-owner-onboarding-production-evidence-secure.mjs
            scripts/run-broker-production-evidence.mjs
            src/broker/pages/BrokerCommissionsPage.tsx
            tests/e2e/business-owner.spec.ts
            tests/e2e/business-broker.spec.ts
          )
          git add -- "${files[@]}"
          mapfile -t staged < <(git diff --cached --name-only)
          if [[ "${#staged[@]}" -ne "${#files[@]}" ]]; then
            printf 'Expected %s staged files, found %s\n' "${#files[@]}" "${#staged[@]}"
            printf '%s\n' "${staged[@]}"
            exit 1
          fi
          for index in "${!files[@]}"; do
            [[ "${staged[$index]}" == "${files[$index]}" ]] || {
              printf 'Unexpected staged file order/content: expected %s got %s\n' "${files[$index]}" "${staged[$index]}"
              exit 1
            }
          done
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(launch): resolve final OTP review blockers'
          git push origin HEAD:agent/finalize-launch-evidence-sequence
