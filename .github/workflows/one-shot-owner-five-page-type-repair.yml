name: One-shot Owner Five-page Type Repair

on:
  push:
    branches:
      - fix/owner-five-page-inspection-first

permissions:
  contents: write

concurrency:
  group: one-shot-owner-five-page-type-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[owner-five-page-type-repair]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/owner-five-page-inspection-first
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply strict Firebase Function typing
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-owner-five-page-type-repair.yml')
          onboarding = Path('functions/inspectionFirstOwnerOnboarding.ts')
          admin_link = Path('functions/ownerInspectionAdminLink.ts')

          source = onboarding.read_text(encoding='utf-8')
          replacements = [
              (
                  '  const properties = Array.isArray(data.properties) ? data.properties.map(cleanPlain) : [];',
                  '  const properties: PlainRecord[] = Array.isArray(data.properties)\n'
                  '    ? data.properties.map((property: unknown): PlainRecord => cleanPlain(property) as PlainRecord)\n'
                  '    : [];',
              ),
              (
                  '  const modes = properties.map(propertyMode);',
                  '  const modes: string[] = properties.map((property: PlainRecord) => propertyMode(property));',
              ),
              (
                  '  if (modes.some((mode) => mode !== modes[0]))',
                  '  if (modes.some((mode: string) => mode !== modes[0]))',
              ),
              (
                  '    const normalizedProperties = properties.map((property, index) => {',
                  '    const normalizedProperties: PlainRecord[] = properties.map((property: PlainRecord, index: number): PlainRecord => {',
              ),
              (
                  '        totalUnits: normalizedProperties.reduce((sum, property) => sum + finite(property.units), 0),',
                  '        totalUnits: normalizedProperties.reduce((sum: number, property: PlainRecord) => sum + finite(property.units), 0),',
              ),
              (
                  '      propertyIds: normalizedProperties.map((property) => property.propertyId),',
                  '      propertyIds: normalizedProperties.map((property: PlainRecord) => property.propertyId),',
              ),
              (
                  '    normalizedProperties.forEach((property) => {',
                  '    normalizedProperties.forEach((property: PlainRecord) => {',
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Missing expected onboarding source fragment: {old}')
              source = source.replace(old, new, 1)
          onboarding.write_text(source, encoding='utf-8')

          link_source = admin_link.read_text(encoding='utf-8')
          old_block = '''  const inspectionIds: string[] = Array.from(
              new Set(suppliedIds.map((value: unknown) => text(value)).filter(Boolean)),
            ).slice(0, 100);'''
          new_block = '''  const inspectionIds: string[] = Array.from(
              new Set<string>(
                suppliedIds
                  .map((value: unknown): string => text(value))
                  .filter((value: string): boolean => value.length > 0),
              ),
            ).slice(0, 100);'''
          if old_block not in link_source:
              raise SystemExit('Missing expected inspection ID normalization block.')
          admin_link.write_text(link_source.replace(old_block, new_block, 1), encoding='utf-8')

          workflow.unlink()

      - name: Install dependencies
        run: npm ci

      - name: Verify Firebase Functions build
        run: npm run build --workspace=functions

      - name: Commit verified repair
        run: |
          git config user.name "BIN GROUP Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add functions/inspectionFirstOwnerOnboarding.ts functions/ownerInspectionAdminLink.ts .github/workflows/one-shot-owner-five-page-type-repair.yml
          git commit -m "fix: type five-page owner function callbacks [owner-five-page-type-repair]"
          git push origin HEAD:fix/owner-five-page-inspection-first
