name: One-shot AI Design Private Media Cleanup

on:
  push:
    branches:
      - fix/public-ai-design-reference-authority

permissions:
  contents: write

concurrency:
  group: one-shot-ai-design-private-media-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[ai-private-media-cleanup]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout AI repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/public-ai-design-reference-authority
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove redundant private media write
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('functions/aiDesignStudioCompat.ts')
          workflow_path = Path('.github/workflows/one-shot-ai-design-private-media-cleanup.yml')
          source = source_path.read_text(encoding='utf-8')
          old = '''  const file = bucket.file(path);
          await file.save({
            resumable: false,
          } as any).catch(() => undefined);
          await file.save(buffer, {'''
          new = '''  const file = bucket.file(path);
          await file.save(buffer, {'''
          if old not in source:
              raise SystemExit('Expected redundant private media write was not found.')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')
          workflow_path.unlink()

      - name: Install dependencies
        run: npm ci

      - name: Build Firebase Functions
        run: npm run build --workspace=functions

      - name: Commit verified cleanup
        run: |
          git config user.name "BIN GROUP Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add functions/aiDesignStudioCompat.ts .github/workflows/one-shot-ai-design-private-media-cleanup.yml
          git commit -m "fix: remove redundant AI private media write [ai-private-media-cleanup]"
          git push origin HEAD:fix/public-ai-design-reference-authority
