name: One-shot GPS Branch Finalization

on:
  push:
    branches:
      - fix/technician-gps-truth-final-v2

permissions:
  contents: write

concurrency:
  group: one-shot-gps-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/technician-gps-truth-final-v2
          fetch-depth: 0

      - name: Apply final security and privacy corrections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          tracking_path = Path('src/utils/liveTracking.ts')
          tracking = tracking_path.read_text()

          def replace_once(before: str, after: str, label: str) -> None:
              global tracking
              count = tracking.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              tracking = tracking.replace(before, after, 1)

          replace_once(
              "import { db, doc, functions, httpsCallable, serverTimestamp, setDoc } from '../lib/firebase';",
              "import { auth, db, doc, functions, httpsCallable, serverTimestamp, setDoc } from '../lib/firebase';",
              'Firebase Auth import',
          )
          replace_once(
              "const QUEUE_KEY_PREFIX = 'bin-technician-gps-queue-v2:';",
              "const LEGACY_QUEUE_KEY = 'bin-technician-gps-queue-v1';\nconst QUEUE_KEY_PREFIX = 'bin-technician-gps-queue-v2:';",
              'legacy queue constant',
          )
          replace_once(
              """function createTrackingSessionId() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID().replace(/-/g, '_');
    }
    return `gps_${Date.now()}_${Math.random().toString(36).slice(2, 12)}`;
}
""",
              """function secureNonce(prefix: 'gps' | 'gpsq') {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return `${prefix}_${crypto.randomUUID().replace(/-/g, '_')}`;
    }
    if (typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function') {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        const suffix = Array.from(bytes, (value) => value.toString(16).padStart(2, '0')).join('');
        return `${prefix}_${suffix}`;
    }
    throw new Error('Secure browser randomness is required for GPS tracking sessions.');
}

function createTrackingSessionId() {
    return secureNonce('gps');
}
""",
              'secure tracking session IDs',
          )
          replace_once(
              """        accuracy: Number.isFinite(Number(point.accuracy)) ? round(Number(point.accuracy), 1) : undefined,
        heading: Number.isFinite(Number(point.heading)) ? round(Number(point.heading), 1) : null,
        speed: Number.isFinite(Number(point.speed)) ? round(Number(point.speed), 2) : null,
        deviceTimestampMs: Number.isFinite(Number(point.deviceTimestampMs)) ? Number(point.deviceTimestampMs) : Date.now(),
""",
              """        accuracy: Number.isFinite(Number(point.accuracy)) ? round(Number(point.accuracy), 1) : undefined,
        deviceTimestampMs: Number.isFinite(Number(point.deviceTimestampMs)) ? Number(point.deviceTimestampMs) : Date.now(),
""",
              'minimum queued point',
          )
          replace_once(
              "id: `${action.toLowerCase()}_${nowMs}_${Math.random().toString(36).slice(2, 8)}`",
              "id: secureNonce('gpsq')",
              'secure queue IDs',
          )
          replace_once(
              """            accuracy: point.accuracy,
            heading: point.heading,
            speed: point.speed,
            deviceTimestampMs: point.deviceTimestampMs,
""",
              """            accuracy: point.accuracy,
            deviceTimestampMs: point.deviceTimestampMs,
""",
              'minimum replay payload',
          )
          replace_once(
              """function errorCode(error: any): string {
""",
              """function purgeLegacyPersistentQueue() {
    if (typeof window === 'undefined') return;
    try {
        window.localStorage.removeItem(LEGACY_QUEUE_KEY);
    } catch {
        // Legacy storage may be unavailable. No new precise queue data is written there.
    }
}

if (typeof window !== 'undefined') purgeLegacyPersistentQueue();

function errorCode(error: any): string {
""",
              'legacy persistent queue purge',
          )
          replace_once(
              """    purgeOtherTechnicianQueues(technicianUid);
    ensureQueueReplayListener(technicianUid);
""",
              """    if (auth.currentUser?.uid !== technicianUid) {
        const message = 'Authenticated Technician identity does not match the requested tracking session.';
        await persistTrackingDiagnostic(technicianUid, ticketId, {
            status: 'IDENTITY_MISMATCH',
            error: message,
            blockedAt: serverTimestamp(),
        });
        onError?.(message);
        return;
    }

    purgeOtherTechnicianQueues(technicianUid);
    ensureQueueReplayListener(technicianUid);
""",
              'authenticated Technician binding',
          )

          if 'Math.random' in tracking:
              raise SystemExit('Math.random remains in GPS tracking source')
          tracking_path.write_text(tracking)

          tests = [
              Path('tests/launch/gps-queue-durability-privacy.test.mjs'),
              Path('tests/launch/maps-gps-product-truth.test.mjs'),
          ]
          for test_path in tests:
              source = test_path.read_text()
              source = source.replace(
                  "assert.doesNotMatch(tracking, /window\\.localStorage/);",
                  "assert.match(tracking, /window\\.localStorage\\.removeItem\\(LEGACY_QUEUE_KEY\\)/);\n  assert.doesNotMatch(tracking, /window\\.localStorage\\.setItem/);",
              )
              test_path.write_text(source)

          focused = tests[0]
          source = focused.read_text()
          marker = "test('online replay listener remains until the UID-scoped queue is empty', () => {"
          security_test = """test('GPS queue identifiers and ownership are cryptographically and authentically bound', () => {
  assert.match(tracking, /crypto\\.randomUUID|crypto\\.getRandomValues/);
  assert.doesNotMatch(tracking, /Math\\.random/);
  assert.match(tracking, /auth\\.currentUser\\?\\.uid !== technicianUid/);
  const minimalStart = tracking.indexOf('function minimalPoint');
  const queueValidationStart = tracking.indexOf('function validQueueEntry', minimalStart);
  assert.ok(minimalStart >= 0 && queueValidationStart > minimalStart);
  const minimalSource = tracking.slice(minimalStart, queueValidationStart);
  assert.doesNotMatch(minimalSource, /heading:|speed:/);
});

"""
          if security_test not in source:
              if marker not in source:
                  raise SystemExit('GPS security test insertion marker missing')
              source = source.replace(marker, security_test + marker, 1)
              focused.write_text(source)

          Path('.github/workflows/zz-one-shot-gps-finalize.yml').unlink()
          PY

      - name: Commit final GPS-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Technician GPS durability privacy and STOP truth'
          git push origin HEAD:fix/technician-gps-truth-final-v2
