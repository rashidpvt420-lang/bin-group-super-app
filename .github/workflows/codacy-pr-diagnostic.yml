name: Codacy PR Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'functions/secureOwnerProfileOperations.ts'
      - 'src/owner/**'
      - 'tests/launch/owner-*.test.mjs'
      - '.github/workflows/codacy-pr-diagnostic.yml'

permissions:
  contents: read
  checks: read

jobs:
  inspect-codacy-issues:
    name: Inspect public Codacy PR issues
    if: ${{ github.event.pull_request.number == 330 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Codacy metadata sources
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
            > check-runs.json

          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('check-runs.json', 'utf8'));
          const runs = Array.isArray(payload?.check_runs) ? payload.check_runs : [];
          const codacyRuns = runs.filter((run) => /codacy/i.test(`${run.name} ${run.app?.name || ''}`));
          console.log('GITHUB_CHECKS');
          console.log(JSON.stringify(codacyRuns.map((run) => ({
            id: run.id,
            name: run.name,
            app: run.app?.name,
            status: run.status,
            conclusion: run.conclusion,
            detailsUrl: run.details_url,
            output: run.output,
          })), null, 2));
          NODE

          urls=(
            'https://api.codacy.com/api/v3/analysis/organizations/gh/rashidpvt420-lang/repositories/bin-group-super-app/pull-requests/330/issues'
            'https://app.codacy.com/api/v3/analysis/organizations/gh/rashidpvt420-lang/repositories/bin-group-super-app/pull-requests/330/issues'
          )
          index=0
          for url in "${urls[@]}"; do
            index=$((index + 1))
            output="codacy-api-${index}.txt"
            status="$(curl --location --silent --show-error --max-time 30 --output "$output" --write-out '%{http_code}' "$url" || true)"
            echo "CODACY_API_${index}_STATUS=$status SIZE=$(wc -c < "$output") HOST=$(printf '%s' "$url" | cut -d/ -f3)"
            FILE="$output" node <<'NODE'
          const fs = require('fs');
          const file = process.env.FILE;
          const text = fs.readFileSync(file, 'utf8');
          try {
            const payload = JSON.parse(text);
            const candidates = [payload, payload?.data, payload?.issues, payload?.items, payload?.results, payload?.data?.issues, payload?.data?.items];
            const rows = candidates.find(Array.isArray) || [];
            const issues = rows.map((entry) => {
              const issue = entry?.issue || entry;
              return {
                filePath: issue?.filePath || issue?.file?.path || issue?.location?.filePath || null,
                lineNumber: issue?.lineNumber || issue?.line || issue?.location?.line || null,
                patternId: issue?.patternInfo?.id || issue?.patternId || issue?.pattern?.id || null,
                patternTitle: issue?.patternInfo?.title || issue?.title || issue?.pattern?.title || null,
                level: issue?.patternInfo?.level || issue?.level || null,
                category: issue?.patternInfo?.category || issue?.category || null,
                message: issue?.message || issue?.description || null,
              };
            });
            console.log(JSON.stringify({ topLevelKeys: Object.keys(payload || {}), issueCount: issues.length, issues }, null, 2));
          } catch {
            console.log(JSON.stringify({ nonJsonPrefix: text.slice(0, 800) }, null, 2));
          }
          NODE
          done

          page='codacy-pr-issues.html'
          page_status="$(curl --location --silent --show-error --max-time 30 --output "$page" --write-out '%{http_code}' 'https://app.codacy.com/gh/rashidpvt420-lang/bin-group-super-app/pull-requests/330/issues' || true)"
          echo "CODACY_PAGE_STATUS=$page_status SIZE=$(wc -c < "$page")"
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('codacy-pr-issues.html', 'utf8');
          const needles = [
            'secureOwnerProfileOperations.ts',
            'OwnerPhoneVerificationCard.tsx',
            'OwnerProfilePage.tsx',
            'critical',
            'patternId',
            'security',
          ];
          const matches = {};
          for (const needle of needles) {
            const index = html.toLowerCase().indexOf(needle.toLowerCase());
            matches[needle] = index >= 0 ? html.slice(Math.max(0, index - 300), index + 700) : null;
          }
          console.log(JSON.stringify({ htmlMatches: matches }, null, 2));
          NODE
