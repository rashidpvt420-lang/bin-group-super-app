name: Production Provider Readiness
run-name: SMTP readiness · ${{ inputs.expected_commit_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Exact current main SHA to verify'
        required: true
        type: string
      confirmation:
        description: 'Type exactly VERIFY_PRODUCTION_PROVIDER_READINESS_BIN_GROUP'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: bin-group-57c60

jobs:
  smtp-readiness:
    name: Verify protected SMTP provider readiness without sending mail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Validate exact current main and confirmation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "VERIFY_PRODUCTION_PROVIDER_READINESS_BIN_GROUP" ]] || { echo '::error::Invalid readiness confirmation.'; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected SHA must be a full lowercase commit SHA.'; exit 1; }
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]] || { echo '::error::Workflow ref does not match expected SHA.'; exit 1; }
          current="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$current" == "$EXPECTED_SHA" ]] || { echo "::error::main moved to $current; refusing readiness claim."; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 416.0.0'
          project_id: bin-group-57c60

      - name: Install dependencies with retry
        run: bash scripts/npm-install-retry.sh

      - name: Verify SMTP authentication and provider capacity without sending email
        run: node scripts/verify-production-smtp-provider.mjs
