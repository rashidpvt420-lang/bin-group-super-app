name: Repair Live Evidence 621 Root Causes

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repair-live-evidence-621-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/live-evidence-621-root-causes' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply audited fail-closed repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one audited match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # Live Role Smoke must carry the same non-secret runtime expectations as
          # Firebase Production Deploy and must prepare the Founder-MFA geography
          # contract before any Tenant dispatch evidence runs.
          replace_one(
              '.github/workflows/live-role-smoke.yml',
              """  VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
  AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
""",
              """  VITE_FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APPCHECK_DEBUG_TOKEN }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'bin-group-57c60' }}
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
  VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
  FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY }}
  VITE_ENABLE_FIREBASE_APPCHECK: 'true'
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
  REACT_APP_ENABLE_FIREBASE_APPCHECK: 'true'
  REACT_APP_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_ENTERPRISE_SITE_KEY }}
  REACT_APP_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  REACT_APP_ADMIN_FIREBASE_APP_ID: 1:123413252227:web:285cb53bc26626d699f3b6
  REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  REACT_APP_FIREBASE_AUTH_DOMAIN: bin-group-57c60.firebaseapp.com
  REACT_APP_FIREBASE_PROJECT_ID: bin-group-57c60
  REACT_APP_FIREBASE_STORAGE_BUCKET: bin-group-57c60.firebasestorage.app
  AUTHORIZED_FOUNDER_ACTORS: ${{ secrets.AUTHORIZED_FOUNDER_ACTORS }}
  AUTHORIZED_FOUNDER_EMAILS: ${{ secrets.AUTHORIZED_FOUNDER_EMAILS }}
  DEPLOYMENT_ENVIRONMENT: production
  PAYMENT_POLICY: phase1-manual
  E2E_STRICT_LIVE: 'true'
""",
          )
          replace_one(
              '.github/workflows/live-role-smoke.yml',
              """      - name: Seed or repair launch accounts and fixtures
        run: |
          node scripts/seed-e2e-auth.mjs
          node scripts/seed-live-role-test-data.mjs
""",
              """      - name: Seed or repair launch accounts and fixtures
        run: |
          node scripts/seed-e2e-auth.mjs
          node scripts/seed-live-role-test-data.mjs
          node scripts/ensure-phase1-manual-payment-config.mjs
          node scripts/prepare-protected-business-fixtures.mjs
""",
          )

          # The fixture writer remains main+production+strict-live+Founder guarded,
          # but may run from either protected workflow that genuinely consumes it.
          replace_one(
              'scripts/prepare-protected-business-fixtures.mjs',
              """if (process.env.GITHUB_ACTIONS !== 'true') fail('GitHub Actions is required.');
if (process.env.GITHUB_WORKFLOW !== 'Firebase Production Deploy') fail('Firebase Production Deploy workflow is required.');
if (process.env.GITHUB_REF !== 'refs/heads/main') fail('refs/heads/main is required.');
""",
              """if (process.env.GITHUB_ACTIONS !== 'true') fail('GitHub Actions is required.');
const protectedWorkflow = text(process.env.GITHUB_WORKFLOW);
if (!['Firebase Production Deploy', 'Live Role Smoke Tests'].includes(protectedWorkflow)) {
  fail('Protected business fixtures require Firebase Production Deploy or Live Role Smoke Tests.');
}
if (process.env.GITHUB_REF !== 'refs/heads/main') fail('refs/heads/main is required.');
""",
          )

          # A later same-SHA Live Role Smoke run performs a fresh hosted bundle scan,
          # while the client-config evidence remains bound to the immutable successful
          # deployment provenance. Record the current verification run separately.
          replace_one(
              'scripts/verify-production-deployment.mjs',
              """const clientRuntimeConfig = buildHostedClientConfigEvidence({
  main: main.runtimeSummary,
  admin: admin.runtimeSummary,
}, { env: process.env, now: new Date() });
""",
              """const liveEvidenceVerification =
  process.env.GITHUB_ACTIONS === 'true' &&
  process.env.GITHUB_WORKFLOW === 'Live Role Smoke Tests' &&
  process.env.GITHUB_REF === 'refs/heads/main';
const clientEvidenceEnv = liveEvidenceVerification && existing
  ? {
      ...process.env,
      GITHUB_SHA: commitSha,
      GITHUB_REPOSITORY: String(existing.repository || process.env.GITHUB_REPOSITORY || ''),
      GITHUB_REF: String(existing.workflowRef || process.env.GITHUB_REF || ''),
      GITHUB_RUN_ID: String(existing.workflowRunId || ''),
      GITHUB_RUN_ATTEMPT: String(existing.workflowRunAttempt || ''),
    }
  : process.env;
const clientRuntimeConfig = buildHostedClientConfigEvidence({
  main: main.runtimeSummary,
  admin: admin.runtimeSummary,
}, { env: clientEvidenceEnv, now: new Date() });
if (liveEvidenceVerification) {
  clientRuntimeConfig.verificationWorkflowName = process.env.GITHUB_WORKFLOW;
  clientRuntimeConfig.verificationWorkflowRunId = String(process.env.GITHUB_RUN_ID || '');
  clientRuntimeConfig.verificationWorkflowRunAttempt = Number(process.env.GITHUB_RUN_ATTEMPT || 0) || null;
}
""",
          )

          # START HERE always dispatches payment_policy=phase1-manual. Public Phase 1
          # therefore must reject Stripe IDs, matching the protected deploy workflow.
          replace_one(
              '.github/workflows/firebase-production-dispatch-current-main.yml',
              """            [[ \"$hard_clearance_run_id\" =~ ^[1-9][0-9]*$ ]] || fail \"Public mode requires a numeric hard-clearance workflow run ID.\"
            [[ \"$stripe_session_id\" =~ ^cs_live_[A-Za-z0-9_]+$ ]] || fail \"Public mode requires a valid live Stripe checkout session ID.\"
            [[ \"$stripe_event_id\" =~ ^evt_[A-Za-z0-9_]+$ ]] || fail \"Public mode requires a valid Stripe webhook event ID.\"
""",
              """            [[ \"$hard_clearance_run_id\" =~ ^[1-9][0-9]*$ ]] || fail \"Public mode requires a numeric hard-clearance workflow run ID.\"
            [[ -z \"$stripe_session_id\" && -z \"$stripe_event_id\" ]] || fail \"Phase 1 manual public mode must not provide Stripe proof identifiers.\"
""",
          )
          replace_one(
              'tests/launch/current-main-production-dispatch-contract.test.mjs',
              """  assert.match(source, /Public mode requires a numeric hard-clearance workflow run ID/);
  assert.match(source, /Public mode requires a valid live Stripe checkout session ID/);
  assert.match(source, /Public mode requires a valid Stripe webhook event ID/);
  assert.match(source, /Bank-pilot mode requires all public-only evidence fields to remain blank/);
""",
              """  assert.match(source, /Public mode requires a numeric hard-clearance workflow run ID/);
  assert.match(source, /Phase 1 manual public mode must not provide Stripe proof identifiers/);
  assert.doesNotMatch(source, /Public mode requires a valid live Stripe checkout session ID/);
  assert.doesNotMatch(source, /Public mode requires a valid Stripe webhook event ID/);
  assert.match(source, /Bank-pilot mode requires all public-only evidence fields to remain blank/);
""",
          )

          Path('tests/launch/live-role-smoke-621-repair.test.mjs').write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';

const read = (path) => readFile(new URL(`../../${path}`, import.meta.url), 'utf8');

test('live role evidence carries production runtime expectations and canonical fixture preparation', async () => {
  const workflow = await read('.github/workflows/live-role-smoke.yml');
  for (const required of [
    'VITE_FIREBASE_API_KEY',
    'VITE_FIREBASE_APP_ID',
    'VITE_FIREBASE_MESSAGING_SENDER_ID',
    'VITE_FIREBASE_VAPID_KEY',
    'VITE_APP_CHECK_SITE_KEY',
    'VITE_GOOGLE_MAPS_API_KEY',
    'REACT_APP_FIREBASE_API_KEY',
    'REACT_APP_ADMIN_FIREBASE_APP_ID',
    'REACT_APP_FIREBASE_MESSAGING_SENDER_ID',
    'REACT_APP_APP_CHECK_SITE_KEY',
    'AUTHORIZED_FOUNDER_EMAILS',
    'DEPLOYMENT_ENVIRONMENT: production',
    'PAYMENT_POLICY: phase1-manual',
    "E2E_STRICT_LIVE: 'true'",
    'node scripts/prepare-protected-business-fixtures.mjs',
  ]) assert.match(workflow, new RegExp(required.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')));
});

test('protected business fixture writer remains fail closed to the two exact production evidence workflows', async () => {
  const source = await read('scripts/prepare-protected-business-fixtures.mjs');
  assert.match(source, /Firebase Production Deploy/);
  assert.match(source, /Live Role Smoke Tests/);
  assert.match(source, /DEPLOYMENT_ENVIRONMENT=production/);
  assert.match(source, /PAYMENT_POLICY=phase1-manual/);
  assert.match(source, /E2E_STRICT_LIVE=true/);
  assert.match(source, /refs\/heads\/main/);
});

test('same-SHA live verification keeps deployment provenance and records verifier provenance separately', async () => {
  const source = await read('scripts/verify-production-deployment.mjs');
  assert.match(source, /liveEvidenceVerification/);
  assert.match(source, /clientEvidenceEnv/);
  assert.match(source, /existing\.workflowRunId/);
  assert.match(source, /verificationWorkflowRunId/);
  assert.match(source, /Live Role Smoke Tests/);
  assert.match(source, /validateHostedClientConfigEvidence/);
});

test('phase1 public dispatcher requires hard clearance and forbids Stripe proof IDs', async () => {
  const source = await read('.github/workflows/firebase-production-dispatch-current-main.yml');
  assert.match(source, /Public mode requires a numeric hard-clearance workflow run ID/);
  assert.match(source, /Phase 1 manual public mode must not provide Stripe proof identifiers/);
  assert.match(source, /--arg paymentPolicy phase1-manual/);
  assert.doesNotMatch(source, /Public mode requires a valid live Stripe checkout session ID/);
});
""")
          PY

          git diff --check

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-repair-live-evidence-621.yml
          git add .github/workflows/live-role-smoke.yml \
                  .github/workflows/firebase-production-dispatch-current-main.yml \
                  scripts/prepare-protected-business-fixtures.mjs \
                  scripts/verify-production-deployment.mjs \
                  tests/launch/current-main-production-dispatch-contract.test.mjs \
                  tests/launch/live-role-smoke-621-repair.test.mjs
          git diff --cached --check
          git commit -m 'fix(release): repair live evidence hard-launch blockers'
          git push origin HEAD:fix/live-evidence-621-root-causes
