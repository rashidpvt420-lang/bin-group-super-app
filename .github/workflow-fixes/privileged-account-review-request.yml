name: Privileged Account Review Request
run-name: Protected owner request · ${{ github.run_id }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - .github/privileged-review-request
      - .github/play-cert-extraction-request-v5

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: privileged-account-review-request-${{ github.run_id }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  ISSUE_NUMBER: '434'
  TRACKING_ISSUE: '478'

jobs:
  review:
    name: Review privileged accounts without mutation
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: bin-group-57c60

    steps:
      - name: Authorize exact owner request
        id: authorize
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          authorized='false'
          request_kind='invalid'

          if [[ "$EVENT_NAME" == 'pull_request_target' ]] &&
             [[ "$BASE_REF" == 'main' ]] &&
             [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]] &&
             [[ "$PR_AUTHOR" == "$REPOSITORY_OWNER" ]] &&
             [[ "$HEAD_REF" == ops/dispatch-privileged-review-* ]] &&
             [[ "$PR_TITLE" == 'Dispatch protected privileged account review' ]]; then
            authorized='true'
            request_kind='privileged-review'
          elif [[ "$EVENT_NAME" == 'pull_request_target' ]] &&
               [[ "$BASE_REF" == 'main' ]] &&
               [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]] &&
               [[ "$PR_AUTHOR" == "$REPOSITORY_OWNER" ]] &&
               [[ "$HEAD_REF" == ops/dispatch-play-cert-v5-* ]] &&
               [[ "$PR_TITLE" == 'Dispatch protected Play certificate extraction v5' ]]; then
            request_kind='play-certificate'
          fi

          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "request_kind=$request_kind" >> "$GITHUB_OUTPUT"
          if [[ "$request_kind" == 'invalid' ]]; then
            echo 'Unauthorized protected owner request.' >&2
          fi

      - name: Reject unauthorized request visibly
        if: steps.authorize.outputs.request_kind == 'invalid'
        shell: bash
        run: |
          echo 'This PR does not satisfy a protected owner request contract.' >&2
          exit 1

      - name: Resolve stable exact current main
        if: steps.authorize.outputs.authorized == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]] || {
            echo 'Main changed while authorizing privileged-account review.' >&2
            exit 1
          }
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        if: steps.authorize.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Verify main remained frozen before review
        if: steps.authorize.outputs.authorized == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "Main moved from $RELEASE_SHA to $remote_main before privileged review." >&2
            exit 1
          }

      - name: Use Node.js 22
        if: steps.authorize.outputs.authorized == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate to Google Cloud
        if: steps.authorize.outputs.authorized == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        if: steps.authorize.outputs.authorized == 'true'
        run: bash scripts/npm-install-retry.sh

      - name: Build read-only privileged-account inventory
        if: steps.authorize.outputs.authorized == 'true'
        env:
          GITHUB_SHA: ${{ steps.release.outputs.sha }}
          GITHUB_REF: refs/heads/main
        run: node scripts/review-privileged-accounts-production.mjs

      - name: Validate exact-SHA no-mutation review evidence
        if: steps.authorize.outputs.authorized == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          report='launch_package/privileged-account-cleanup.json'
          [[ -s "$report" ]]
          jq -e --arg sha "$RELEASE_SHA" '
            .schemaVersion == 2 and
            .status == "dry-run" and
            .projectId == "bin-group-57c60" and
            .commitSha == $sha and
            .mutationPerformed == false and
            .deletedAccountCount == 0 and
            .deletedProfileDocumentCount == 0 and
            .sensitiveValuesExcluded == true and
            .auditLogsPreserved == true and
            .nonPrivilegedAccountsUntouched == true and
            .hardLaunchClaim == false and
            (.canonicalFounderReady | type) == "boolean" and
            (.executionEligible | type) == "boolean" and
            (.deletionTargetCount | type) == "number"
          ' "$report" >/dev/null

      - name: Verify main remained frozen through review
        if: steps.authorize.outputs.authorized == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "Privileged review completed, but main moved to $remote_main; refusing exact-SHA evidence." >&2
            exit 1
          }

      - name: Upload sanitized privileged review artifact
        if: steps.authorize.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: privileged-account-cleanup-review-${{ steps.release.outputs.sha }}-${{ github.run_id }}
          path: launch_package/privileged-account-cleanup.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Publish sanitized review result
        if: steps.authorize.outputs.authorized == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          report='launch_package/privileged-account-cleanup.json'
          ready="$(jq -r '.canonicalFounderReady' "$report")"
          email_verified="$(jq -r '.founderEmailVerified' "$report")"
          phone_mfa="$(jq -r '.founderPhoneMfaReady' "$report")"
          eligible="$(jq -r '.executionEligible' "$report")"
          privileged_count="$(jq -r '.privilegedAccountCountBefore' "$report")"
          target_count="$(jq -r '.deletionTargetCount' "$report")"
          blockers="$(jq -r '.executionBlockers | join("; ") | if length == 0 then "none" else . end' "$report")"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          artifact="privileged-account-cleanup-review-$RELEASE_SHA-$GITHUB_RUN_ID"
          body="## Privileged-account review
          
          - Exact SHA: \`$RELEASE_SHA\`
          - Review run ID: \`$GITHUB_RUN_ID\`
          - Review run: $run_url
          - Artifact: \`$artifact\`
          - Canonical Founder ready: \`$ready\`
          - Founder email verified: \`$email_verified\`
          - Founder phone MFA ready: \`$phone_mfa\`
          - Privileged accounts: \`$privileged_count\`
          - Unexpected deletion targets: \`$target_count\`
          - Cleanup execution eligible: \`$eligible\`
          - Execution blockers: \`$blockers\`
          - Mutation performed: \`false\`
          - Hard-launch claim: \`false\`"
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

  announce_play_certificate:
    name: Announce protected Play certificate extraction
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'ops/dispatch-play-cert-v5-') &&
      github.event.pull_request.title == 'Dispatch protected Play certificate extraction v5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      request_pr: ${{ steps.request.outputs.pr_number }}
    env:
      REQUEST_PR: ${{ github.event.pull_request.number }}
      REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Validate one-file certificate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(gh api --paginate "repos/$REPOSITORY/pulls/$REQUEST_PR/files" --jq '.[].filename')
          [[ "${#files[@]}" -eq 1 && "${files[0]}" == '.github/play-cert-extraction-request-v5' ]] || {
            printf '::error::Certificate request must change only .github/play-cert-extraction-request-v5. Found: %s\n' "${files[*]:-none}"
            exit 1
          }

          marker="$(gh api "repos/$REPOSITORY/contents/.github/play-cert-extraction-request-v5?ref=$REQUEST_HEAD_SHA" --jq '.content' | tr -d '\n' | base64 --decode)"
          expected=$'request=extract-public-play-upload-certificate-v5\nprivate_material_artifact_allowed=false\nhard_launch_claim=false'
          [[ "$marker" == "$expected" ]] || {
            echo '::error::Certificate request marker is not canonical.'
            exit 1
          }
          echo "pr_number=$REQUEST_PR" >> "$GITHUB_OUTPUT"

      - name: Resolve stable exact current main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          first_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" =~ ^[0-9a-f]{40}$ ]]
          sleep 3
          second_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          [[ "$first_sha" == "$second_sha" ]] || {
            echo '::error::Main moved during certificate authorization.'
            exit 1
          }
          echo "sha=$second_sha" >> "$GITHUB_OUTPUT"

      - name: Publish waiting-for-production status
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="## Protected Play Store certificate extraction
          
          - Status: \`WAITING_FOR_PRODUCTION_ENVIRONMENT\`
          - Exact SHA: \`$RELEASE_SHA\`
          - Request PR: #$REQUEST_PR — do not merge
          - Workflow run ID: \`$GITHUB_RUN_ID\`
          - Workflow run: $run_url
          - Protected job: \`Export public Android upload certificate\`
          - Artifact: pending
          - Package: \`ae.bingroups.superapp\`
          - Private key included: \`false\`
          - Keystore included: \`false\`
          - Passwords included: \`false\`
          - Hard-launch claim: \`false\`"
          gh api --method PATCH "repos/$REPOSITORY/issues/$TRACKING_ISSUE" \
            -f state='open' \
            -f body="$body" >/dev/null

  export_play_certificate:
    name: Export public Android upload certificate
    needs: announce_play_certificate
    if: needs.announce_play_certificate.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.certificate.outputs.artifact_name }}
      fingerprint: ${{ steps.certificate.outputs.fingerprint }}
      signing_ready: ${{ steps.signing_inputs.outputs.ready }}
      missing_inputs: ${{ steps.signing_inputs.outputs.missing }}
    env:
      RELEASE_SHA: ${{ needs.announce_play_certificate.outputs.release_sha }}
      REQUEST_PR: ${{ needs.announce_play_certificate.outputs.request_pr }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Verify main remained frozen before extraction
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Main moved from $RELEASE_SHA to $remote_main before certificate extraction."
            exit 1
          }

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Inspect protected Android signing inputs
        id: signing_inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          missing_csv="$(IFS=,; printf '%s' "${missing[*]-}")"
          echo "missing=$missing_csv" >> "$GITHUB_OUTPUT"
          if [[ "${#missing[@]}" -eq 0 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::error::Missing protected Android signing inputs: $missing_csv"
          fi

      - name: Fail closed when protected signing inputs are missing
        if: steps.signing_inputs.outputs.ready != 'true'
        shell: bash
        run: exit 1

      - name: Decode keystore and write signing properties
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/bin-group-upload.jks
          chmod 600 android/app/bin-group-upload.jks
          [[ -s android/app/bin-group-upload.jks ]]

          umask 077
          printf '%s\n' \
            'storeFile=app/bin-group-upload.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > android/keystore.properties
          [[ -s android/keystore.properties ]]

      - name: Export and verify public upload certificate
        id: certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play-store-certificate

          keytool -exportcert -rfc \
            -keystore android/app/bin-group-upload.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file play-store-certificate/bin-group-upload-certificate.pem

          grep -q -- '-----BEGIN CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem
          grep -q -- '-----END CERTIFICATE-----' play-store-certificate/bin-group-upload-certificate.pem

          keytool -printcert \
            -file play-store-certificate/bin-group-upload-certificate.pem \
            > play-store-certificate/bin-group-upload-certificate-details.txt

          fingerprint="$(awk -F': ' '/SHA256:/{print $2; exit}' play-store-certificate/bin-group-upload-certificate-details.txt)"
          [[ "$fingerprint" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]
          certificate_file_sha256="$(sha256sum play-store-certificate/bin-group-upload-certificate.pem | awk '{print $1}')"
          [[ "$certificate_file_sha256" =~ ^[0-9a-f]{64}$ ]]

          jq -n \
            --arg commitSha "$RELEASE_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg requestPr "$REQUEST_PR" \
            --arg packageName 'ae.bingroups.superapp' \
            --arg certificateSha256Fingerprint "$fingerprint" \
            --arg certificateFileSha256 "$certificate_file_sha256" \
            '{
              schemaVersion: 7,
              commitSha: $commitSha,
              workflowRunId: $workflowRunId,
              requestPr: $requestPr,
              packageName: $packageName,
              certificateSha256Fingerprint: $certificateSha256Fingerprint,
              certificateFileSha256: $certificateFileSha256,
              publicCertificateOnly: true,
              privateKeyExcluded: true,
              keystoreExcluded: true,
              passwordsExcluded: true,
              hardLaunchClaim: false
            }' > play-store-certificate/play-store-certificate-evidence.json

          artifact_name="bin-group-play-store-certificate-$RELEASE_SHA-$GITHUB_RUN_ID"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Verify certificate artifact allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find play-store-certificate -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(
            bin-group-upload-certificate-details.txt
            bin-group-upload-certificate.pem
            play-store-certificate-evidence.json
          )
          [[ "${files[*]}" == "${expected[*]}" ]]
          ! find play-store-certificate -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' \) | grep -q .

      - name: Upload public Play certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.certificate.outputs.artifact_name }}
          path: play-store-certificate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Verify main remained frozen through extraction
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$RELEASE_SHA" ]] || {
            echo "::error::Certificate exported, but main moved to $remote_main."
            exit 1
          }

      - name: Remove private Android signing material
        if: always()
        shell: bash
        run: |
          set +e
          shred -u android/app/bin-group-upload.jks 2>/dev/null || rm -f android/app/bin-group-upload.jks
          shred -u android/keystore.properties 2>/dev/null || rm -f android/keystore.properties

      - name: Publish certificate extraction outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SIGNING_READY: ${{ steps.signing_inputs.outputs.ready }}
          MISSING_INPUTS: ${{ steps.signing_inputs.outputs.missing }}
          ARTIFACT_NAME: ${{ steps.certificate.outputs.artifact_name }}
          CERTIFICATE_FINGERPRINT: ${{ steps.certificate.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ "$JOB_STATUS" == 'success' ]]; then
            body="## Protected Play Store certificate extraction
          
          - Status: \`SUCCESS\`
          - Exact SHA: \`$RELEASE_SHA\`
          - Request PR: #$REQUEST_PR — closed without merge
          - Workflow run ID: \`$GITHUB_RUN_ID\`
          - Workflow run: $run_url
          - Artifact: \`$ARTIFACT_NAME\`
          - Package: \`ae.bingroups.superapp\`
          - Certificate SHA-256: \`$CERTIFICATE_FINGERPRINT\`
          - Private key included: \`false\`
          - Keystore included: \`false\`
          - Passwords included: \`false\`
          - Hard-launch claim: \`false\`"
            gh api --method PATCH "repos/$REPOSITORY/issues/$TRACKING_ISSUE" \
              -f state='closed' \
              -f state_reason='completed' \
              -f body="$body" >/dev/null
            gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
            gh api --method PATCH "repos/$REPOSITORY/pulls/$REQUEST_PR" -f state='closed' >/dev/null
          else
            missing="${MISSING_INPUTS:-none-reported}"
            body="## Protected Play Store certificate extraction
          
          - Status: \`FAILURE\`
          - Exact SHA: \`$RELEASE_SHA\`
          - Request PR: #$REQUEST_PR — remains open and unmerged
          - Workflow run ID: \`$GITHUB_RUN_ID\`
          - Workflow run: $run_url
          - Protected signing inputs ready: \`${SIGNING_READY:-unknown}\`
          - Missing protected inputs: \`$missing\`
          - Artifact: unavailable
          - Private key included: \`false\`
          - Keystore included: \`false\`
          - Passwords included: \`false\`
          - Hard-launch claim: \`false\`"
            gh api --method PATCH "repos/$REPOSITORY/issues/$TRACKING_ISSUE" \
              -f state='open' \
              -f body="$body" >/dev/null
            gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
          fi
