<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BIN-Admin" />

    <title>BIN Group Admin Portal</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body, #root { min-height: 100%; background: #020617; color: #FFFFFF; }
        body { margin: 0; overflow: hidden; font-family: 'Inter', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .system-loader { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020617; color: #DAA520; padding: 32px 20px 96px; text-align: center; }
        .loader-shield { width: 72px; height: 72px; display: grid; place-items: center; border-radius: 22px; border: 1px solid rgba(198, 167, 94, 0.28); background: linear-gradient(145deg, #1e293b, #0f172a); box-shadow: 0 20px 48px rgba(0, 0, 0, 0.32); font-size: 34px; line-height: 1; margin-bottom: 24px; }
        .loader-brand { color: #FFFFFF; font-size: clamp(30px, 5vw, 42px); line-height: 1; font-weight: 950; font-style: italic; letter-spacing: -1px; margin: 0; }
        .loader-subtitle { color: #94A3B8; font-size: 9px; line-height: 1.4; font-weight: 800; letter-spacing: 4px; margin-top: 10px; }
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(218, 165, 32, 0.28); border-top-color: #DAA520; border-radius: 50%; animation: spin 1s linear infinite; margin: 34px 0 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { min-height: 18px; color: #DAA520; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; font-size: 10px; }
        .compliance-bar { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; min-height: 66px; display: flex; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 18px 20px; font-family: inherit; background: #000; border-top: 2px solid #C6A75E; color: #fff; z-index: 10; }
        .compliance-bar-link { color: #C6A75E; text-decoration: none; margin: 0 3px; font-weight: 700; }
    </style>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
        <div class="system-loader" aria-live="polite">
            <div class="loader-shield" aria-hidden="true">⌾</div>
            <h1 class="loader-brand">BIN GROUP</h1>
            <div class="loader-subtitle">ADMIN PORTAL</div>
            <div class="spinner" aria-hidden="true"></div>
            <div class="loader-text">AUTHENTICATING SOVEREIGN IDENTITY...</div>
        </div>
    </div>
    <div class="compliance-bar" aria-label="Institutional compliance links">
        <a href="/privacy-policy.html" class="compliance-bar-link">Privacy Policy</a>
        <span aria-hidden="true">|</span>
        <a href="/terms-of-service.html" class="compliance-bar-link">Terms of Service</a>
        <span aria-hidden="true">|</span>
        <a href="/support" class="compliance-bar-link">Support</a>
    </div>

    <!-- Recovery monitoring is maintenance-only and must not block parsing. -->
    <script defer src="%PUBLIC_URL%/admin-init-recovery.js"></script>
</body>

</html>
